name: Bug report
description: Report a defect in mirror.cloud
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Unfixed vulnerabilities go through private reporting. See [SECURITY.md](https://github.com/tyler-r-kendrick/mirror.cloud/blob/main/SECURITY.md). Do not file them here.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is broken.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands, requests, and config. Smallest sequence that shows the bug.
      placeholder: |
        1. go build -o bin/mirror ./cmd/mirror
        2. bin/mirror up s3
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Error text, status codes, or response bodies.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Go version, mirror commit or release, and the command line.
      placeholder: |
        OS:
        Go:
        Commit or release:
        Command:
    validations:
      required: true
