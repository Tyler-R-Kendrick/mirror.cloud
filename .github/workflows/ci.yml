name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: vet
        run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l . | grep -v node_modules || true)"
      - name: test
        run: go test ./...
      - name: fuzz seeds
        run: go test ./internal/edge ./internal/identity ./internal/services/dynamodb/expr ./internal/services/gcs -count=1
      - name: mutation
        run: go test ./internal/mutation -count=1 -timeout 120s
