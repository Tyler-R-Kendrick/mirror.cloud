name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # What this run has to run. On a pull request: the packages the diff can
  # reach (cmd/affected over the files it changes), the fuzz targets they
  # hold, the mutants the diff selects, and which path-gated jobs its files
  # open. On main: everything.
  # A path cmd/affected cannot place selects everything, and if this job fails,
  # every job that needs it is skipped, which `test` reads as a failure.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      packages: ${{ steps.affected.outputs.packages }}
      all: ${{ steps.affected.outputs.all }}
      race: ${{ steps.affected.outputs.race }}
      fuzz: ${{ steps.affected.outputs.fuzz }}
      mutation: ${{ steps.mutation.outputs.shards }}
      mutation-count: ${{ steps.mutation.outputs.count }}
      generated-models: ${{ steps.affected.outputs.generated-models }}
      image: ${{ steps.affected.outputs.image }}
      cloudflare-miniflare: ${{ steps.affected.outputs.cloudflare-miniflare }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The pull request's merge commit and its first parent, the base.
          fetch-depth: 2
      - uses: ./.github/actions/go
        with:
          cache: test
          save: "false"
      - name: what changed
        if: github.event_name == 'pull_request'
        run: |
          # NUL-separated and never renamed: every name exactly as it is, both
          # sides of a move, and no quoting a name could hide behind.
          git diff -z --name-only --no-renames HEAD^1 HEAD > "$RUNNER_TEMP/changed.z"
          git -c core.quotePath=false diff --unified=0 --no-color --no-renames HEAD^1 HEAD > "$RUNNER_TEMP/pr.diff"
          echo "$(tr -cd '\0' < "$RUNNER_TEMP/changed.z" | wc -c) files changed"
      - name: affected packages and gates
        id: affected
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = pull_request ]; then
            go run ./cmd/affected -json -z -files "$RUNNER_TEMP/changed.z" > "$RUNNER_TEMP/affected.json"
          else
            go run ./cmd/affected -json -all -files /dev/null > "$RUNNER_TEMP/affected.json"
          fi
          python3 -I scripts/ci-plan.py "$RUNNER_TEMP/affected.json" >> "$GITHUB_OUTPUT"
      - name: mutants selected
        id: mutation
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = pull_request ]; then export MUTATION_DIFF="$RUNNER_TEMP/pr.diff"; fi
          MUTATION_PLAN="$RUNNER_TEMP/mutation.json" go test ./internal/mutation -run '^TestMutationPlan$' -count=1
          cat "$RUNNER_TEMP/mutation.json"
          python3 -I -c 'import json,sys; d=json.load(open(sys.argv[1])); print("shards=" + json.dumps(d["shards"])); print("count=%d" % len(d["shards"]))' "$RUNNER_TEMP/mutation.json" >> "$GITHUB_OUTPUT"

  # What used to be one job was 69 minutes of independent checks run one after
  # another, 41 of them native fuzzing. They are separate jobs now, so the run
  # takes as long as the slowest and each failure names its own job.
  #
  # `test` at the bottom keeps the name that job had, for anything that requires
  # it by name, and fails unless every one of these passed.
  #
  # Inside each job, every step still runs whatever the ones before it did, and
  # the job still fails if any of them fail. Without that a step failure skips
  # the rest, and one had been doing that for six merges: the ratchet sat third
  # and nine checks after it never ran at all. A red gate that hides other gates
  # reports less than no gate, because the silence reads as coverage.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The Makefile's build, so vet reuses the packages the unit job compiled.
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: the ratchet's baseline guard compares ratchet.json
          # against the merge-base with main, and skips without it.
          fetch-depth: 0
      - uses: ./.github/actions/go
        with:
          cache: test
          save: "false"
      - name: vet
        if: ${{ !cancelled() }}
        run: go vet ./...
      - name: gofmt
        if: ${{ !cancelled() }}
        run: test -z "$(gofmt -l . | grep -v node_modules || true)"
      - name: anti-drift ratchet
        if: ${{ !cancelled() }}
        run: set -o pipefail; make ratchet 2>&1 | tee -a ci-run.log
      - name: known red triage
        if: ${{ !cancelled() }}
        run: make known-red RUN=ci-run.log

  # Every package of the module, once, with nothing that stops go test caching
  # the result. main runs it the same way and saves the cache, so a pull request
  # reports main's result for every package whose inputs it did not change. main
  # used to pass -count=1 and clear the cache first, which left nothing to read
  # and made pull requests rerun everything. The uncached run of every test is
  # now the coverage job, which go test cannot cache, and nightly.yml.
  #
  # The snapshot, chaos, BDD, contract and fuzz-seed suites used to be steps of
  # their own that ran these packages a second time; the table
  # scripts/test-tiers.py prints at the end says how each of them did.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/go
        with:
          cache: test
          mtimes: "true"
      # The log goes outside the checkout: internal/check walks the tree, and
      # a file there that grows during the run would make it miss the cache.
      - name: unit, by tier
        run: set -o pipefail; make test-unit GOTESTFLAGS=-json 2>&1 | python3 -I scripts/test-tiers.py unit | tee -a "$RUNNER_TEMP/ci-run.log"
      - name: extraction equivalence
        if: ${{ !cancelled() }}
        # Named separately so it can be a required check: no pack may be
        # deleted without its recording replaying green against the bundle
        # that replaced it. The step above ran internal/equivalence with the
        # same flags, so that half reads its result from the cache.
        run: set -o pipefail; make equivalence GOTESTFLAGS=-json COUNT= 2>&1 | python3 -I scripts/test-tiers.py equivalence | tee -a "$RUNNER_TEMP/ci-run.log"
      - name: aws sdk round-trip
        if: ${{ !cancelled() }}
        # test/sdk/go is its own module, which `go list ./...` never reaches,
        # so coverage does not rerun it; it runs uncached here (about 15 s).
        run: set -o pipefail; make test-sdk GOTESTFLAGS=-json COUNT=-count=1 2>&1 | python3 -I scripts/test-tiers.py 'aws sdk round-trip' | tee -a "$RUNNER_TEMP/ci-run.log"
      - name: known red triage
        if: ${{ !cancelled() }}
        run: make known-red RUN="$RUNNER_TEMP/ci-run.log"

  # The 80% floor, per pull request as before, in one -coverpkg=./... pass (see
  # test-coverage in the Makefile). Kept out of the unit job because a covered
  # run is never cached: this is the job that runs every test uncached.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          # The ratchet's baseline guard in internal/check skips without history.
          fetch-depth: 0
      - uses: ./.github/actions/go
        with:
          cache: coverage
      - name: coverage floor
        run: set -o pipefail; make test-coverage 2>&1 | tee -a ci-run.log
      - name: known red triage
        if: ${{ !cancelled() }}
        run: make known-red RUN=ci-run.log

  # The native fuzz targets in scripts/fuzz-targets.txt, 10000 executions each.
  # Run in one job they were 41 minutes; main splits them six ways by line. A
  # pull request fuzzes only the targets in the packages its diff can reach, in
  # as many shards as they need (scripts/ci-plan.py), and one shard that says
  # so when there are none.
  fuzz:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.fuzz).shards }}
    env:
      SHARDS: ${{ fromJSON(needs.plan.outputs.fuzz).count }}
      TARGETS: ${{ fromJSON(needs.plan.outputs.fuzz).targets }}
    steps:
      - name: skipped as unaffected
        if: env.TARGETS == '0'
        run: echo "no fuzz target is in a package this change can reach"
      - name: the plan sized this job
        run: '[[ "$TARGETS" =~ ^[0-9]+$ ]] || { echo "::error::plan gave TARGETS=$TARGETS"; exit 1; }'
      - uses: actions/checkout@v6
        if: env.TARGETS != '0'
      - uses: ./.github/actions/go
        if: env.TARGETS != '0'
        with:
          cache: fuzz
          save: ${{ matrix.shard == 0 }}
      - name: fuzz shard ${{ matrix.shard }}
        if: env.TARGETS != '0'
        env:
          AFFECTED: ${{ needs.plan.outputs.packages }}
          ALL: ${{ needs.plan.outputs.all }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ] && [ "$ALL" != true ]; then
            printf '%s\n' "$AFFECTED" > "$RUNNER_TEMP/affected.txt"
            export FUZZ_PKGS="$RUNNER_TEMP/affected.txt"
          fi
          scripts/fuzz.sh ${{ matrix.shard }} "$SHARDS"

  # The race build of the whole suite was 20 minutes in one job, the longest
  # there is. main and the nightly split every package four ways by the race
  # times main measured (test/race-costs.json), strict. A pull request runs the
  # packages its diff can reach, in as many shards as they need, with -short:
  # internal/racegate skips there the tests that parse large inputs on one
  # goroutine, where the race detector costs ten to forty times as much and
  # can find nothing. unit runs those on every pull request without race, and
  # main runs them under it. A pull request's -short results are not main's, so
  # they never come from main's race cache. On main every shard reads the race
  # cache, but only shard 0 saves it; nightly.yml runs all four uncached.
  race:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.race).shards }}
    env:
      SHARDS: ${{ fromJSON(needs.plan.outputs.race).count }}
      PACKAGES: ${{ fromJSON(needs.plan.outputs.race).packages }}
    steps:
      - name: skipped as unaffected
        if: env.PACKAGES == '0'
        run: echo "this change reaches no package"
      - name: the plan sized this job
        run: '[[ "$PACKAGES" =~ ^[0-9]+$ ]] || { echo "::error::plan gave PACKAGES=$PACKAGES"; exit 1; }'
      - uses: actions/checkout@v6
        if: env.PACKAGES != '0'
        with:
          fetch-depth: 0
      - uses: ./.github/actions/go
        if: env.PACKAGES != '0'
        with:
          cache: race
          mtimes: "true"
          save: ${{ matrix.shard == 0 }}
      - name: race detector, shard ${{ matrix.shard }}
        if: env.PACKAGES != '0'
        env:
          AFFECTED: ${{ needs.plan.outputs.packages }}
        run: |
          set -o pipefail
          scope=()
          if [ "${{ github.event_name }}" = pull_request ]; then
            printf '%s\n' "$AFFECTED" > "$RUNNER_TEMP/affected.txt"
            scope=("RACE_PKGS=$RUNNER_TEMP/affected.txt" RACE_FLAGS=-short)
          fi
          make test-race RACE_SHARD=${{ matrix.shard }} RACE_SHARDS="$SHARDS" "${scope[@]}" 2>&1 | tee -a "$RUNNER_TEMP/ci-run.log"
      - name: known red triage
        if: ${{ !cancelled() && env.PACKAGES != '0' }}
        run: make known-red RUN="$RUNNER_TEMP/ci-run.log"

  # The Dockerfile and Dockerfile.release are built here and nowhere else before
  # a tag, so a change that breaks either shows up on the pull request and not in
  # the first release that needs it. Dockerfile: only the slim build, the one
  # with an argument to get wrong. Dockerfile.release: laid out and built the way
  # release.yml does it, for both architectures, from binaries built here in
  # place of the archives, and everything but the push.
  #
  # Path-gated: it runs when ./cmd/mirror, a Dockerfile, a profile or the slim
  # overlay can have changed (cmd/affected's gates), and otherwise passes as
  # skipped, so `test` still requires it.
  image:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GATE: ${{ needs.plan.outputs.image }}
    steps:
      - name: skipped as unaffected
        if: env.GATE == 'false'
        run: echo "nothing the image is built from changed"
      - name: the plan named this gate
        # Anything but true or false means the plan did not say; run nothing
        # and fail, rather than read a missing answer as unaffected.
        if: env.GATE != 'true' && env.GATE != 'false'
        run: echo "::error::plan gave this gate '$GATE', not true or false" && exit 1
      - uses: actions/checkout@v6
        if: env.GATE != 'false'
      - uses: ./.github/actions/go
        if: env.GATE != 'false'
        with:
          cache: test
          save: "false"
      - name: build with a service list
        if: env.GATE != 'false'
        run: docker build --build-arg SERVICES=@profiles/core.txt -t mirror-core .
      - name: it serves exactly that list, from a scratch image
        if: env.GATE != 'false'
        run: |
          got=$(docker run --rm mirror-core services | cut -f1 | sort | tr '\n' ' ')
          want=$(grep -v '^#' profiles/core.txt | sort | tr '\n' ' ')
          [ "$got" = "$want" ] || { echo "::error::image serves: $got; profile lists: $want"; exit 1; }
      - name: the release image builds for both architectures
        if: env.GATE != 'false'
        run: |
          set -euo pipefail
          python3 -I scripts/slim-overlay.py "$RUNNER_TEMP/overlay.json" @profiles/core.txt
          for arch in amd64 arm64; do
            mkdir -p "ctx/linux_$arch"
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags '-s -w' \
              -overlay "$RUNNER_TEMP/overlay.json" -o "ctx/linux_$arch/mirror" ./cmd/mirror
          done
          cp Dockerfile.release ctx/Dockerfile
          docker buildx create --name ci --driver docker-container --use > /dev/null
          docker buildx build --platform linux/amd64,linux/arm64 --output "type=oci,dest=$RUNNER_TEMP/image.tar" ctx
          docker buildx build --platform linux/amd64 --load -t release-shaped ctx
          got=$(docker run --rm release-shaped services | cut -f1 | sort | tr '\n' ' ')
          want=$(grep -v '^#' profiles/core.txt | sort | tr '\n' ' ')
          [ "$got" = "$want" ] || { echo "::error::release image serves: $got; profile lists: $want"; exit 1; }

  # Fails unless every job above passed. A job that is skipped or cancelled is
  # not a pass, and `needs` alone would skip this one with it.
  test:
    needs: [plan, check, unit, coverage, fuzz, race, image, generated-models, cloudflare-miniflare]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every job passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "::error::a job did not pass: ${{ join(needs.*.result, ' ') }}"
          exit 1

  # Separate matrix job: the mutation suite had grown to fifty-eight minutes
  # against a sixty-minute timeout, which meant the next mutant anyone added
  # would have turned CI red for time rather than for a defect -- a failure
  # that looks nothing like a surviving mutant and costs an hour to diagnose.
  #
  # The per-mutant cost is a compile of the mutated package plus the test it
  # runs, and each used to include about four seconds of process start that
  # loaded every bundle in the emulator (internal/bundled's init). What can come
  # down now is how many one job runs; the shard count is the lever, and it
  # moves when a shard crosses the timeout.
  #
  # TestShardingIsAPartition proves the split loses no mutant, and the harness
  # fails a shard that selects none -- because a shard that runs nothing still
  # reports success.
  #
  # main runs every mutant in twelve shards, filled by measured cost
  # (internal/mutation costs_test.go). A pull request runs the mutants on the
  # files it changed, of the tests it changed, and whose own entries it changed
  # (select_test.go), in as many shards as their cost needs; with none, the job
  # is skipped. The report says how many kills were the 30s timeout.
  mutation:
    needs: plan
    if: needs.plan.outputs.mutation != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.mutation) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: ./.github/actions/go
        with:
          cache: mutation
          save: ${{ matrix.shard == 0 }}
      - name: the diff the mutants are chosen from
        if: github.event_name == 'pull_request'
        run: |
          git -c core.quotePath=false diff --unified=0 --no-color --no-renames HEAD^1 HEAD > "$RUNNER_TEMP/pr.diff"
          echo "MUTATION_DIFF=$RUNNER_TEMP/pr.diff" >> "$GITHUB_ENV"
      - name: mutation shard ${{ matrix.shard }} of ${{ needs.plan.outputs.mutation-count }}
        env:
          MUTATION_REPORT: ${{ runner.temp }}/mutation.txt
        run: set -o pipefail; make test-mutation-shard MUTATION_SHARD=${{ matrix.shard }} MUTATION_SHARDS=${{ needs.plan.outputs.mutation-count }} 2>&1 | tee -a ci-run.log
      - name: timeouts and cost
        if: ${{ !cancelled() }}
        run: if [ -f "$RUNNER_TEMP/mutation.txt" ]; then tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/mutation.txt"; fi
      - name: known red triage
        if: ${{ !cancelled() }}
        run: make known-red RUN=ci-run.log

  # Separate job: syncing specs leaves ~92 MB under specs/, and a populated
  # specs/ changes what the runtime boots from, so it must not share a
  # workspace with the unit tests.
  #
  # Path-gated like image: specs/, internal/generated, cmd/mirrorgen and what
  # it links, and the sync scripts.
  generated-models:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GATE: ${{ needs.plan.outputs.generated-models }}
    steps:
      - name: skipped as unaffected
        if: env.GATE == 'false'
        run: echo "nothing the models are generated from changed"
      - name: the plan named this gate
        # Anything but true or false means the plan did not say; run nothing
        # and fail, rather than read a missing answer as unaffected.
        if: env.GATE != 'true' && env.GATE != 'false'
        run: echo "::error::plan gave this gate '$GATE', not true or false" && exit 1
      - uses: actions/checkout@v6
        if: env.GATE != 'false'
      - uses: ./.github/actions/go
        if: env.GATE != 'false'
        with:
          cache: test
          save: "false"
      - name: regenerate from the pinned specs
        if: env.GATE != 'false'
        run: |
          make specs-sync
          make generate
      - name: models reproduce byte-for-byte
        if: env.GATE != 'false'
        # `make specs-sync` fetches exactly what the lock pins -- the AWS
        # models at the recorded commit, the committed Discovery document --
        # so this is deterministic. A diff means the committed models no
        # longer follow from the lock, which is the only thing that makes
        # them trustworthy as a build input.
        #
        # Moving the pins is `make specs-refresh`, deliberately, in its own
        # commit: an upstream change should be reviewed, not absorbed by a
        # build. That review is where an unannounced vendor change gets
        # noticed until the behavioral changelog exists to record it.
        run: |
          git diff --exit-code -- internal/generated specs/mirror.lock || {
            echo "::error::internal/generated is stale; run 'make specs-sync && make generate' and commit the result"
            exit 1
          }

  # Required live Cloudflare runtime job: real node + real workerd through
  # the pinned helper. Separate from the unit job because it provisions an
  # optional runtime the unit path must never require. This job FAILS when
  # the backend is absent -- the suite fatals instead of skipping, and npm
  # ci failure is a job failure, never a silent pass. Ordinary CI performs
  # no other npm install and no session start; real-provider probes remain
  # unrun (no credentials, by policy).
  #
  # Path-gated like image: internal/execution, test/behavior/cloudflare and
  # what they link, and tools/cloudflare-runtime.
  cloudflare-miniflare:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GATE: ${{ needs.plan.outputs.cloudflare-miniflare }}
    steps:
      - name: skipped as unaffected
        if: env.GATE == 'false'
        run: echo "nothing the miniflare suite builds or drives changed"
      - name: the plan named this gate
        # Anything but true or false means the plan did not say; run nothing
        # and fail, rather than read a missing answer as unaffected.
        if: env.GATE != 'true' && env.GATE != 'false'
        run: echo "::error::plan gave this gate '$GATE', not true or false" && exit 1
      - uses: actions/checkout@v6
        if: env.GATE != 'false'
      - uses: ./.github/actions/go
        if: env.GATE != 'false'
        with:
          cache: test
          save: "false"
      - uses: actions/setup-node@v4
        if: env.GATE != 'false'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/cloudflare-runtime/package-lock.json
      - name: provision pinned miniflare/workerd
        if: env.GATE != 'false'
        run: npm ci --no-audit --no-fund
        working-directory: tools/cloudflare-runtime
      - name: live miniflare session suite
        if: env.GATE != 'false'
        run: set -o pipefail; make test-cloudflare-miniflare 2>&1 | tee -a ci-run.log
