name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache-dependency-path: test/sdk/go/go.sum
      - name: vet
        run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l . | grep -v node_modules || true)"
      - name: unit and coverage floor
        run: make test-coverage
      - name: protocol contracts
        run: go test ./internal/conformance ./internal/proto/... -count=1
      - name: aws sdk round-trip
        working-directory: test/sdk/go
        run: go test ./... -count=1
      - name: snapshots
        run: make test-snapshot
      - name: chaos
        run: make test-chaos
      - name: bdd and functional
        run: make test-bdd
      - name: fuzz seeds
        run: make test-fuzz-seeds
      - name: bounded native fuzzing
        run: make test-fuzz
      - name: race detector
        run: make test-race
  mutation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["0/4", "1/4", "2/4", "3/4"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache-dependency-path: test/sdk/go/go.sum
      - name: mutation shard ${{ matrix.shard }}
        run: MUTATION_SHARD=${{ matrix.shard }} make test-mutation
