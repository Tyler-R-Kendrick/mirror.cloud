name: cut-release

# Merging to main releases it. When ci has passed on the commit that merged,
# scripts/cut-release.sh reads the commit messages since the last tag (Conventional
# Commits: fix, feat, a `!` or BREAKING CHANGE) and, if they call for a release,
# creates the next version's tag on that commit, but only while that commit is still
# the tip of main. release.yml then builds it once and promotes it through the
# edge, staging and production environments, exactly as it does for a tag a
# maintainer pushes. The rules, and what this changes about who can release, are in
# docs/RELEASING.md.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions: {}

# One at a time, and never cancelled: a release in progress is not something a
# later commit's run should stop.
concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  plan:
    # Only a push to main that passed: not a pull request's CI, and not a failed or
    # cancelled run.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # to create the tag, and nothing else
    outputs:
      tag: ${{ steps.cut.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The commit CI passed on, not the tip of main now, with the history
          # and tags the next version is worked out from.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: cut
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/cut-release.sh

  release:
    needs: plan
    if: ${{ needs.plan.outputs.tag != '' }}
    # The most release.yml's jobs may ask for.
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      publish: true
      ref: refs/tags/${{ needs.plan.outputs.tag }}
