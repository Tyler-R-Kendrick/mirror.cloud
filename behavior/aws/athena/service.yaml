schema: bir/1
service: aws.athena

# Transcribed from the hand-written pack, not established against the real
# service. A query finishes the moment it starts: StartQueryExecution runs the
# SQL synchronously and stores the columns and rows on the execution record,
# and GetQueryResults reads them back. StopQueryExecution stops nothing.
provenance: authored

# The pack answered an absent required member with InvalidRequestException:
# its first() helper folds an absent member to the empty string, the store
# holds no empty key, and the miss is that fault. The engine's model check now
# rejects the absence first, so that is also the missing-input answer.
missing_input_error: InvalidRequest

# StartQueryExecution is a query engine, not a CRUD write, and it is Go, in
# internal/services/aws/athena: a SELECT with FROM resolves the table through
# aws.glue and scans its S3 location parsing CSV or JSON-lines, and an
# s3tablescatalog/ catalog runs DDL and DML against S3 Tables. It writes the
# query_execution record below, which the reads here project.
native: [StartQueryExecution]

resources:
  workgroup:
    collection: atwg
    id:
      input_members: [Name, WorkGroup]
    record:
      Name: id
      State: "'ENABLED'"
      Description: "'Description' in input ? string(input.Description) : ''"

  # The query's computed columns and rows live on the execution record, which
  # only the native StartQueryExecution writes; reads project them back out.
  query_execution:
    collection: atq
    id:
      input_members: [QueryExecutionId]

errors:
  InvalidRequest:
    code: InvalidRequestException
    http: 400
    fault: client

operations:
  CreateWorkGroup:
    effects:
      - put: { resource: workgroup }
    output: {}

  GetWorkGroup: {get: {resource: workgroup, error: InvalidRequest, wrap: WorkGroup}}
  ListWorkGroups:
    list: { resource: workgroup, member: WorkGroups, paginate: model }

  DeleteWorkGroup:
    effects:
      - delete: { resource: workgroup, missing: ignore }
    output: {}

  # The pack answered exactly these four members, not the stored record.
  GetQueryExecution:
    reads:
      q: { resource: query_execution }
    require:
      - { cond: q_found, error: InvalidRequest }
    output:
      QueryExecution: >
        {'QueryExecutionId': q.QueryExecutionId, 'Query': q.Query,
         'Status': q.Status, 'WorkGroup': q.WorkGroup}

  # The result set's first row is the column headers, then one row per stored
  # row, every cell wrapped in VarCharValue.
  GetQueryResults:
    reads:
      q: { resource: query_execution }
    require:
      - { cond: q_found, error: InvalidRequest }
    output:
      ResultSet: >
        {'Rows': [{'Data': q.columns.map(c, {'VarCharValue': c})}]
           + q.rows.map(r, {'Data': r.map(cell, {'VarCharValue': cell})}),
         'ResultSetMetadata':
           {'ColumnInfo': q.columns.map(c, {'Name': c, 'Type': 'varchar'})}}

  # The pack stopped nothing: no read, no write, and an unknown id succeeds.
  StopQueryExecution:
    output: {}

  ListQueryExecutions:
    list:
      resource: query_execution
      member: QueryExecutionIds
      paginate: model
    output:
      QueryExecutionIds: "items.map(q, q.QueryExecutionId)"

quirks:
  - operation: StartQueryExecution
    note: >
      The query runs synchronously at start: the execution is SUCCEEDED or
      FAILED the moment it is created, with no SubmissionDateTime or
      CompletionDateTime ever set, and the WorkGroup named is not checked to
      exist.
  - operation: GetQueryExecution
    note: >
      The answer carries QueryExecutionId, Query, Status and WorkGroup only;
      StatementType, Statistics, ResultConfiguration and every other declared
      member are never set, and a FAILED execution's StateChangeReason is the
      upstream glue or s3tables fault's message text.
  - operation: GetQueryResults
    note: >
      The first row of the result set is the header row, so a query over N
      records answers N+1 rows. MaxResults and NextToken are accepted and
      ignored: every row comes back in one page.
  - operation: StopQueryExecution
    note: >
      Stopping changes nothing and never faults: an unknown or already
      finished execution answers success, and the execution keeps its state.
  - operation: ListQueryExecutions
    note: >
      The WorkGroup member the model declares on the request is ignored; every
      execution in the account and region is listed, whichever workgroup the
      request names.
  - operation: CreateWorkGroup
    note: >
      Creating over an existing name overwrites the record, resetting State to
      ENABLED and dropping the old description when the new request omits one,
      where the real service answers InvalidRequestException. Configuration
      and Tags are accepted and discarded. The model requires Name; the pack
      accepted its absence and stored a workgroup under the empty key, which
      the engine now rejects.
  - operation: DeleteWorkGroup
    note: >
      Deleting is idempotent and ignores RecursiveDeleteOption: an absent
      workgroup deletes cleanly, and a workgroup with query history deletes
      without it -- the executions survive in their own collection and still
      list.
