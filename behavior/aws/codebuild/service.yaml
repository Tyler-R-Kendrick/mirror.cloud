schema: bir/1
service: aws.codebuild

# CodeBuild control plane with local execute-mode builds via the CI/CD JobControl
# bridge (see internal/execution/cicd/codebuild). StartBuild admits IN_PROGRESS;
# an AfterHook runs buildspec 0.2 when an executor is registered. Without one,
# builds remain non-terminal — never silent SUCCEEDED.
provenance: authored

resources:
  project:
    collection: cbproj
    arn: "arn:aws:codebuild:{region}:{account}:project/{id}"
    id:
      input_members: [name]
    record:
      name: id
      arn: arn

  build:
    collection: cbbuild
    id:
      input_members: [id]
    record:
      id: id

errors:
  AlreadyExists:
    code: ResourceAlreadyExistsException
    http: 400
    fault: client
  NotFound:
    code: ResourceNotFoundException
    http: 400
    fault: client

operations:
  CreateProject:
    reads:
      project: { resource: project }
    require:
      - { cond: "!project_found", error: AlreadyExists }
    effects:
      - create:
          resource: project
          record:
            source: "'source' in input ? input.source : null"
            environment: "'environment' in input ? input.environment : null"
            artifacts: "'artifacts' in input ? input.artifacts : null"
            serviceRole: "'serviceRole' in input ? string(input.serviceRole) : ''"
            timeoutInMinutes: "'timeoutInMinutes' in input ? input.timeoutInMinutes : 60"
      - patch:
          resource: project
          when: "'description' in input"
          record:
            description: "string(input.description)"
      - patch:
          resource: project
          when: "'cache' in input"
          record:
            cache: input.cache
      - patch:
          resource: project
          when: "'logsConfig' in input"
          record:
            logsConfig: input.logsConfig
    output:
      project: rec

  UpdateProject:
    reads:
      project: { resource: project }
    require:
      - { cond: project_found, error: NotFound }
    effects:
      - patch:
          resource: project
          when: "'source' in input"
          record:
            source: input.source
      - patch:
          resource: project
          when: "'environment' in input"
          record:
            environment: input.environment
      - patch:
          resource: project
          when: "'artifacts' in input"
          record:
            artifacts: input.artifacts
      - patch:
          resource: project
          when: "'serviceRole' in input"
          record:
            serviceRole: "string(input.serviceRole)"
      - patch:
          resource: project
          when: "'timeoutInMinutes' in input"
          record:
            timeoutInMinutes: input.timeoutInMinutes
      - patch:
          resource: project
          when: "'description' in input"
          record:
            description: "string(input.description)"
      - patch:
          resource: project
          when: "'cache' in input"
          record:
            cache: input.cache
      - patch:
          resource: project
          when: "'logsConfig' in input"
          record:
            logsConfig: input.logsConfig
    output:
      project: rec

  BatchGetProjects:
    list:
      resource: project
      member: projects
      paginate: model
      filter: "item.name in input.names"
    output:
      projects: items
      projectsNotFound: "input.names.filter(n, !items.exists(p, string(p.name) == string(n)))"

  ListProjects:
    list: { resource: project, member: projects, paginate: model }
    output:
      projects: "items.map(p, string(p.name))"

  # Deleting a project leaves builds in cbbuild (AWS DeleteProject retains
  # build history; the resource-policy exception is not modeled here).
  DeleteProject: {delete: {resource: project, missing: ignore}}

  StartBuild:
    reads:
      project: { resource: project, key: "string(input.projectName)" }
    require:
      - { cond: project_found, error: NotFound }
    effects:
      - generate: { bind: bid, kind: hex, bytes: 8 }
      - create:
          resource: build
          key: "string(input.projectName) + ':' + fx.bid"
          record:
            projectName: "string(input.projectName)"
            buildStatus: "'IN_PROGRESS'"
            currentPhase: "'BUILD'"
            startTime: now
            # Snapshot project config at admission (immutable for this build).
            source: "'sourceOverride' in input ? input.sourceOverride : project.source"
            environment: "'environmentOverride' in input ? input.environmentOverride : project.environment"
            artifacts: "project.artifacts"
            buildspecOverride: "'buildspecOverride' in input ? string(input.buildspecOverride) : ''"
            idempotencyToken: "'idempotencyToken' in input ? string(input.idempotencyToken) : ''"
            phases: >
              [{'phaseType': 'SUBMITTED', 'phaseStatus': 'SUCCEEDED', 'startTime': now, 'endTime': now},
               {'phaseType': 'BUILD', 'phaseStatus': 'IN_PROGRESS', 'startTime': now}]
    output:
      build: rec

  BatchGetBuilds:
    list:
      resource: build
      member: builds
      paginate: model
      filter: "item.id in input.ids"
    output:
      builds: items
      buildsNotFound: "input.ids.filter(i, !items.exists(b, string(b.id) == string(i)))"

  ListBuilds:
    list: { resource: build, member: ids, paginate: model }
    output:
      ids: "items.map(b, string(b.id))"

  ListBuildsForProject:
    list:
      resource: build
      member: ids
      paginate: model
      filter: "string(item.projectName) == string(input.projectName)"
    output:
      ids: "items.map(b, string(b.id))"

  # Stop only rewrites non-terminal builds. A completed build answers with its
  # existing final status unchanged (AWS StopBuild semantics).
  StopBuild:
    reads:
      build: { resource: build }
    require:
      - { cond: build_found, error: NotFound }
    effects:
      - patch:
          resource: build
          when: "string(build.buildStatus) == 'IN_PROGRESS'"
          record:
            buildStatus: "'STOPPED'"
            currentPhase: "'COMPLETED'"
            endTime: now
    output:
      build: >
        string(build.buildStatus) == 'IN_PROGRESS'
          ? merge(build, {'buildStatus': 'STOPPED', 'currentPhase': 'COMPLETED', 'endTime': now})
          : build

quirks:
  - operation: CreateProject
    note: >
      Required source, environment, artifacts, and serviceRole are persisted.
      Duplicate names fault ResourceAlreadyExistsException. vpcConfig and
      privileged builds remain out of profile.
  - operation: UpdateProject
    note: >
      Partial updates merge onto the existing project; missing projects fault
      ResourceNotFoundException. Omitted members keep prior values.
  - operation: StartBuild
    note: >
      Builds start IN_PROGRESS (not SUCCEEDED). Execution requires the CI/CD
      process executor AfterHook; without it the build stays non-terminal.
      Project must exist. Buildspec 0.1 is unsupported. Hosted image/VPC
      parity is out of profile.
  - operation: StopBuild
    note: >
      Missing builds fault ResourceNotFoundException. Terminal builds
      (SUCCEEDED/FAILED/STOPPED) return unchanged. Only IN_PROGRESS becomes
      STOPPED.
  - operation: DeleteProject
    note: >
      Project deletion leaves build history in cbbuild. The AWS resource-policy
      exception that blocks delete while builds exist is not modeled.
