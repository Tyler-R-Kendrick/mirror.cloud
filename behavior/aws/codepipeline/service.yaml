schema: bir/1
service: aws.codepipeline

# Pipeline control plane with real stage-state projection. Executions admit as
# InProgress. Optional AfterInvoke (MIRROR_CICD_EXECUTE=1 / codepipeline.Enable)
# dispatches Build/CodeBuild → StartBuild, stops on Approval/Manual Pending, and
# on PutApprovalResult(Approved) continues Deploy/CodeDeploy → CreateDeployment.
# Fixture may supply mirrorAppSpec / mirrorRevisionFiles on Deploy action config.
# Without execute, GetPipelineState projects InProgress from the declaration.
provenance: authored

resources:
  pipeline:
    collection: cp
    id:
      derive: >
        'pipeline' in input && 'name' in input.pipeline
          ? string(input.pipeline.name)
          : ('name' in input ? string(input.name) : '')
    record:
      name: id
      roleArn: >
        'pipeline' in input && 'roleArn' in input.pipeline
          ? string(input.pipeline.roleArn) : ''
      artifactStore: >
        'pipeline' in input && 'artifactStore' in input.pipeline
          ? input.pipeline.artifactStore : null
      stages: >
        'pipeline' in input && 'stages' in input.pipeline
          ? input.pipeline.stages : []

  execution:
    collection: cpex
    id:
      generate: { kind: hex, bytes: 8 }
    record: {}

errors:
  Validation:
    code: ValidationException
    http: 400
    fault: client
  PipelineNotFound:
    code: PipelineNotFoundException
    http: 400
    fault: client
  ExecutionNotFound:
    code: PipelineExecutionNotFoundException
    http: 400
    fault: client

operations:
  # Create and update are one write: both replace the whole record, so an
  # update that omits a stage list empties it.
  CreatePipeline: {put: {resource: pipeline, wrap: pipeline}}
  UpdatePipeline: {put: {resource: pipeline, wrap: pipeline}}
  GetPipeline: {get: {resource: pipeline, error: PipelineNotFound, key: string(input.name), wrap: pipeline}}
  # Prefer stageStates snapped by the execute AfterInvoke; otherwise project
  # InProgress from the stored pipeline declaration.

  GetPipelineState:
    reads:
      p: { resource: pipeline, key: "string(input.name)" }
    require:
      - { cond: p_found, error: PipelineNotFound }
    output:
      pipelineName: p.name
      stageStates: >
        ('stageStates' in p && p.stageStates != null)
          ? p.stageStates
          : (p.stages == null ? [] : p.stages).map(s, {
              'stageName': string(s.name),
              'inboundTransitionState': {'enabled': true},
              'actionStates': (s.actions == null ? [] : s.actions).map(a, {
                'actionName': string(a.name),
                'latestExecution': {
                  'status': 'InProgress',
                  'actionExecutionId': string(a.name)
                }
              })
            })

  ListPipelines:
    list: { resource: pipeline, member: pipelines, paginate: model }
    output:
      pipelines: "items.map(p, {'name': p.name})"

  DeletePipeline: {delete: {resource: pipeline, key: string(input.name), missing: ignore}}
  StartPipelineExecution:
    reads:
      p: { resource: pipeline, key: "string(input.name)" }
    require:
      - { cond: p_found, error: PipelineNotFound }
    effects:
      - generate: { bind: run, kind: hex, bytes: 8 }
      - put:
          resource: execution
          key: "string(input.name) + '-' + fx.run"
          record:
            pipelineName: "string(input.name)"
            pipelineExecutionId: "string(input.name) + '-' + fx.run"
            status: "'InProgress'"
      - patch:
          resource: pipeline
          key: "string(input.name)"
          record:
            latestExecutionId: "string(input.name) + '-' + fx.run"
    output:
      pipelineExecutionId: "string(input.name) + '-' + fx.run"

  GetPipelineExecution: {get: {resource: execution, error: ExecutionNotFound, key: string(input.pipelineExecutionId), wrap: pipelineExecution}}
  ListPipelineExecutions:
    list:
      resource: execution
      member: pipelineExecutionSummaries
      paginate: model
      filter: "string(item.pipelineName) == string(input.pipelineName)"

  # Mirror ack for Manual approval. Execute AfterInvoke advances past Pending
  # when result.status is Approved; Rejected fails the execution without deploy.
  PutApprovalResult:
    output: {}

  # Stopping an absent id still answers the id (pack quirk). Only InProgress
  # executions are rewritten; terminal statuses stay put.
  StopPipelineExecution:
    reads:
      e: { resource: execution, key: "string(input.pipelineExecutionId)" }
    effects:
      - patch:
          resource: execution
          key: "string(input.pipelineExecutionId)"
          when: "e_found && string(e.status) == 'InProgress' && !('abandon' in input && input.abandon)"
          record:
            status: "'Stopped'"
      - patch:
          resource: execution
          key: "string(input.pipelineExecutionId)"
          when: "e_found && string(e.status) == 'InProgress' && 'abandon' in input && input.abandon"
          record:
            status: "'Abandoned'"
    output:
      pipelineExecutionId: "string(input.pipelineExecutionId)"

quirks:
  - operation: StartPipelineExecution
    note: >
      Executions admit as InProgress. With execute enabled, AfterInvoke dispatches
      Build/CodeBuild → StartBuild, leaves Approval/Manual Pending (later stages
      not dispatched), and may snap stageStates / terminal status. Deploy/CodeDeploy
      runs only after approval. Without execute, GetPipelineState projects InProgress.
  - operation: PutApprovalResult
    note: >
      Control-plane ack (empty output). With execute enabled, Approved resumes
      Finalize past the Pending action (including Deploy/CodeDeploy). Rejected
      marks the approval Failed and the execution Failed without deploying.
      Token is ignored. Missing/non-Pending actions are no-ops.
  - operation: StopPipelineExecution
    note: >
      Only InProgress executions move to Stopped or Abandoned. Terminal
      executions keep their status. Missing ids still answer the requested id.
  - operation: ListPipelineExecutions
    note: >
      Results are filtered to the requested pipelineName.
  - operation: UpdatePipeline
    note: >
      Omitted stages/roleArn/artifactStore keep prior values. Missing
      pipelines fault PipelineNotFoundException.
