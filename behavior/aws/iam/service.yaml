quirks:
  - operation: CreateRole
    note: >
      CreateRole and UpdateRole are one code path in the pack: both replace the
      record wholesale, so an UpdateRole drops the AssumeRolePolicyDocument the
      create stored (it reads a member UpdateRole does not declare and stores
      null), and a Create over an existing name overwrites it where the real
      service answers EntityAlreadyExists. UpdateRole's output shape declares
      no members; the pack answered the Role record anyway, so that step is
      recorded as superseded. UpdateUser and UpdateGroup have the same shape:
      the pack answered the renamed record though both operations return the
      unit shape.
  - operation: UpdateUser
    note: >
      A rename deletes the old record and writes it under the new name, but
      nothing else follows: access keys, login profiles, inline policies,
      attachments and group memberships keep pointing at the old name, so a
      renamed user's access keys stop listing under the new name and the old
      name's GetGroup entry reads as the bare fallback. UpdateGroup renames
      the same way. UpdateRoleDescription is not this operation: the pack's
      leftover surface handles it as a flat lmisc write that stores the request
      under the role's name, and the role record itself is unchanged.
  - operation: CreatePolicy
    note: >
      The v1 version row is written alongside the policy, and DeletePolicy
      removes only the policy record -- the versions are orphaned and
      GetPolicyVersion still answers them. The pack keys policies by name,
      preferring an undeclared PolicyName member over the declared PolicyArn
      when both are present; the bundle's derive does the same.
  - operation: CreatePolicyVersion
    note: >
      With SetAsDefault the pack updates the policy's DefaultVersionId and the
      new version's stored IsDefaultVersion but never clears the old default's,
      so ListPolicyVersions reports two defaults until SetDefaultPolicyVersion
      runs; the transcription keeps that, and the recorded list steps show it.
      The version id comes from a per-policy sequence the create seeds at v1.
  - operation: DeletePolicyVersion
    note: >
      Deleting the policy's current default version is the pack's only
      DeleteConflict; deleting a version that never existed succeeds, and
      deleting one whose policy is already gone succeeds too.
  - operation: CreateAccessKey
    note: >
      The key id is derived from the count of the user's existing keys, so
      deleting the only key and creating again reissues the same id and the
      same secret; the bundle draws fresh ones and the recorded reissue step
      is superseded. ListAccessKeys strips the secret -- CreateAccessKey is
      the only operation that ever answers it.
  - operation: UpdateLoginProfile
    note: >
      Updating a profile that was never created conjures one holding only the
      user name, where GetLoginProfile on a missing user faults. A
      PasswordResetRequired the update omits is kept from the stored profile.
  - operation: GetGroup
    note: >
      The pack joined member user records live at read time, falling back to a
      bare {UserName} for a deleted user; the bundle stores the member's user
      record at AddUserToGroup time, so a user whose record changes after the
      add lists as of the add, and after a rename -- which deletes the old
      record -- the pack answers the bare fallback while the bundle still
      carries the snapshot's stale Arn. That path is not recorded.
  - operation: AddRoleToInstanceProfile
    note: >
      A role that was never created joins the profile as a bare name and the
      ARN it would have had. RemoveRoleFromInstanceProfile never faults: an
      unknown profile answers success and the role-side marker is still
      deleted. DeleteInstanceProfile orphans those markers, so
      ListInstanceProfilesForRole lists profiles that no longer exist.
  - operation: TagRole
    note: >
      Tag replaces the whole tag list stored under the name; Untag deletes all
      of it, ignoring the TagKeys it was given. ListRoleTags and ListUserTags
      answer an empty list for a name that was never tagged rather than
      faulting. TagUser is the same.
  - operation: CreateOpenIDConnectProvider
    note: >
      The provider ARN is the URL with its scheme stripped. The pack also
      honored an undeclared URL member when Url was empty; the bundle does
      not. GetOpenIDConnectProvider answers the stored Arn member, which the
      response shape does not declare, so those steps are recorded as
      superseded; GetSAMLProvider is the same with Name and Arn.
  - operation: CreateSAMLProvider
    note: >
      Providers are keyed by the last path segment of whatever names them, so
      a Name containing a slash is truncated to its last segment. The pack's
      Name fallback on Get, Update and Delete is dead: the model requires
      SAMLProviderArn and the engine rejects its absence before the rule runs.
  - operation: GetAccountSummary
    note: >
      Not transcribed: the pack counts five collections and B-IR has no count,
      so the bundle omits the operation and the shadow note carries it.
  - operation: SimulatePrincipalPolicy
    note: >
      Not transcribed, with SimulateCustomPolicy: the pack runs the policy
      decision engine (glob matching, the Condition operator vocabulary) and
      reads SCP attachments from another account's scope for the
      OrganizationsDecisionDetail member. Neither is expressible; both stay
      with the pack, and the authorizer they share code with is what
      internal/runtime consumes.
  - operation: PutRolePolicy
    note: >
      Inline policies store the whole request verbatim and Get answers it
      back; Put over an existing name replaces it. PutUserPolicy and
      PutGroupPolicy are the same, and none of them check that the named role,
      user or group exists. Deletes of inline policies and attachments are
      idempotent, as is every delete in this service.
  - operation: ListMFADevices
    note: >
      On the leftover surface a list that names an id falls through to a full
      listing of the kind when that exact record is absent -- ListMFADevices
      with a UserName lists every MFA device, not the user's -- and the one
      recorded step naming an absent id is superseded; the bundle's keyed list
      answers empty. The engine's model check also rejects requests missing
      required members before any rule runs, where the pack folded the absence
      to an empty-string key; those write-side paths are dead, and the
      missing-input answer is NoSuchEntity, the pack's read-side one.
  - operation: UploadServerCertificate
    note: >
      The leftover Update operations are writes: UpdateServerCertificate
      replaces the certificate record with the update request, so the body and
      private key are gone afterwards, and the recorded GetServerCertificate
      after it shows exactly that. UploadSSHPublicKey, UploadSigningCertificate
      and CreateServiceSpecificCredential are keyed by the user name when the
      request carries no id member, so a second credential for one user
      overwrites the first. Every leftover write answers the stored request
      plus its id member whether or not the output shape declares them; those
      steps are recorded as superseded, and the wire drops the undeclared
      members either way. Untag*, Remove*, Deactivate*, Disable* and Reject*
      all delete the named record itself -- UntagMFADevice deletes the device.
      ListVirtualMFADevices answers under MFADevices, which the response does
      not declare (it declares VirtualMFADevices), and the tag listings answer
      under their kind's list member rather than Tags; the bundle answers the
      declared member and those steps are superseded. GetCredentialReport
      always answers an empty Content (its State COMPLETE is undeclared), and
      GetAccessKeyLastUsed a constant N/A.
