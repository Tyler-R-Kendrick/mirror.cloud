schema: bir/1
service: aws.iam

# Transcribed from the hand-written pack, not established against the real
# service. IAM-lite: roles, users, groups, policies and profiles are stored
# records; nothing is validated against anything, no attachment is checked to
# exist, and renames delete-and-rewrite the record under its new name.
provenance: authored

# The pack answered an absent required member with NoSuchEntity on the read
# side: its first() helper folds an absent member to the empty string, the
# store holds no empty key, and the miss is that fault. The engine's model
# check now rejects the absence first, so that is also the missing-input
# answer. On the write side the pack accepted the absence and stored a record
# under the empty key; that path is dead now (see quirks).
missing_input_error: NoSuchEntity

# Complete and gated, but not yet serving. Three gaps, none expressible:
#
#   - SimulatePrincipalPolicy and SimulateCustomPolicy are a policy decision
#     engine: glob matching over Action/Resource, the Condition operator
#     vocabulary (StringLike, Numeric*, Null, IfExists), and -- for the
#     OrganizationsDecisionDetail member -- a read of the aws.organizations
#     pack's SCP attachments in another account's scope. CEL has no glob
#     match and B-IR has no cross-scope read, so both operations are omitted
#     below rather than approximated.
#   - GetAccountSummary counts five collections; B-IR can list one resource
#     per operation and has no count. Omitted rather than answered with a
#     constant.
#   - The pack also exports NewAuthorizer, the policy evaluator the runtime
#     (internal/runtime) uses to authorize every service's requests against
#     these records. That is engine infrastructure with a Go-only API, not
#     service behavior; it is why the pack directory stays regardless.
#
# The bundle takes over when an iam/evaluate primitive carries the decision
# engine (with its cross-scope SCP read), a count or size-over-list reaches
# outputs, and the authorizer's ownership moves into the engine.
shadow: >
  SimulatePrincipalPolicy/SimulateCustomPolicy need glob matching, the IAM
  Condition operators and a cross-scope read of SCP attachments, and
  GetAccountSummary needs a count over five collections; none of that is
  expressible in B-IR today, and the pack's NewAuthorizer is Go-only engine
  infrastructure consumed by internal/runtime. Everything else the pack does
  is transcribed and gated below.

resources:
  role:
    collection: iamrole
    id:
      input_members: [RoleName]

  user:
    collection: iamuser
    id:
      input_members: [UserName]

  # The pack keys a customer policy by name, taking PolicyName when the
  # request carries it and the last ARN path segment otherwise.
  policy:
    collection: iampolicy
    id:
      derive: >
        ('PolicyName' in input && string(input.PolicyName) != '')
        ? string(input.PolicyName)
        : ('PolicyArn' in input ? lastSegment(string(input.PolicyArn), '/') : '')

  # Versions live under the policy so the listing needs no filter; the pack
  # kept them in one flat collection under a name:version key, which is the
  # same containment.
  polver:
    collection: "iampolver:{policy.id}"
    parent: policy
    id:
      derive: >
        (('PolicyName' in input && string(input.PolicyName) != '')
          ? string(input.PolicyName)
          : ('PolicyArn' in input ? lastSegment(string(input.PolicyArn), '/') : ''))
        + ':' + ('VersionId' in input ? string(input.VersionId) : '')

  # Inline policies store the whole request verbatim; reads answer it back.
  rolepolicy:
    collection: iamrp
    id:
      derive: "string(input.RoleName) + ':' + string(input.PolicyName)"

  userpolicy:
    collection: iamup
    id:
      derive: "string(input.UserName) + ':' + string(input.PolicyName)"

  grouppolicy:
    collection: iamgp
    id:
      derive: "string(input.GroupName) + ':' + string(input.PolicyName)"

  attached:
    collection: iamatt
    id:
      derive: "string(input.RoleName) + ':' + string(input.PolicyArn)"

  uattached:
    collection: iamuatt
    id:
      derive: "string(input.UserName) + ':' + string(input.PolicyArn)"

  gattached:
    collection: iamgable
    id:
      derive: "string(input.GroupName) + ':' + string(input.PolicyArn)"

  # The pack stored the tag list itself, not a record; the record wrapper is
  # the bundle's. Untag deletes the whole list, ignoring TagKeys.
  roletags:
    collection: iamroletags
    id:
      input_members: [RoleName]

  usertags:
    collection: iamusertags
    id:
      input_members: [UserName]

  login:
    collection: iamlogin
    id:
      input_members: [UserName]

  group:
    collection: iamgroup
    id:
      input_members: [GroupName]

  # Group membership, group side. The record is the member's user record as
  # of the add; see the GetGroup quirk for what the pack did instead.
  gm:
    collection: "iamgm:{group.id}"
    parent: group
    id:
      derive: "string(input.UserName)"

  # Group membership, user side; ListGroupsForUser answers these verbatim.
  ug:
    collection: "iamug:{user.id}"
    parent: user
    id:
      derive: "string(input.GroupName)"

  ip:
    collection: iamip
    id:
      input_members: [InstanceProfileName]

  # Which instance profiles hold a role, role side; the record carries only
  # the profile name, as the pack's did.
  iprole:
    collection: "iamipr:{role.id}"
    parent: role
    id:
      derive: "string(input.InstanceProfileName)"

  alias:
    collection: iamalias
    id:
      input_members: [AccountAlias]

  pwpolicy:
    collection: iampw
    singleton: pwpolicy

  # Providers are keyed by their ARN, computed from the URL at creation and
  # supplied directly afterwards.
  oidc:
    collection: iamoidc
    id:
      derive: >
        ('OpenIDConnectProviderArn' in input && string(input.OpenIDConnectProviderArn) != '')
        ? string(input.OpenIDConnectProviderArn)
        : ('Url' in input
          ? 'arn:aws:iam::' + identity.account + ':oidc-provider/'
            + (string(input.Url).startsWith('https://')
              ? substr(string(input.Url), 8, blen(string(input.Url)))
              : (string(input.Url).startsWith('http://')
                ? substr(string(input.Url), 7, blen(string(input.Url)))
                : string(input.Url)))
          : '')

  # SAML providers are keyed by name, taken from the last ARN path segment
  # when the request names the provider by ARN.
  saml:
    collection: iamsaml
    id:
      derive: >
        ('SAMLProviderArn' in input && string(input.SAMLProviderArn) != '')
        ? lastSegment(string(input.SAMLProviderArn), '/')
        : ('Name' in input ? lastSegment(string(input.Name), '/') : '')

  # Access keys are addressed by user and id together; creation generates the
  # id and writes under an explicit key.
  ak:
    collection: iamak
    id:
      derive: >
        ('UserName' in input ? string(input.UserName) : '')
        + ':' + ('AccessKeyId' in input ? string(input.AccessKeyId) : '')

  # The pack's leftover surface (extra.go): every remaining operation stores
  # the request under kind:id, where id is the first of these members the
  # request carries, or a generated hex id when it carries none. One
  # collection per kind; the per-operation chain lives in each operation's
  # `eid` let binding.
  ldele:
    collection: ldele
  lmfa:
    collection: lmfa
  lssh:
    collection: lssh
  lscert:
    collection: lscert
  lsign:
    collection: lsign
  lssc:
    collection: lssc
  lslr:
    collection: lslr
  loidc:
    collection: loidc
  lsaml:
    collection: lsaml
  lip:
    collection: lip
  lorg:
    collection: lorg
  lrep:
    collection: lrep
  lbound:
    collection: lbound
  lmisc:
    collection: lmisc

errors:
  NoSuchEntity:
    code: NoSuchEntity
    http: 404
    fault: client
  DeleteConflict:
    code: DeleteConflict
    http: 409
    fault: client
    message: cannot delete default version

operations:
  # --- roles ---------------------------------------------------------------

  # CreateRole and UpdateRole are one code path in the pack: both replace the
  # record wholesale. UpdateRole's declared output has no members, so the
  # Role the pack answered is recorded as superseded.
  CreateRole:
    effects:
      - create:
          resource: role
          record:
            RoleName: id
            Arn: "'arn:aws:iam::' + identity.account + ':role/' + id"
            AssumeRolePolicyDocument: "'AssumeRolePolicyDocument' in input ? input.AssumeRolePolicyDocument : null"
    output:
      Role: rec

  UpdateRole:
    effects:
      - create:
          resource: role
          record:
            RoleName: id
            Arn: "'arn:aws:iam::' + identity.account + ':role/' + id"
            AssumeRolePolicyDocument: "'AssumeRolePolicyDocument' in input ? input.AssumeRolePolicyDocument : null"
    output: {}

  GetRole:
    reads:
      r: { resource: role }
    require:
      - { cond: r_found, error: NoSuchEntity }
    output:
      Role: r

  DeleteRole:
    effects:
      - delete: { resource: role, missing: ignore }
    output: {}

  ListRoles:
    list: { resource: role, member: Roles, paginate: model }

  UpdateAssumeRolePolicy:
    reads:
      r: { resource: role }
    require:
      - { cond: r_found, error: NoSuchEntity }
    effects:
      - patch:
          resource: role
          record:
            AssumeRolePolicyDocument: "'PolicyDocument' in input ? input.PolicyDocument : input.AssumeRolePolicyDocument"
    output: {}

  # --- inline role policies --------------------------------------------------

  PutRolePolicy:
    effects:
      - create: { resource: rolepolicy, spread: input }
    output: {}

  GetRolePolicy:
    reads:
      p: { resource: rolepolicy }
    require:
      - { cond: p_found, error: NoSuchEntity }
    output:
      RoleName: "'RoleName' in p ? p.RoleName : null"
      PolicyName: "'PolicyName' in p ? p.PolicyName : null"
      PolicyDocument: "'PolicyDocument' in p ? p.PolicyDocument : null"

  DeleteRolePolicy:
    effects:
      - delete: { resource: rolepolicy, missing: ignore }
    output: {}

  ListRolePolicies:
    list:
      resource: rolepolicy
      member: PolicyNames
      paginate: model
      filter: "string(item.RoleName) == string(input.RoleName)"
    output:
      PolicyNames: "items.map(p, p.PolicyName)"

  # --- attached role policies --------------------------------------------------

  AttachRolePolicy:
    effects:
      - create:
          resource: attached
          record:
            PolicyArn: "string(input.PolicyArn)"
            RoleName: "string(input.RoleName)"
    output: {}

  DetachRolePolicy:
    effects:
      - delete: { resource: attached, missing: ignore }
    output: {}

  ListAttachedRolePolicies:
    list:
      resource: attached
      member: AttachedPolicies
      paginate: model
      filter: "string(item.RoleName) == string(input.RoleName)"

  # --- managed policies --------------------------------------------------------

  # The version row is written first so `rec` is the policy, which is the
  # record the output answers.
  CreatePolicy:
    reads:
      # Resolves the policy's key so the version row's parent-scoped
      # collection can be named; the read itself is not used.
      p: { resource: policy }
    effects:
      - create:
          resource: polver
          key: "string(input.PolicyName) + ':v1'"
          record:
            VersionId: "'v1'"
            Document: input.PolicyDocument
            IsDefaultVersion: true
      - create:
          resource: policy
          record:
            PolicyName: id
            Arn: "'arn:aws:iam::' + identity.account + ':policy/' + id"
            PolicyDocument: input.PolicyDocument
            DefaultVersionId: "'v1'"
    output:
      Policy: rec

  GetPolicy:
    reads:
      p: { resource: policy }
    require:
      - { cond: p_found, error: NoSuchEntity }
    output:
      Policy: p

  # Deleting a policy orphans its versions; the pack never touched them.
  DeletePolicy:
    effects:
      - delete: { resource: policy, missing: ignore }
    output: {}

  ListPolicies:
    list: { resource: policy, member: Policies, paginate: model }

  CreatePolicyVersion:
    reads:
      p: { resource: policy }
    require:
      - { cond: p_found, error: NoSuchEntity }
    effects:
      - counter: { name: "iam/polvseq/{policy.id}" }
      - patch:
          resource: policy
          when: "'SetAsDefault' in input && (input.SetAsDefault == true || input.SetAsDefault == 'true' || input.SetAsDefault == 'True')"
          record:
            DefaultVersionId: "'v' + string(fx.counter + 1)"
      - create:
          resource: polver
          key: "string(p.PolicyName) + ':v' + string(fx.counter + 1)"
          record:
            VersionId: "'v' + string(fx.counter + 1)"
            Document: input.PolicyDocument
            IsDefaultVersion: "'SetAsDefault' in input && (input.SetAsDefault == true || input.SetAsDefault == 'true' || input.SetAsDefault == 'True')"
    output:
      PolicyVersion: rec

  GetPolicyVersion:
    reads:
      p: { resource: policy }
      v: { resource: polver }
    require:
      - { cond: v_found, error: NoSuchEntity }
    output:
      PolicyVersion: v

  DeletePolicyVersion:
    reads:
      p: { resource: policy }
    require:
      - cond: "!(p_found && 'DefaultVersionId' in p && string(p.DefaultVersionId) == string(input.VersionId))"
        error: DeleteConflict
    effects:
      - delete: { resource: polver, missing: ignore }
    output: {}

  ListPolicyVersions:
    reads:
      p: { resource: policy }
    list: { resource: polver, member: Versions, paginate: model }

  SetDefaultPolicyVersion:
    reads:
      p: { resource: policy }
    require:
      - { cond: p_found, error: NoSuchEntity }
    select: { binding: vers, resource: polver }
    effects:
      - patch:
          resource: policy
          record:
            DefaultVersionId: "string(input.VersionId)"
      - patch:
          resource: polver
          for_each: vers
          key: "string(p.PolicyName) + ':' + string(item.VersionId)"
          record:
            IsDefaultVersion: "string(item.VersionId) == string(input.VersionId)"
    output: {}

  # --- users -------------------------------------------------------------------

  CreateUser:
    effects:
      - create:
          resource: user
          record:
            UserName: id
            Arn: "'arn:aws:iam::' + identity.account + ':user/' + id"
    output:
      User: rec

  GetUser:
    reads:
      u: { resource: user }
    require:
      - { cond: u_found, error: NoSuchEntity }
    output:
      User: u

  # A rename deletes the old record and writes the same record under the new
  # name. UpdateUser's output is the unit shape; the User the pack answered
  # is recorded as superseded.
  UpdateUser:
    reads:
      u: { resource: user }
    require:
      - { cond: u_found, error: NoSuchEntity }
    effects:
      - delete:
          resource: user
          key: "string(input.UserName)"
          when: "'NewUserName' in input && string(input.NewUserName) != ''"
      - put:
          resource: user
          key: "'NewUserName' in input && string(input.NewUserName) != '' ? string(input.NewUserName) : string(input.UserName)"
          record:
            UserName: "'NewUserName' in input && string(input.NewUserName) != '' ? string(input.NewUserName) : string(input.UserName)"
            Arn: "'arn:aws:iam::' + identity.account + ':user/' + ('NewUserName' in input && string(input.NewUserName) != '' ? string(input.NewUserName) : string(input.UserName))"
    output: {}

  DeleteUser:
    effects:
      - delete: { resource: user, missing: ignore }
    output: {}

  ListUsers:
    list: { resource: user, member: Users, paginate: model }

  # --- inline user policies ------------------------------------------------------

  PutUserPolicy:
    effects:
      - create: { resource: userpolicy, spread: input }
    output: {}

  GetUserPolicy:
    reads:
      p: { resource: userpolicy }
    require:
      - { cond: p_found, error: NoSuchEntity }
    output:
      UserName: "'UserName' in p ? p.UserName : null"
      PolicyName: "'PolicyName' in p ? p.PolicyName : null"
      PolicyDocument: "'PolicyDocument' in p ? p.PolicyDocument : null"

  DeleteUserPolicy:
    effects:
      - delete: { resource: userpolicy, missing: ignore }
    output: {}

  ListUserPolicies:
    list:
      resource: userpolicy
      member: PolicyNames
      paginate: model
      filter: "string(item.UserName) == string(input.UserName)"
    output:
      PolicyNames: "items.map(p, p.PolicyName)"

  AttachUserPolicy:
    effects:
      - create:
          resource: uattached
          record:
            PolicyArn: "string(input.PolicyArn)"
            UserName: "string(input.UserName)"
    output: {}

  DetachUserPolicy:
    effects:
      - delete: { resource: uattached, missing: ignore }
    output: {}

  ListAttachedUserPolicies:
    list:
      resource: uattached
      member: AttachedPolicies
      paginate: model
      filter: "string(item.UserName) == string(input.UserName)"

  # --- access keys -----------------------------------------------------------------

  CreateAccessKey:
    effects:
      - generate: { bind: akid, kind: hex, bytes: 20 }
      - generate: { bind: aksecret, kind: hex, bytes: 40 }
      - create:
          resource: ak
          key: "string(input.UserName) + ':' + string(fx.akid)"
          record:
            AccessKeyId: "string(fx.akid)"
            SecretAccessKey: "string(fx.aksecret)"
            UserName: "string(input.UserName)"
            Status: "'Active'"
    output:
      AccessKey: rec

  # The pack strips the secret at read time; the projection names what stays.
  ListAccessKeys:
    list:
      resource: ak
      member: AccessKeyMetadata
      paginate: model
      filter: "string(item.UserName) == ('UserName' in input ? string(input.UserName) : '')"
    output:
      AccessKeyMetadata: "items.map(k, {'AccessKeyId': k.AccessKeyId, 'Status': k.Status, 'UserName': k.UserName})"

  UpdateAccessKey:
    reads:
      a: { resource: ak }
    require:
      - { cond: a_found, error: NoSuchEntity }
    effects:
      - patch:
          resource: ak
          when: "string(input.Status) != ''"
          record:
            Status: "string(input.Status)"
    output: {}

  DeleteAccessKey:
    effects:
      - delete: { resource: ak, missing: ignore }
    output: {}

  # --- login profiles ---------------------------------------------------------------

  CreateLoginProfile:
    effects:
      - create:
          resource: login
          record:
            UserName: id
            PasswordResetRequired: "'PasswordResetRequired' in input ? input.PasswordResetRequired : null"
    output:
      LoginProfile: rec

  GetLoginProfile:
    reads:
      l: { resource: login }
    require:
      - { cond: l_found, error: NoSuchEntity }
    output:
      LoginProfile: l

  # Updating a profile that was never created conjures one holding only the
  # user name; the pack did the same.
  UpdateLoginProfile:
    reads:
      l: { resource: login }
    effects:
      - put:
          resource: login
          record:
            UserName: "string(input.UserName)"
            PasswordResetRequired: "'PasswordResetRequired' in input ? input.PasswordResetRequired : (l_found && 'PasswordResetRequired' in l ? l.PasswordResetRequired : null)"
    output: {}

  DeleteLoginProfile:
    effects:
      - delete: { resource: login, missing: ignore }
    output: {}

  # --- groups -------------------------------------------------------------------------

  CreateGroup:
    effects:
      - create:
          resource: group
          record:
            GroupName: id
            Arn: "'arn:aws:iam::' + identity.account + ':group/' + id"
            Path: "'Path' in input && string(input.Path) != '' ? string(input.Path) : '/'"
    output:
      Group: rec

  GetGroup:
    reads:
      g: { resource: group }
    require:
      - { cond: g_found, error: NoSuchEntity }
    list: { resource: gm, member: Users, paginate: model }
    output:
      Group: g

  UpdateGroup:
    reads:
      g: { resource: group }
    require:
      - { cond: g_found, error: NoSuchEntity }
    effects:
      - delete:
          resource: group
          key: "string(input.GroupName)"
          when: "'NewGroupName' in input && string(input.NewGroupName) != ''"
      - put:
          resource: group
          key: "'NewGroupName' in input && string(input.NewGroupName) != '' ? string(input.NewGroupName) : string(input.GroupName)"
          record:
            GroupName: "'NewGroupName' in input && string(input.NewGroupName) != '' ? string(input.NewGroupName) : string(input.GroupName)"
            Arn: "'arn:aws:iam::' + identity.account + ':group/' + ('NewGroupName' in input && string(input.NewGroupName) != '' ? string(input.NewGroupName) : string(input.GroupName))"
            Path: "'Path' in g ? g.Path : '/'"
    output: {}

  DeleteGroup:
    effects:
      - delete: { resource: group, missing: ignore }
    output: {}

  ListGroups:
    list: { resource: group, member: Groups, paginate: model }

  AddUserToGroup:
    reads:
      g: { resource: group }
      u: { resource: user }
    effects:
      - create:
          resource: gm
          record:
            UserName: "string(input.UserName)"
            Arn: "u_found && 'Arn' in u ? u.Arn : null"
      - create:
          resource: ug
          record:
            GroupName: "string(input.GroupName)"
            UserName: "string(input.UserName)"
    output: {}

  RemoveUserFromGroup:
    reads:
      g: { resource: group }
      u: { resource: user }
    effects:
      - delete: { resource: gm, missing: ignore }
      - delete: { resource: ug, missing: ignore }
    output: {}

  ListGroupsForUser:
    reads:
      u: { resource: user }
    list: { resource: ug, member: Groups, paginate: model }

  # --- inline group policies --------------------------------------------------------------

  PutGroupPolicy:
    effects:
      - create: { resource: grouppolicy, spread: input }
    output: {}

  GetGroupPolicy:
    reads:
      p: { resource: grouppolicy }
    require:
      - { cond: p_found, error: NoSuchEntity }
    output:
      GroupName: "'GroupName' in p ? p.GroupName : null"
      PolicyName: "'PolicyName' in p ? p.PolicyName : null"
      PolicyDocument: "'PolicyDocument' in p ? p.PolicyDocument : null"

  DeleteGroupPolicy:
    effects:
      - delete: { resource: grouppolicy, missing: ignore }
    output: {}

  ListGroupPolicies:
    list:
      resource: grouppolicy
      member: PolicyNames
      paginate: model
      filter: "string(item.GroupName) == string(input.GroupName)"
    output:
      PolicyNames: "items.map(p, p.PolicyName)"

  AttachGroupPolicy:
    effects:
      - create:
          resource: gattached
          record:
            PolicyArn: "string(input.PolicyArn)"
            GroupName: "string(input.GroupName)"
    output: {}

  DetachGroupPolicy:
    effects:
      - delete: { resource: gattached, missing: ignore }
    output: {}

  ListAttachedGroupPolicies:
    list:
      resource: gattached
      member: AttachedPolicies
      paginate: model
      filter: "string(item.GroupName) == string(input.GroupName)"

  # --- instance profiles ----------------------------------------------------------------------

  CreateInstanceProfile:
    effects:
      - create:
          resource: ip
          record:
            InstanceProfileName: id
            Arn: "'arn:aws:iam::' + identity.account + ':instance-profile/' + id"
            Roles: "[]"
    output:
      InstanceProfile: rec

  GetInstanceProfile:
    reads:
      p: { resource: ip }
    require:
      - { cond: p_found, error: NoSuchEntity }
    output:
      InstanceProfile: p

  DeleteInstanceProfile:
    effects:
      - delete: { resource: ip, missing: ignore }
    output: {}

  ListInstanceProfiles:
    list: { resource: ip, member: InstanceProfiles, paginate: model }

  # A role that was never created joins the profile as a bare name and the
  # ARN it would have had; the pack fabricated the same record.
  AddRoleToInstanceProfile:
    reads:
      p: { resource: ip }
      r: { resource: role }
    require:
      - { cond: p_found, error: NoSuchEntity }
    effects:
      - patch:
          resource: ip
          record:
            Roles: "('Roles' in p ? p.Roles : []) + [r_found ? r : dyn({'RoleName': string(input.RoleName), 'Arn': 'arn:aws:iam::' + identity.account + ':role/' + string(input.RoleName)})]"
      - create:
          resource: iprole
          record:
            InstanceProfileName: "string(input.InstanceProfileName)"
    output: {}

  RemoveRoleFromInstanceProfile:
    reads:
      p: { resource: ip }
      r: { resource: role }
    effects:
      - patch:
          resource: ip
          missing: ignore
          record:
            Roles: "('Roles' in p ? p.Roles : []).filter(x, string(x.RoleName) != string(input.RoleName))"
      - delete: { resource: iprole, missing: ignore }
    output: {}

  ListInstanceProfilesForRole:
    reads:
      r: { resource: role }
    list: { resource: iprole, member: InstanceProfiles, paginate: model }

  # --- tags ---------------------------------------------------------------------------------------

  TagRole:
    effects:
      - put:
          resource: roletags
          record:
            Tags: input.Tags
    output: {}

  UntagRole:
    effects:
      - delete: { resource: roletags, missing: ignore }
    output: {}

  ListRoleTags:
    reads:
      t: { resource: roletags }
    output:
      Tags: "t_found && 'Tags' in t ? t.Tags : dyn([])"

  TagUser:
    effects:
      - put:
          resource: usertags
          record:
            Tags: input.Tags
    output: {}

  UntagUser:
    effects:
      - delete: { resource: usertags, missing: ignore }
    output: {}

  ListUserTags:
    reads:
      t: { resource: usertags }
    output:
