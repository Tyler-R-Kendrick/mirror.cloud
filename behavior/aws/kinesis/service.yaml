  # The shard count is a counter on the stream record, defaulting to 1; it
  # changes nothing else. A split and a merge are an existing provisioned
  # stream's, as UpdateShardCount is. SplitShard and MergeShards answer a body the output
  # shape (Unit) does not declare, so the bundle answers nothing there.
  SplitShard:
    reads:
      s: { resource: stream, key: "'StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : ''))" }
    let:
      cur: "s_found && 'OpenShardCount' in s && int(s.OpenShardCount) > 0 ? int(s.OpenShardCount) : 1"
    require:
      - cond: "('StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : ''))) != ''"
        error: InvalidArgument
        message: Either StreamName or StreamARN must be specified.
      - cond: s_found
        error: NotFound
        message_expr: "'Stream ' + ('StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : ''))) + ' under account ' + identity.account + ' not found.'"
      - cond: "!('StreamModeDetails' in s && type(s.StreamModeDetails) == map && 'StreamMode' in s.StreamModeDetails && s.StreamModeDetails.StreamMode == 'ON_DEMAND')"
        error: Validation
        message: SplitShard is only supported for data streams with the provisioned capacity mode.
    effects:
      - patch:
          resource: stream
          key: "'StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : ''))"
          record:
            OpenShardCount: "cur + 1"
    output: {}

  MergeShards:
    reads:
      s: { resource: stream, key: "'StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : ''))" }
