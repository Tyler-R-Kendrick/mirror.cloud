          record:
            EncryptionType: "'KMS'"
            KeyId: "string(input.KeyId)"
    output: {}

  StopStreamEncryption:
    reads:
      s: { resource: stream, key: "('StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : '')))" }
    require:
      - cond: "('StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : ''))) != ''"
        error: InvalidArgument
        message: Either StreamName or StreamARN must be specified.
      - cond: s_found
        error: NotFound
        message_expr: "'Stream ' + ('StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : ''))) + ' under account ' + identity.account + ' not found.'"
    effects:
      - patch:
          resource: stream
          key: "'StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : ''))"
          record:
            EncryptionType: "'NONE'"
    output: {}

  DescribeLimits:
    select:
      binding: streams
      resource: stream
      filter: "true"
    output:
      ShardLimit: "500"
      OpenShardCount: "sum(streams.filter(s, !('StreamModeDetails' in s && type(s.StreamModeDetails) == map && 'StreamMode' in s.StreamModeDetails && s.StreamModeDetails.StreamMode == 'ON_DEMAND')).map(s, 'OpenShardCount' in s && int(s.OpenShardCount) > 0 ? int(s.OpenShardCount) : 1))"
      OnDemandStreamCount: "size(streams.filter(s, 'StreamModeDetails' in s && type(s.StreamModeDetails) == map && 'StreamMode' in s.StreamModeDetails && s.StreamModeDetails.StreamMode == 'ON_DEMAND'))"
      OnDemandStreamCountLimit: "50"

  # The pack stores the request verbatim under a fixed key and answers it
  # back; DescribeAccountSettings answers that store, or a DISABLED default.
  UpdateAccountSettings:
    effects:
      - create: { resource: account_settings, spread: input }
    output:
      MinimumThroughputBillingCommitment: "input.MinimumThroughputBillingCommitment"

  DescribeAccountSettings:
    reads:
      a: { resource: account_settings }
    output:
      MinimumThroughputBillingCommitment: "a_found && 'MinimumThroughputBillingCommitment' in a ? a.MinimumThroughputBillingCommitment : dyn({'Status': 'DISABLED'})"

  # The three stream-option operations answer the whole stored stream record,
  # which their output shapes do not declare (UpdateMaxRecordSize and
  # UpdateStreamMode are Unit); the bundle answers the declared subset and the
  # recorded steps are superseded with that reason.
  UpdateMaxRecordSize:
    reads:
      s: { resource: stream, key: "('StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : '')))" }
    require:
      - cond: "('StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : ''))) != ''"
        error: InvalidArgument
        message: Either StreamName or StreamARN must be specified.
      - cond: s_found
        error: NotFound
        message_expr: "'Stream ' + ('StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : ''))) + ' under account ' + identity.account + ' not found.'"
    effects:
      - patch:
          resource: stream
          key: "'StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : ''))"
          record:
            MaxRecordSizeInKiB: "input.MaxRecordSizeInKiB"
    output: {}

  # A stream that changes mode is held to the limit of the mode it takes, over
  # the other streams: the on-demand streams' limit, or the shard limit for
  # the shards it has. It changes twice in 24 hours and no more: the record
  # keeps the times of its changes in that window (ModeChanges), and a call
  # for the mode it has is no change.
  UpdateStreamMode:
    reads:
      s: { resource: stream, key: "'StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : ''))" }
    select:
      binding: others
      resource: stream
      filter: "string(item.StreamName) != ('StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : '')))"
    let:
      given: "'StreamModeDetails' in input && input.StreamModeDetails != null"
      structure: "given && type(input.StreamModeDetails) == map"
      raw: "structure && 'StreamMode' in input.StreamModeDetails ? input.StreamModeDetails.StreamMode : null"
      mode: "raw == null ? (given ? '' : 'PROVISIONED') : (type(raw) == string ? string(raw) : toJSON(raw))"
      asked: "given && 'StreamARN' in input && input.StreamARN != null"
      changing: "s_found && mode != (('StreamModeDetails' in s && type(s.StreamModeDetails) == map && 'StreamMode' in s.StreamModeDetails && s.StreamModeDetails.StreamMode == 'ON_DEMAND') ? 'ON_DEMAND' : 'PROVISIONED')"
      recent: "s_found && 'ModeChanges' in s && type(s.ModeChanges) == list ? s.ModeChanges.filter(t, now_ms - int(t) < 86400000) : []"
    require:
      - cond: "!given || structure"
        error: Validation
        message: "1 validation error detected: Value at 'streamModeDetails' failed to satisfy constraint: Member must be a structure with a StreamMode"
      - cond: "!given || raw != null"
        error: Validation
        message: "1 validation error detected: Value null at 'streamModeDetails.streamMode' failed to satisfy constraint: Member must not be null"
      - cond: "!given || mode in ['PROVISIONED', 'ON_DEMAND']"
        error: Validation
        message_expr: "'1 validation error detected: Value \\'' + mode + '\\' at \\'streamModeDetails.streamMode\\' failed to satisfy constraint: Member must satisfy enum value set: [PROVISIONED, ON_DEMAND]'"
      - cond: "!asked || s_found"
        error: NotFound
        message_expr: "'Stream ' + lastSegment(string(input.StreamARN), '/') + ' under account ' + identity.account + ' not found.'"
      - cond: "!asked || !changing || size(recent) < 2"
        error: LimitExceeded
        message_expr: "'Stream ' + lastSegment(string(input.StreamARN), '/') + ' under account ' + identity.account + ' has changed its capacity mode twice in the last 24 hours.'"
      - cond: "!asked || mode != 'ON_DEMAND' || size(others.filter(o, 'StreamModeDetails' in o && type(o.StreamModeDetails) == map && 'StreamMode' in o.StreamModeDetails && o.StreamModeDetails.StreamMode == 'ON_DEMAND')) < 50"
        error: LimitExceeded
        message: This request would exceed the limit of on-demand streams for the account.
      - cond: "!asked || mode != 'PROVISIONED' || ('OpenShardCount' in s && int(s.OpenShardCount) > 0 ? int(s.OpenShardCount) : 1) <= 500 && sum(others.filter(o, !('StreamModeDetails' in o && type(o.StreamModeDetails) == map && 'StreamMode' in o.StreamModeDetails && o.StreamModeDetails.StreamMode == 'ON_DEMAND')).map(o, 'OpenShardCount' in o && int(o.OpenShardCount) > 0 ? int(o.OpenShardCount) : 1)) + ('OpenShardCount' in s && int(s.OpenShardCount) > 0 ? int(s.OpenShardCount) : 1) <= 500"
        error: LimitExceeded
        message: This request would exceed the shard limit for the account.
    effects:
      - patch:
          resource: stream
          key: "'StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : ''))"
          record:
            StreamModeDetails: "{'StreamMode': mode}"
            ModeChanges: "changing ? recent + [now_ms] : recent"
    output: {}

  UpdateStreamWarmThroughput:
    reads:
      s: { resource: stream, key: "('StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : '')))" }
    require:
      - cond: "('StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : ''))) != ''"
        error: InvalidArgument
        message: Either StreamName or StreamARN must be specified.
      - cond: s_found
        error: NotFound
        message_expr: "'Stream ' + ('StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : ''))) + ' under account ' + identity.account + ' not found.'"
    effects:
      - patch:
          resource: stream
          key: "'StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : ''))"
          record:
            WarmThroughput: "'WarmThroughputMiBPerSecond' in input ? input.WarmThroughputMiBPerSecond : null"
    output:
      StreamName: rec.StreamName
      WarmThroughput: rec.WarmThroughput

quirks:
  - note: >
      The record plane (PutRecord, PutRecords, GetShardIterator, GetRecords)
      is not transcribed; see the shadow. DeleteStream still drops the stream
      record, but the pack's cleanup of the stream's per-stream record
      collection is part of the shadow plane and goes with it.
  - note: >
      Every operation on a stream that does not exist faults
      ResourceNotFoundException, "Stream <name> under account <id> not
      found.", and writes nothing; the pack answered 200 for most and made a
      record for many. A stream is found by its StreamName or by its
      StreamARN, and a request that gives neither faults
      InvalidArgumentException. A resource ARN (tags, policy) is its
      stream's, or a consumer's, which must exist too. The record plane does
      the same, GetRecords for the stream its iterator names.
  - operation: CreateStream
    note: >
      An absent StreamName faults ValidationException from the engine's model
      check, the same code the pack answered. StreamModeDetails is recorded,
      PROVISIONED when it is absent or null; one that is given must be a
      structure whose StreamMode is PROVISIONED or ON_DEMAND, or the create
      faults ValidationException. ShardCount is recorded as the stream's open shard
      count: when it is absent or not positive, four for an on-demand stream
      and one for a provisioned one. A provisioned create that would take the
      account's provisioned shards past the ShardLimit DescribeLimits reports,
      or an on-demand one its on-demand streams past their limit, faults
      LimitExceededException; an on-demand stream's shards are not held to
      the shard limit and not counted in it. Tags,
      MaxRecordSizeInKiB and WarmThroughputMiBps are accepted and discarded. Creating over an existing name replaces the record wholesale,
      resetting the record-plane sequence counter to 0.
  - operation: DescribeStream
    note: >
      The pack's main switch resolved StreamName alone, so a describe or a
      delete addressed by ARN alone did not find a stream that was there; the
      bundle finds it by either.
      The description is built from the name: the stored record's status,
      retention and encryption never appear, HasMoreShards is never set, and
      DescribeStream and ListShards always list exactly one shard with a
      full-range hash key, whatever the count: shards are not records here,
      and the record plane writes to that one shard. The count itself is
      answered from the record by DescribeStreamSummary's OpenShardCount,
      UpdateShardCount and DescribeLimits, which sums it over the caller's
      streams.
  - operation: AddTagsToStream
    note: >
      One stream has two tag sets: the stream-named operations key the tag
      record by stream name, the ResourceARN operations by the full ARN, and
      they never meet. An absent Tags map merges nothing and succeeds, which
      the engine's model check now rejects (Tags is required); TagKeys-less
      Remove calls die the same way. The pack also honored a ResourceArn
      member the model does not declare; the key expressions keep that.
  - operation: IncreaseStreamRetentionPeriod
    note: >
      The pack let a retention call on a stream that does not exist succeed
      and write a phantom ACTIVE stream record, which then described and
      listed as a real stream; so did enhanced monitoring, the shard count,
      encryption and the stream-option updates. None does here. An absent or
      non-positive RetentionPeriodHours stores 24; the model requires the
      member, so the absence path is now the engine's ValidationException.
  - operation: GetResourcePolicy
    note: >
      An absent policy of a stream that exists answers an empty string; of
      one that does not, ResourceNotFoundException. The pack fell
      back to the stream name when ResourceARN was absent; the model requires
      ResourceARN on all three policy operations, so that fallback is dead.
  - operation: RegisterStreamConsumer
    note: >
      The consumer ARN hardcodes the aws partition and derives the stream name
      from StreamName first -- a member this operation's input shape does not
      even declare -- before the StreamARN suffix. Registering over an
      existing consumer replaces the record. No ConsumerCreationTimestamp is
      ever set, and the record carries StreamARN, which the Consumer shape
      does not declare but the pack answers with.
  - operation: ListStreamConsumers
    note: >
      The StreamARN the request names must be a stream's, and is otherwise
      ignored: every consumer in the account and region is listed. MaxResults and NextToken are accepted and
      ignored by the pack; the engine paginates only when the request asks.
  - operation: SubscribeToShard
    note: >
      Answers an empty event stream immediately; nothing is ever delivered on
      it. A consumer that does not exist faults ResourceNotFoundException.
  - operation: UpdateShardCount
    note: >
      A target below 1 faults ValidationException before the stream is looked
      for, as CreateStream's ShardCount does. A stream that does not exist faults ResourceNotFoundException with the
      service's message, an on-demand stream ValidationException (the
      operation is a provisioned stream's alone), and a target that would
      take the account's provisioned shards past its ShardLimit
      LimitExceededException; none of the service's other rules on how far or
      how often a count moves is applied, and the answer is the count found
      and the target. A record stored with a StreamModeDetails that is not a
      structure is a provisioned stream, here and everywhere. The count is a number on the stream record with a floor of 1; Split and
      Merge answer StreamName, CurrentShardCount and TargetShardCount where
      their output shapes are Unit, so the bundle answers nothing there and
      the recorded steps are superseded. ScalingType is required by the model
      and ignored. No shards actually exist to split or merge.
  - operation: UpdateStreamMode
    note: >
      StreamARN and StreamModeDetails are required, and a missing one is
      answered before anything else, one that is null as a missing one (the
      engine drops a null member). The mode must be PROVISIONED or ON_DEMAND, in a structure,
      or the fault is ValidationException. A stream that does not exist faults
      ResourceNotFoundException; a change to ON_DEMAND is held to the
      on-demand streams' limit and one to PROVISIONED to the ShardLimit for
      the shards the stream has, each over the caller's other streams, with
      LimitExceededException. A stream changes mode twice in 24 hours: a
      third change inside that moving window is LimitExceededException too,
      and a call for the mode the stream has is no change. The stream is
      never UPDATING, and its shards stay as they are.
  - operation: StartStreamEncryption
    note: >
      EncryptionType comes from the operation name, not the request: Start is
      always KMS and Stop always NONE, whatever the request's required
      EncryptionType says.
  - operation: UpdateAccountSettings
    note: >
      The whole request is stored under a fixed key and answered back;
      DescribeAccountSettings answers that store or a DISABLED default. Any
      extra member the caller sent round-trips too.
  - operation: UpdateStreamWarmThroughput
    note: >
      The pack reads WarmThroughputMiBPerSecond, a member the model does not
      declare (the declared one is WarmThroughputMiBps), so WarmThroughput is
      always stored and answered as null. All three stream-option operations
      answer the whole stored stream record where their shapes declare a
      subset or nothing, so those recorded steps are superseded.
  - operation: DescribeLimits
    note: >
      ShardLimit 500 and OnDemandStreamCountLimit 50 are constants.
      OpenShardCount is the sum of the caller's provisioned streams' shard
      counts and OnDemandStreamCount the number of its on-demand streams.
