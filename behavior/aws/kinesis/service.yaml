schema: bir/1
service: aws.kinesis

# Transcribed from the hand-written pack, not established against the real
# service. A stream is ACTIVE the moment it is created, there is exactly one
# shard however the shard-count operations move the counter, and the record
# plane is the shadow below.
provenance: authored

# The record plane is Go, in internal/services/aws/kinesis: PutRecord and
# PutRecords publish every record to the deps.Bus "kinesis" topic, which
# aws.pipes drains and aws.firehose subscribes to, and the effect vocabulary
# has no bus publish. GetShardIterator and GetRecords carry an opaque base64
# "stream|seq" iterator, with an AT_TIMESTAMP arrival-time scan over the
# record collection below, numeric-key ordering and Limit pagination.
native: [PutRecord, PutRecords, GetShardIterator, GetRecords]

# A request is read as awsJson1.1 has a server read it: a member that is null
# is absent, and one that should be a string or an integer and could be
# neither is the caller's mistake, answered before any rule. The expressions
# below convert with string() and int(), which have no answer for an object or
# a list, and never see a null. The spellings they read that a model does not
# declare (StreamArn, ResourceArn, ConsumerArn, and a StreamName or ResourceARN
# where an operation has none) are guarded where they are read.
malformed_input_error: Validation

resources:
  # A stream is keyed by its name. Every operation that takes a StreamName or
  # a StreamARN finds it by the name, or by the last segment of the ARN, which
  # each spells out as an explicit key; only CreateStream, which takes no ARN,
  # uses the id below.
  stream:
    collection: kinesis
    id:
      input_members: [StreamName]
    record:
      StreamName: id
      Status: "'ACTIVE'"

  # The pack's tag record IS the tag map, keyed by stream name for the
  # stream-named operations and by the full ResourceARN for the resource-ARN
  # ones -- so one stream has two tag sets that never meet. Here the map sits
  # under a Tags member so `without` can rewrite it wholesale; the answers are
  # identical.
  # One collection per stream, keyed by sequence number; the native record
  # plane writes it, and it is here so DeleteStream can empty it.
  record:
    collection: "kinesis:{stream.id}"
    parent: stream

  tag:
    collection: ktags

  # The pack stored the policy document as raw bytes, not JSON; the record
  # holds it as a string member, which answers the same bytes.
  policy:
    collection: kpol

  consumer:
    collection: kcons

  account_settings:
    collection: kacct
    singleton: default

errors:
  NotFound:
    code: ResourceNotFoundException
    http: 400
    fault: client
  LimitExceeded:
    code: LimitExceededException
    http: 400
    fault: client
  Validation:
    code: ValidationException
    http: 400
    fault: client
  InvalidArgument:
    code: InvalidArgumentException
    http: 400
    fault: client

operations:
  # A stream has the mode and the shards it is created with: the ShardCount
  # given, or four for an on-demand stream and one for a provisioned one. The
  # account's ShardLimit, the one DescribeLimits reports, is the provisioned
  # streams': it holds a provisioned stream over the shards of every other
  # provisioned stream, and an on-demand stream is held to the limit on
  # on-demand streams and no other.
  CreateStream:
    select:
      binding: streams
      resource: stream
      filter: "string(item.StreamName) != string(input.StreamName)"
    let:
      given: "'StreamModeDetails' in input && input.StreamModeDetails != null"
      structure: "given && type(input.StreamModeDetails) == map"
      raw: "structure && 'StreamMode' in input.StreamModeDetails ? input.StreamModeDetails.StreamMode : null"
      mode: "raw == null ? (given ? '' : 'PROVISIONED') : (type(raw) == string ? string(raw) : toJSON(raw))"
      shards: "'ShardCount' in input && int(input.ShardCount) > 0 ? int(input.ShardCount) : (mode == 'ON_DEMAND' ? 4 : 1)"
    require:
      - cond: "!given || structure"
        error: Validation
        message: "1 validation error detected: Value at 'streamModeDetails' failed to satisfy constraint: Member must be a structure with a StreamMode"
      - cond: "!given || raw != null"
        error: Validation
        message: "1 validation error detected: Value null at 'streamModeDetails.streamMode' failed to satisfy constraint: Member must not be null"
      - cond: "!given || mode in ['PROVISIONED', 'ON_DEMAND']"
        error: Validation
        message_expr: "'1 validation error detected: Value \\'' + mode + '\\' at \\'streamModeDetails.streamMode\\' failed to satisfy constraint: Member must satisfy enum value set: [PROVISIONED, ON_DEMAND]'"
      - cond: "!('ShardCount' in input) || int(input.ShardCount) >= 1"
        error: Validation
        message_expr: "'1 validation error detected: Value \\'' + string(int(input.ShardCount)) + '\\' at \\'shardCount\\' failed to satisfy constraint: Member must have value greater than or equal to 1'"
      - cond: "mode == 'ON_DEMAND' || shards <= 500 && sum(streams.filter(s, !('StreamModeDetails' in s && type(s.StreamModeDetails) == map && 'StreamMode' in s.StreamModeDetails && s.StreamModeDetails.StreamMode == 'ON_DEMAND')).map(s, 'OpenShardCount' in s && int(s.OpenShardCount) > 0 ? int(s.OpenShardCount) : 1)) + shards <= 500"
        error: LimitExceeded
        message: This request would exceed the shard limit for the account.
      - cond: "mode != 'ON_DEMAND' || size(streams.filter(s, 'StreamModeDetails' in s && type(s.StreamModeDetails) == map && 'StreamMode' in s.StreamModeDetails && s.StreamModeDetails.StreamMode == 'ON_DEMAND')) < 50"
        error: LimitExceeded
        message: This request would exceed the limit of on-demand streams for the account.
    effects:
      - create:
          resource: stream
          record:
            Seq: 0
            OpenShardCount: shards
            StreamModeDetails: "{'StreamMode': mode}"
    output: {}

  # A recreated stream starts again at sequence 0, so its predecessor's
  # records have to go with it or GetRecords would answer them.
  DeleteStream:
    reads:
      stream: { resource: stream, key: "('StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : '')))" }
    require:
      - cond: "('StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : ''))) != ''"
        error: InvalidArgument
        message: Either StreamName or StreamARN must be specified.
      - cond: stream_found
        error: NotFound
        message_expr: "'Stream ' + ('StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : ''))) + ' under account ' + identity.account + ' not found.'"
    effects:
      - delete: { resource: record, where: "true" }
      - delete: { resource: stream, key: "('StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : '')))" }
    output: {}

  ListStreams:
    list: { resource: stream, member: StreamNames, paginate: model }
    output:
      StreamNames: "items.map(s, s.StreamName)"
      HasMoreStreams: "false"

  # The pack builds the description from the name alone: one static shard,
  # status ACTIVE, nothing read from the record.
  DescribeStream:
    reads:
      s: { resource: stream, key: "('StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : '')))" }
    require:
      - cond: "('StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : ''))) != ''"
        error: InvalidArgument
        message: Either StreamName or StreamARN must be specified.
      - cond: s_found
        error: NotFound
        message_expr: "'Stream ' + ('StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : ''))) + ' under account ' + identity.account + ' not found.'"
    output:
      StreamDescription: >
        {'StreamName': s.StreamName,
         'StreamARN': 'arn:aws:kinesis:' + identity.region + ':' + identity.account + ':stream/' + string(s.StreamName),
         'StreamStatus': 'ACTIVE',
         'Shards': [{'ShardId': 'shardId-000000000000',
                     'HashKeyRange': {'StartingHashKey': '0', 'EndingHashKey': '340282366920938463463374607431768211455'},
                     'SequenceNumberRange': {'StartingSequenceNumber': '0'}}]}

  # OpenShardCount is the counter on the stream record: what CreateStream was
  # given, moved by every split, merge and UpdateShardCount since.
  DescribeStreamSummary:
    reads:
      s: { resource: stream, key: "('StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : '')))" }
    require:
      - cond: "('StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : ''))) != ''"
        error: InvalidArgument
        message: Either StreamName or StreamARN must be specified.
      - cond: s_found
        error: NotFound
        message_expr: "'Stream ' + ('StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : ''))) + ' under account ' + identity.account + ' not found.'"
    output:
      StreamDescriptionSummary: >
        {'StreamName': s.StreamName,
         'StreamARN': 'arn:aws:kinesis:' + identity.region + ':' + identity.account + ':stream/' + string(s.StreamName),
         'StreamStatus': 'ACTIVE',
         'StreamModeDetails': {'StreamMode': 'StreamModeDetails' in s && type(s.StreamModeDetails) == map && 'StreamMode' in s.StreamModeDetails && s.StreamModeDetails.StreamMode == 'ON_DEMAND' ? 'ON_DEMAND' : 'PROVISIONED'},
         'OpenShardCount': 'OpenShardCount' in s && int(s.OpenShardCount) > 0 ? int(s.OpenShardCount) : 1}

  ListShards:
    reads:
      s: { resource: stream, key: "('StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : '')))" }
    require:
      - cond: "('StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : ''))) != '' || 'NextToken' in input"
        error: InvalidArgument
        message: Either StreamName or StreamARN must be specified.
      - cond: "s_found || ('StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : ''))) == ''"
        error: NotFound
        message_expr: "'Stream ' + ('StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : ''))) + ' under account ' + identity.account + ' not found.'"
    output:
      Shards: "[{'ShardId': 'shardId-000000000000'}]"

  AddTagsToStream:
    reads:
      t: { resource: tag, key: "'ResourceARN' in input && type(input.ResourceARN) != map && type(input.ResourceARN) != list && string(input.ResourceARN) != '' ? string(input.ResourceARN) : ('ResourceArn' in input && type(input.ResourceArn) != map && type(input.ResourceArn) != list && string(input.ResourceArn) != '' ? string(input.ResourceArn) : ('StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : ''))))" }
      s: { resource: stream, key: "('ResourceARN' in input && type(input.ResourceARN) != map && type(input.ResourceARN) != list && string(input.ResourceARN) != '' ? lastSegment(string(input.ResourceARN), '/') : ('ResourceArn' in input && type(input.ResourceArn) != map && type(input.ResourceArn) != list && string(input.ResourceArn) != '' ? lastSegment(string(input.ResourceArn), '/') : ('StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : '')))))" }
    require:
      - cond: "('ResourceARN' in input && type(input.ResourceARN) != map && type(input.ResourceARN) != list && string(input.ResourceARN) != '' ? lastSegment(string(input.ResourceARN), '/') : ('ResourceArn' in input && type(input.ResourceArn) != map && type(input.ResourceArn) != list && string(input.ResourceArn) != '' ? lastSegment(string(input.ResourceArn), '/') : ('StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : ''))))) != ''"
        error: InvalidArgument
        message: Either StreamName or StreamARN must be specified.
      - cond: s_found
        error: NotFound
        message_expr: "'Stream ' + ('ResourceARN' in input && type(input.ResourceARN) != map && type(input.ResourceARN) != list && string(input.ResourceARN) != '' ? lastSegment(string(input.ResourceARN), '/') : ('ResourceArn' in input && type(input.ResourceArn) != map && type(input.ResourceArn) != list && string(input.ResourceArn) != '' ? lastSegment(string(input.ResourceArn), '/') : ('StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : ''))))) + ' under account ' + identity.account + ' not found.'"
    effects:
      - patch:
          resource: tag
          key: "'ResourceARN' in input && type(input.ResourceARN) != map && type(input.ResourceARN) != list && string(input.ResourceARN) != '' ? string(input.ResourceARN) : ('ResourceArn' in input && type(input.ResourceArn) != map && type(input.ResourceArn) != list && string(input.ResourceArn) != '' ? string(input.ResourceArn) : ('StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : ''))))"
          record:
            Tags: "merge(t_found && 'Tags' in t ? t.Tags : {}, 'Tags' in input ? input.Tags : {})"
    output: {}

  RemoveTagsFromStream:
    reads:
      t: { resource: tag, key: "'ResourceARN' in input && type(input.ResourceARN) != map && type(input.ResourceARN) != list && string(input.ResourceARN) != '' ? string(input.ResourceARN) : ('ResourceArn' in input && type(input.ResourceArn) != map && type(input.ResourceArn) != list && string(input.ResourceArn) != '' ? string(input.ResourceArn) : ('StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : ''))))" }
      s: { resource: stream, key: "('ResourceARN' in input && type(input.ResourceARN) != map && type(input.ResourceARN) != list && string(input.ResourceARN) != '' ? lastSegment(string(input.ResourceARN), '/') : ('ResourceArn' in input && type(input.ResourceArn) != map && type(input.ResourceArn) != list && string(input.ResourceArn) != '' ? lastSegment(string(input.ResourceArn), '/') : ('StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : '')))))" }
    require:
      - cond: "('ResourceARN' in input && type(input.ResourceARN) != map && type(input.ResourceARN) != list && string(input.ResourceARN) != '' ? lastSegment(string(input.ResourceARN), '/') : ('ResourceArn' in input && type(input.ResourceArn) != map && type(input.ResourceArn) != list && string(input.ResourceArn) != '' ? lastSegment(string(input.ResourceArn), '/') : ('StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : ''))))) != ''"
        error: InvalidArgument
        message: Either StreamName or StreamARN must be specified.
      - cond: s_found
        error: NotFound
        message_expr: "'Stream ' + ('ResourceARN' in input && type(input.ResourceARN) != map && type(input.ResourceARN) != list && string(input.ResourceARN) != '' ? lastSegment(string(input.ResourceARN), '/') : ('ResourceArn' in input && type(input.ResourceArn) != map && type(input.ResourceArn) != list && string(input.ResourceArn) != '' ? lastSegment(string(input.ResourceArn), '/') : ('StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : ''))))) + ' under account ' + identity.account + ' not found.'"
    effects:
      - patch:
          resource: tag
          key: "'ResourceARN' in input && type(input.ResourceARN) != map && type(input.ResourceARN) != list && string(input.ResourceARN) != '' ? string(input.ResourceARN) : ('ResourceArn' in input && type(input.ResourceArn) != map && type(input.ResourceArn) != list && string(input.ResourceArn) != '' ? string(input.ResourceArn) : ('StreamName' in input && type(input.StreamName) != map && type(input.StreamName) != list && string(input.StreamName) != '' ? string(input.StreamName) : ('StreamARN' in input && type(input.StreamARN) != map && type(input.StreamARN) != list && string(input.StreamARN) != '' ? lastSegment(string(input.StreamARN), '/') : ('StreamArn' in input && type(input.StreamArn) != map && type(input.StreamArn) != list && string(input.StreamArn) != '' ? lastSegment(string(input.StreamArn), '/') : ''))))"
          record:
            Tags: "without(t_found && 'Tags' in t ? t.Tags : {}, 'TagKeys' in input ? input.TagKeys : [])"
    output: {}

  ListTagsForStream:
