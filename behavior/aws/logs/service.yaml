schema: bir/1
service: aws.logs

# Transcribed from the hand-written pack, not established against the real
# service. The pack never faults: every delete of an absent record succeeds,
# every read of one answers an empty body or a stock default, and a request
# missing a required member used to write to the empty key rather than be
# rejected (the engine's model validation now answers ValidationException,
# which the pack never had). 84 of the 118 operations share one generic
# handler that spreads the whole request into a record keyed by the first
# non-empty of a fixed member chain -- so CreateExportTask's taskId is the log
# group name, and several Put/Update operations write phantom rows under
# generated ids that ListLogGroups then answers as log groups.
provenance: authored

resources:
  group:
    collection: logsg
    id:
      input_members: [logGroupName, LogGroupName]
    record:
      logGroupName: id

  # Streams and events share the pack's composite key, group + "/" + stream.
  # The stored k member is that key, so the prefix listings the pack served
  # (DescribeLogStreams, FilterLogEvents, the two filter lists) keep their
  # exact semantics: a group whose name prefixes another's sees its streams.
  stream:
    collection: logsst
    id:
      derive: "('logGroupName' in input ? string(input.logGroupName) : '') + '/' + ('logStreamName' in input ? string(input.logStreamName) : '')"
    record:
      k: id

  event:
    collection: logsev
    id:
      derive: "('logGroupName' in input ? string(input.logGroupName) : '') + '/' + ('logStreamName' in input ? string(input.logStreamName) : '')"
    record:
      k: id

  retention:
    collection: logsret
    id:
      input_members: [logGroupName, LogGroupName]
    record:
      retentionInDays: "'retentionInDays' in input ? input.retentionInDays : null"

  subfilter:
    collection: logssub
    id:
      derive: "('logGroupName' in input ? string(input.logGroupName) : '') + '/' + ('filterName' in input ? string(input.filterName) : '')"
    record:
      k: id
      filterName: input.filterName
      filterPattern: input.filterPattern
      destinationArn: input.destinationArn

  metricfilter:
    collection: logsmf
    id:
      derive: "('logGroupName' in input ? string(input.logGroupName) : '') + '/' + ('filterName' in input ? string(input.filterName) : '')"
    record:
      k: id
      filterName: input.filterName
      filterPattern: input.filterPattern

  resourcepolicy:
    collection: logspol
    id:
      input_members: [policyName, PolicyName]
    record:
      policyName: id
      policyDocument: "'policyDocument' in input ? input.policyDocument : ''"

  grouptags:
    collection: logstag
    id:
      input_members: [logGroupName, LogGroupName]
    record:
      tags: "'tags' in input ? input.tags : ('Tags' in input ? input.Tags : null)"

  destination:
    collection: logsd
    id:
      input_members: [destinationName, DestinationName]
    record:
      destinationName: id
      targetArn: input.targetArn
      roleArn: input.roleArn

  querydef:
    collection: logsqd
    id:
      input_members: [queryDefinitionId, QueryDefinitionId]

  query:
    collection: logsq
    id:
      generate: { kind: hex, bytes: 8 }
      input_members: [queryId, QueryId]

  kmskey:
    collection: logskms
    id:
      input_members: [logGroupName, LogGroupName]
    record:
      kmsKeyId: "'kmsKeyId' in input ? input.kmsKeyId : ''"

  # The generic handler's fourteen stores. The pack kept them all in one
  # collection under a kind prefix; one collection each is the same thing.
  # Records are the spread request plus a forced id member, written inline by
  # each operation, so the resources themselves declare nothing.
  delivery:
    collection: ldel
  exporttask:
    collection: lexp
  importtask:
    collection: limp
  anomalydetector:
    collection: lanom
  lookuptable:
    collection: llut
  scheduledquery:
    collection: lsq
  integration:
    collection: lint
  transformer:
    collection: ltx
  syslog:
    collection: lsys
  indexpolicy:
    collection: lidx
  dataprotection:
    collection: ldp
  accountpolicy:
    collection: lacct
  storagetier:
    collection: ltier
  misc:
    collection: lmisc

operations:
  CreateLogGroup:
    effects:
      - create: { resource: group }

  # Deleting a group leaves its streams, events, retention, tags and KMS row
  # behind; only the group row goes.
  DeleteLogGroup:
    effects:
      - delete: { resource: group, missing: ignore }

  DescribeLogGroups:
    list: { resource: group, member: logGroups, paginate: model }

  CreateLogStream:
    effects:
      - create: { resource: stream }

  DescribeLogStreams:
    list:
      resource: stream
      member: logStreams
      paginate: model
      filter: "item.k.startsWith(('logGroupName' in input ? string(input.logGroupName) : '') + '/')"
    output:
      logStreams: "items.map(s, {'logStreamName': lastSegment(s.k, '/')})"

  # Events accumulate in one record per stream; the token is just the count.
  PutLogEvents:
    reads:
      ev: { resource: event }
    effects:
      - create:
          resource: event
          record:
            events: "ev_found ? ev.events + input.logEvents : input.logEvents"
    output:
      nextSequenceToken: "string(size(ev_found ? ev.events + input.logEvents : input.logEvents))"

  GetLogEvents:
    reads:
      ev: { resource: event }
    output:
      events: "ev_found ? ev.events : []"

  # The pack ignores filterPattern entirely: every event in the group matches.
  # CEL has no list flatten, so the per-stream lists are sewn together through
  # their JSON rendering -- exact for values that arrived as JSON.
  FilterLogEvents:
    list:
      resource: event
      member: events
      paginate: model
      filter: "item.k.startsWith(('logGroupName' in input ? string(input.logGroupName) : '') + '/')"
    output:
      events: "parseJSON('[' + join(items.map(e, toJSON(e.events)).filter(s, s != '[]').map(s, substr(s, 1, blen(s) - 1)), ',') + ']')"

  DeleteLogStream:
    effects:
      - delete: { resource: stream, missing: ignore }
      - delete: { resource: event, missing: ignore }

  # Retention is stored and never surfaces anywhere -- DescribeLogGroups does
  # not read it.
  PutRetentionPolicy:
    effects:
      - create: { resource: retention }

  DeleteRetentionPolicy:
    effects:
      - delete: { resource: retention, missing: ignore }

  PutSubscriptionFilter:
    effects:
      - create: { resource: subfilter }

  DescribeSubscriptionFilters:
    list:
      resource: subfilter
      member: subscriptionFilters
      paginate: model
      filter: "item.k.startsWith(string(input.logGroupName) + '/')"
    output:
      subscriptionFilters: "items.map(f, {'filterName': f.filterName, 'filterPattern': f.filterPattern, 'destinationArn': f.destinationArn})"

  DeleteSubscriptionFilter:
    effects:
      - delete: { resource: subfilter, missing: ignore }

  # The pack drops metricTransformations, which the model requires; only the
  # name and pattern are stored.
  PutMetricFilter:
    effects:
      - create: { resource: metricfilter }

  DescribeMetricFilters:
    list:
      resource: metricfilter
      member: metricFilters
      paginate: model
      filter: "item.k.startsWith(('logGroupName' in input ? string(input.logGroupName) : '') + '/')"
    output:
      metricFilters: "items.map(f, {'filterName': f.filterName, 'filterPattern': f.filterPattern})"

  DeleteMetricFilter:
    effects:
      - delete: { resource: metricfilter, missing: ignore }

  # The pack answered the flat record where the model wraps it in
  # resourcePolicy; the recording's step is superseded for that.
  PutResourcePolicy:
    effects:
      - create: { resource: resourcepolicy }
    output:
      resourcePolicy: rec

  DescribeResourcePolicies:
    list: { resource: resourcepolicy, member: resourcePolicies }

  DeleteResourcePolicy:
    effects:
      - delete: { resource: resourcepolicy, missing: ignore }

  TagLogGroup:
    effects:
      - create: { resource: grouptags }

  # Untag deletes the whole tag map; tagKeys is never read.
  UntagLogGroup:
    effects:
      - delete: { resource: grouptags, missing: ignore }

  ListTagsLogGroup:
    reads:
      t: { resource: grouptags }
    output:
      tags: "t_found ? t.tags : {}"

  PutDestination:
    effects:
      - create: { resource: destination }
    output:
      destination: rec

  DescribeDestinations:
    list: { resource: destination, member: destinations, paginate: model }

  DeleteDestination:
    effects:
      - delete: { resource: destination, missing: ignore }

  PutQueryDefinition:
    let:
      asked: "coalesce('queryDefinitionId' in input ? input.queryDefinitionId : '', 'QueryDefinitionId' in input ? input.QueryDefinitionId : '')"
    effects:
      - generate: { bind: rid, kind: hex, bytes: 8, when: "asked == ''" }
      - create:
          resource: querydef
          key: "asked != '' ? asked : fx.rid"
          record:
            queryDefinitionId: id
            name: input.name
            queryString: input.queryString
    output:
      queryDefinitionId: id

  DescribeQueryDefinitions:
    list: { resource: querydef, member: queryDefinitions }

  DeleteQueryDefinition:
    effects:
      - delete: { resource: querydef, missing: ignore }
    output:
      success: "true"

  # A query is Complete the moment it starts; nothing ever runs it.
  StartQuery:
    effects:
      - create:
          resource: query
          record:
            queryId: id
            status: "'Complete'"
            queryString: input.queryString
    output:
      queryId: id

  # Unknown ids answer the same Complete/empty as known ones -- there is no
  # fault. The pack's answer also carried queryId and queryString, which the
  # response shape does not declare; those members are superseded in the
  # recording.
  GetQueryResults:
    reads:
      q: { resource: query }
    output:
      status: "'Complete'"
      results: "[]"

  # Stop flips the stored status to Cancelled, which GetQueryResults then
  # overwrites back to Complete on the way out: a stopped query never reads
  # as stopped.
  StopQuery:
    reads:
      q: { resource: query }
    effects:
      - put:
          resource: query
          when: q_found
          record:
            status: "'Cancelled'"
    output:
      success: "true"

  # The KMS row is stored and never read by anything.
  AssociateKmsKey:
    effects:
      - create: { resource: kmskey }

  DisassociateKmsKey:
    effects:
      - delete: { resource: kmskey, missing: ignore }
  AssociateSourceToS3TableIntegration:
    let:
      asked: "coalesce('integrationName' in input ? input.integrationName : '', coalesce('logGroupName' in input ? input.logGroupName : '', coalesce('LogGroupName' in input ? input.LogGroupName : '', coalesce('name' in input ? input.name : '', coalesce('Name' in input ? input.Name : '', coalesce('taskId' in input ? input.taskId : '', coalesce('deliveryId' in input ? input.deliveryId : '', '')))))))"
    effects:
      - generate: { bind: rid, kind: hex, bytes: 8, when: "asked == ''" }
      - create:
          resource: integration
          key: "asked != '' ? asked : fx.rid"
          spread: input
          record:
            integrationName: "'integrationName' in input ? input.integrationName : id"
  CreateDelivery:
    let:
      asked: "coalesce('deliveryId' in input ? input.deliveryId : '', coalesce('logGroupName' in input ? input.logGroupName : '', coalesce('LogGroupName' in input ? input.LogGroupName : '', coalesce('name' in input ? input.name : '', coalesce('Name' in input ? input.Name : '', coalesce('taskId' in input ? input.taskId : '', coalesce('deliveryId' in input ? input.deliveryId : '', '')))))))"
    effects:
