quirks:
  - operation: CreateLogGroup
    note: >
      The pack never faults, anywhere in the service. A request missing a
      required member used to write or read the empty key; the model marks
      those members required and the engine now answers ValidationException
      before any behavior runs, so those paths are gone. The pack also stored
      only the group name: no tags, no class, no KMS key, however the request
      carried them (they land in their own stores, which nothing joins back).
  - operation: DeleteLogGroup
    note: >
      Deleting a group deletes only the group row. Its streams, events,
      retention policy, tags and KMS association survive, and
      DescribeLogStreams still answers them for the deleted group.
  - operation: DescribeLogStreams
    note: >
      Streams are matched by key prefix, not by group membership: a group
      whose name followed by "/" prefixes another group's name sees that
      group's streams. The answered logStreamName is the key's last
      "/"-separated segment, so a stream whose own name contains "/" reads
      back truncated. FilterLogEvents and both filter listings share the
      prefix rule.
  - operation: PutLogEvents
    note: >
      Events are appended to one record per stream and nextSequenceToken is
      just how many events the stream now holds -- "1", "2", ... -- not an
      opaque cursor. The events themselves are stored verbatim, entity and
      sequenceToken ignored.
  - operation: FilterLogEvents
    note: >
      filterPattern is never evaluated: every event in the group is
      returned, in store-key order of the streams.
  - operation: UntagLogGroup
    note: >
      tagKeys is ignored; the whole tag map is deleted. A partial untag is
      not possible.
  - operation: PutMetricFilter
    note: >
      metricTransformations -- required by the model -- is dropped on the
      floor; the stored filter is a name and a pattern, so a metric filter
      here can never emit a metric.
  - operation: GetQueryResults
    note: >
      Every query is Complete with an empty result set, including query ids
      that were never started -- there is no InvalidParameterException. The
      pack's answer also carried queryId and queryString, which the response
      shape does not declare; the bundle drops them and the recording
      supersedes those two members.
  - operation: StopQuery
    note: >
      Stopping writes Cancelled into the stored record, but GetQueryResults
      forces Complete on every answer, so a stopped query never reads as
      stopped. Stopping a query that was never started succeeds.
  - operation: PutRetentionPolicy
    note: >
      The retention days are stored in their own collection and never read:
      DescribeLogGroups does not answer them, and no expiry ever happens.
      AssociateKmsKey's row is likewise write-only.
  - operation: CreateExportTask
    note: >
      The generic handler resolves a record id from the first non-empty of
      (taskId, logGroupName, name, ...); the request carries no taskId, so
      the answered taskId IS the log group name, and a second export task on
      one group overwrites the first. CreateImportTask is the same shape but
      finds nothing and generates a hex id, which it also stores as taskId.
  - operation: CreateScheduledQuery
    note: >
      scheduledQueryArn is not an input member, so the chain falls through
      to name: the answered scheduledQueryArn is the query's name, not an
      ARN. GetScheduledQuery and DeleteScheduledQuery read the declared
      identifier member, which the chain does not know, so they can never
      reach the record -- Get answers empty and Delete is a no-op.
  - operation: DeleteDelivery
    note: >
      The model addresses a delivery by `id`; the handler's chain reads
      deliveryId, so a well-formed request deletes nothing. Only a caller
      echoing the undeclared deliveryId member (as CreateDelivery answers
      it) can delete one. DeleteLookupTable is the same defect with
      lookupTableArn/lookupTableName, and UpdateDeliveryConfiguration,
      UpdateLookupTable and UpdateScheduledQuery write fresh phantom rows
      under generated ids instead of updating anything.
  - operation: DescribeDeliveries
    note: >
      "Deliveries" does not contain the substring "Delivery", so
      DescribeDeliveries falls out of the delivery arm of the shape table
      into the misc store, and answers whatever PutBearerTokenAuthentication,
      PutDestinationPolicy, PutLogGroupDeletionProtection, StartLiveTail,
      TagResource and TestMetricFilter wrote -- under the member name
      "logGroups". DescribeAccountPolicies, DescribeConfigurationTemplates,
      DescribeQueries, ListAnomalies, ListScheduledQueries,
      ListLogGroupsForQuery, ListAggregateLogGroupSummaries and
      ListTagsForResource share that store and that answer. The bundle lists
      the same rows under the member the model declares for each operation,
      and those steps are superseded in the recording.
  - operation: ListLogGroups
    note: >
      This is not DescribeLogGroups: it lists the misc store, so the phantom
      rows from the bearer-token, deletion-protection, destination-policy,
      tagging, live-tail and metric-filter-test writes appear here as log
      groups. ListLogGroups and DescribeLogGroups answer different things
      for the same account.
  - operation: PutDeliveryDestination
    note: >
      Destinations, sources and policies of the delivery family share one
      store keyed by the chain; PutDeliveryDestination lands on the name
      member, so GetDeliveryDestination (which does read name) finds it,
      while PutDeliveryDestinationPolicy finds nothing in the chain and
      writes a phantom row under a generated id that
      GetDeliveryDestinationPolicy can never read back.
  - operation: GetStorageTierPolicy
    note: >
      Always empty. The request has no members, so the read key is the bare
      kind prefix, which PutStorageTierPolicy never writes -- its write is
      keyed by a generated id, since storageTier is not in the chain either.
  - operation: DescribeImportTaskBatches
    note: >
      The pack answered the import task record under "importTasks" here;
      the model declares "importBatches". Several generic-handler answers
      carry the record under a member the response shape does not declare
      (importTask, delivery, transformer, scheduledQuery, anomalyDetector,
      lookupTable, integration, exportTask); the bundle answers the declared
      member or nothing, and the affected recording steps are superseded.
