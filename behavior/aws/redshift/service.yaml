errors:
  # listOrGet answered every named-and-missing describe with this fault,
  # whatever the resource -- a missing snapshot is ClusterNotFound too.
  NotFound:
    code: ClusterNotFound
    http: 404
    fault: client

operations:
  CreateCluster:
    effects:
      # The credential write comes first: `rec` is the last write's record,
      # and the output's record is the cluster's. The stores are independent,
      # so the order is unobservable anywhere else.
      - create:
          resource: credential
          when: "'MasterUserPassword' in input && string(input.MasterUserPassword) != ''"
          record:
            Username: "string(input.MasterUsername)"
            PasswordHash: "sha256hex(string(input.MasterUserPassword))"
      - create:
          resource: cluster
          record:
            ClusterIdentifier: id
            ClusterStatus: "'available'"
            NodeType: "string(input.NodeType)"
            MasterUsername: "string(input.MasterUsername)"
            DBName: "'DBName' in input && string(input.DBName) != '' ? string(input.DBName) : 'dev'"
            Endpoint: "{'Address': id + '.' + identity.region + '.redshift.amazonaws.com', 'Port': 5439}"
    output:
      Cluster: rec

  DescribeClusters:
    reads:
      c: { resource: cluster }
    require:
      - { cond: "id == '' || c_found", error: NotFound }
    list:
      resource: cluster
      member: Clusters
      paginate: model
      key: id

  # The pack merged the status change onto the stored record (or conjured a
  # bare one for an unknown identifier); every other request member is
  # ignored -- a ModifyCluster with a new NodeType changes nothing.
  ModifyCluster:
    effects:
      - put:
          resource: cluster
          record:
            ClusterIdentifier: id
            ClusterStatus: "'available'"
    output:
      Cluster: rec

  RebootCluster:
    effects:
      - put:
          resource: cluster
          record:
            ClusterIdentifier: id
            ClusterStatus: "'available'"
    output:
      Cluster: rec

  PauseCluster:
    effects:
      - put:
          resource: cluster
          record:
            ClusterIdentifier: id
            ClusterStatus: "'paused'"
    output:
      Cluster: rec

  ResumeCluster:
    effects:
      - put:
          resource: cluster
          record:
            ClusterIdentifier: id
            ClusterStatus: "'available'"
    output:
      Cluster: rec

  ResizeCluster:
    reads:
      c: { resource: cluster }
    effects:
      - put:
          resource: cluster
          record:
            ClusterIdentifier: id
            ClusterStatus: "'resizing'"
            NodeType: "'NodeType' in input && string(input.NodeType) != '' ? string(input.NodeType) : ('NodeType' in c ? c.NodeType : null)"
    output:
      Cluster: rec

  # The pack deleted the cluster, its credential, and every COPY table row
  # under it; the row store is the shadow's, so only the first two are here.
  DeleteCluster:
    effects:
      - delete: { resource: cluster, missing: ignore }
      - delete: { resource: credential, missing: ignore }
    output:
      Cluster: "{'ClusterIdentifier': string(input.ClusterIdentifier), 'ClusterStatus': 'deleting'}"

  # Replaces the record wholesale -- a restored cluster loses its NodeType,
  # MasterUsername and DBName. The SnapshotIdentifier is never read.
  RestoreFromClusterSnapshot:
    effects:
      - create:
          resource: cluster
          record:
            ClusterIdentifier: id
            ClusterStatus: "'available'"
            Endpoint: "{'Address': id + '.' + identity.region + '.redshift.amazonaws.com', 'Port': 5439}"
    output:
      Cluster: rec

  CreateClusterSnapshot:
    effects:
      - create:
          resource: snapshot
          record:
            SnapshotIdentifier: id
            ClusterIdentifier: "string(input.ClusterIdentifier)"
            Status: "'available'"
    output:
      Snapshot: rec

  DescribeClusterSnapshots:
    reads:
      s: { resource: snapshot }
    require:
      - { cond: "id == '' || s_found", error: NotFound }
    list:
      resource: snapshot
      member: Snapshots
      paginate: model
      key: id

  DeleteClusterSnapshot:
    effects:
      - delete: { resource: snapshot, missing: ignore }
    output: {}

  # The copy inherits every member of the source record (its Status too) and
  # is re-keyed to the target; copying a missing source yields a bare
  # {SnapshotIdentifier, Status: available} record, not a fault.
  CopyClusterSnapshot:
    reads:
      s: { resource: snapshot, key: "string(input.SourceSnapshotIdentifier)" }
    effects:
      - create:
          resource: snapshot
          key: "string(input.TargetSnapshotIdentifier)"
          record:
            SnapshotIdentifier: id
            Status: "s_found && 'Status' in s ? s.Status : 'available'"
            ClusterIdentifier: "s_found && 'ClusterIdentifier' in s ? s.ClusterIdentifier : null"
    output:
      Snapshot: rec

  # Only the name is stored: Description and the required SubnetIds are read
  # off the request and dropped.
  CreateClusterSubnetGroup:
    effects:
      - create:
          resource: subnet
          record:
            ClusterSubnetGroupName: id
    output:
      ClusterSubnetGroup: rec

  DescribeClusterSubnetGroups:
    reads:
      s: { resource: subnet }
    require:
      - { cond: "id == '' || s_found", error: NotFound }
    list:
      resource: subnet
      member: ClusterSubnetGroups
      paginate: model
      key: id

  DeleteClusterSubnetGroup:
    effects:
      - delete: { resource: subnet, missing: ignore }
    output: {}

  # Merges the name back over the stored record; the required SubnetIds are
  # ignored, exactly as Create dropped them.
  ModifyClusterSubnetGroup:
    effects:
      - put:
          resource: subnet
          record:
            ClusterSubnetGroupName: id
    output:
      ClusterSubnetGroup: rec

  # Description is required by the model and dropped by the pack.
  CreateClusterParameterGroup:
    effects:
      - create:
          resource: param_group
          record:
            ParameterGroupName: id
            ParameterGroupFamily: "string(input.ParameterGroupFamily)"
    output:
      ClusterParameterGroup: rec

  DescribeClusterParameterGroups:
    reads:
      p: { resource: param_group }
    require:
      - { cond: "id == '' || p_found", error: NotFound }
    list:
      resource: param_group
      member: ParameterGroups
      paginate: model
      key: id

  # Deleting the group leaves its stored parameters behind in pg_params.
  DeleteClusterParameterGroup:
    effects:
      - delete: { resource: param_group, missing: ignore }
    output: {}

  ModifyClusterParameterGroup:
    effects:
      - create: { resource: pg_params, spread: input }
    output: {}

  ResetClusterParameterGroup:
    effects:
      - create: { resource: pg_params, spread: input }
    output: {}

  # Answers the raw stored request as one element of Parameters -- the
