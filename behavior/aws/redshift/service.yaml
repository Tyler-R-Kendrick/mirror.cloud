        ('EndpointName' in input && string(input.EndpointName) != '') ? string(input.EndpointName) : ('ClusterIdentifier' in input && string(input.ClusterIdentifier) != '') ? string(input.ClusterIdentifier) : ('SnapshotIdentifier' in input && string(input.SnapshotIdentifier) != '') ? string(input.SnapshotIdentifier) : ('ResourceArn' in input && string(input.ResourceArn) != '') ? string(input.ResourceArn) : ('ScheduledActionName' in input && string(input.ScheduledActionName) != '') ? string(input.ScheduledActionName) : ('UsageLimitId' in input && string(input.UsageLimitId) != '') ? string(input.UsageLimitId) : ('IntegrationArn' in input && string(input.IntegrationArn) != '') ? string(input.IntegrationArn) : ('NamespaceArn' in input && string(input.NamespaceArn) != '') ? string(input.NamespaceArn) : ('PartnerName' in input && string(input.PartnerName) != '') ? string(input.PartnerName) : ''

