quirks:
  - operation: DescribeClusters
    note: >
      Every named-and-missing describe in the pack's core -- DescribeClusters,
      DescribeClusterSnapshots, DescribeClusterSubnetGroups,
      DescribeClusterParameterGroups, DescribeSnapshotCopyGrants and
      DescribeEventSubscriptions -- answered the same ClusterNotFound fault
      through a shared helper, so a missing snapshot or subnet group reads as
      a missing cluster. Listing with no name never faults.
  - operation: ModifyCluster
    note: >
      ModifyCluster, RebootCluster, PauseCluster and ResumeCluster merge only
      a ClusterStatus onto the record -- ModifyCluster applies nothing else
      from the request, not even NodeType -- and naming an unknown cluster
      conjures a bare record that DescribeClusters then answers. ResizeCluster
      always sets resizing and honors NodeType; PauseCluster sets paused;
      everything else sets available.
  - operation: DeleteCluster
    note: >
      Deleting is idempotent and answers {ClusterIdentifier, deleting} whether
      or not the cluster existed. The pack also removed the credential and
      every COPY table row under the cluster; the row store belongs to the
      shadowed data plane, so the bundle deletes only the credential.
  - operation: CreateCluster
    note: >
      DBName defaults to dev and the endpoint is synthesized from the
      identifier and region. MasterUserPassword is never stored on the
      cluster record; it lands (hashed) in the credential collection the
      shadowed COPY data plane reads. The model requires ClusterIdentifier,
      MasterUsername and NodeType; the pack accepted their absence and stored
      empty strings, which the engine now rejects.
  - operation: CopyClusterSnapshot
    note: >
      The copy inherits every member of the source record -- including its
      Status -- under the target identifier, and copying a source that does
      not exist succeeds with a bare {SnapshotIdentifier, Status: available}
      record.
  - operation: RestoreFromClusterSnapshot
    note: >
      The snapshot named in the request is never read: the cluster record is
      rebuilt from the identifier alone, wholesale, dropping any NodeType,
      MasterUsername and DBName the cluster had.
  - operation: CreateClusterSubnetGroup
    note: >
      Only the name is stored. Description and the required SubnetIds are
      dropped at create, and ModifyClusterSubnetGroup ignores them too.
      CreateClusterParameterGroup likewise drops the required Description.
  - operation: DescribeClusterParameters
    note: >
      The answer is the raw Modify/ResetClusterParameterGroup request as a
      single Parameters element -- not a parameter list. A group whose
      parameters were never set answers an empty list, and
      DeleteClusterParameterGroup does not remove them.
  - operation: GetClusterCredentials
    note: >
      The pack derived the password deterministically from the DbUser, so two
      calls for one user answered the same password; the bundle draws it
      fresh each call. Expiration is the constant 2099-01-01T00:00:00Z, the
      user is always IAM:-prefixed, and ClusterIdentifier is ignored.
  - operation: ModifyClusterIamRoles
    note: >
      AddIamRoles replaces the whole IamRoles member and RemoveIamRoles is
      never read; calling it with neither stores a null IamRoles.
  - operation: CreateTags
    note: >
      CreateTags replaces the whole tag list stored under the resource name,
      DeleteTags deletes all of it ignoring TagKeys, and DescribeTags wraps
      whatever list it finds in one TaggedResources entry -- an untagged ARN
      answers {Tags: []}, not a fault.
  - operation: DisableSnapshotCopy
    note: >
      The record is rebuilt without ClusterSnapshotCopyStatus; every other
      member survives. EnableSnapshotCopy sets that member to
      {DestinationRegion} and nothing else, merging over the stored record.
  - operation: EnableLogging
    note: >
      The 109 remaining operations are one generic keyed store in the pack:
      writes spread the request and force an id member, deletes drop the row,
      and describes answer the named record or -- this is the pack's actual
      behavior, transcribed -- the whole list of that kind when the named
      record is absent. Writes also echo the id member at the top level of
      the answer and the record under a wrapper member, most of which the
      operations' output shapes do not declare; the bundle answers the
      declared members and the recorded steps are superseded with that
      reason. When no id member is present the pack mints a hex id, so
      ModifyEventSubscription, RegisterNamespace, the IDC application
      operations, PurchaseReservedNodeOffering and others write records no
      other operation can address.
  - operation: DescribeLoggingStatus
    note: >
      Answers under LoggingStatus, a member the output shape does not declare
      (it declares BucketName, LoggingEnabled and friends), so the wire
      carries nothing; the recorded steps are superseded. DescribeEvents,
      DescribeStorage, DescribeResize and the other misc describes answer the
      same undeclared Clusters member, listing the records RotateEncryptionKey
      and its siblings write. The pack's dead branches -- a Status: available
      fallback for these three describes and write-path special cases for
      GetClusterCredentialsWithIAM and GetIdentityCenterAuthToken -- are
      unreachable behind the name-prefix dispatch and are not transcribed.
  - operation: GetIdentityCenterAuthToken
    note: >
      The token and the Cluster wrapper are both undeclared on the output
      shape, so nothing reaches the wire; the recorded step is superseded.
      GetReservedNodeExchangeConfigurationOptions and
      GetReservedNodeExchangeOfferings are the same shape. GetResourcePolicy
      is the exception: its ResourcePolicy member is declared, so it is
      transcribed and gated.
