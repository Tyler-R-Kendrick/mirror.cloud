schema: bir/1
service: aws.redshift

# Transcribed from the hand-written pack, not established against the real
# service. Redshift-lite: clusters, snapshots, subnet and parameter groups,
# copy grants, event subscriptions and tags are flat control-plane records
# that are "available" the moment they are written; the 109 remaining
# operations are a generic keyed store over the request, classified by name.
# No SQL ever runs -- the pack's data plane is a Firehose COPY row store
# reached only from Go, which is the shadow reason below.
provenance: authored

# The pack never named absent input with a fault of its own: its first()
# helper folds a missing member to the empty string and proceeds -- a create
# with no ClusterIdentifier stored the record under the empty key and
# succeeded. The engine's model check now rejects the absence first with the
# default ValidationException, so those empty-key paths are dead; see quirks.

# Complete and gated, but not yet serving: aws.firehose's Redshift COPY
# destination does not reach this service over HTTP. It builds the pack with
# redshift.New(deps) and calls the Go-only CreateTable, Copy and TableRows
# methods -- Copy parses delimited and JSON row bodies in a transaction,
# checks the stored credential's SHA-256, and appends to a whole-table JSON
# document under rstable. None of that has an HTTP operation, and B-IR has no
# cross-service invocation, no []byte row parsing, and no primitive registry
# (the engine's prim dispatch reports none registered). Deleting the pack
# would orphan firehose's destination and its retry loop; registering both
# would describe one service twice. The bundle takes over when an
# aws.redshift/copy primitive carries CreateTable/Copy/TableRows, moved
# verbatim, and firehose routes through it.
shadow: >
  aws.firehose calls the pack's Go-only CreateTable/Copy/TableRows data plane
  (COPY row parsing and credential checks over the rstable/rscredential
  collections) -- no HTTP operation reaches it and no B-IR primitive exists
  for it yet. Everything the HTTP surface does is transcribed and gated below.

resources:
  cluster:
    collection: rscluster
    id:
      input_members: [ClusterIdentifier]

  # Written by CreateCluster when the request carries MasterUserPassword; only
  # the Go-only COPY data plane (the shadow reason above) ever reads it.
  credential:
    collection: rscredential
    id:
      input_members: [ClusterIdentifier]

  snapshot:
    collection: rssnap
    id:
      input_members: [SnapshotIdentifier]

  subnet:
    collection: rssubnet
    id:
      input_members: [ClusterSubnetGroupName]

  param_group:
    collection: rspg
    id:
      input_members: [ParameterGroupName]

  # The pack stores the whole Modify/ResetClusterParameterGroup request here
  # and DescribeClusterParameters answers it back as a single "parameter".
  pg_params:
    collection: rspg-params
    id:
      input_members: [ParameterGroupName]

  copy_grant:
    collection: rscopygrant
    id:
      input_members: [SnapshotCopyGrantName]

  event_sub:
    collection: rsev
    id:
      input_members: [SubscriptionName]

  # The pack stored the bare tag list under the resource name; the bundle
  # wraps it in a record member, which no answer can tell apart.
  tag:
    collection: rstags
    id:
      input_members: [ResourceName]

  # --- the generic leftover store -------------------------------------------
  # The pack's remaining 109 operations all share one dispatch: a kind chosen
  # by substring of the operation name, an id read from the kind's own member
  # and then the shared fallbacks below (first present non-empty wins), a
  # generated hex id when all are absent, and one store collection. The
  # bundle gives each kind its own collection, which no answer can tell
  # apart: the pack's per-kind key prefix is the same partition.

  datashare:
    collection: rsl-datashare
    id:
      derive: >-
        ('DataShareArn' in input && string(input.DataShareArn) != '') ? string(input.DataShareArn) : ('ClusterIdentifier' in input && string(input.ClusterIdentifier) != '') ? string(input.ClusterIdentifier) : ('SnapshotIdentifier' in input && string(input.SnapshotIdentifier) != '') ? string(input.SnapshotIdentifier) : ('ResourceArn' in input && string(input.ResourceArn) != '') ? string(input.ResourceArn) : ('ScheduledActionName' in input && string(input.ScheduledActionName) != '') ? string(input.ScheduledActionName) : ('UsageLimitId' in input && string(input.UsageLimitId) != '') ? string(input.UsageLimitId) : ('IntegrationArn' in input && string(input.IntegrationArn) != '') ? string(input.IntegrationArn) : ('NamespaceArn' in input && string(input.NamespaceArn) != '') ? string(input.NamespaceArn) : ('PartnerName' in input && string(input.PartnerName) != '') ? string(input.PartnerName) : ''

  reserved_node:
