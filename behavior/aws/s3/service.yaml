schema: bir/1
service: aws.s3

# Transcribed from the hand-written pack, not established against the real
# service. Every operation is Go, in internal/services/aws/s3. S3 routes by
# the request's shape -- host, path, method, query and headers -- rather
# than by the operation the codec decoded; it answers a bucket's CORS rules
# on every response and preflight; and objects are streamed blobs with
# versions, multipart uploads, checksums, encryption, object lock and
# notifications. None of that is records yet, so the bundle declares the
# surface and the Go serves it.
provenance: authored

