schema: bir/1
service: aws.schemas

# Transcribed from the hand-written pack, not established against the real
# service. Nothing is parsed or versioned: a registry and a schema are names
# with ARNs, and the content a schema was created with is not kept.
provenance: authored

missing_input_error: BadRequest

resources:
  registry:
    collection: schreg
    id:
      input_members: [RegistryName]
    arn: "arn:{partition}:schemas:{region}:{account}:registry/{id}"
    record:
      RegistryName: id
      RegistryArn: arn

  # A schema is addressed by its registry and its own name together, which is
  # how the pack keyed it and what DescribeSchema is given.
  schema:
    collection: schsch
    id:
      derive: "string(input.RegistryName) + '/' + string(input.SchemaName)"
    arn: "arn:{partition}:schemas:{region}:{account}:schema/{id}"
    record:
      SchemaName: "string(input.SchemaName)"
      SchemaArn: arn

errors:
  BadRequest:
    code: BadRequestException
    http: 400
    fault: client
  NotFound:
    code: NotFoundException
    http: 404
    fault: client

operations:
  CreateRegistry:
    require:
      - { cond: "string(input.RegistryName) != ''", error: BadRequest }
    effects:
      - put: { resource: registry }
    output:
      RegistryName: rec.RegistryName
      RegistryArn: rec.RegistryArn

  DescribeRegistry:
    reads:
      reg: { resource: registry }
    require:
      - { cond: reg_found, error: NotFound }
    output:
      RegistryName: reg.RegistryName
      RegistryArn: reg.RegistryArn

  ListRegistries:
    list: { resource: registry, member: Registries, paginate: model }

  DeleteRegistry:
    effects:
      - delete: { resource: registry, missing: ignore }

  CreateSchema:
    effects:
      - put: { resource: schema }
    output:
      SchemaName: rec.SchemaName
      SchemaArn: rec.SchemaArn

  DescribeSchema:
    reads:
      sch: { resource: schema }
    require:
      - { cond: sch_found, error: NotFound }
    output:
      SchemaName: sch.SchemaName
      SchemaArn: sch.SchemaArn

quirks:
  - operation: CreateSchema
    note: >
      The pack answered with the registry name beside the schema. Neither
      CreateSchema nor DescribeSchema declares a RegistryName member -- the
      registry is in the path and in the ARN, not in the answer -- so it was a
      field no SDK could read. The declared shape outranks the pack's authored
      behavior, so it is dropped and the recorded steps are superseded with
      that reason.
  - operation: CreateSchema
    note: >
      Content and Type are required by the model and are not stored, so
      DescribeSchema answers without the Content it declares: a schema here is
      a name and an ARN. SchemaVersion, LastModified and VersionCreatedDate are
      likewise never set. A probe settles what the real service returns for a
      schema created and immediately described.
  - operation: DeleteRegistry
    note: >
      Deleting an absent registry succeeds, and deleting a registry leaves its
      schemas behind: they are keyed by registry and name together but nothing
      cascades. The real service faults on the first and is a probe away on the
      second.
