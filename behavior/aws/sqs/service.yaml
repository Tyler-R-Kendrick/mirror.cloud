schema: bir/1
service: aws.sqs

# Transcribed from the hand-written pack, not established against the real
# service. This is the wave-0 ceiling case: if the schema can carry visibility
# timeouts, FIFO ordering and deduplication, dead-letter redrive and long
# polling, it can carry the rest. Probing upgrades individual cells to
# observed/probed and records the evidence.
provenance: authored

# SQS calls an absent required input MissingParameter, not the engine's default
# ValidationException. The model says which members are required; what a
# service calls their absence is the service's own vocabulary, so it is stated
# here rather than assumed by the engine.
missing_input_error: MissingParameter

# Every operation the pack serves is now expressed here, including the six that
# were missing, and all of them are gated against the pack's recording on every
# CI run: the message plane -- visibility timeouts, FIFO ordering and
# deduplication, dead-letter redrive, long polling, batches -- plus the access
# policy, the dead-letter sources and the message move tasks.
#
# ListDeadLetterSourceQueues was the operation that decided a schema question:
# it filters queues on a redrive policy that may live in either the queue
# record or its settings record, so the list has to join a companion resource
# per item. That is now `list.reads` plus `list.let`, which is the operation's
# own reads-then-lets shape applied to one candidate at a time rather than a
# construct invented for this service.
#
# What still keeps the pack serving is addressing, not semantics. SQS requires
# QueueUrl on the wire and the model says so, so the engine's model-driven
# input check rejects a request that names a queue any other way. The pack also
# accepts QueueName, and the emulator's own delivery paths rely on that: an
# EventBridge rule, a Scheduler target, an SNS subscription and a Pipes poller
# each know a queue's name and have no URL to build one from, because nothing
# in spi.Deps carries the endpoint the server is listening on. That is an
# emulator-internal affordance rather than a claim about SQS, and resolving it
# means letting a resource declare the members that address it -- so the
# required check is satisfied by any one of them -- which is a change to input
# validation for every service and wants its own evidence.
shadow: >
  Complete and gated, but not yet serving: SQS requires QueueUrl on the wire
  and the engine enforces that from the model, while the emulator's internal
  delivery paths (events, scheduler, sns, pipes) address queues by QueueName
  because no endpoint is available to them. Serving from this bundle needs
  resource-declared addressing members in input validation.

resources:
  queue:
    collection: queues
    id:
      # A caller names a queue directly, through its URL, or -- the message
      # move operations only -- through its ARN, and all three must resolve to
      # the same record.
      input_members: [QueueName]
      derive: >
        'QueueName' in input ? string(input.QueueName)
          : ('QueueUrl' in input ? lastSegment(string(input.QueueUrl), '/')
             : ('SourceArn' in input ? queueFromArn(string(input.SourceArn)) : ''))
    record:
      name: id
      # The URL has to echo the endpoint the caller actually reached: a client
      # handed a link to somewhere it cannot reach is worse than an error.
      url: "endpoint + '/' + identity.account + '/' + id"
      attrs: >
        id.endsWith('.fifo')
          ? merge('Attributes' in input ? input.Attributes : {}, {'FifoQueue': 'true'})
          : ('Attributes' in input ? input.Attributes : {})
    views:
      fifo: "string(rec.name).endsWith('.fifo')"
      # Stored attributes over the documented defaults, so a bundle reads one
      # merged map rather than repeating the fallbacks at every site.
      settings: "merge({'VisibilityTimeout': '30', 'DelaySeconds': '0'}, rec.attrs)"

  # Queue attributes set after creation live apart from the queue record, as
  # they do in the pack: SetQueueAttributes replaces this wholesale while
  # CreateQueue's attributes stay put underneath.
  settings:
    collection: qattrs
    id:
      input_members: [QueueName]
      derive: "'QueueName' in input ? string(input.QueueName) : lastSegment(string(input.QueueUrl), '/')"
    record:
      attrs: "'Attributes' in input ? input.Attributes : {}"

  tags:
    collection: qtags
    id:
      input_members: [QueueName]
      derive: "'QueueName' in input ? string(input.QueueName) : lastSegment(string(input.QueueUrl), '/')"
    record:
      tags: "'Tags' in input ? input.Tags : {}"

  # A message move task. The pack completes a move synchronously and records
  # the task as already COMPLETED, so this record is a receipt rather than a
  # job: nothing later advances its status. Real SQS runs the move in the
  # background and the task passes through RUNNING, which is why
  # CancelMessageMoveTask can never succeed here -- see quirks.
  movetask:
    collection: qmove
    id: { generate: { kind: hex, bytes: 16 } }
    record:
      TaskHandle: id
      Status: "'COMPLETED'"
      StartedTimestamp: "int(now)"

  message:
    # Parent-scoped: each queue's messages are their own collection, named for
    # the queue rather than filtered out of a shared one.
    collection: "msgs:{queue.id}"
    parent: queue
    id: { generate: { kind: hex, bytes: 16 } }
    # Addressed by receipt handle, which is what a caller holds.
    key: handle
    record:
      id: id
      handle: { generate: { kind: hex, bytes: 64 } }
      body: input.MessageBody
      md5: "md5hex(string(input.MessageBody))"
      group: "'MessageGroupId' in input ? string(input.MessageGroupId) : ''"
      attrs: "'MessageAttributes' in input ? input.MessageAttributes : {}"
      seq: { counter: "seq:{queue.id}" }
      receiveCount: "0"

    statechart:
      initial: visible
      states:
        visible:
          on:
            RECEIVE:
              # Redrive is evaluated at receive, not at expiry: a message moves
              # to the dead-letter queue on the delivery that would exceed the
              # policy's count, which is what the pack does and what makes the
              # count observable.
              - guard: >
                  has(event.maxReceiveCount) && event.maxReceiveCount > 0 &&
                  int(rec.receiveCount) + 1 > event.maxReceiveCount &&
                  event.deadLetter != '' && event.deadLetter != event.queue
                target: redriven
                actions:
                  # The delivery that redrives is still a delivery: it counts,
                  # and the caller sees the incremented count on the message it
                  # is handed. Setting this before the move is what carries the
                  # new count into the dead-letter queue.
                  - set: { receiveCount: "int(rec.receiveCount) + 1" }
                  - move:
                      to: { queue: event.deadLetter }
                      set:
                        handle: { generate: { kind: hex, bytes: 64 } }
                        origin: "has(rec.origin) && rec.origin != '' ? rec.origin : event.queue"
                      state: visible
              - target: invisible
                actions:
                  - set: { receiveCount: "int(rec.receiveCount) + 1" }
                  - deadline: { name: reappear, after: "seconds(event.visibilityTimeout)" }
            DELETE: [{ target: deleted }]
            PURGE: [{ target: deleted }]
            # A moved message arrives visible in its destination whatever it
            # was in its source: the move is a delivery, not a redelivery, so
            # it does not inherit an unexpired visibility timeout. Which
            # messages are eligible to move is decided by the operation's
            # selection, so there is no guard here.
            MOVE:
              - target: moved
                actions:
                  - move: &moveTo
                      to:
                        queue: >
                          event.dest != '' ? event.dest : string(rec.origin)
                      set:
                        handle: { generate: { kind: hex, bytes: 64 } }
                      state: visible
            CHANGE_VISIBILITY:
              - target: invisible
                actions:
                  - deadline: { name: reappear, after: "seconds(event.timeout)" }

        invisible:
          timers:
            # Lazy: nothing schedules this. The deadline sits on the record
            # until something observes the queue, and the observation is what
            # makes the message visible again.
            - { deadline: reappear, target: visible }
          on:
            DELETE: [{ target: deleted }]
            PURGE: [{ target: deleted }]
            MOVE: [{ target: moved, actions: [{ move: *moveTo }] }]
            CHANGE_VISIBILITY:
              - target: invisible
                actions:
                  - deadline: { name: reappear, after: "seconds(event.timeout)" }

        redriven: { final: true }
        moved: { final: true }
        deleted: { final: true }

errors:
  NonExistentQueue:
    code: AWS.SimpleQueueService.NonExistentQueue
    http: 400
    fault: client
    message: The specified queue does not exist.
  MissingParameter:
    code: MissingParameter
    http: 400
    fault: client
  InvalidParameterValue:
    code: InvalidParameterValue
    http: 400
    fault: client
  ResourceNotFound:
    code: ResourceNotFoundException
    http: 400
    fault: client

operations:
  CreateQueue:
    effects:
      - create: { resource: queue }
    output:
      QueueUrl: rec.url

  GetQueueUrl:
    reads:
      q: { resource: queue }
    require:
      - { cond: q_found, error: NonExistentQueue }
    output:
      QueueUrl: q.url

  ListQueues:
    list: { resource: queue, member: QueueUrls, paginate: model }
    output:
      QueueUrls: "items.map(q, q.url)"

  DeleteQueue:
    reads:
      q: { resource: queue }
    require:
      - { cond: q_found, error: NonExistentQueue }
    effects:
      - delete: { resource: queue }

  GetQueueAttributes:
    reads:
      q: { resource: queue }
      s: { resource: settings }
    require:
      - { cond: q_found, error: NonExistentQueue }
    # Counting the messages is an observation like any other, so expired
    # visibility timeouts settle here too.
    select: { binding: msgs, resource: message }
    output:
      Attributes: >
        merge(
          merge({'ApproximateNumberOfMessages': string(msgs.size()), 'VisibilityTimeout': '30'},
                q.attrs),
          s_found ? s.attrs : {})

  SetQueueAttributes:
    reads:
      q: { resource: queue }
    require:
      - { cond: q_found, error: NonExistentQueue }
    effects:
      - put: { resource: settings }

  TagQueue:
    reads:
      q: { resource: queue }
    require:
      - { cond: q_found, error: NonExistentQueue }
    effects:
      - put: { resource: tags }

  UntagQueue:
    reads:
      q: { resource: queue }
      t: { resource: tags }
    require:
      - { cond: q_found, error: NonExistentQueue }
    effects:
      - put:
          resource: tags
          record:
            tags: "without(t_found ? t.tags : {}, 'TagKeys' in input ? input.TagKeys : [])"

  ListQueueTags:
    reads:
      q: { resource: queue }
      t: { resource: tags }
    require:
      - { cond: q_found, error: NonExistentQueue }
    output:
      Tags: "t_found ? t.tags : {}"

  SendMessage:
    reads:
      q: { resource: queue }
      s: { resource: settings }
    let:
      settings: "merge(q.settings, s_found ? s.attrs : {})"
      # Deduplication is explicit, or derived from the body when the queue asks
      # for content-based deduplication, or absent.
      dedupId: >
        'MessageDeduplicationId' in input && string(input.MessageDeduplicationId) != ''
          ? string(input.MessageDeduplicationId)
          : (('ContentBasedDeduplication' in settings && string(settings.ContentBasedDeduplication) == 'true')
              ? md5hex(string(input.MessageBody)) : '')
      delay: >
        int('DelaySeconds' in input && input.DelaySeconds != null
              ? input.DelaySeconds
              : coalesce(settings.DelaySeconds, '0'))
    # Ordered: the first failing rule decides the error, and this ordering is
    # the service's error precedence stated as data.
    require:
      - { cond: q_found, error: NonExistentQueue }
      - cond: "!q.fifo || ('MessageGroupId' in input && string(input.MessageGroupId) != '')"
        error: MissingParameter
        message: MessageGroupId
      - cond: "!q.fifo || dedupId != ''"
        error: InvalidParameterValue
        message: MessageDeduplicationId is required when ContentBasedDeduplication is disabled.
      - cond: "delay >= 0 && delay <= 900"
        error: InvalidParameterValue
        message: DelaySeconds must be between 0 and 900.
    effects:
      # A duplicate inside the window replays the first send's answer and
      # writes nothing.
      - dedup:
          when: "dedupId != ''"
          table: "dedup:{queue.id}"
          key: dedupId
          ttl: 5m
          on_hit:
            output:
              MessageId: hit.MessageId
              MD5OfMessageBody: hit.MD5OfMessageBody
      - create:
          resource: message
          # A delayed message is born invisible with its reappearance already
          # armed, rather than needing anything to wake up and deliver it.
          state: "delay > 0 ? 'invisible' : 'visible'"
          deadline: { name: reappear, after: "seconds(delay)", when: "delay > 0" }
    output:
      MessageId: rec.id
      MD5OfMessageBody: rec.md5

  SendMessageBatch:
    reads:
      q: { resource: queue }
    require:
      - { cond: q_found, error: NonExistentQueue }
    batch:
      of: SendMessage
      entries: Entries
      id: Id
      carry: [QueueUrl, QueueName]
      successful: Successful
      failed: Failed
      result: [MessageId, MD5OfMessageBody]

  ReceiveMessage:
    reads:
      q: { resource: queue }
      s: { resource: settings }
    require:
      - { cond: q_found, error: NonExistentQueue }
    let:
      settings: "merge(q.settings, s_found ? s.attrs : {})"
      redrive: >
        'RedrivePolicy' in settings ? parseJSON(string(settings.RedrivePolicy)) : null
    select:
      binding: msgs
      resource: message
      state: visible
      order_by: item.seq
      limit: "clamp(int(coalesce('MaxNumberOfMessages' in input ? input.MaxNumberOfMessages : 0, 1)), 1, 10)"
      group:
        # FIFO only: a standard queue has no ordering to preserve.
        when: q.fifo
        by: group
        # A group with a message still in flight is closed until it settles,
        # which is what "ordered within a group" actually means.
        exclusive_in_flight: invisible
    wait:
      until: "msgs.size() > 0"
      timeout: "seconds(int(coalesce('WaitTimeSeconds' in input ? input.WaitTimeSeconds : 0, 0)))"
      on_timeout:
        output:
          Messages: "[]"
    effects:
      - send_event:
          foreach: msgs
          event: RECEIVE
          context:
            visibilityTimeout: >
              int(coalesce('VisibilityTimeout' in input && input.VisibilityTimeout != null
                            ? input.VisibilityTimeout : '',
                          coalesce(settings.VisibilityTimeout, '30')))
            maxReceiveCount: "redrive != null && 'maxReceiveCount' in redrive ? int(redrive.maxReceiveCount) : 0"
            deadLetter: >
              redrive != null && 'deadLetterTargetArn' in redrive
                ? queueFromArn(string(redrive.deadLetterTargetArn)) : ''
            queue: q.name
    output:
      Messages: >
        msgs.map(m, {
          'MessageId': m.id,
          'ReceiptHandle': m.handle,
          'Body': m.body,
          'Attributes': {'ApproximateReceiveCount': string(m.receiveCount)},
          'MessageAttributes': filterAttrs(m.attrs,
            'MessageAttributeNames' in input ? input.MessageAttributeNames : [])
        })

  DeleteMessage:
    reads:
      q: { resource: queue }
    require:
      - { cond: q_found, error: NonExistentQueue }
    effects:
      # Deleting a message that is not there is not an error in this service.
      - send_event:
          resource: message
          key: "string(input.ReceiptHandle)"
          event: DELETE
          missing: ignore

  DeleteMessageBatch:
    reads:
      q: { resource: queue }
    require:
      - { cond: q_found, error: NonExistentQueue }
    batch:
      of: DeleteMessage
      entries: Entries
      id: Id
      carry: [QueueUrl, QueueName]
      successful: Successful
      failed: Failed

  ChangeMessageVisibility:
    reads:
      q: { resource: queue }
    require:
      - { cond: q_found, error: NonExistentQueue }
    effects:
      - send_event:
          resource: message
          key: "string(input.ReceiptHandle)"
          event: CHANGE_VISIBILITY
          missing: ignore
          context:
            timeout: "int(coalesce(input.VisibilityTimeout, 0))"

  ChangeMessageVisibilityBatch:
    reads:
      q: { resource: queue }
    require:
      - { cond: q_found, error: NonExistentQueue }
    batch:
      of: ChangeMessageVisibility
      entries: Entries
      id: Id
      carry: [QueueUrl, QueueName]
      successful: Successful
      failed: Failed

  PurgeQueue:
    reads:
      q: { resource: queue }
    require:
      - { cond: q_found, error: NonExistentQueue }
    select: { binding: msgs, resource: message }
    effects:
      - send_event: { foreach: msgs, event: PURGE }

  # The access policy is a JSON document inside a queue attribute, so these two
  # read it, amend the statement list and write the attribute back. Everything
  # about the document is data here; nothing about it is SQS-specific except
  # which attribute it lives in.
  AddPermission:
    reads:
      q: { resource: queue }
      s: { resource: settings }
    let:
      # Creation-time attributes underneath, SetQueueAttributes on top, which
      # is the same order every read of a queue's attributes uses.
      attrs: "merge(q_found ? q.attrs : {}, s_found ? s.attrs : {})"
      policy: >
        'Policy' in attrs && string(attrs.Policy) != ''
          ? parseJSON(string(attrs.Policy))
          : {'Version': '2012-10-17', 'Statement': []}
      statements: >
        policy != null && 'Statement' in policy && policy.Statement != null
          ? policy.Statement : []
      label: "'Label' in input ? string(input.Label) : ''"
      accounts: "'AWSAccountIds' in input ? input.AWSAccountIds : []"
      actions: "'Actions' in input ? input.Actions : []"
    require:
      - { cond: q_found, error: NonExistentQueue }
      - { cond: "label != ''", error: MissingParameter, message: Label }
      - cond: "accounts.size() > 0 && actions.size() > 0"
        error: MissingParameter
        message: AWSAccountIds/Actions
      # A label names one statement, so reusing it would leave the policy with
      # two statements answering to the same name and no way to remove either.
      - cond: "!statements.exists(st, 'Sid' in st && string(st.Sid) == label)"
        error: InvalidParameterValue
        message: Label exists
    effects:
      # A bare action name is qualified and a qualified one is left alone, so
      # AddPermission('SendMessage') and AddPermission('SQS:SendMessage') mean
      # the same thing.
      - put:
          resource: settings
          record:
            attrs: >
              merge(attrs, {'Policy': toJSON({
                'Version': policy != null && 'Version' in policy
                  ? policy.Version : '2012-10-17',
                'Statement': statements + [{
                  'Sid': label,
                  'Effect': 'Allow',
                  'Principal': {'AWS': accounts.map(a, string(a))},
                  'Action': actions.map(a,
                    string(a).contains(':') ? string(a) : 'SQS:' + string(a)),
                  'Resource': arn('aws', ['sqs', identity.region, identity.account, q.name])
                }]
              })})

  RemovePermission:
    reads:
      q: { resource: queue }
      s: { resource: settings }
    let:
      attrs: "merge(q_found ? q.attrs : {}, s_found ? s.attrs : {})"
      policy: >
        'Policy' in attrs && string(attrs.Policy) != ''
          ? parseJSON(string(attrs.Policy))
          : {'Version': '2012-10-17', 'Statement': []}
      statements: >
        policy != null && 'Statement' in policy && policy.Statement != null
          ? policy.Statement : []
      label: "'Label' in input ? string(input.Label) : ''"
      kept: "statements.filter(st, !('Sid' in st) || string(st.Sid) != label)"
    require:
      - { cond: q_found, error: NonExistentQueue }
      # Removing a label that is not there is an error rather than a no-op:
      # the caller believes a permission exists that does not.
      - cond: "kept.size() != statements.size()"
        error: InvalidParameterValue
        message: Label not found
    effects:
      - put:
          resource: settings
          record:
            attrs: >
              merge(attrs, {'Policy': toJSON({
                'Version': policy != null && 'Version' in policy
                  ? policy.Version : '2012-10-17',
                'Statement': kept
              })})

  # The per-item join: a queue's redrive policy may sit on the queue record or
  # on its settings, so deciding whether a queue feeds this dead-letter queue
  # needs both records for every candidate.
  ListDeadLetterSourceQueues:
    reads:
      q: { resource: queue }
    require:
      - { cond: q_found, error: NonExistentQueue }
    list:
      resource: queue
      member: queueUrls
      paginate: model
      reads:
        src: { resource: settings, key: "string(item.name)" }
      let:
        attrs: "merge(item.attrs, src_found ? src.attrs : {})"
        redrivePolicy: >
          'RedrivePolicy' in attrs && string(attrs.RedrivePolicy) != ''
            ? parseJSON(string(attrs.RedrivePolicy)) : null
        deadLetter: >
          redrivePolicy != null && 'deadLetterTargetArn' in redrivePolicy
            ? queueFromArn(string(redrivePolicy.deadLetterTargetArn)) : ''
      filter: "deadLetter == q.name"
    output:
      queueUrls: "items.map(src, src.url)"

  StartMessageMoveTask:
    reads:
      q: { resource: queue }
    let:
      source: "q_found ? string(q.name) : ''"
      destination: >
        'DestinationArn' in input && input.DestinationArn != null
          ? queueFromArn(string(input.DestinationArn)) : ''
    require:
      - { cond: "source != ''", error: MissingParameter, message: SourceArn }
    select:
      binding: msgs
      resource: message
      # Without a destination the move is a redrive back to where each message
      # came from, so a message that was never redriven has nowhere to go and
      # is left alone -- as is one whose origin is the queue it is already in.
      # Deciding eligibility here rather than in the statechart is what makes
      # the moved count the size of this selection.
      filter: >
        (destination != ''
          ? destination
          : ('origin' in item && item.origin != null ? string(item.origin) : '')) != '' &&
        (destination != ''
          ? destination
          : ('origin' in item && item.origin != null ? string(item.origin) : '')) != source
    effects:
      # The event carries the requested destination, which is the same for
      # every message; where it is empty each message falls back to its own
      # origin, and only the record knows that, so the fallback is in the move
      # action rather than here.
      - send_event:
          foreach: msgs
          event: MOVE
          context:
            dest: destination
      - create:
          resource: movetask
          record:
            SourceArn: "'SourceArn' in input ? input.SourceArn : ''"
            DestinationArn: "'DestinationArn' in input ? input.DestinationArn : ''"
            ApproximateNumberOfMessagesMoved: "msgs.size()"
            source: source
    output:
      TaskHandle: rec.TaskHandle

  CancelMessageMoveTask:
    reads:
      task: { resource: movetask, key: "string(input.TaskHandle)" }
    require:
      - { cond: task_found, error: ResourceNotFound, message: TaskHandle }
      - cond: "string(task.Status) == 'RUNNING'"
        error: InvalidParameterValue
        message: task is not in progress
    effects:
      - patch:
          resource: movetask
          key: "string(input.TaskHandle)"
          record:
            Status: "'CANCELLING'"

  ListMessageMoveTasks:
    let:
      source: >
        'SourceArn' in input && input.SourceArn != null
          ? queueFromArn(string(input.SourceArn)) : ''
    list:
      resource: movetask
      member: Results
      filter: "source == '' || string(item.source) == source"
    output:
      Results: >
        items.map(t, {
          'TaskHandle': t.TaskHandle,
          'Status': t.Status,
          'SourceArn': t.SourceArn,
          'DestinationArn': t.DestinationArn,
          'ApproximateNumberOfMessagesMoved': t.ApproximateNumberOfMessagesMoved,
          'StartedTimestamp': t.StartedTimestamp
        })

quirks:
  - operation: ListDeadLetterSourceQueues
    note: >
      The pack answered with a `QueueUrls` member. The model declares the
      member as `queueUrls`, and the awsJson codec writes the response map
      through unchanged, so the pack's answer was one no SDK could read: a
      generated client looks for `queueUrls` and finds nothing. This bundle
      answers with the member the model declares, which is a deliberate
      divergence from the recording rather than a transcription error, and the
      trace step records it as superseded for that reason.

  - operation: CancelMessageMoveTask
    note: >
      The pack performs a move synchronously and files the task as COMPLETED,
      so a cancel always fails with "task is not in progress" -- there is no
      window in which a task is RUNNING. Real SQS moves messages in the
      background at a bounded rate, which is what MaxNumberOfMessagesPerSecond
      controls, and that input is accepted and ignored here. Transcribed as it
      stands; a probe should settle whether a cancel ever succeeds and what
      ApproximateNumberOfMessagesMoved answers when it does.

  - operation: ReceiveMessage
    note: >
      Redrive to the dead-letter queue is decided at receive rather than when
      a visibility timeout expires, so a message that exceeds maxReceiveCount
      moves on the delivery that would exceed it. Transcribed from the pack;
      real SQS moves it without delivering it again, which a probe should
      settle.
    provenance: authored

  - operation: DeleteQueue
    note: >
      Deleting a queue leaves its messages in the store rather than removing
      the collection. Nothing can reach them, since every message operation
      requires the queue, but the space is not reclaimed. Transcribed from the
      pack.
    provenance: authored

  - note: >
      MD5OfMessageAttributes is not returned. AWS computes it with an
      undocumented binary encoding of the attribute map; that is the
      `aws.sqs/attr-md5` primitive in the design, and no primitive registry
      exists yet. Omitting it is honest; guessing it would not be.
    provenance: authored
