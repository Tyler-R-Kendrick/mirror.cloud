schema: bir/1
service: aws.timestream

# Transcribed from the hand-written pack, not established against the real
# service. Nothing here is a time-series engine: a database or a table is a
# name plus an ARN, a written record set is stored verbatim, and Query is a
# substring match, not SQL.
provenance: authored

# Query rides an authored supplement (specs/timestream-query.json): the
# vendored model covers only the timestream-write namespace, so the supplement
# declares the Query input and output shapes the bundle answers with.

# The pack answered an absent or empty DatabaseName on the create/update paths
# with ValidationException; that is also the service's vocabulary for the
# required members the model now enforces.
missing_input_error: Validation

resources:
  database:
    collection: tsdb
    id:
      input_members: [DatabaseName]
    arn: "arn:{partition}:timestream:{region}:{account}:database/{id}"
    record:
      DatabaseName: id
      Arn: arn

  # The pack scoped tables to a per-database collection; a composite key over
  # one collection is the same containment, and the listing narrows by the
  # recorded DatabaseName.
  table:
    collection: tstab
    id:
      derive: "string(input.DatabaseName) + '/' + string(input.TableName)"
    record:
      DatabaseName: "string(input.DatabaseName)"
      TableName: "string(input.TableName)"
      Arn: "'arn:aws:timestream:' + identity.region + ':' + identity.account + ':database/' + string(input.DatabaseName) + '/table/' + string(input.TableName)"

  # The pack stored the request's Records array verbatim under the database
  # and table name, overwriting whatever a previous WriteRecords put there.
  # The row also carries the coordinates Query matches on, because a select
  # binds records and never store keys.
  records:
    collection: tsrec
    id:
      derive: "string(input.DatabaseName) + '/' + string(input.TableName)"
    record:
      Records: "input.Records"
      db: "string(input.DatabaseName)"
      tbl: "string(input.TableName)"

errors:
  Validation:
    code: ValidationException
    http: 400
    fault: client
  NotFound:
    code: ResourceNotFoundException
    http: 400
    fault: client

operations:
  CreateDatabase:
    require:
      - { cond: "string(input.DatabaseName) != ''", error: Validation }
    effects:
      - put: { resource: database }
    output:
      Database: rec

  DescribeDatabase: {get: {resource: database, error: NotFound, wrap: Database}}
  ListDatabases:
    list: { resource: database, member: Databases, paginate: model }

  # Updating is the pack's create path with another name: an upsert that
  # overwrites the record, storing nothing the update carried.
  UpdateDatabase:
    require:
      - { cond: "string(input.DatabaseName) != ''", error: Validation }
    effects:
      - put: { resource: database }
    output:
      Database: rec

  DeleteDatabase:
    effects:
      - delete: { resource: database, missing: ignore }
    output: {}

  CreateTable:
    require:
      - { cond: "string(input.DatabaseName) != '' && string(input.TableName) != ''", error: Validation }
    effects:
      - put: { resource: table }
    output:
      Table: rec

  DescribeTable: {get: {resource: table, error: NotFound, wrap: Table}}
  ListTables:
    list:
      resource: table
      member: Tables
      paginate: model
      filter: "item.DatabaseName == ('DatabaseName' in input ? string(input.DatabaseName) : '')"

  DeleteTable:
    effects:
      - delete: { resource: table, missing: ignore }
    output: {}

  WriteRecords:
    effects:
      - put: { resource: records }
    output:
      RecordsIngested: "{'Total': size(input.Records)}"

  # Not SQL: a stored batch answers when QueryString is absent or any
  # nonempty part of its database/table key is a substring of it, and each
  # row is one stored record JSON-marshalled into a single ScalarValue. The
  # rows build as a JSON string because CEL has no list flatten; an empty
  # match answers Rows null, as the pack did.
  Query:
    let:
      q: "('QueryString' in input && type(input.QueryString) == string) ? string(input.QueryString) : ''"
    select:
      binding: batches
      resource: records
      filter: "q == '' || split(string(item.db) + '/' + string(item.tbl), '/').exists(part, part != '' && q.contains(part))"
    output:
      ColumnInfo: "[{'Name': 'measure', 'Type': 'VARCHAR'}]"
      Rows: >
        sum(batches.map(b, size(type(b.Records) == list ? b.Records : []))) == 0 ? dyn(null)
          : dyn(parseJSON('[' + join(batches
            .map(b, join((type(b.Records) == list ? b.Records : []).map(r, toJSON({'Data': [{'ScalarValue': type(r) == string ? string(r) : toJSON(r)}]})), ',')), ',') + ']'))

  DescribeEndpoints:
    output:
      Endpoints: "[{'Address': '127.0.0.1', 'CachePeriodInMinutes': 60}]"

quirks:
  - operation: CreateDatabase
    note: >
      Creating over an existing name overwrites the record, where the real
      service answers ConflictException. The pack faulted an absent or empty
      DatabaseName with ValidationException; the model marks the member
      required, so the engine rejects its absence before the bundle runs and
      only the empty-string refusal is the bundle's own.
  - operation: UpdateDatabase
    note: >
      Updating a database that was never created creates it, where the real
      service answers ResourceNotFoundException. The model also requires
      KmsKeyId and the engine now rejects a request that omits it, which the
      pack accepted; the key is never stored either way, so a database has a
      name and an ARN and nothing else -- no CreationTime, no TableCount, none
      of what Database declares.
  - operation: DescribeDatabase
    note: >
      The pack answered an absent DatabaseName with ResourceNotFoundException
      (its lookup of the empty name missed); the engine answers
      ValidationException first, because the model marks the member required.
      DeleteDatabase's pack answered the same request with success, and
      DescribeTable, DeleteTable and WriteRecords likewise behaved rather than
      faulting; all of those paths are now the engine's missing-input refusal.
  - operation: DeleteDatabase
    note: >
      Deleting a database that does not exist succeeds, and deleting one that
      does leaves its tables and records behind: nothing cascades, so
      ListTables still answers them afterwards.
  - operation: ListDatabases
    note: >
      The pack ignored MaxResults and NextToken and answered every database;
      the bundle paginates from the model's pagination trait, which no
      recorded step exercises. ListTables is the same.
  - operation: ListTables
    note: >
      A request naming no database lists the collection the pack wrote tables
      under the empty database name into, which is always empty: CreateTable
      refuses an empty DatabaseName, so the listing answers empty too.
  - operation: WriteRecords
    note: >
      Nothing about a record is checked -- a record with no MeasureName is
      stored as happily as any other -- CommonAttributes is ignored, and a
      second write to the same table replaces the first batch outright.
      RecordsIngested.Total is the request's record count, nothing measured.
  - operation: Query
    note: >
      Not SQL: a stored batch answers when QueryString is absent or any
      nonempty part of its database/table key is a substring of it, so
      "SELECT * FROM metrics" answers every table whose database name happens
      to appear in the string. Each row is one stored record, JSON-marshalled
      into a single ScalarValue under a fixed one-column header; an empty
      match answers Rows null, as the pack did. The rows build as a JSON
      string because CEL has no list flatten.
  - operation: DescribeEndpoints
    note: >
      The endpoint is a constant: 127.0.0.1 with a sixty-minute cache period,
      whatever the account or region.
