schema: bir/1
service: azure.blobs

# Extracted from internal/services/azure/blobs. Authored from that pack, not
# from live Azure. The eight CRUD operations keep the pack's names because
# restxml azureRoute and the catalog still resolve those names; swagger ingest
# is a later PR.
provenance: authored

resources:
  container:
    collection: azctr
    id:
      derive: "('container' in input && input.container != null) ? lower(string(input.container)) : ''"
    record:
      name: id

  # No input-derived resource-level record: every write re-evaluates it, so a
  # metadata or properties patch would re-run the template against a body-less
  # request and wipe the value it was not touching. PutBlob carries the full
  # record; patches and folds declare only the fields they mean to change.
  # last_modified is input-independent, so re-evaluating it only bumps mtime
  # (which every Azure write does).
  blob:
    collection: "azblob:{container.id}"
    parent: container
    id:
      input_members: [blob]
    record:
      last_modified: "int(now)"

  blob_slot:
    collection: azslot
    parent: container
    id:
      input_members: [blob]
    record:
      name: id

  block:
    collection: "azblock:{blob_slot.id}"
    parent: blob_slot
    id:
      derive: "('blockid' in input && input.blockid != null) ? string(input.blockid) : ''"
    record:
      id: id
      value: "('body' in input && input.body != null) ? string(input.body) : ''"

  account:
    collection: azacct
    id:
      derive: "'default'"

errors:
  InvalidResourceName:
    code: InvalidResourceName
    http: 400
    fault: client
  ContainerAlreadyExists:
    code: ContainerAlreadyExists
    http: 409
    fault: client
  ContainerNotFound:
    code: ContainerNotFound
    http: 404
    fault: client
  BlobNotFound:
    code: BlobNotFound
    http: 404
    fault: client
  InvalidBlockList:
    code: InvalidBlockList
    http: 400
    fault: client
  InvalidQueryParameterValue:
    code: InvalidQueryParameterValue
    http: 400
    fault: client
  LeaseAlreadyPresent:
    code: LeaseAlreadyPresent
    http: 409
    fault: client
  LeaseIdMismatchWithLeaseOperation:
    code: LeaseIdMismatchWithLeaseOperation
    http: 409
    fault: client
  BlobAlreadyExists:
    code: BlobAlreadyExists
    http: 409
    fault: client
  InvalidBlobType:
    code: InvalidBlobType
    http: 409
    fault: client
  InvalidHeaderValue:
    code: InvalidHeaderValue
    http: 400
    fault: client
  RequestedRangeNotSatisfiable:
    code: RequestedRangeNotSatisfiable
    http: 416
    fault: client
  RequestBodyTooLarge:
    code: RequestBodyTooLarge
    http: 413
    fault: client
  BlockCountExceedsLimit:
    code: BlockCountExceedsLimit
    http: 409
    fault: client
  SnapshotsPresent:
    code: SnapshotsPresent
    http: 409
    fault: client
  NoPendingCopyOperation:
    code: NoPendingCopyOperation
    http: 409
    fault: client
  ConditionNotMet:
    code: ConditionNotMet
    http: 412
    fault: client
  # Azurite's NotModified carries the ConditionNotMet code with a 304 status;
  # EncodeFault writes it header-only.
  NotModified:
    code: ConditionNotMet
    http: 304
    fault: client
  MultipleConditionHeadersNotSupported:
    code: MultipleConditionHeadersNotSupported
    http: 400
    fault: client
  UnsatisfiableCondition:
    code: UnsatisfiableCondition
    http: 400
    fault: client
  SequenceNumberConditionNotMet:
    code: SequenceNumberConditionNotMet
    http: 412
    fault: client
  AppendPositionConditionNotMet:
    code: AppendPositionConditionNotMet
    http: 412
    fault: client
  MaxBlobSizeConditionNotMet:
    code: MaxBlobSizeConditionNotMet
    http: 412
    fault: client
  TagsTooLarge:
    code: TagsTooLarge
    http: 400
    fault: client
  EmptyTagName:
    code: EmptyTagName
    http: 400
    fault: client
  # Azurite's getInvalidTag really returns this code for bad characters.
  DuplicateTagNames:
    code: DuplicateTagNames
    http: 400
    fault: client
  InvalidXmlDocument:
    code: InvalidXmlDocument
    http: 400
    fault: client
  BlobArchived:
    code: BlobArchived
    http: 409
    fault: client
  AccessTierNotSupportedForBlobType:
    code: AccessTierNotSupportedForBlobType
    http: 400
    fault: client
  LeaseIdMissing:
    code: LeaseIdMissing
    http: 412
    fault: client
  LeaseIdMismatchWithBlobOperation:
    code: LeaseIdMismatchWithBlobOperation
    http: 409
    fault: client

operations:
  CreateContainer:
    reads:
      existing: { resource: container }
    require:
      - { cond: "'container' in input && string(input.container) != ''", error: InvalidResourceName, message: "The specified resource name contains invalid characters." }
      - { cond: "!existing_found", error: ContainerAlreadyExists, message: "The specified container already exists." }
    effects:
      - create: { resource: container }
    output:
      name: id

  GetContainer:
    reads:
      rec: { resource: container }
    require:
      - { cond: rec_found, error: ContainerNotFound, message: "The specified container does not exist." }
    output:
      name: rec.name
      metadata: "('metadata' in rec && rec.metadata != null) ? rec.metadata : {}"
      public_access: "('public_access' in rec && rec.public_access != null) ? string(rec.public_access) : ''"
      lease_id: "('lease_id' in rec && rec.lease_id != null) ? string(rec.lease_id) : ''"
      lease_status: "('lease_status' in rec && rec.lease_status != null && string(rec.lease_status) != '') ? string(rec.lease_status) : 'unlocked'"
      lease_state: "('lease_state' in rec && rec.lease_state != null && string(rec.lease_state) != '') ? string(rec.lease_state) : 'available'"
      lease_duration: "('lease_duration' in rec && rec.lease_duration != null) ? string(rec.lease_duration) : ''"

  ListContainers:
    list: { resource: container, member: _list }

  DeleteContainer:
    reads:
      rec: { resource: container }
    require:
      - { cond: rec_found, error: ContainerNotFound, message: "The specified container does not exist." }
    effects:
      - delete: { resource: container }

  PutBlob:
    reads:
      ctr: { resource: container }
      existing: { resource: blob }
      acct: { resource: account }
    require:
      - { cond: ctr_found, error: ContainerNotFound, message: "The specified container does not exist." }
      - { cond: "'blob' in input && string(input.blob) != ''", error: InvalidResourceName, message: "The specified blob name is invalid." }
      # Azurite createBlob special case: If-None-Match * on an existing blob
      # is a 409, not the write validator's 412.
      - { cond: "!('if_none_match_list' in input && size(input.if_none_match_list) > 0 && string(input.if_none_match_list[0]) == '*') || !existing_found", error: BlobAlreadyExists, message: "The specified blob already exists." }
      - { cond: "!(('tags_invalid' in input) && string(input.tags_invalid) == 'TagsTooLarge')", error: TagsTooLarge, message: "The tags specified exceed the maximum permissible limit." }
      - { cond: "!(('tags_invalid' in input) && string(input.tags_invalid) == 'EmptyTagName')", error: EmptyTagName, message: "The name of one of the tag key-value pairs is empty." }
      - { cond: "!(('tags_invalid' in input) && string(input.tags_invalid) == 'DuplicateTagNames')", error: DuplicateTagNames, message: "The tags specified are invalid. It contains characters that are not permitted." }
      - { cond: "!('if_tags_invalid' in input && input.if_tags_invalid == true)", error: InvalidHeaderValue, message: "The value for one of the HTTP headers is not in the correct format." }
      - { cond: "!('if_tags' in input && input.if_tags != null && string(input.if_tags) != '') || !existing_found || tagmatch(string(input.if_tags), ('tags' in existing && existing.tags != null) ? existing.tags : {}, lower(string(input.container)))", error: ConditionNotMet, message: "The condition specified using HTTP conditional header(s) is not met." }
      - { cond: "!existing_found || !('lease_status' in existing && string(existing.lease_status) == 'locked') || ('lease_id' in input && input.lease_id != null && string(input.lease_id) != '')", error: LeaseIdMissing, message: "There is currently a lease on the blob and no lease ID was specified in the request." }
      - { cond: "!existing_found || !('lease_status' in existing && string(existing.lease_status) == 'locked') || string(existing.lease_id) == string(input.lease_id)", error: LeaseIdMismatchWithBlobOperation, message: "The lease ID specified did not match the lease ID for the blob." }
    effects:
      - put:
          resource: blob
          record:
            container: "lower(string(input.container))"
            name: "string(input.blob)"
            value: "('body' in input && input.body != null) ? string(input.body) : (('value' in input && input.value != null) ? string(input.value) : '')"
            metadata: "('metadata' in input && input.metadata != null) ? input.metadata : {}"
            content_type: "('content_type' in input && input.content_type != null) ? string(input.content_type) : ''"
            cache_control: "('cache_control' in input && input.cache_control != null) ? string(input.cache_control) : ''"
            content_encoding: "('content_encoding' in input && input.content_encoding != null) ? string(input.content_encoding) : ''"
            content_language: "('content_language' in input && input.content_language != null) ? string(input.content_language) : ''"
            content_disposition: "('content_disposition' in input && input.content_disposition != null) ? string(input.content_disposition) : ''"
            content_md5: "('content_md5' in input && input.content_md5 != null) ? string(input.content_md5) : ''"
            blob_type: "('blob_type' in input && input.blob_type != null && string(input.blob_type) != '') ? string(input.blob_type) : 'BlockBlob'"
            access_tier: "('access_tier' in input && input.access_tier != null) ? string(input.access_tier) : ''"
            access_tier_inferred: "('access_tier' in input && input.access_tier != null) ? 'false' : 'true'"
            lease_id: "(existing_found && 'lease_id' in existing && existing.lease_id != null) ? string(existing.lease_id) : ''"
            lease_status: "(existing_found && 'lease_status' in existing && existing.lease_status != null) ? string(existing.lease_status) : ''"
            lease_state: "(existing_found && 'lease_state' in existing && existing.lease_state != null) ? string(existing.lease_state) : ''"
            lease_duration: "(existing_found && 'lease_duration' in existing && existing.lease_duration != null) ? string(existing.lease_duration) : ''"
            tags: "('tags' in input && input.tags != null) ? input.tags : {}"
      # The FilterBlobs index mirrors this blob's tags at account level; an
      # overwrite replaces the entry wholesale, tags or no tags.
      - patch:
          resource: account
          record:
            tags_index: "merge((acct_found && 'tags_index' in acct && acct.tags_index != null) ? acct.tags_index : {}, {lower(string(input.container)) + '/' + string(input.blob): {'container': lower(string(input.container)), 'name': string(input.blob), 'tags': ('tags' in input && input.tags != null) ? input.tags : {}}})"
    output:
      container: "lower(string(input.container))"
      name: "string(input.blob)"

  GetBlob:
    reads:
      ctr: { resource: container }
      rec: { resource: blob }
    require:
      - { cond: ctr_found, error: ContainerNotFound, message: "The specified container does not exist." }
      # Azurite's metadata store validates read conditions before throwing
      # BlobNotFound: any If-Match on a missing blob is 412, and If-None-Match
      # * on a missing blob is 400.
      - { cond: "rec_found || !('if_match_list' in input && size(input.if_match_list) > 0)", error: ConditionNotMet, message: "The condition specified using HTTP conditional header(s) is not met." }
      - { cond: "rec_found || !('if_none_match_list' in input && size(input.if_none_match_list) > 0 && string(input.if_none_match_list[0]) == '*')", error: UnsatisfiableCondition, message: "The condition specified using HTTP conditional header(s) cannot be satisfied." }
      - { cond: rec_found, error: BlobNotFound, message: "The specified blob does not exist." }
      - { cond: "!('snapshot' in input && input.snapshot != null) || ('snapshots' in rec && rec.snapshots != null && size(rec.snapshots.filter(s, s.id == string(input.snapshot))) > 0)", error: BlobNotFound, message: "The specified blob does not exist." }
      - { cond: "('snapshot' in input && input.snapshot != null) || !('access_tier' in rec && string(rec.access_tier) == 'Archive')", error: BlobArchived, message: "This operation is not permitted on an archived blob." }
      # Read conditions (Azurite ReadConditionalHeadersValidator).
      - { cond: "!('if_none_match_list' in input && size(input.if_none_match_list) > 0 && string(input.if_none_match_list[0]) == '*')", error: UnsatisfiableCondition, message: "The condition specified using HTTP conditional header(s) cannot be satisfied." }
      - { cond: "!('if_match_list' in input && size(input.if_match_list) > 0) || string(input.if_match_list[0]) == '*' || input.if_match_list.exists(m, string(m) == etag)", error: ConditionNotMet, message: "The condition specified using HTTP conditional header(s) is not met." }
      - { cond: "!('if_unmodified_since_unix' in input) || last_mod <= int(input.if_unmodified_since_unix)", error: ConditionNotMet, message: "The condition specified using HTTP conditional header(s) is not met." }
      - { cond: "!('if_none_match_list' in input && input.if_none_match_list.exists(m, string(m) == etag)) || (('if_modified_since_unix' in input) && int(input.if_modified_since_unix) < last_mod)", error: NotModified, message: "The condition specified using HTTP conditional header(s) is not met." }
      - { cond: "!('if_modified_since_unix' in input) || int(input.if_modified_since_unix) < last_mod || (('if_none_match_list' in input && size(input.if_none_match_list) > 0) && !input.if_none_match_list.exists(m, string(m) == etag))", error: NotModified, message: "The condition specified using HTTP conditional header(s) is not met." }
      - { cond: "!('if_tags_invalid' in input && input.if_tags_invalid == true)", error: InvalidHeaderValue, message: "The value for one of the HTTP headers is not in the correct format." }
      - { cond: "!('if_tags' in input && input.if_tags != null && string(input.if_tags) != '') || tagmatch(string(input.if_tags), ('tags' in src && src.tags != null) ? src.tags : {}, ('container' in src && src.container != null) ? string(src.container) : lower(string(input.container)))", error: ConditionNotMet, message: "The condition specified using HTTP conditional header(s) is not met." }
    let:
      # Guard the snapshot index: an unknown snapshot id must 404 via the
      # require above, not fault the let before requires run.
      src: "rec_found ? (('snapshot' in input && input.snapshot != null && 'snapshots' in rec && rec.snapshots != null && size(rec.snapshots.filter(s, s.id == string(input.snapshot))) > 0) ? rec.snapshots.filter(s, s.id == string(input.snapshot))[0] : rec) : {}"
      etag: "rec_found ? md5hex(string(src.value) + '|' + toJSON(('metadata' in src && src.metadata != null) ? src.metadata : {}) + '|' + (('content_type' in src && src.content_type != null) ? string(src.content_type) : '')) : ''"
      last_mod: "rec_found ? (('last_modified' in src && src.last_modified != null) ? int(src.last_modified) : 0) : 0"
    output:
      _raw: "string(src.value)"

  CreateSnapshot:
    reads:
      ctr: { resource: container }
      rec: { resource: blob }
    require:
      - { cond: ctr_found, error: ContainerNotFound, message: "The specified container does not exist." }
      - { cond: rec_found, error: BlobNotFound, message: "The specified blob does not exist." }
      - { cond: "!('if_tags_invalid' in input && input.if_tags_invalid == true)", error: InvalidHeaderValue, message: "The value for one of the HTTP headers is not in the correct format." }
      - { cond: "!('if_tags' in input && input.if_tags != null && string(input.if_tags) != '') || tagmatch(string(input.if_tags), ('tags' in rec && rec.tags != null) ? rec.tags : {}, lower(string(input.container)))", error: ConditionNotMet, message: "The condition specified using HTTP conditional header(s) is not met." }
    let:
      snap_id: "rec_found ? string(now) + '-' + string((('snapshots' in rec && rec.snapshots != null) ? size(rec.snapshots) : 0)) : ''"
      snap: "rec_found ? {'id': snap_id, 'value': string(rec.value), 'metadata': (('metadata' in input && input.metadata != null) ? input.metadata : (('metadata' in rec && rec.metadata != null) ? rec.metadata : {})), 'content_type': (('content_type' in rec && rec.content_type != null) ? string(rec.content_type) : ''), 'cache_control': (('cache_control' in rec && rec.cache_control != null) ? string(rec.cache_control) : ''), 'content_encoding': (('content_encoding' in rec && rec.content_encoding != null) ? string(rec.content_encoding) : ''), 'content_language': (('content_language' in rec && rec.content_language != null) ? string(rec.content_language) : ''), 'content_disposition': (('content_disposition' in rec && rec.content_disposition != null) ? string(rec.content_disposition) : ''), 'content_md5': (('content_md5' in rec && rec.content_md5 != null) ? string(rec.content_md5) : ''), 'blob_type': (('blob_type' in rec && rec.blob_type != null) ? string(rec.blob_type) : 'BlockBlob'), 'tags': (('tags' in rec && rec.tags != null) ? rec.tags : {}), 'last_modified': int(now)} : {}"
    effects:
      - patch:
          resource: blob
          record:
            snapshots: "(('snapshots' in rec && rec.snapshots != null) ? rec.snapshots : []) + [snap]"
    output:
      snapshot: snap_id

  StartCopyFromURL:
    reads:
      ctr: { resource: container }
      src: { resource: blob, key: "('source_blob' in input && input.source_blob != null) ? string(input.source_blob) : ''" }
      dst: { resource: blob }
      acct: { resource: account }
    require:
      - { cond: ctr_found, error: ContainerNotFound, message: "The specified container does not exist." }
      - { cond: "!('source_invalid' in input && input.source_invalid == true)", error: InvalidHeaderValue, message: "The value for one of the HTTP headers is not in the correct format." }
      - { cond: src_found, error: BlobNotFound, message: "The specified blob does not exist." }
      - { cond: "!('source_snapshot' in input && input.source_snapshot != null) || ('snapshots' in src && src.snapshots != null && size(src.snapshots.filter(s, s.id == string(input.source_snapshot))) > 0)", error: BlobNotFound, message: "The specified blob does not exist." }
      - { cond: "!('if_none_match_list' in input && size(input.if_none_match_list) > 0 && string(input.if_none_match_list[0]) == '*') || !dst_found", error: BlobAlreadyExists, message: "The specified blob already exists." }
      - { cond: "!(('tags_invalid' in input) && string(input.tags_invalid) == 'TagsTooLarge')", error: TagsTooLarge, message: "The tags specified exceed the maximum permissible limit." }
      - { cond: "!(('tags_invalid' in input) && string(input.tags_invalid) == 'EmptyTagName')", error: EmptyTagName, message: "The name of one of the tag key-value pairs is empty." }
      - { cond: "!(('tags_invalid' in input) && string(input.tags_invalid) == 'DuplicateTagNames')", error: DuplicateTagNames, message: "The tags specified are invalid. It contains characters that are not permitted." }
      - { cond: "!('source_if_tags_invalid' in input && input.source_if_tags_invalid == true)", error: InvalidHeaderValue, message: "The value for one of the HTTP headers is not in the correct format." }
      - { cond: "!('source_if_tags' in input && input.source_if_tags != null && string(input.source_if_tags) != '') || tagmatch(string(input.source_if_tags), ('tags' in srcrec && srcrec.tags != null) ? srcrec.tags : {}, lower(string(input.container)))", error: ConditionNotMet, message: "The condition specified using HTTP conditional header(s) is not met." }
    let:
      srcrec: "src_found ? (('source_snapshot' in input && input.source_snapshot != null) ? src.snapshots.filter(s, s.id == string(input.source_snapshot))[0] : src) : {}"
      smeta: "('metadata' in input && input.metadata != null) ? input.metadata : (('metadata' in srcrec && srcrec.metadata != null) ? srcrec.metadata : {})"
      stags: "('tags' in input && input.tags != null) ? input.tags : (('tags' in srcrec && srcrec.tags != null) ? srcrec.tags : {})"
    effects:
      # The src read resolved this resource's id to the source blob; without
      # an explicit key the put would carry that key and overwrite the source.
      - put:
          resource: blob
          key: "string(input.blob)"
          record:
            container: "lower(string(input.container))"
            name: "string(input.blob)"
            value: "string(srcrec.value)"
            metadata: smeta
            content_type: "('content_type' in srcrec && srcrec.content_type != null) ? string(srcrec.content_type) : ''"
            cache_control: "('cache_control' in srcrec && srcrec.cache_control != null) ? string(srcrec.cache_control) : ''"
            content_encoding: "('content_encoding' in srcrec && srcrec.content_encoding != null) ? string(srcrec.content_encoding) : ''"
            content_language: "('content_language' in srcrec && srcrec.content_language != null) ? string(srcrec.content_language) : ''"
            content_disposition: "('content_disposition' in srcrec && srcrec.content_disposition != null) ? string(srcrec.content_disposition) : ''"
            content_md5: "('content_md5' in srcrec && srcrec.content_md5 != null) ? string(srcrec.content_md5) : ''"
            blob_type: "('blob_type' in srcrec && srcrec.blob_type != null) ? string(srcrec.blob_type) : 'BlockBlob'"
            sequence_number: "('sequence_number' in srcrec && srcrec.sequence_number != null) ? string(srcrec.sequence_number) : '0'"
            append_count: "'0'"
            lease_id: "(dst_found && 'lease_id' in dst && dst.lease_id != null) ? string(dst.lease_id) : ''"
            lease_status: "(dst_found && 'lease_status' in dst && dst.lease_status != null) ? string(dst.lease_status) : ''"
            lease_state: "(dst_found && 'lease_state' in dst && dst.lease_state != null) ? string(dst.lease_state) : ''"
            lease_duration: "(dst_found && 'lease_duration' in dst && dst.lease_duration != null) ? string(dst.lease_duration) : ''"
            tags: stags
      - patch:
          resource: account
          record:
            tags_index: "merge((acct_found && 'tags_index' in acct && acct.tags_index != null) ? acct.tags_index : {}, {lower(string(input.container)) + '/' + string(input.blob): {'container': lower(string(input.container)), 'name': string(input.blob), 'tags': stags}})"
    output:
      copy_id: "md5hex(string(input.copy_source) + '|' + string(input.blob))"
      copy_status: "'success'"
      content_md5: "('content_md5' in srcrec && srcrec.content_md5 != null) ? string(srcrec.content_md5) : ''"

  CopyBlobFromURL:
    reads:
      ctr: { resource: container }
      src: { resource: blob, key: "('source_blob' in input && input.source_blob != null) ? string(input.source_blob) : ''" }
      dst: { resource: blob }
      acct: { resource: account }
    require:
      - { cond: ctr_found, error: ContainerNotFound, message: "The specified container does not exist." }
      - { cond: "!('source_invalid' in input && input.source_invalid == true)", error: InvalidHeaderValue, message: "The value for one of the HTTP headers is not in the correct format." }
      - { cond: src_found, error: BlobNotFound, message: "The specified blob does not exist." }
      - { cond: "!('source_snapshot' in input && input.source_snapshot != null) || ('snapshots' in src && src.snapshots != null && size(src.snapshots.filter(s, s.id == string(input.source_snapshot))) > 0)", error: BlobNotFound, message: "The specified blob does not exist." }
      - { cond: "!('if_none_match_list' in input && size(input.if_none_match_list) > 0 && string(input.if_none_match_list[0]) == '*') || !dst_found", error: BlobAlreadyExists, message: "The specified blob already exists." }
      - { cond: "!(('tags_invalid' in input) && string(input.tags_invalid) == 'TagsTooLarge')", error: TagsTooLarge, message: "The tags specified exceed the maximum permissible limit." }
      - { cond: "!(('tags_invalid' in input) && string(input.tags_invalid) == 'EmptyTagName')", error: EmptyTagName, message: "The name of one of the tag key-value pairs is empty." }
      - { cond: "!(('tags_invalid' in input) && string(input.tags_invalid) == 'DuplicateTagNames')", error: DuplicateTagNames, message: "The tags specified are invalid. It contains characters that are not permitted." }
      - { cond: "!('source_if_tags_invalid' in input && input.source_if_tags_invalid == true)", error: InvalidHeaderValue, message: "The value for one of the HTTP headers is not in the correct format." }
      - { cond: "!('source_if_tags' in input && input.source_if_tags != null && string(input.source_if_tags) != '') || tagmatch(string(input.source_if_tags), ('tags' in srcrec && srcrec.tags != null) ? srcrec.tags : {}, lower(string(input.container)))", error: ConditionNotMet, message: "The condition specified using HTTP conditional header(s) is not met." }
    let:
      srcrec: "src_found ? (('source_snapshot' in input && input.source_snapshot != null) ? src.snapshots.filter(s, s.id == string(input.source_snapshot))[0] : src) : {}"
      smeta: "('metadata' in input && input.metadata != null) ? input.metadata : (('metadata' in srcrec && srcrec.metadata != null) ? srcrec.metadata : {})"
