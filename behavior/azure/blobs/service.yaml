  # where is an empty result, and matched items carry only the tags the
  # expression references, like Azurite. The account-level tags_index is
  # maintained by every tag-changing op.
  FilterBlobs:
    reads:
      acct: { resource: account }
      ctr: { resource: container }
    require:
      - { cond: "!has_ctr || ctr_found", error: ContainerNotFound, message: "The specified container does not exist." }
      - { cond: "!('where_invalid' in input && input.where_invalid == true)", error: InvalidQueryParameterValue, message: "The value for one of the query parameters specified in the request URI is invalid." }
    let:
      has_ctr: "('container' in input && input.container != null && string(input.container) != '')"
      wq: "('where' in input && input.where != null) ? string(input.where) : ''"
      idx: "(acct_found && 'tags_index' in acct && acct.tags_index != null) ? acct.tags_index : {}"
      wkeys: "wq != '' ? tagkeys(wq) : []"
    output:
      where: wq
      blobs: "wq == '' ? [] : idx.map(k, idx[k]).filter(b, (!has_ctr || string(b.container) == lower(string(input.container))) && tagmatch(wq, ('tags' in b && b.tags != null) ? b.tags : {}, string(b.container))).map(b, {'name': b.name, 'container': string(b.container), 'tags': without(('tags' in b && b.tags != null) ? b.tags : {}, (('tags' in b && b.tags != null) ? b.tags : {}).map(tk, tk).filter(tk, !wkeys.exists(w, w == tk)))})"

