schema: bir/1
service: azure.blobs

# Extracted from internal/services/azure/blobs. Authored from that pack, not
# from live Azure. The eight CRUD operations keep the pack's names because
# restxml azureRoute and the catalog still resolve those names; swagger ingest
# is a later PR.
provenance: authored

resources:
  container:
    collection: azctr
    id:
      derive: "('container' in input && input.container != null) ? lower(string(input.container)) : ''"
    record:
      name: id

  # No resource-level record: every write re-evaluates it, so a metadata or
  # properties patch would re-run the template against a body-less request and
  # wipe the value it was not touching. PutBlob carries the full record;
  # patches and folds declare only the fields they mean to change.
  blob:
    collection: "azblob:{container.id}"
    parent: container
    id:
      input_members: [blob]

  blob_slot:
    collection: azslot
    parent: container
    id:
      input_members: [blob]
    record:
      name: id

  block:
    collection: "azblock:{blob_slot.id}"
    parent: blob_slot
    id:
      derive: "('blockid' in input && input.blockid != null) ? string(input.blockid) : ''"
    record:
      id: id
      value: "('body' in input && input.body != null) ? string(input.body) : ''"

  account:
    collection: azacct
    id:
      derive: "'default'"
    record:
      properties: "('body' in input && input.body != null) ? string(input.body) : ''"

errors:
  InvalidResourceName:
    code: InvalidResourceName
    http: 400
    fault: client
  ContainerAlreadyExists:
    code: ContainerAlreadyExists
    http: 409
    fault: client
  ContainerNotFound:
    code: ContainerNotFound
    http: 404
    fault: client
  BlobNotFound:
    code: BlobNotFound
    http: 404
    fault: client
  InvalidBlockList:
    code: InvalidBlockList
    http: 400
    fault: client
  InvalidQueryParameterValue:
    code: InvalidQueryParameterValue
    http: 400
    fault: client
  LeaseAlreadyPresent:
    code: LeaseAlreadyPresent
    http: 409
    fault: client
  LeaseIdMismatchWithLeaseOperation:
    code: LeaseIdMismatchWithLeaseOperation
    http: 409
    fault: client
  BlobAlreadyExists:
    code: BlobAlreadyExists
    http: 409
    fault: client
  InvalidBlobType:
    code: InvalidBlobType
    http: 409
    fault: client
  InvalidHeaderValue:
    code: InvalidHeaderValue
    http: 400
    fault: client
  RequestedRangeNotSatisfiable:
    code: RequestedRangeNotSatisfiable
    http: 416
    fault: client
  RequestBodyTooLarge:
    code: RequestBodyTooLarge
    http: 413
    fault: client
  BlockCountExceedsLimit:
    code: BlockCountExceedsLimit
    http: 409
    fault: client
  SnapshotsPresent:
    code: SnapshotsPresent
    http: 409
    fault: client
  NoPendingCopyOperation:
    code: NoPendingCopyOperation
    http: 409
    fault: client

operations:
  CreateContainer:
    reads:
      existing: { resource: container }
    require:
      - { cond: "'container' in input && string(input.container) != ''", error: InvalidResourceName, message: "The specified resource name contains invalid characters." }
      - { cond: "!existing_found", error: ContainerAlreadyExists, message: "The specified container already exists." }
    effects:
      - create: { resource: container }
    output:
      name: id

  GetContainer:
    reads:
      rec: { resource: container }
    require:
      - { cond: rec_found, error: ContainerNotFound, message: "The specified container does not exist." }
    output:
      name: rec.name
      metadata: "('metadata' in rec && rec.metadata != null) ? rec.metadata : {}"
      public_access: "('public_access' in rec && rec.public_access != null) ? string(rec.public_access) : ''"
      lease_id: "('lease_id' in rec && rec.lease_id != null) ? string(rec.lease_id) : ''"
      lease_status: "('lease_status' in rec && rec.lease_status != null && string(rec.lease_status) != '') ? string(rec.lease_status) : 'unlocked'"
      lease_state: "('lease_state' in rec && rec.lease_state != null && string(rec.lease_state) != '') ? string(rec.lease_state) : 'available'"
      lease_duration: "('lease_duration' in rec && rec.lease_duration != null) ? string(rec.lease_duration) : ''"

  ListContainers:
    list: { resource: container, member: _list }

  DeleteContainer:
    reads:
      rec: { resource: container }
    require:
      - { cond: rec_found, error: ContainerNotFound, message: "The specified container does not exist." }
    effects:
      - delete: { resource: container }

  PutBlob:
    reads:
      ctr: { resource: container }
    require:
      - { cond: ctr_found, error: ContainerNotFound, message: "The specified container does not exist." }
      - { cond: "'blob' in input && string(input.blob) != ''", error: InvalidResourceName, message: "The specified blob name is invalid." }
    effects:
      - put:
          resource: blob
          record:
            container: "lower(string(input.container))"
            name: "string(input.blob)"
            value: "('body' in input && input.body != null) ? string(input.body) : (('value' in input && input.value != null) ? string(input.value) : '')"
            metadata: "('metadata' in input && input.metadata != null) ? input.metadata : {}"
            content_type: "('content_type' in input && input.content_type != null) ? string(input.content_type) : ''"
            cache_control: "('cache_control' in input && input.cache_control != null) ? string(input.cache_control) : ''"
            content_encoding: "('content_encoding' in input && input.content_encoding != null) ? string(input.content_encoding) : ''"
            content_language: "('content_language' in input && input.content_language != null) ? string(input.content_language) : ''"
            content_disposition: "('content_disposition' in input && input.content_disposition != null) ? string(input.content_disposition) : ''"
            content_md5: "('content_md5' in input && input.content_md5 != null) ? string(input.content_md5) : ''"
            blob_type: "('blob_type' in input && input.blob_type != null && string(input.blob_type) != '') ? string(input.blob_type) : 'BlockBlob'"
    output:
      container: "lower(string(input.container))"
      name: "string(input.blob)"

  GetBlob:
    reads:
      ctr: { resource: container }
      rec: { resource: blob }
    require:
      - { cond: ctr_found, error: ContainerNotFound, message: "The specified container does not exist." }
      - { cond: rec_found, error: BlobNotFound, message: "The specified blob does not exist." }
      - { cond: "!('snapshot' in input && input.snapshot != null) || ('snapshots' in rec && rec.snapshots != null && size(rec.snapshots.filter(s, s.id == string(input.snapshot))) > 0)", error: BlobNotFound, message: "The specified blob does not exist." }
    output:
      _raw: "('snapshot' in input && input.snapshot != null) ? string(rec.snapshots.filter(s, s.id == string(input.snapshot))[0].value) : string(rec.value)"

  CreateSnapshot:
    reads:
      ctr: { resource: container }
      rec: { resource: blob }
    require:
      - { cond: ctr_found, error: ContainerNotFound, message: "The specified container does not exist." }
      - { cond: rec_found, error: BlobNotFound, message: "The specified blob does not exist." }
    let:
      snap_id: "rec_found ? string(now) + '-' + string((('snapshots' in rec && rec.snapshots != null) ? size(rec.snapshots) : 0)) : ''"
      snap: "rec_found ? {'id': snap_id, 'value': string(rec.value), 'metadata': (('metadata' in input && input.metadata != null) ? input.metadata : (('metadata' in rec && rec.metadata != null) ? rec.metadata : {})), 'content_type': (('content_type' in rec && rec.content_type != null) ? string(rec.content_type) : ''), 'cache_control': (('cache_control' in rec && rec.cache_control != null) ? string(rec.cache_control) : ''), 'content_encoding': (('content_encoding' in rec && rec.content_encoding != null) ? string(rec.content_encoding) : ''), 'content_language': (('content_language' in rec && rec.content_language != null) ? string(rec.content_language) : ''), 'content_disposition': (('content_disposition' in rec && rec.content_disposition != null) ? string(rec.content_disposition) : ''), 'content_md5': (('content_md5' in rec && rec.content_md5 != null) ? string(rec.content_md5) : ''), 'blob_type': (('blob_type' in rec && rec.blob_type != null) ? string(rec.blob_type) : 'BlockBlob')} : {}"
    effects:
      - patch:
          resource: blob
          record:
            snapshots: "(('snapshots' in rec && rec.snapshots != null) ? rec.snapshots : []) + [snap]"
    output:
      snapshot: snap_id

  StartCopyFromURL:
    reads:
      ctr: { resource: container }
      src: { resource: blob, key: "('source_blob' in input && input.source_blob != null) ? string(input.source_blob) : ''" }
    require:
      - { cond: ctr_found, error: ContainerNotFound, message: "The specified container does not exist." }
      - { cond: "!('source_invalid' in input && input.source_invalid == true)", error: InvalidHeaderValue, message: "The value for one of the HTTP headers is not in the correct format." }
      - { cond: src_found, error: BlobNotFound, message: "The specified blob does not exist." }
      - { cond: "!('source_snapshot' in input && input.source_snapshot != null) || ('snapshots' in src && src.snapshots != null && size(src.snapshots.filter(s, s.id == string(input.source_snapshot))) > 0)", error: BlobNotFound, message: "The specified blob does not exist." }
    let:
      srcrec: "src_found ? (('source_snapshot' in input && input.source_snapshot != null) ? src.snapshots.filter(s, s.id == string(input.source_snapshot))[0] : src) : {}"
      smeta: "('metadata' in input && input.metadata != null) ? input.metadata : (('metadata' in srcrec && srcrec.metadata != null) ? srcrec.metadata : {})"
    effects:
      # The src read resolved this resource's id to the source blob; without
      # an explicit key the put would carry that key and overwrite the source.
      - put:
          resource: blob
          key: "string(input.blob)"
          record:
            container: "lower(string(input.container))"
            name: "string(input.blob)"
            value: "string(srcrec.value)"
            metadata: smeta
            content_type: "('content_type' in srcrec && srcrec.content_type != null) ? string(srcrec.content_type) : ''"
            cache_control: "('cache_control' in srcrec && srcrec.cache_control != null) ? string(srcrec.cache_control) : ''"
            content_encoding: "('content_encoding' in srcrec && srcrec.content_encoding != null) ? string(srcrec.content_encoding) : ''"
            content_language: "('content_language' in srcrec && srcrec.content_language != null) ? string(srcrec.content_language) : ''"
            content_disposition: "('content_disposition' in srcrec && srcrec.content_disposition != null) ? string(srcrec.content_disposition) : ''"
            content_md5: "('content_md5' in srcrec && srcrec.content_md5 != null) ? string(srcrec.content_md5) : ''"
            blob_type: "('blob_type' in srcrec && srcrec.blob_type != null) ? string(srcrec.blob_type) : 'BlockBlob'"
            sequence_number: "('sequence_number' in srcrec && srcrec.sequence_number != null) ? string(srcrec.sequence_number) : '0'"
            append_count: "'0'"
    output:
      copy_id: "md5hex(string(input.copy_source) + '|' + string(input.blob))"
      copy_status: "'success'"
      content_md5: "('content_md5' in srcrec && srcrec.content_md5 != null) ? string(srcrec.content_md5) : ''"

  CopyBlobFromURL:
    reads:
      ctr: { resource: container }
      src: { resource: blob, key: "('source_blob' in input && input.source_blob != null) ? string(input.source_blob) : ''" }
    require:
      - { cond: ctr_found, error: ContainerNotFound, message: "The specified container does not exist." }
      - { cond: "!('source_invalid' in input && input.source_invalid == true)", error: InvalidHeaderValue, message: "The value for one of the HTTP headers is not in the correct format." }
      - { cond: src_found, error: BlobNotFound, message: "The specified blob does not exist." }
      - { cond: "!('source_snapshot' in input && input.source_snapshot != null) || ('snapshots' in src && src.snapshots != null && size(src.snapshots.filter(s, s.id == string(input.source_snapshot))) > 0)", error: BlobNotFound, message: "The specified blob does not exist." }
    let:
      srcrec: "src_found ? (('source_snapshot' in input && input.source_snapshot != null) ? src.snapshots.filter(s, s.id == string(input.source_snapshot))[0] : src) : {}"
      smeta: "('metadata' in input && input.metadata != null) ? input.metadata : (('metadata' in srcrec && srcrec.metadata != null) ? srcrec.metadata : {})"
    effects:
      # The src read resolved this resource's id to the source blob; without
      # an explicit key the put would carry that key and overwrite the source.
      - put:
          resource: blob
          key: "string(input.blob)"
          record:
            container: "lower(string(input.container))"
            name: "string(input.blob)"
            value: "string(srcrec.value)"
            metadata: smeta
            content_type: "('content_type' in srcrec && srcrec.content_type != null) ? string(srcrec.content_type) : ''"
            cache_control: "('cache_control' in srcrec && srcrec.cache_control != null) ? string(srcrec.cache_control) : ''"
            content_encoding: "('content_encoding' in srcrec && srcrec.content_encoding != null) ? string(srcrec.content_encoding) : ''"
            content_language: "('content_language' in srcrec && srcrec.content_language != null) ? string(srcrec.content_language) : ''"
            content_disposition: "('content_disposition' in srcrec && srcrec.content_disposition != null) ? string(srcrec.content_disposition) : ''"
            content_md5: "('content_md5' in srcrec && srcrec.content_md5 != null) ? string(srcrec.content_md5) : ''"
            blob_type: "('blob_type' in srcrec && srcrec.blob_type != null) ? string(srcrec.blob_type) : 'BlockBlob'"
            sequence_number: "('sequence_number' in srcrec && srcrec.sequence_number != null) ? string(srcrec.sequence_number) : '0'"
            append_count: "'0'"
    output:
      copy_id: "md5hex(string(input.copy_source) + '|' + string(input.blob))"
      copy_status: "'success'"
      content_md5: "('content_md5' in srcrec && srcrec.content_md5 != null) ? string(srcrec.content_md5) : ''"

  AbortCopy:
    reads:
      ctr: { resource: container }
    require:
      - { cond: ctr_found, error: ContainerNotFound, message: "The specified container does not exist." }
      # Copies complete synchronously here, so there is never a pending copy
      # to abort -- Azurite answers the same 409 in that case.
      - { cond: "false", error: NoPendingCopyOperation, message: "There is currently no pending copy operation." }

  StageBlockFromURL:
    reads:
      ctr: { resource: container }
      src: { resource: blob, key: "('source_blob' in input && input.source_blob != null) ? string(input.source_blob) : ''" }
    require:
      - { cond: ctr_found, error: ContainerNotFound, message: "The specified container does not exist." }
      - { cond: "!('source_invalid' in input && input.source_invalid == true)", error: InvalidHeaderValue, message: "The value for one of the HTTP headers is not in the correct format." }
      - { cond: src_found, error: BlobNotFound, message: "The specified blob does not exist." }
    effects:
      - put: { resource: blob_slot }
      - put:
          resource: block
          record:
            id: id
            value: "('source_range_start' in input) ? substr(string(src.value), int(input.source_range_start), int(input.source_range_end) + 1) : string(src.value)"
    output:
      container: "lower(string(input.container))"
      name: "string(input.blob)"

  GetBlobProperties:
    reads:
      ctr: { resource: container }
      rec: { resource: blob }
    require:
      - { cond: ctr_found, error: ContainerNotFound, message: "The specified container does not exist." }
      - { cond: rec_found, error: BlobNotFound, message: "The specified blob does not exist." }
      - { cond: "!('snapshot' in input && input.snapshot != null) || ('snapshots' in rec && rec.snapshots != null && size(rec.snapshots.filter(s, s.id == string(input.snapshot))) > 0)", error: BlobNotFound, message: "The specified blob does not exist." }
    let:
      src: "rec_found ? (('snapshot' in input && input.snapshot != null) ? rec.snapshots.filter(s, s.id == string(input.snapshot))[0] : rec) : {}"
    output:
      metadata: "('metadata' in src && src.metadata != null) ? src.metadata : {}"
      content_type: "('content_type' in src && src.content_type != null) ? string(src.content_type) : ''"
      cache_control: "('cache_control' in src && src.cache_control != null) ? string(src.cache_control) : ''"
      content_encoding: "('content_encoding' in src && src.content_encoding != null) ? string(src.content_encoding) : ''"
      content_language: "('content_language' in src && src.content_language != null) ? string(src.content_language) : ''"
      content_disposition: "('content_disposition' in src && src.content_disposition != null) ? string(src.content_disposition) : ''"
      content_md5: "('content_md5' in src && src.content_md5 != null) ? string(src.content_md5) : ''"
      blob_type: "('blob_type' in src && src.blob_type != null && string(src.blob_type) != '') ? string(src.blob_type) : 'BlockBlob'"
      content_length: "string(blen(string(src.value)))"
      sequence_number: "('sequence_number' in src && src.sequence_number != null) ? string(src.sequence_number) : ''"

  SetBlobMetadata:
    reads:
      ctr: { resource: container }
      rec: { resource: blob }
    require:
      - { cond: ctr_found, error: ContainerNotFound, message: "The specified container does not exist." }
      - { cond: rec_found, error: BlobNotFound, message: "The specified blob does not exist." }
    effects:
      - patch:
          resource: blob
          record:
            metadata: "('metadata' in input && input.metadata != null) ? input.metadata : {}"
    output:
      metadata: "('metadata' in input && input.metadata != null) ? input.metadata : {}"

  GetBlobMetadata:
    reads:
      ctr: { resource: container }
      rec: { resource: blob }
    require:
      - { cond: ctr_found, error: ContainerNotFound, message: "The specified container does not exist." }
      - { cond: rec_found, error: BlobNotFound, message: "The specified blob does not exist." }
    output:
      metadata: "('metadata' in rec && rec.metadata != null) ? rec.metadata : {}"

  SetBlobProperties:
    reads:
      ctr: { resource: container }
      rec: { resource: blob }
    require:
      - { cond: ctr_found, error: ContainerNotFound, message: "The specified container does not exist." }
      - { cond: rec_found, error: BlobNotFound, message: "The specified blob does not exist." }
    effects:
      - patch:
          resource: blob
          record:
            content_type: "('content_type' in input && input.content_type != null) ? string(input.content_type) : ''"
            cache_control: "('cache_control' in input && input.cache_control != null) ? string(input.cache_control) : ''"
            content_encoding: "('content_encoding' in input && input.content_encoding != null) ? string(input.content_encoding) : ''"
            content_language: "('content_language' in input && input.content_language != null) ? string(input.content_language) : ''"
            content_disposition: "('content_disposition' in input && input.content_disposition != null) ? string(input.content_disposition) : ''"
            content_md5: "('content_md5' in input && input.content_md5 != null) ? string(input.content_md5) : ''"
    output:
      content_type: "('content_type' in input && input.content_type != null) ? string(input.content_type) : ''"
      cache_control: "('cache_control' in input && input.cache_control != null) ? string(input.cache_control) : ''"
      content_encoding: "('content_encoding' in input && input.content_encoding != null) ? string(input.content_encoding) : ''"
      content_language: "('content_language' in input && input.content_language != null) ? string(input.content_language) : ''"
      content_disposition: "('content_disposition' in input && input.content_disposition != null) ? string(input.content_disposition) : ''"
      content_md5: "('content_md5' in input && input.content_md5 != null) ? string(input.content_md5) : ''"

  CreatePageBlob:
    reads:
      ctr: { resource: container }
      existing: { resource: blob }
    require:
      - { cond: ctr_found, error: ContainerNotFound, message: "The specified container does not exist." }
      - { cond: "!existing_found", error: BlobAlreadyExists, message: "The specified blob already exists." }
      - { cond: "'content_length' in input && input.content_length != null", error: InvalidHeaderValue, message: "The value for one of the HTTP headers is not in the correct format." }
      - { cond: "int(input.content_length) % 512 == 0", error: InvalidHeaderValue, message: "The value for one of the HTTP headers is not in the correct format." }
    effects:
      - put:
          resource: blob
          record:
            container: "lower(string(input.container))"
            name: "string(input.blob)"
            value: "zeros(int(input.content_length))"
            metadata: "('metadata' in input && input.metadata != null) ? input.metadata : {}"
            content_type: "('content_type' in input && input.content_type != null) ? string(input.content_type) : ''"
            cache_control: ''
            content_encoding: ''
            content_language: ''
            content_disposition: ''
            content_md5: ''
            blob_type: "'PageBlob'"
            sequence_number: "('sequence_number' in input && input.sequence_number != null) ? string(int(input.sequence_number)) : '0'"
    output:
      container: "lower(string(input.container))"
      name: "string(input.blob)"

  PutPage:
    reads:
      ctr: { resource: container }
      rec: { resource: blob }
    require:
      - { cond: ctr_found, error: ContainerNotFound, message: "The specified container does not exist." }
      - { cond: rec_found, error: BlobNotFound, message: "The specified blob does not exist." }
      - { cond: "string(rec.blob_type) == 'PageBlob'", error: InvalidBlobType, message: "The blob type is invalid for this operation." }
      - { cond: "'page_write' in input && string(input.page_write) == 'update'", error: InvalidHeaderValue, message: "The value for one of the HTTP headers is not in the correct format." }
      - { cond: "'range_start' in input", error: InvalidHeaderValue, message: "The value for one of the HTTP headers is not in the correct format." }
      - { cond: "int(input.range_start) % 512 == 0 && (int(input.range_end) + 1) % 512 == 0", error: InvalidHeaderValue, message: "The value for one of the HTTP headers is not in the correct format." }
      - { cond: "int(input.range_end) < blen(string(rec.value))", error: RequestedRangeNotSatisfiable, message: "The range specified is invalid for the current size of the resource." }
      - { cond: "blen(('body' in input && input.body != null) ? string(input.body) : '') == int(input.range_end) - int(input.range_start) + 1", error: InvalidHeaderValue, message: "The value for one of the HTTP headers is not in the correct format." }
    effects:
      - patch:
          resource: blob
          record:
            value: "substr(string(rec.value), 0, int(input.range_start)) + (('body' in input && input.body != null) ? string(input.body) : '') + substr(string(rec.value), int(input.range_end) + 1, blen(string(rec.value)))"
    output:
      container: "lower(string(input.container))"
      name: "string(input.blob)"

  ClearPages:
    reads:
      ctr: { resource: container }
      rec: { resource: blob }
    require:
      - { cond: ctr_found, error: ContainerNotFound, message: "The specified container does not exist." }
      - { cond: rec_found, error: BlobNotFound, message: "The specified blob does not exist." }
      - { cond: "string(rec.blob_type) == 'PageBlob'", error: InvalidBlobType, message: "The blob type is invalid for this operation." }
      - { cond: "'range_start' in input", error: InvalidHeaderValue, message: "The value for one of the HTTP headers is not in the correct format." }
      - { cond: "int(input.range_start) % 512 == 0 && (int(input.range_end) + 1) % 512 == 0", error: InvalidHeaderValue, message: "The value for one of the HTTP headers is not in the correct format." }
      - { cond: "int(input.range_end) < blen(string(rec.value))", error: RequestedRangeNotSatisfiable, message: "The range specified is invalid for the current size of the resource." }
    effects:
      - patch:
          resource: blob
          record:
            value: "substr(string(rec.value), 0, int(input.range_start)) + zeros(int(input.range_end) - int(input.range_start) + 1) + substr(string(rec.value), int(input.range_end) + 1, blen(string(rec.value)))"
    output:
      container: "lower(string(input.container))"
      name: "string(input.blob)"

  GetPageRanges:
    reads:
      ctr: { resource: container }
      rec: { resource: blob }
    require:
      - { cond: ctr_found, error: ContainerNotFound, message: "The specified container does not exist." }
      - { cond: rec_found, error: BlobNotFound, message: "The specified blob does not exist." }
      - { cond: "string(rec.blob_type) == 'PageBlob'", error: InvalidBlobType, message: "The blob type is invalid for this operation." }
      - { cond: "!('range_start' in input) || int(input.range_start) < blen(string(rec.value))", error: RequestedRangeNotSatisfiable, message: "The range specified is invalid for the current size of the resource." }
    let:
      npages: "blen(string(rec.value)) / 512"
      starts: "series(npages).filter(i, substr(string(rec.value), i * 512, i * 512 + 512) != zeros(512) && (i == 0 || substr(string(rec.value), (i - 1) * 512, i * 512) == zeros(512)))"
      ends: "series(npages).filter(i, substr(string(rec.value), i * 512, i * 512 + 512) != zeros(512) && (i + 1 == npages || substr(string(rec.value), (i + 1) * 512, (i + 2) * 512) == zeros(512)))"
      all: "series(size(starts)).map(j, {'start': starts[j] * 512, 'end': ends[j] * 512 + 511})"
    output:
      ranges: "('range_start' in input) ? all.filter(r, r.end >= int(input.range_start) && r.start <= int(input.range_end)).map(r, {'start': r.start > int(input.range_start) ? r.start : int(input.range_start), 'end': r.end < int(input.range_end) ? r.end : int(input.range_end)}) : all"

  ResizePageBlob:
    reads:
      ctr: { resource: container }
      rec: { resource: blob }
    require:
      - { cond: ctr_found, error: ContainerNotFound, message: "The specified container does not exist." }
      - { cond: rec_found, error: BlobNotFound, message: "The specified blob does not exist." }
      - { cond: "string(rec.blob_type) == 'PageBlob'", error: InvalidBlobType, message: "The blob type is invalid for this operation." }
      - { cond: "'content_length' in input && input.content_length != null", error: InvalidHeaderValue, message: "The value for one of the HTTP headers is not in the correct format." }
      - { cond: "int(input.content_length) % 512 == 0", error: InvalidHeaderValue, message: "The value for one of the HTTP headers is not in the correct format." }
    effects:
      - patch:
          resource: blob
          record:
            value: "int(input.content_length) > blen(string(rec.value)) ? string(rec.value) + zeros(int(input.content_length) - blen(string(rec.value))) : substr(string(rec.value), 0, int(input.content_length))"
    output:
      container: "lower(string(input.container))"
      name: "string(input.blob)"

  SetBlobSequenceNumber:
    reads:
      ctr: { resource: container }
      rec: { resource: blob }
    require:
      - { cond: ctr_found, error: ContainerNotFound, message: "The specified container does not exist." }
      - { cond: rec_found, error: BlobNotFound, message: "The specified blob does not exist." }
      - { cond: "string(rec.blob_type) == 'PageBlob'", error: InvalidBlobType, message: "The blob type is invalid for this operation." }
      - { cond: "'sequence_number_action' in input && ['update', 'max', 'increment'].exists(a, a == string(input.sequence_number_action))", error: InvalidHeaderValue, message: "The value for one of the HTTP headers is not in the correct format." }
      - { cond: "string(input.sequence_number_action) == 'increment' || 'sequence_number' in input", error: InvalidHeaderValue, message: "The value for one of the HTTP headers is not in the correct format." }
    let:
      cur: "('sequence_number' in rec && rec.sequence_number != null) ? int(rec.sequence_number) : 0"
      next: "string(input.sequence_number_action) == 'increment' ? cur + 1 : (string(input.sequence_number_action) == 'max' ? (cur > int(input.sequence_number) ? cur : int(input.sequence_number)) : int(input.sequence_number))"
    effects:
      - patch:
          resource: blob
          record:
            sequence_number: "string(next)"
    output:
      sequence_number: "string(next)"

  ListBlobs:
    reads:
      ctr: { resource: container }
    require:
      - { cond: ctr_found, error: ContainerNotFound, message: "The specified container does not exist." }
    list: { resource: blob, member: _list }

  DeleteBlob:
    reads:
      ctr: { resource: container }
      rec: { resource: blob }
    require:
      - { cond: ctr_found, error: ContainerNotFound, message: "The specified container does not exist." }
      - { cond: rec_found, error: BlobNotFound, message: "The specified blob does not exist." }
      - { cond: "!('snapshot' in input && input.snapshot != null) || ('snapshots' in rec && rec.snapshots != null && size(rec.snapshots.filter(s, s.id == string(input.snapshot))) > 0)", error: BlobNotFound, message: "The specified blob does not exist." }
      - { cond: "('snapshot' in input && input.snapshot != null) || !('snapshots' in rec && rec.snapshots != null && size(rec.snapshots) > 0) || ('delete_snapshots' in input && input.delete_snapshots != null)", error: SnapshotsPresent, message: "The blob has one or more snapshots. Specify the x-ms-delete-snapshots header." }
    effects:
      # Deleting one snapshot removes it from the base record.
      - patch:
          when: "('snapshot' in input && input.snapshot != null)"
          resource: blob
          record:
            snapshots: "rec.snapshots.filter(s, s.id != string(input.snapshot))"
      # x-ms-delete-snapshots: only drops the snapshots, keeps the base.
      - patch:
          when: "!('snapshot' in input && input.snapshot != null) && 'delete_snapshots' in input && string(input.delete_snapshots) == 'only'"
          resource: blob
          record:
            snapshots: "[]"
      # A base delete (with or without include) removes the record outright.
      - delete:
          when: "!('snapshot' in input && input.snapshot != null) && !('delete_snapshots' in input && string(input.delete_snapshots) == 'only')"
          resource: blob

  PutBlock:
    reads:
      ctr: { resource: container }
    require:
      - { cond: ctr_found, error: ContainerNotFound, message: "The specified container does not exist." }
      - { cond: "'blockid' in input && string(input.blockid) != ''", error: InvalidResourceName, message: "The specified block id is invalid." }
    effects:
      - put: { resource: blob_slot }
      - put: { resource: block }

  PutBlockList:
    reads:
      ctr: { resource: container }
      slot: { resource: blob_slot }
    require:
      - { cond: ctr_found, error: ContainerNotFound, message: "The specified container does not exist." }
      - { cond: "'blob' in input && string(input.blob) != ''", error: InvalidResourceName, message: "The specified blob name is invalid." }
      - { cond: "'blockids' in input && input.blockids.all(id, staged.exists(b, string(b.id) == string(id)))", error: InvalidBlockList, message: "The specified block list is invalid." }
    select: { binding: staged, resource: block }
    effects:
      - put:
          resource: blob
          record:
            container: "lower(string(input.container))"
            name: "string(input.blob)"
            value: "join(input.blockids.map(id, string(staged.filter(b, string(b.id) == string(id))[0].value)), '')"
            blob_type: "'BlockBlob'"
    output:
      container: "lower(string(input.container))"
      name: "string(input.blob)"

  UnsupportedQuery:
    require:
      - { cond: "false", error: InvalidQueryParameterValue, message: "The value for one of the query parameters specified in the request URI is invalid." }

  SetContainerMetadata:
    reads:
      rec: { resource: container }
    require:
      - { cond: rec_found, error: ContainerNotFound, message: "The specified container does not exist." }
    effects:
      - patch:
          resource: container
          record:
            metadata: "('metadata' in input && input.metadata != null) ? input.metadata : {}"
    output:
      name: rec.name
      metadata: "('metadata' in input && input.metadata != null) ? input.metadata : {}"

  GetContainerMetadata:
    reads:
      rec: { resource: container }
    require:
      - { cond: rec_found, error: ContainerNotFound, message: "The specified container does not exist." }
    output:
      name: rec.name
      metadata: "('metadata' in rec && rec.metadata != null) ? rec.metadata : {}"

  SetContainerAcl:
    reads:
      rec: { resource: container }
    require:
      - { cond: rec_found, error: ContainerNotFound, message: "The specified container does not exist." }
    effects:
      - patch:
          resource: container
          record:
            acl: "('acl' in input && input.acl != null) ? string(input.acl) : (('body' in input && input.body != null) ? string(input.body) : '')"
            public_access: "('public_access' in input && input.public_access != null) ? string(input.public_access) : ''"
    output:
      name: rec.name
      public_access: "('public_access' in input && input.public_access != null) ? string(input.public_access) : ''"

  GetContainerAcl:
    reads:
      rec: { resource: container }
    require:
      - { cond: rec_found, error: ContainerNotFound, message: "The specified container does not exist." }
    output:
      acl: "('acl' in rec && rec.acl != null && string(rec.acl) != '') ? string(rec.acl) : '<?xml version=\"1.0\" encoding=\"utf-8\"?><SignedIdentifiers></SignedIdentifiers>'"
      public_access: "('public_access' in rec && rec.public_access != null) ? string(rec.public_access) : ''"

  AcquireContainerLease:
    reads:
      rec: { resource: container }
    require:
      - { cond: rec_found, error: ContainerNotFound, message: "The specified container does not exist." }
      - { cond: "!('lease_status' in rec && string(rec.lease_status) == 'locked')", error: LeaseAlreadyPresent, message: "There is already a lease present." }
    effects:
      - generate: { bind: leaseid, kind: hex, bytes: 16 }
      - patch:
          resource: container
          record:
            lease_id: "('proposed_lease_id' in input && string(input.proposed_lease_id) != '') ? string(input.proposed_lease_id) : fx.leaseid"
            lease_status: "'locked'"
            lease_state: "'leased'"
            lease_duration: "('lease_duration' in input && string(input.lease_duration) == '-1') ? 'infinite' : 'fixed'"
    output:
      lease_id: "('proposed_lease_id' in input && string(input.proposed_lease_id) != '') ? string(input.proposed_lease_id) : fx.leaseid"
      lease_status: "'locked'"
      lease_state: "'leased'"
      lease_duration: "('lease_duration' in input && string(input.lease_duration) == '-1') ? 'infinite' : 'fixed'"

  ReleaseContainerLease:
    reads:
      rec: { resource: container }
    require:
      - { cond: rec_found, error: ContainerNotFound, message: "The specified container does not exist." }
      - { cond: "'lease_id' in rec && string(rec.lease_id) == string(input.lease_id)", error: LeaseIdMismatchWithLeaseOperation, message: "The lease ID specified did not match the lease ID for the container." }
    effects:
      - patch:
          resource: container
          record:
            lease_id: "''"
            lease_status: "'unlocked'"
            lease_state: "'available'"
            lease_duration: "''"
    output:
      lease_status: "'unlocked'"
      lease_state: "'available'"

  RenewContainerLease:
    reads:
      rec: { resource: container }
    require:
      - { cond: rec_found, error: ContainerNotFound, message: "The specified container does not exist." }
      - { cond: "'lease_id' in rec && string(rec.lease_id) == string(input.lease_id)", error: LeaseIdMismatchWithLeaseOperation, message: "The lease ID specified did not match the lease ID for the container." }
    effects:
      - patch:
          resource: container
          record:
            lease_status: "'locked'"
            lease_state: "'leased'"
    output:
      lease_id: "string(rec.lease_id)"
      lease_status: "'locked'"
      lease_state: "'leased'"

  BreakContainerLease:
    reads:
      rec: { resource: container }
    require:
      - { cond: rec_found, error: ContainerNotFound, message: "The specified container does not exist." }
    effects:
      - patch:
          resource: container
          record:
            lease_id: "''"
            lease_status: "'unlocked'"
            lease_state: "'broken'"
            lease_duration: "''"
    output:
      lease_status: "'unlocked'"
      lease_state: "'broken'"

  GetServiceProperties:
    reads:
      rec: { resource: account }
    output:
      properties: "rec_found && rec.properties != null && string(rec.properties) != '' ? string(rec.properties) : ''"

  SetServiceProperties:
    effects:
      - put: { resource: account }
    output:
      properties: "('body' in input && input.body != null) ? string(input.body) : ''"

  GetServiceStats:
    require:
      - { cond: "'secondary' in input && input.secondary == true", error: InvalidQueryParameterValue, message: "The value for one of the query parameters specified in the request URI is invalid." }
    output:
      geo_status: "'live'"

  GetAccountInfo:
    output:
      account_kind: "'StorageV2'"
      sku_name: "'Standard_RAGRS'"
      hns: "'false'"

  ChangeContainerLease:
    reads:
      rec: { resource: container }
    require:
      - { cond: rec_found, error: ContainerNotFound, message: "The specified container does not exist." }
      - { cond: "'lease_id' in rec && string(rec.lease_id) == string(input.lease_id)", error: LeaseIdMismatchWithLeaseOperation, message: "The lease ID specified did not match the lease ID for the container." }
      - { cond: "'proposed_lease_id' in input && string(input.proposed_lease_id) != ''", error: InvalidResourceName, message: "The proposed lease ID is invalid." }
    effects:
      - patch:
          resource: container
          record:
            lease_id: "string(input.proposed_lease_id)"
            lease_status: "'locked'"
            lease_state: "'leased'"
    output:
      lease_id: "string(input.proposed_lease_id)"
      lease_status: "'locked'"
      lease_state: "'leased'"

  GetBlockList:
    reads:
      ctr: { resource: container }
      slot: { resource: blob_slot }
    require:
      - { cond: ctr_found, error: ContainerNotFound, message: "The specified container does not exist." }
    list: { resource: block, member: _list }

  AppendBlock:
    reads:
      ctr: { resource: container }
      rec: { resource: blob }
    require:
      - { cond: ctr_found, error: ContainerNotFound, message: "The specified container does not exist." }
      - { cond: rec_found, error: BlobNotFound, message: "The specified blob does not exist." }
      - { cond: "string(rec.blob_type) == 'AppendBlob'", error: InvalidBlobType, message: "The blob type is invalid for this operation." }
      - { cond: "'body' in input && input.body != null && blen(string(input.body)) > 0", error: InvalidHeaderValue, message: "The value for one of the HTTP headers is not in the correct format." }
      - { cond: "blen(string(input.body)) <= 4194304", error: RequestBodyTooLarge, message: "The request body is too large and exceeds the maximum permissible limit." }
      - { cond: "!('append_count' in rec && rec.append_count != null) || int(rec.append_count) < 50000", error: BlockCountExceedsLimit, message: "The committed block count has exceeded the maximum permissible limit." }
    let:
      offset: "rec_found ? blen(string(rec.value)) : 0"
      count: "rec_found ? ((('append_count' in rec && rec.append_count != null) ? int(rec.append_count) : 0) + 1) : 0"
    effects:
      - patch:
          resource: blob
          record:
            value: "string(rec.value) + string(input.body)"
            append_count: "string(count)"
    output:
      append_offset: "string(offset)"
      committed_block_count: "string(count)"

  CreateAppendBlob:
    reads:
      ctr: { resource: container }
    require:
      - { cond: ctr_found, error: ContainerNotFound, message: "The specified container does not exist." }
    effects:
      - put:
          resource: blob
          record:
            container: "lower(string(input.container))"
            name: "string(input.blob)"
            value: "''"
            metadata: "('metadata' in input && input.metadata != null) ? input.metadata : {}"
            content_type: "('content_type' in input && input.content_type != null) ? string(input.content_type) : ''"
            cache_control: "('cache_control' in input && input.cache_control != null) ? string(input.cache_control) : ''"
            content_encoding: "('content_encoding' in input && input.content_encoding != null) ? string(input.content_encoding) : ''"
            content_language: "('content_language' in input && input.content_language != null) ? string(input.content_language) : ''"
            content_disposition: "('content_disposition' in input && input.content_disposition != null) ? string(input.content_disposition) : ''"
            content_md5: "('content_md5' in input && input.content_md5 != null) ? string(input.content_md5) : ''"
            blob_type: "'AppendBlob'"
            append_count: "'0'"
    output:
      container: "lower(string(input.container))"
      name: "string(input.blob)"
