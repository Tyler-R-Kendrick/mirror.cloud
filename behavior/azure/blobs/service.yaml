      content_length: "string(blen(string(src.value)))"
      sequence_number: "('sequence_number' in src && src.sequence_number != null) ? string(src.sequence_number) : ''"
      tag_count: "string(size(('tags' in src && src.tags != null) ? src.tags : {}))"
      access_tier: "('access_tier' in src && src.access_tier != null && string(src.access_tier) != '') ? string(src.access_tier) : 'Hot'"
      access_tier_inferred: "('access_tier' in src && src.access_tier != null && string(src.access_tier) != '') ? 'false' : 'true'"
      lease_status: "('lease_status' in src && src.lease_status != null && string(src.lease_status) != '') ? string(src.lease_status) : 'unlocked'"
      lease_state: "('lease_state' in src && src.lease_state != null && string(src.lease_state) != '') ? string(src.lease_state) : 'available'"
