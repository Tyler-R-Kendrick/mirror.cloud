      - { cond: "rec_found || !('if_none_match_list' in input && size(input.if_none_match_list) > 0 && string(input.if_none_match_list[0]) == '*')", error: UnsatisfiableCondition, message: "The condition specified using HTTP conditional header(s) cannot be satisfied." }
      - { cond: rec_found, error: BlobNotFound, message: "The specified blob does not exist." }
      - { cond: "!('snapshot' in input && input.snapshot != null) || ('snapshots' in rec && rec.snapshots != null && size(rec.snapshots.filter(s, s.id == string(input.snapshot))) > 0)", error: BlobNotFound, message: "The specified blob does not exist." }
