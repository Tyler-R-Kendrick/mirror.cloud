      - { cond: "!('if_none_match_list' in input && input.if_none_match_list.exists(m, string(m) == etag)) || (('if_modified_since_unix' in input) && int(input.if_modified_since_unix) < last_mod)", error: NotModified, message: "The condition specified using HTTP conditional header(s) is not met." }
      - { cond: "!('if_modified_since_unix' in input) || int(input.if_modified_since_unix) < last_mod || (('if_none_match_list' in input && size(input.if_none_match_list) > 0) && !input.if_none_match_list.exists(m, string(m) == etag))", error: NotModified, message: "The condition specified using HTTP conditional header(s) is not met." }
      - { cond: "!('if_tags_invalid' in input && input.if_tags_invalid == true)", error: InvalidHeaderValue, message: "The value for one of the HTTP headers is not in the correct format." }
      - { cond: "!('if_tags' in input && input.if_tags != null && string(input.if_tags) != '') || tagmatch(string(input.if_tags), ('tags' in src && src.tags != null) ? src.tags : {}, ('container' in src && src.container != null) ? string(src.container) : lower(string(input.container)))", error: ConditionNotMet, message: "The condition specified using HTTP conditional header(s) is not met." }
