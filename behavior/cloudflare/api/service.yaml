quirks:
  - operation: WorkersKvNamespaceCreateANamespace
    note: >
      The envelope moved from Go into the model. The pack answered a bare
      {id, title, supports_url_encoding} and a branch of the REST/JSON codec
      wrapped every Cloudflare answer in {success, errors, messages, result}.
      The document declares that envelope as each operation's response shape,
      so the bundle projects it and the codec branch is gone. Nothing on the
      wire changes; what changes is where the shape is written down.

      `jurisdiction` is accepted by the document at creation time and ignored
      here, exactly as the pack ignored it. A namespace created with
      jurisdiction: eu is stored with no jurisdiction and answers without one,
      so a client that sets it and reads it back sees it disappear.
  - operation: WorkersKvNamespaceGetANamespace
    note: >
      A request that omits namespace_id entirely now fails the engine's model
      check with 10007 / 400, where the pack answered 10013 / 404 for it: the
      document marks the label required, and the engine checks required members
      before any rule here runs. A request that carries an empty namespace_id
      still reaches the rule and still answers 10013 / 404, which is what a
      request over HTTP produces -- an absent label cannot be expressed in a
      URL that routed to this operation at all.
  - operation: WorkersKvNamespaceReadKeyValuePair
    note: >
      A key containing a slash must be percent-encoded, where the pack accepted
      a literal one. The pack routed by joining every path segment after
      `values/` into the key, so `values/a/b` addressed the key `a/b`; routing
      is the model's now, `{key_name}` binds exactly one segment, and `a/b`
      matches no operation. The document says so in the member's own
      documentation -- "use percent-encoding to define key names as part of a
      URL" -- so this follows the document and breaks a client that relied on
      the pack being lax.

      The body is answered as application/octet-stream, where the pack answered
      text/plain. The document declares the former; neither is in the model, so
      the codec states one for every `_raw` operation rather than per provider.
  - operation: WorkersKvNamespaceRemoveANamespace
    note: >-
      Deleting a namespace deletes its keys with it. The keys live in a
      collection named for the namespace id, so nothing else could reach them,
      but a namespace later created reusing the id would have inherited them,
      and the real API does not do that. The pack could not delete a namespace
      at all, so the cascade is new surface rather than a transcribed defect.
  - operation: WorkersKvNamespaceListNamespaces
    note: >-
      Unpaginated: page, per_page and total_count describe a single page
      holding every namespace, whatever the request asked for. The pack ignored
      those parameters too. `direction` and `order` are ignored as well, so the
      listing is in store order rather than by title.
  - operation: "WorkersKvNamespaceListANamespace'SKeys"
    note: >-
      New surface: the pack served no key listing. `prefix` filters by key-name
      prefix. `limit` and `cursor` are accepted and ignored -- the generated
      model declares no pagination trait for this operation, so the engine has
      no input token to bind -- and the cursor answered in result_info is
      always empty, so a client that pages on it stops after one page and sees
      every matching key. Expiration and metadata are answered when the key
      carries them.
  - operation: WorkersKvNamespaceWriteKeyValuePairWithMetadata
    note: >-
      expiration and expiration_ttl are honored: absolute wins over relative
      when both are present, an expired key reads and lists as missing under
      the engine's controlled clock, and a key with neither never expires. The
      multipart form of the request body is parsed: `value` becomes the stored
      bytes and `metadata` is stored beside them (capped at Cloudflare's
      published 1024-byte key-metadata limit), so a multipart write no longer
      stores the MIME envelope. A multipart body that does not parse is
      refused with a 400 rather than stored.
  - operation: WorkersKvNamespaceRenameANamespace
    note: >
      New surface: the pack served no rename. Renaming to the namespace's own
      title is allowed and is a no-op; renaming to a title another namespace
      holds is 10014, which is the code a colliding create answers.
