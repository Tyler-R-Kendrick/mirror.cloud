schema: bir/1
service: cloudflare.api

# Extracted from internal/services/cloudflare/api (201 lines of Go), which
# served six operations under the service id `cloudflare.kv`. The model this
# bundle is served from is generated out of Cloudflare's own document, so the
# served id is now `cloudflare.api` -- the id the document produces -- and
# every operation has the document's name. The recording carries both.
#
# Every cell is `authored`: transcribed from that pack, not established against
# the real Workers KV API. Where the document contradicts the pack the document
# wins, and each of those is stated per operation and in `quirks`.
provenance: authored

# The pack answered a missing title with code 10007 / 400 before looking at
# anything else. The document marks title, namespace_id, key_name and
# account_id required, so the engine's model check now runs first -- and it has
# to fail with Cloudflare's name for that failure rather than the
# ValidationException default.
missing_input_error: InvalidInput

resources:
  namespace:
    collection: cfkvns
    id:
      # Sixteen hex characters, which is what the pack drew and well inside
      # the 32 workers-kv_namespace_identifier allows.
      generate: { kind: hex, bytes: 16 }
      input_members: [namespace_id]
    record:
      id: id
      title: "string(input.title)"
      # The document describes this as "true if keys written on the URL will be
      # URL-decoded before storing". Answered true because the router
      # percent-decodes a path label before it reaches the engine, so a key
      # written as `a%2Fb` is stored as `a/b` -- which is the behavior the
      # member advertises.
      supports_url_encoding: "true"

  # Titles are unique per account, and the pack enforced that with a second row
  # in the namespace collection keyed `title:<title>`, skipped when listing. It
  # is a separate collection here: uniqueness is a lookup by the title, a
  # listing should not have to know which of its rows are really an index, and
  # a namespace whose title begins with `title:` was indistinguishable from one
  # in the pack's layout.
  namespace_title:
    collection: cfkvtitle
    id:
      # Total: the expression is evaluated wherever the resource is addressed,
      # and a request carrying no title must yield an empty key rather than an
      # evaluation error. The type check matters: reads of this resource run
      # before the operation's own requires, so a wrong-typed title (a list,
      # a number) reaches here first -- and string([]) is a CEL error, which
      # the engine answers as a 500. A non-string yields '' so the write path
      # never stores an index row for it and the rule answers 10007.
      derive: "('title' in input && input.title != null && type(input.title) == string) ? string(input.title) : ''"

  entry:
    # Parent-scoped: each namespace's keys are their own collection, named for
    # the namespace, exactly as the pack's `cfkv:<namespace_id>` was.
    collection: "cfkv:{namespace.id}"
    parent: namespace
    id:
      input_members: [key_name]
    record:
      name: id
      # `body` is what the document calls the request payload, and the REST
      # codec binds it from the raw bytes because the member's shape is a
      # union of a string and a blob. The pack read `value`, which was its own
      # codec branch's name for the same bytes.
      #
      # The base64 envelope: raw bytes are not valid record material. A record
      # is marshalled to JSON for the store, and an arbitrary byte sequence is
      # not valid UTF-8, so storing it as a Go string corrupts it on read
      # (encoding/json replaces invalid bytes with U+FFFD). b64() of the body
      # is pure ASCII and round-trips exactly; the read path decodes it back.
      value: "('body' in input && input.body != null) ? b64(string(input.body)) : ''"
      # Expiration, straight from the query members the document declares.
      # Absolute `expiration` wins over relative `expiration_ttl` when both
      # are present, matching the real API. Without either, the key never
      # expires and the member stays 0 rather than null: CEL's ternary needs
      # one result type, and 0 is already in the past for no real clock, so
      # the expiry checks test > 0 first and a 0 reads as "no deadline".
      expiration: "('expiration' in input && input.expiration != null) ? int(input.expiration) : ((('expiration_ttl' in input && input.expiration_ttl != null) ? int(now_ms / 1000) : 0) + (('expiration_ttl' in input && input.expiration_ttl != null) ? int(input.expiration_ttl) : 0))"
      # Metadata arrives only in the multipart form of the request body (the
      # document declares no metadata member on the write request), so the
      # codec splits the envelope and lands the metadata part here as
      # `__multipart_metadata`. Absent on a plain value write, and stored as
      # the part's exact text rather than a parsed structure: the read path
      # answers it as JSON, and the Cloudflare limits page caps key metadata
      # at 1024 bytes, which the write require enforces below.
      metadata: "('__multipart_metadata' in input && input.__multipart_metadata != null) ? string(input.__multipart_metadata) : ''"

errors:
  # Cloudflare's codes are integers on the wire; the fault encoder converts a
  # numeric code back to a number when it writes the envelope.
  InvalidInput:
    code: "10007"
    http: 400
    fault: client
  NamespaceNotFound:
    code: "10013"
    http: 404
    fault: client
  KeyNotFound:
    code: "10009"
    http: 404
    fault: client
  NamespaceTitleTaken:
    code: "10014"
    # 400, not 409: this is the status the pack answered and the one the real
    # API answers. Cloudflare carries the distinction in the code, not the
    # status.
    http: 400
    fault: client

operations:
  WorkersKvNamespaceCreateANamespace:
    reads:
      taken: { resource: namespace_title }
    require:
      # `cond` is a precondition: the error fires when it does NOT hold.
      # has() first, because an absent title is a missing key, not a null:
      # string(input.title) on one raises, and a CEL error inside a require
      # becomes InternalFailure 500. Without the guard the "no title" case
      # answered a server error instead of the 10007 it declares.
      #
      # The explicit type check matters too: the engine holds the model's
      # missing-input fault until requires have had their say, so a null or
      # numeric title reaches here. string(null) answers "null" and
      # string(42) answers "42" -- both non-empty, so without the type check
      # a wrong-typed title would create a namespace literally named "null".
      - { cond: "has(input.title) && type(input.title) == string && string(input.title) != ''", error: InvalidInput, message: "Title is required" }
      - { cond: "!taken_found", error: NamespaceTitleTaken, message: "A namespace with this account ID and title already exists" }
    effects:
      # The title index is written before the namespace, and the order matters:
      # every write effect rebinds `rec` and `id`, and the output projects the
      # namespace from `rec`. Reversing these two answers with the index row.
      - put:
          resource: namespace_title
          record:
            title: id
      - create: { resource: namespace }
    output:
      # The envelope is the document's, not the codec's. Every Cloudflare v4
      # response carries {success, errors, messages, result}, and the response
      # shape declares all four -- so the bundle projects them, where the pack
      # had a branch of the REST/JSON codec synthesize them around a bare body.
      success: "true"
      errors: "[]"
      messages: "[]"
      result: rec

  WorkersKvNamespaceListNamespaces:
    list: { resource: namespace, member: result }
    output:
      success: "true"
      errors: "[]"
      messages: "[]"
      # Unpaginated -- see the quirk. Every namespace is on page one, whatever
      # `page` and `per_page` the request asked for; per_page is answered as
      # Cloudflare's documented default rather than as the count, so a client
      # reading it to size its next request sees a real page size.
      result_info: "{'count': double(size(items)), 'page': 1.0, 'per_page': 20.0, 'total_count': double(size(items))}"

  WorkersKvNamespaceGetANamespace:
    reads:
      ns: { resource: namespace }
    require:
      - { cond: ns_found, error: NamespaceNotFound, message: "Namespace not found" }
    output:
      success: "true"
      errors: "[]"
      messages: "[]"
      result: ns

  WorkersKvNamespaceRenameANamespace:
    reads:
      ns: { resource: namespace }
      taken: { resource: namespace_title }
    require:
      - { cond: ns_found, error: NamespaceNotFound, message: "Namespace not found" }
      # has() first for the same reason the create rule has it, plus the type
      # check: the rename request carries no title on some paths and a null on
      # others, and string() of either is a CEL error or a wrong answer.
      - { cond: "has(input.title) && type(input.title) == string && string(input.title) != ''", error: InvalidInput, message: "Title is required" }
      # Renaming a namespace to the title it already has is not a collision
      # with itself.
      - { cond: "!taken_found || string(ns.title) == string(input.title)", error: NamespaceTitleTaken, message: "A namespace with this account ID and title already exists" }
    effects:
      # The old title is freed first and the new one claimed second; `id` in a
      # write's record is that resource's own key, so the put here writes the
      # title the request named, not the one just deleted. The patch is last so
      # `rec` is the updated namespace the output projects.
      - delete: { resource: namespace_title, key: "string(ns.title)" }
      - put:
          resource: namespace_title
          record:
            title: id
      - patch:
          resource: namespace
          record:
            title: "string(input.title)"
    output:
      success: "true"
      errors: "[]"
      messages: "[]"
      result: rec

  WorkersKvNamespaceRemoveANamespace:
    reads:
      ns: { resource: namespace }
    require:
      - { cond: ns_found, error: NamespaceNotFound, message: "Namespace not found" }
    effects:
      - delete: { resource: namespace }
      # Keyed off the stored record, not the request: a delete addresses the
      # namespace by id and never carries its title.
      - delete: { resource: namespace_title, key: "string(ns.title)" }
      # The keys live in their own collection named for the namespace id.
      # Deleting the namespace must delete them too, or a later namespace
      # reusing the id would inherit them. `where: 'true'` drops every row in
      # that collection -- and only that collection, because the resource's
      # collection template resolves the id already bound by the read above.
      - delete: { resource: entry, where: "true" }
    output:
      success: "true"
      errors: "[]"
      messages: "[]"
      # The document declares `result` an object with no members, so an empty
      # one is what it can hold. The real API answers null here.
      result: "{}"

  WorkersKvNamespaceWriteKeyValuePairWithMetadata:
    reads:
      ns: { resource: namespace }
    require:
      # Precedence is the pack's: an unknown namespace fails before the key is
      # looked at, so writing to a namespace that does not exist is 10013 and
      # never 10007.
      - { cond: ns_found, error: NamespaceNotFound, message: "Namespace not found" }
      - { cond: "string(input.key_name) != ''", error: InvalidInput, message: "Key is required" }
      # Key metadata is capped at 1024 bytes (Cloudflare's published KV
      # limits). blen counts bytes, not runes, so a multi-byte value cannot
      # slip past by character count. Only multipart writes carry metadata;
      # a plain write never trips this.
      - { cond: "!('__multipart_metadata' in input && input.__multipart_metadata != null && blen(string(input.__multipart_metadata)) > 1024)", error: InvalidInput, message: "metadata must be 1024 bytes or less" }
    effects:
      - put: { resource: entry }
    output:
      success: "true"
      errors: "[]"
      messages: "[]"
      result: "{}"

  WorkersKvNamespaceReadKeyValuePair:
    reads:
      ns: { resource: namespace }
      entry: { resource: entry }
    require:
      - { cond: ns_found, error: NamespaceNotFound, message: "Namespace not found" }
      - { cond: entry_found, error: KeyNotFound, message: "key not found" }
      # An expired key is a missing key: the real API answers 404 once the
      # deadline has passed. now_ms is the engine's controlled clock, so a
      # test can step past the deadline and watch the key vanish. Stored 0
      # means no deadline (see the write path), never "already expired".
      - { cond: "!('expiration' in entry && entry.expiration != null && double(entry.expiration) > 0.0 && double(entry.expiration) <= double(now_ms / 1000))", error: KeyNotFound, message: "key not found" }
    output:
      # `_raw` is bir.TopLevelRaw: the body is the stored value itself, with no
      # envelope around it. The document answers this operation as
      # application/octet-stream, which is the one Cloudflare operation here
      # that is not enveloped, and the only reason the convention exists.
      # The base64 envelope from the write path is decoded back here.
      _raw: "b64decode(string(entry.value))"

  WorkersKvNamespaceDeleteKeyValuePair:
    reads:
      ns: { resource: namespace }
      entry: { resource: entry }
    require:
      - { cond: ns_found, error: NamespaceNotFound, message: "Namespace not found" }
      - { cond: entry_found, error: KeyNotFound, message: "key not found" }
      - { cond: "!('expiration' in entry && entry.expiration != null && double(entry.expiration) > 0.0 && double(entry.expiration) <= double(now_ms / 1000))", error: KeyNotFound, message: "key not found" }
    effects:
      - delete: { resource: entry }
    output:
      success: "true"
      errors: "[]"
      messages: "[]"
      result: "{}"

  WorkersKvNamespaceReadTheMetadataForAKey:
    # New surface: the pack served no metadata read, so this operation was
    # answered by the deterministic mock. It reads the same entry the write
    # stores metadata beside, which makes it the direct proof that a
    # multipart write separated value from metadata rather than storing the
    # envelope: the value reads back through ReadKeyValuePair, the metadata
    # here.
    reads:
      ns: { resource: namespace }
      entry: { resource: entry }
    require:
      - { cond: ns_found, error: NamespaceNotFound, message: "Namespace not found" }
      - { cond: entry_found, error: KeyNotFound, message: "key not found" }
      # An expired key's metadata is as gone as its value: same deadline
      # test as the value read, same 10009.
      - { cond: "!('expiration' in entry && entry.expiration != null && double(entry.expiration) > 0.0 && double(entry.expiration) <= double(now_ms / 1000))", error: KeyNotFound, message: "key not found" }
    output:
      success: "true"
      errors: "[]"
      messages: "[]"
      # The stored metadata is the part's exact text; parseJSON turns it
      # into the structure the document's `any`-shaped result holds. A key
      # written without a metadata part has none, and the document's result
      # member is optional, so the answer is null and omit_null keeps it off
      # the wire rather than sending an empty string a client would have to
      # distinguish from real metadata.
      result: "('metadata' in entry && entry.metadata != null && string(entry.metadata) != '') ? parseJSON(string(entry.metadata)) : null"
    omit_null: [result]

  "WorkersKvNamespaceListANamespace'SKeys":
    reads:
      ns: { resource: namespace }
    require:
      - { cond: ns_found, error: NamespaceNotFound, message: "Namespace not found" }
    # Prefix narrows to one key-name prefix at store level; the expiration
    # filter drops dead keys per candidate (a deadline is record state, not a
    # key prefix, so it cannot be a store prefix).
    list:
      resource: entry
      member: result
      prefix: "('prefix' in input && input.prefix != null) ? string(input.prefix) : ''"
      filter: "!('expiration' in item && item.expiration != null && double(item.expiration) > 0.0 && double(item.expiration) <= double(now_ms / 1000))"
    output:
      success: "true"
      errors: "[]"
      messages: "[]"
      # The stored record carries the value as well as the name, and a key
      # listing must not answer with it: the projection replaces the list the
      # `list` spec placed in `result` with one key object per entry, which is
      # what workers-kv_key declares. Expiration rides along when the key has
      # one (positive deadline), and is omitted for keys that never expire.
      # Metadata rides when the write carried a multipart metadata part; it is
      # stored as the part's exact text and answered as-is here (the shape
      # declares metadata as arbitrary JSON, and a JSON-looking string is
      # what the API accepts). parseJSON turns it into the structure a client
      # expects; a non-JSON metadata part (which Cloudflare's API would have
      # rejected) parses to null rather than a string a client cannot read.
      result: "items.map(i, merge(merge({'name': string(i.name)}, (('expiration' in i && i.expiration != null && double(i.expiration) > 0.0) ? {'expiration': i.expiration} : {})), (('metadata' in i && i.metadata != null && string(i.metadata) != '') ? {'metadata': parseJSON(string(i.metadata))} : {})))"
      result_info: "{'count': double(size(items)), 'cursor': ''}"

quirks:
  - operation: WorkersKvNamespaceCreateANamespace
    note: >
      The envelope moved from Go into the model. The pack answered a bare
      {id, title, supports_url_encoding} and a branch of the REST/JSON codec
      wrapped every Cloudflare answer in {success, errors, messages, result}.
      The document declares that envelope as each operation's response shape,
      so the bundle projects it and the codec branch is gone. Nothing on the
      wire changes; what changes is where the shape is written down.

      `jurisdiction` is accepted by the document at creation time and ignored
      here, exactly as the pack ignored it. A namespace created with
      jurisdiction: eu is stored with no jurisdiction and answers without one,
      so a client that sets it and reads it back sees it disappear.
  - operation: WorkersKvNamespaceGetANamespace
    note: >
      A request that omits namespace_id entirely now fails the engine's model
      check with 10007 / 400, where the pack answered 10013 / 404 for it: the
      document marks the label required, and the engine checks required members
      before any rule here runs. A request that carries an empty namespace_id
      still reaches the rule and still answers 10013 / 404, which is what a
      request over HTTP produces -- an absent label cannot be expressed in a
      URL that routed to this operation at all.
  - operation: WorkersKvNamespaceReadKeyValuePair
    note: >
      A key containing a slash must be percent-encoded, where the pack accepted
      a literal one. The pack routed by joining every path segment after
      `values/` into the key, so `values/a/b` addressed the key `a/b`; routing
      is the model's now, `{key_name}` binds exactly one segment, and `a/b`
      matches no operation. The document says so in the member's own
      documentation -- "use percent-encoding to define key names as part of a
      URL" -- so this follows the document and breaks a client that relied on
      the pack being lax.

      The body is answered as application/octet-stream, where the pack answered
      text/plain. The document declares the former; neither is in the model, so
      the codec states one for every `_raw` operation rather than per provider.
  - operation: WorkersKvNamespaceRemoveANamespace
    note: >-
      Deleting a namespace deletes its keys with it. The keys live in a
      collection named for the namespace id, so nothing else could reach them,
      but a namespace later created reusing the id would have inherited them,
      and the real API does not do that. The pack could not delete a namespace
      at all, so the cascade is new surface rather than a transcribed defect.
  - operation: WorkersKvNamespaceListNamespaces
    note: >-
      Unpaginated: page, per_page and total_count describe a single page
      holding every namespace, whatever the request asked for. The pack ignored
      those parameters too. `direction` and `order` are ignored as well, so the
      listing is in store order rather than by title.
  - operation: "WorkersKvNamespaceListANamespace'SKeys"
    note: >-
      New surface: the pack served no key listing. `prefix` filters by key-name
      prefix. `limit` and `cursor` are accepted and ignored -- the generated
      model declares no pagination trait for this operation, so the engine has
      no input token to bind -- and the cursor answered in result_info is
      always empty, so a client that pages on it stops after one page and sees
      every matching key. Expiration and metadata are answered when the key
      carries them.
  - operation: WorkersKvNamespaceWriteKeyValuePairWithMetadata
    note: >-
      expiration and expiration_ttl are honored: absolute wins over relative
      when both are present, an expired key reads and lists as missing under
      the engine's controlled clock, and a key with neither never expires. The
      multipart form of the request body is parsed: `value` becomes the stored
      bytes and `metadata` is stored beside them (capped at Cloudflare's
      published 1024-byte key-metadata limit), so a multipart write no longer
      stores the MIME envelope. A multipart body that does not parse is
      refused with a 400 rather than stored.
  - operation: WorkersKvNamespaceRenameANamespace
    note: >
      New surface: the pack served no rename. Renaming to the namespace's own
      title is allowed and is a no-op; renaming to a title another namespace
      holds is 10014, which is the code a colliding create answers.
