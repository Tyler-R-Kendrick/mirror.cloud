schema: bir/1
service: hostinger.api

# Extracted from internal/services/hostinger/api (332 lines of Go). Every cell
# is `authored` -- transcribed from that pack, not established against the real
# Hostinger API -- except where the generated model says otherwise, which is
# noted per operation and in `quirks` below.
provenance: authored

resources:
  domain:
    collection: hsdom
    id:
      # The domain is the identity, case-folded. Hostinger domains are DNS
      # names and DNS names are case-insensitive, so `Example.COM` and
      # `example.com` must be one record; the pack called strings.ToLower on
      # every path into the store and this is that, once.
      derive: "lower(input.domain)"
    record:
      domain: id
      status: "'active'"

  order:
    collection: hsorder
    # Purchasing is a billing operation in the specification and answers with
    # an order, so an order is a record here even though the pack had none.
    id:
      generate: { kind: int }
    record:
      id: id
      status: "'completed'"

  zone:
    collection: hszone
    # The DNS records for a domain, stored under the same key. It is a
    # separate collection rather than a member of the domain record because
    # the pack kept it that way, and the two are written independently:
    # DeleteDNSRecords empties the zone and leaves the domain.
    id:
      derive: "lower(input.domain)"

errors:
  ValidationFailed:
    code: validation_error
    http: 422
    fault: client
  Conflict:
    code: conflict
    http: 409
    fault: client
  NotFound:
    code: not_found
    http: 404
    fault: client

operations:
  # The six operations the pack served, under the names the specification
  # gives them. The pack invented its own -- CreateDomain, GetDNSRecords --
  # and bound them to the same URIs, so no request changes shape; only the
  # operation a request resolves to is now the one the document declares.
  DomainsPurchaseNewDomainV1:
    reads:
      existing: { resource: domain }
    require:
      - { cond: "lower(input.domain) == ''", error: ValidationFailed, message: "Domain is required" }
      - { cond: existing_found, error: Conflict, message: "Domain already exists" }
    effects:
      - create: { resource: domain }
      # A domain always has a zone, so GetDNSRecords on a fresh domain answers
      # with an empty list rather than a miss.
      - put:
          resource: zone
          record:
            _list: "[]"
      # Created last, and the order matters: every write effect rebinds `id`,
      # so the `id` the output projects is whichever resource was written most
      # recently. Reordering these three silently changes the response to the
      # domain name. Written down because an implicit last-write-wins is the
      # kind of thing a later edit breaks without noticing.
      - create: { resource: order }
    output:
      id: id
      status: "'completed'"

  DomainsGetDomainListV1:
    list: { resource: domain, member: _list }

  DomainsGetDomainDetailsV1:
    reads:
      rec: { resource: domain }
    require:
      - { cond: "!rec_found", error: NotFound, message: "Domain not found" }
    output:
      domain: rec.domain
      status: rec.status

  DNSGetDNSRecordsV1:
    reads:
      dom: { resource: domain }
      zone: { resource: zone }
    require:
      - { cond: "!dom_found", error: NotFound, message: "Domain not found" }
    output:
      # An absent zone reads as empty, which is what the pack answered when a
      # domain existed but its zone record had been removed.
      _list: "zone_found ? zone._list : []"

  DNSUpdateDNSRecordsV1:
    reads:
      dom: { resource: domain }
      zone: { resource: zone }
    require:
      - { cond: "!dom_found", error: NotFound, message: "Domain not found" }
      - { cond: "!has(input.zone)", error: ValidationFailed, message: "zone is required" }
    effects:
      - put:
          resource: zone
          record:
            # Append unless the caller asked to replace. The pack read the
            # stored zone, concatenated, and wrote back; the read is already
            # bound above, so this is the same operation as one expression.
            _list: "(has(input.overwrite) && input.overwrite) ? input.zone : (zone_found ? zone._list : []) + input.zone"
    output:
      message: "'Request accepted'"

  DNSDeleteDNSRecordsV1:
    reads:
      dom: { resource: domain }
    require:
      - { cond: "!dom_found", error: NotFound, message: "Domain not found" }
    effects:
      # The zone is emptied, not dropped: the pack wrote an empty list back so
      # a later read answers [] rather than falling to the absent-zone path.
      - put:
          resource: zone
          record:
            _list: "[]"
    output:
      message: "'Request accepted'"

quirks:
  - operation: DomainsPurchaseNewDomainV1
    note: >
      The specification declares this as a billing operation: it requires
      item_id and a payment method and answers with an order, not a domain.
      The pack invented a create that takes only a domain and answers with
      {domain, status}. The model is `declared` evidence and outranks the
      pack's `authored`, so item_id is now required -- a client that really
      talks to Hostinger already sends it -- and the response is now an order
      rather than the pack's {domain, status}.

      Only `id` and `status` are filled. The shape also declares currency,
      subtotal, total, billing_address and subscription_id, and every one of
      those is a billing fact this emulator has no evidence for; inventing a
      currency and a total would read as recorded behaviour rather than as the
      guess it would be. A corpus recording is what fills them.
  - operation: DNSDeleteDNSRecordsV1
    note: >
      The specification requires `filters`, naming which records to remove;
      the pack emptied the whole zone and required nothing. Requiring it is
      the model winning over the pack, but honouring it is not implemented:
      the zone is still emptied whatever the filters say. A caller that sends
      filters expecting a partial delete gets more deleted than it asked for,
      which is why this is recorded rather than left to be discovered.
