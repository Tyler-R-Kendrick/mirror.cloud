schema: bir/1
service: vercel.api

# A project's environment variables: set, listed, edited, removed.
#
# The variable is the document's: type plain, encrypted, sensitive, secret or
# system; a target list; an optional git branch; a comment. What the API shows of
# its value depends on the type, and that rule is the one thing here a client
# would otherwise get wrong:
#
#   plain, secret   the value as it was set.
#   encrypted       an opaque string, unless the request asks to decrypt
#                   (?decrypt=true) or addresses the one variable by id.
#   sensitive       never shown: the answer carries "". Its value is not even
#                   stored -- only its SHA-256, so a persisted snapshot holds no
#                   secret and a duplicate check still has something to compare.
#
# The record is the stored variable; `shown` is the view of it an answer carries,
# defined once, so a listing, a create, an edit and a get cannot disagree about
# what a variable looks like.

resources:
  # Parent-scoped: each project's variables are their own collection, as the
  # pack's `<project id>/<env id>` key prefix was.
  env:
    collection: "venv:{project.id}"
    parent: project
    key: id
    id:
      generate: { kind: hex, bytes: 10 }
      input_members: [id]
    record:
      # The identifier is the generated key with a prefix. Every writer states
      # the rest of the variable itself.
      id: "'env_' + id"
    views:
      shown: >
        merge(merge({
          'id': rec.id, 'key': rec.key, 'type': rec.type,
          'value': rec.type == 'sensitive' ? ''
            : ((rec.type == 'encrypted' && !(('id' in input && input.id != null) || ('decrypt' in input && string(input.decrypt) == 'true')))
               ? b64('{"v":"mirror","h":"' + rec.digest + '"}') : rec.value),
          'target': rec.target,
          'createdAt': rec.createdAt, 'updatedAt': rec.updatedAt,
          'createdBy': rec.createdBy, 'updatedBy': rec.updatedBy,
          'configurationId': null, 'securityIssues': [],
          'comment': rec.comment, 'customEnvironmentIds': rec.customEnvironmentIds
        }, rec.gitBranch != '' ? {'gitBranch': rec.gitBranch} : {}),
           (rec.type == 'encrypted' && (('id' in input && input.id != null) || ('decrypt' in input && string(input.decrypt) == 'true')))
             ? {'decrypted': true} : {})

operations:
  FilterProjectEnvs:
    reads: &project_reads
      # Two reads, in this order, because reads resolve in dependency order and
      # `by_name` sorts first: the index answers whether `idOrName` is a name, and
      # the project read prefers what it found over the raw input.
      by_name: { resource: project_name }
      proj:
        resource: project
        key: >
          by_name_found ? string(by_name.project)
            : (('idOrName' in input && input.idOrName != null) ? string(input.idOrName) : '')
    require:
      - { cond: proj_found, error: NotFound, message: "Project not found" }
    list:
      resource: env
      member: envs
      # A branch asks for the variables set for it, and for those set for no
      # branch in particular.
      filter: >
        !('gitBranch' in input && input.gitBranch != null && string(input.gitBranch) != '')
          || item.gitBranch == '' || item.gitBranch == string(input.gitBranch)
    output:
      envs: "sortBy(items, 'seq', false).map(i, i.shown)"
      pagination: "{'count': size(items), 'next': null, 'prev': null}"

  CreateProjectEnv:
    reads: *project_reads
    let:
      userId: "'usr_' + (identity.project != '' ? identity.project : identity.account)"
      upsert: "'upsert' in input && input.upsert != null && string(input.upsert) == 'true'"
      # The body is one variable or an array of them (the codec puts an array
      # under `body`). Either way it is a list of variables from here on, with
      # the defaults a variable has when a request leaves them out: encrypted,
      # and every target.
      bulk: "'body' in input && input.body != null"
      entries: >
        (bulk ? input.body : [input]).map(x, {
          'key': ('key' in x && x.key != null) ? string(x.key) : '',
          'type': ('type' in x && x.type != null) ? string(x.type) : 'encrypted',
          'value': ('value' in x && x.value != null) ? string(x.value) : '',
          'target': ('target' in x && x.target != null) ? (type(x.target) == list ? x.target : [x.target])
            : ((('customEnvironmentIds' in x) && x.customEnvironmentIds != null && size(x.customEnvironmentIds) > 0)
               ? [] : ['production', 'preview', 'development']),
          'gitBranch': ('gitBranch' in x && x.gitBranch != null) ? string(x.gitBranch) : '',
          'comment': ('comment' in x && x.comment != null) ? string(x.comment) : '',
          'customEnvironmentIds': ('customEnvironmentIds' in x && x.customEnvironmentIds != null) ? x.customEnvironmentIds : []
        })
      # Which of the requested variables already exist, and which of them stand
      # against an earlier one in the same request. A variable exists for a key,
      # a target and a git branch, and two that share all three are one.
      taken: >
        indices(entries).filter(i,
          existing.exists(c, c.key == entries[i].key && c.gitBranch == entries[i].gitBranch
            && c.target.exists(t, entries[i].target.exists(u, u == t)))
          || indices(entries).exists(j, j < i && entries[j].key == entries[i].key && entries[j].gitBranch == entries[i].gitBranch
            && entries[j].target.exists(t, entries[i].target.exists(u, u == t))))
      fresh: "indices(entries).filter(i, !(i in taken)).map(i, entries[i])"
      # With ?upsert=true a taken variable is updated rather than refused.
      updates: >
        taken.filter(i, existing.exists(c, c.key == entries[i].key && c.gitBranch == entries[i].gitBranch
            && c.target.exists(t, entries[i].target.exists(u, u == t)))).map(i,
          merge(entries[i], {'id': existing.filter(c, c.key == entries[i].key && c.gitBranch == entries[i].gitBranch
            && c.target.exists(t, entries[i].target.exists(u, u == t)))[0].id}))
    select:
      binding: existing
      resource: env
      filter: "('body' in input && input.body != null ? input.body : [input]).exists(x, 'key' in x && x.key != null && string(x.key) == item.key)"
    require:
      - { cond: proj_found, error: NotFound, message: "Project not found" }
      - { cond: "entries.all(x, x.key != '')", error: BadRequest, message: "Env key is required" }
      - { cond: "entries.all(x, x.type in ['system', 'encrypted', 'plain', 'sensitive', 'secret'])", error: BadRequest, message: "Invalid environment variable type" }
      - { cond: "entries.all(x, x.target.all(t, t in ['production', 'preview', 'development']))", error: BadRequest, message: "Invalid target environment" }
      - { cond: "entries.all(x, x.gitBranch == '' || x.target == ['preview'])", error: BadRequest, message: "A git branch applies to the preview target only" }
      - { cond: "entries.all(x, x.type != 'sensitive' || !('development' in x.target))", error: BadRequest, message: "Sensitive variables cannot target development" }
      # A single variable that exists is the CLI's cue to ask whether to
      # overwrite; a batch reports the ones that did not go through in `failed`.
      - cond: "bulk || upsert || size(taken) == 0"
        error: EnvConflict
        message_expr: "'A variable with the name `' + entries[0].key + '` already exists for the target(s) `' + join(entries[0].target, ',') + '`'"
        fields:
          envVarKey: "entries[0].key"
          target: "entries[0].target"
    effects:
      - counter: { name: "venvbatch" }
      - create:
          resource: env
          for_each: fresh
          record:
            id: "'env_' + id"
            key: "item.key"
            type: "item.type"
            # A sensitive value is never kept; its digest is, which is also what
            # the opaque form of an encrypted one is made from.
            value: "item.type == 'sensitive' ? '' : item.value"
            digest: "sha256hex(item.key + ':' + item.value)"
            target: "item.target"
            gitBranch: "item.gitBranch"
            comment: "item.comment"
            customEnvironmentIds: "item.customEnvironmentIds"
            createdAt: "now_ms"
            updatedAt: "now_ms"
            createdBy: "userId"
            updatedBy: "userId"
            seq: { counter: "venv" }
            batch: "fx.counter"
      - patch:
          resource: env
          for_each: "upsert ? updates : []"
          key: "item.id"
          record:
            type: "item.type"
            value: "item.type == 'sensitive' ? '' : item.value"
            digest: "sha256hex(item.key + ':' + item.value)"
            target: "item.target"
            comment: "item.comment"
            updatedAt: "now_ms"
            updatedBy: "userId"
            batch: "fx.counter"
    list:
      # What this request made or moved, found by the stamp it left.
      resource: env
      member: created
      filter: "item.batch == fx.counter"
    output:
      created: "bulk ? sortBy(items, 'seq', false).map(i, i.shown) : (size(items) > 0 ? items[0].shown : null)"
      failed: >
        (bulk && !upsert)
          ? taken.map(i, {'error': {'code': 'ENV_CONFLICT', 'envVarKey': entries[i].key, 'target': entries[i].target,
              'message': 'A variable with the name `' + entries[i].key + '` already exists for the target(s) `' + join(entries[i].target, ',') + '`'}})
          : []

  GetProjectEnv:
    reads:
      by_name: { resource: project_name }
      proj:
        resource: project
        key: >
          by_name_found ? string(by_name.project)
            : (('idOrName' in input && input.idOrName != null) ? string(input.idOrName) : '')
      rec: { resource: env }
    require:
      - { cond: proj_found, error: NotFound, message: "Project not found" }
      - { cond: rec_found, error: NotFound, message: "Environment variable not found" }
    output: &env
      id: rec.shown.id
      key: rec.shown.key
      type: rec.shown.type
      value: rec.shown.value
      target: rec.shown.target
      createdAt: rec.shown.createdAt
      updatedAt: rec.shown.updatedAt
      createdBy: rec.shown.createdBy
      updatedBy: rec.shown.updatedBy
      configurationId: rec.shown.configurationId
      comment: rec.shown.comment
      customEnvironmentIds: rec.shown.customEnvironmentIds
      gitBranch: "'gitBranch' in rec.shown ? rec.shown.gitBranch : null"
      decrypted: "'decrypted' in rec.shown ? rec.shown.decrypted : null"
    omit_null: [gitBranch, decrypted]

  EditProjectEnv:
    reads:
      by_name: { resource: project_name }
      proj:
        resource: project
        key: >
          by_name_found ? string(by_name.project)
            : (('idOrName' in input && input.idOrName != null) ? string(input.idOrName) : '')
      variable: { resource: env }
    let:
      userId: "'usr_' + (identity.project != '' ? identity.project : identity.account)"
      newKey: "('key' in input && input.key != null) ? string(input.key) : string(variable.key)"
      newTarget: "('target' in input && input.target != null) ? (type(input.target) == list ? input.target : [input.target]) : variable.target"
      newBranch: "('gitBranch' in input) ? (input.gitBranch == null ? '' : string(input.gitBranch)) : variable.gitBranch"
      newType: "('type' in input && input.type != null) ? string(input.type) : string(variable.type)"
      newValue: "('value' in input && input.value != null) ? string(input.value) : (variable.type == 'sensitive' ? '' : string(variable.value))"
    # The other variables this edit would collide with.
    select:
      binding: others
      resource: env
      filter: >
        item.id != variable.id && item.key == newKey && item.gitBranch == newBranch
          && item.target.exists(t, newTarget.exists(u, u == t))
    require:
      - { cond: proj_found, error: NotFound, message: "Project not found" }
      - { cond: variable_found, error: NotFound, message: "Environment variable not found" }
      - { cond: "newKey != ''", error: BadRequest, message: "Env key is required" }
      - { cond: "newType in ['system', 'encrypted', 'plain', 'sensitive', 'secret']", error: BadRequest, message: "Invalid environment variable type" }
      - { cond: "newTarget.all(t, t in ['production', 'preview', 'development'])", error: BadRequest, message: "Invalid target environment" }
      - { cond: "newBranch == '' || newTarget == ['preview']", error: BadRequest, message: "A git branch applies to the preview target only" }
      - cond: "size(others) == 0"
        error: EnvConflict
        message_expr: "'A variable with the name `' + newKey + '` already exists for the target(s) `' + join(newTarget, ',') + '`'"
        fields:
          envVarKey: "newKey"
          target: "newTarget"
    effects:
      - patch:
          resource: env
          key: "string(variable.id)"
          record:
            id: id
            key: "newKey"
            type: "newType"
            value: "newType == 'sensitive' ? '' : newValue"
            digest: "sha256hex(newKey + ':' + newValue)"
            target: "newTarget"
            gitBranch: "newBranch"
            comment: "('comment' in input && input.comment != null) ? string(input.comment) : variable.comment"
            customEnvironmentIds: "('customEnvironmentIds' in input && input.customEnvironmentIds != null) ? input.customEnvironmentIds : variable.customEnvironmentIds"
            updatedAt: "now_ms"
            updatedBy: "userId"
    list:
      # The edited variable as it stands now, read back so it passes through the
      # same `shown` view as every other answer. A listing has to name an output
      # member for its items; the answer below is built from them, not from it.
      resource: env
      member: id
      filter: "item.id == string(variable.id)"
    output:
      id: items[0].shown.id
      key: items[0].shown.key
      type: items[0].shown.type
      value: items[0].shown.value
      target: items[0].shown.target
      createdAt: items[0].shown.createdAt
      updatedAt: items[0].shown.updatedAt
      createdBy: items[0].shown.createdBy
      updatedBy: items[0].shown.updatedBy
      configurationId: items[0].shown.configurationId
      comment: items[0].shown.comment
      customEnvironmentIds: items[0].shown.customEnvironmentIds
      gitBranch: "'gitBranch' in items[0].shown ? items[0].shown.gitBranch : null"
      decrypted: "'decrypted' in items[0].shown ? items[0].shown.decrypted : null"
    omit_null: [gitBranch, decrypted]

  RemoveProjectEnv:
    reads:
      by_name: { resource: project_name }
      proj:
        resource: project
        key: >
          by_name_found ? string(by_name.project)
            : (('idOrName' in input && input.idOrName != null) ? string(input.idOrName) : '')
      rec: { resource: env }
    require:
      - { cond: proj_found, error: NotFound, message: "Project not found" }
      - { cond: rec_found, error: NotFound, message: "Environment variable not found" }
    effects:
      - delete: { resource: env, key: "string(rec.id)" }
    # The answer is the variable that was removed.
    output: *env
    omit_null: [gitBranch, decrypted]

  BatchRemoveProjectEnv:
    reads: *project_reads
    select:
      binding: doomed
      resource: env
      filter: "'ids' in input && input.ids != null && input.ids.exists(i, i == item.id)"
    require:
      - { cond: proj_found, error: NotFound, message: "Project not found" }
      - { cond: "'ids' in input && input.ids != null && size(input.ids) > 0", error: BadRequest, message: "ids is required" }
    effects:
      - delete:
          resource: env
          where: "input.ids.exists(i, i == item.id)"
    output:
      deleted: "size(doomed)"
      ids: "doomed.map(d, d.id)"
