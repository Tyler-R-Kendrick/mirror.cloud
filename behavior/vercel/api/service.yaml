schema: bir/1
service: vercel.api

# Extracted from the REST half of internal/services/vercel/api (304 of its 342
# lines of Go). The other 38 served Vercel KV, which is a different product on
# a different host and is now behavior/vercel/kv.
#
# Every cell is `authored`: transcribed from that pack, not established against
# the real Vercel API. Where the document contradicts the pack the document
# wins, and each of those is stated per operation and in `quirks`.
provenance: authored

# The pack answered a missing name with `bad_request` / 400. The document marks
# the path labels required and the engine's model check runs before any rule
# here, so that failure has to carry Vercel's name for it rather than the
# ValidationException default.
missing_input_error: BadRequest

resources:
  custom_environment:
    collection: "vcenv:{project.id}"
    parent: project
    # Keyed on the record's id, as the project is: the document gives the id
    # an env_ prefix, so the record member rather than the raw draw is the
    # store key.
    key: id
    id:
      # No `generate`, for the project's reason: the create draws the id as an
      # effect because the slug index write needs the same one. Addressed by
      # id directly or by slug through custom_environment_slug, the two
      # spellings of the path label `environmentSlugOrId`.
      input_members: [environmentSlugOrId]
    record:
      # Input-independent for the project's reason: UpdateCustomEnvironment
      # patches this resource. `slug`, `description` and `branchMatcher` live
      # on the create effect, whose request is the one that carries them.
      id: "'env_' + id"
      # The document declares the enum and nothing to set it from: a custom
      # environment is preview-shaped (it exists to match branches), which is
      # a judgment call and is recorded in `quirks`.
      type: "'preview'"
      createdAt: "int(now) * 1000"
      updatedAt: "int(now) * 1000"

  # Slugs are unique per project, the same shape of constraint as project
  # names, so the same shape of index: a separate collection rather than a
  # prefixed row the listing would have to know about.
  custom_environment_slug:
    collection: "vcenvslug:{project.id}"
    parent: project
    id:
      # Total, for the project_name reason: a request carrying neither member
      # must yield an empty key rather than an evaluation error. The label
      # first, because get/update/remove name the environment that way and a
      # create names it `slug`.
      derive: >
        ('environmentSlugOrId' in input && input.environmentSlugOrId != null) ? string(input.environmentSlugOrId)
          : (('slug' in input && input.slug != null) ? string(input.slug) : '')

  # An API key's id and its token are both minted at create; the token is the
  # secret answer, the id is how a delete addresses the row.
  api_key:
    collection: vapikey
    id:
      derive: "''"

  # The local OAuth flow's two stores: codes the callback issues and the token
  # exchange consumes exactly once, and the tokens it issues.
  oauth_code:
    collection: voauthcode
    id:
      derive: "''"

  oauth_token:
    collection: voauthtok
    id:
      derive: "''"

errors:
  BadRequest:
    code: bad_request
    http: 400
    fault: client
  NotFound:
    code: not_found
    http: 404
    fault: client
  Conflict:
    code: conflict
    http: 409
    fault: client
  # A deployment that names files nobody uploaded. The code and the `missing`
  # list in the envelope are what every Vercel client uploads by.
  MissingFiles:
    code: missing_files
    http: 400
    fault: client
  # A variable that already exists for the same key, target and branch. Vercel's
  # CLI reads the code to ask whether to overwrite, and the envelope carries the
  # key and targets it conflicts on.
  EnvConflict:
    code: ENV_CONFLICT
    http: 409
    fault: client
  # Domains. The document names the statuses and not the codes; these are the
  # codes this bundle chose, and the quirks say so.
  InvalidDomain:
    code: invalid_domain
    http: 400
    fault: client
  DomainAlreadyInUse:
    code: domain_already_in_use
    http: 409
    fault: client
  DomainAlreadyExists:
    code: domain_already_exists
    http: 409
    fault: client
  # The document's AssignAlias answers 404 "The domain used for the alias was not
  # found" and names no code. This one is authored: it is the code the CLI itself
  # lists beside invalid_domain for a domain the account cannot use
  # (nextCommandsForDomainsAddFailure), so a client that keys on it finds it.
  DomainNotFound:
    code: domain_not_found
    http: 404
    fault: client
  # `vercel domains add <domain> <project>` posts the older
  # POST /projects/{project}/alias and keys on this code, with the project that
  # holds the host in the envelope (client-observed, vercel 63.1.2).
  AliasDomainExist:
    code: ALIAS_DOMAIN_EXIST
    http: 409
    fault: client
  # The oracle's invite route answers a second 409 under its own code; the
  # generic Conflict stays for project names.
  MemberAlreadyExists:
    code: member_already_exists
    http: 409
    fault: client
  Unauthorized:
    code: unauthorized
    http: 401
    fault: client
  TeamSlugAlreadyExists:
    code: team_slug_already_exists
    http: 409
    fault: client
  InvalidGrant:
    code: invalid_grant
    http: 400
    fault: client
  InvalidClient:
    code: invalid_client
    http: 401
    fault: client

operations:
  # The ones below have no pack behind them: the pack never served them, so
  # there was nothing to transcribe. Each is written from the document alone
  # -- its path, its declared response members, its status -- and keeps to the
  # state the fourteen above establish. Where the document is thin the
  # behavior is minimal and `quirks` says so.

  CreateCustomEnvironment:
    reads:
      by_name: { resource: project_name }
      proj:
        resource: project
        key: >
          by_name_found ? string(by_name.project)
            : (('idOrName' in input && input.idOrName != null) ? string(input.idOrName) : '')
      taken: { resource: custom_environment_slug }
    require:
      - { cond: proj_found, error: NotFound, message: "The requested resource was not found." }
      - { cond: "'slug' in input && input.slug != null && string(input.slug) != ''", error: BadRequest, message: "Environment slug is required" }
      - { cond: "!taken_found", error: Conflict, message: "A custom environment with the same slug already exists." }
    effects:
      # The id is drawn first, because both writes need the same one and
      # neither can borrow it from the other -- the project's two-write
      # pattern. The index is written first because every write rebinds `rec`
      # and the output projects the environment from it.
      - generate: { bind: eid, kind: hex, bytes: 10 }
      - put:
          resource: custom_environment_slug
          record:
            environment: "'env_' + fx.eid"
      - create:
          resource: custom_environment
          key: "'env_' + fx.eid"
          record:
            id: "'env_' + fx.eid"
            slug: "string(input.slug)"
            # Both members are always written, so every record carries them
            # and the listing is uniform; an update's fallback can rely on
            # them being there.
            description: "('description' in input && input.description != null) ? string(input.description) : ''"
            branchMatcher: "('branchMatcher' in input && input.branchMatcher != null) ? input.branchMatcher : null"
    output:
      id: rec.id
      slug: rec.slug
      type: rec.type
      description: rec.description
      branchMatcher: rec.branchMatcher
      createdAt: rec.createdAt
      updatedAt: rec.updatedAt

  GetProjectsByIdOrNameCustomEnvironments:
    reads:
      by_name: { resource: project_name }
      proj:
        resource: project
        key: >
          by_name_found ? string(by_name.project)
            : (('idOrName' in input && input.idOrName != null) ? string(input.idOrName) : '')
    require:
      - { cond: proj_found, error: NotFound, message: "The requested resource was not found." }
    list: { resource: custom_environment, member: environments }
    output:
      # A fixed limit: the document declares the member's shape and no value
      # for it -- see the quirk.
      accountLimit: "{'total': 12}"

  GetCustomEnvironment:
    reads:
      by_name: { resource: project_name }
      proj:
        resource: project
        key: >
          by_name_found ? string(by_name.project)
            : (('idOrName' in input && input.idOrName != null) ? string(input.idOrName) : '')
      # The by_slug-then-environment pair is the project's by_name pattern
      # one level down: `environmentSlugOrId` may be the id or the slug the
      # index holds.
      by_slug: { resource: custom_environment_slug }
      cenv:
        resource: custom_environment
        key: >
          by_slug_found ? string(by_slug.environment)
            : (('environmentSlugOrId' in input && input.environmentSlugOrId != null) ? string(input.environmentSlugOrId) : '')
    require:
      - { cond: proj_found, error: NotFound, message: "The requested resource was not found." }
      - { cond: cenv_found, error: NotFound, message: "The requested resource was not found." }
    output:
      id: cenv.id
      slug: cenv.slug
      type: cenv.type
      description: cenv.description
      branchMatcher: cenv.branchMatcher
      createdAt: cenv.createdAt
      updatedAt: cenv.updatedAt

  UpdateCustomEnvironment:
    reads:
      by_name: { resource: project_name }
      proj:
        resource: project
        key: >
          by_name_found ? string(by_name.project)
            : (('idOrName' in input && input.idOrName != null) ? string(input.idOrName) : '')
      by_slug: { resource: custom_environment_slug }
      cenv:
        resource: custom_environment
        key: >
          by_slug_found ? string(by_slug.environment)
            : (('environmentSlugOrId' in input && input.environmentSlugOrId != null) ? string(input.environmentSlugOrId) : '')
    require:
      - { cond: proj_found, error: NotFound, message: "The requested resource was not found." }
      - { cond: cenv_found, error: NotFound, message: "The requested resource was not found." }
    effects:
      # One patch, both members falling back to what the read found; the
      # create writes both unconditionally, so the fallback keys are always
      # there. `id` is explicit for UpdateProject's reason.
      - patch:
          resource: custom_environment
          # Explicit key: addressed by slug, the write would otherwise
          # re-resolve from `input.environmentSlugOrId` -- the SLUG -- and
          # merge against an empty row, losing every member it does not set.
          key: "string(cenv.id)"
          record:
            id: id
            description: "('description' in input && input.description != null) ? string(input.description) : string(cenv.description)"
            branchMatcher: "('branchMatcher' in input && input.branchMatcher != null) ? input.branchMatcher : cenv.branchMatcher"
    output:
      id: rec.id
      slug: rec.slug
      type: rec.type
      description: rec.description
      branchMatcher: rec.branchMatcher
      createdAt: rec.createdAt
      updatedAt: rec.updatedAt

  RemoveCustomEnvironment:
    reads:
      by_name: { resource: project_name }
      proj:
        resource: project
        key: >
          by_name_found ? string(by_name.project)
            : (('idOrName' in input && input.idOrName != null) ? string(input.idOrName) : '')
      by_slug: { resource: custom_environment_slug }
      cenv:
        resource: custom_environment
        key: >
          by_slug_found ? string(by_slug.environment)
            : (('environmentSlugOrId' in input && input.environmentSlugOrId != null) ? string(input.environmentSlugOrId) : '')
    require:
      - { cond: proj_found, error: NotFound, message: "The requested resource was not found." }
      - { cond: cenv_found, error: NotFound, message: "The requested resource was not found." }
    effects:
      - delete: { resource: custom_environment }
      # Keyed off the stored record, not the request: a remove may address the
      # environment by id and never carry its slug.
      - delete:
          resource: custom_environment_slug
          key: "string(cenv.slug)"
          missing: ignore
    # The document answers the removed environment, so this does too.
    # `deleteUnassignedEnvironmentVariables` is accepted and read by nothing.
    output:
      id: cenv.id
      slug: cenv.slug
      type: cenv.type
      description: cenv.description
      branchMatcher: cenv.branchMatcher
      createdAt: cenv.createdAt
      updatedAt: cenv.updatedAt

  RequestPromote:
    reads:
      # The label is spelled `projectId`, which the name index's derive does
      # not know, so the key is explicit; addressing by name still works
      # through the index, as it does everywhere else here.
      by_name:
        resource: project_name
        key: "('projectId' in input && input.projectId != null) ? string(input.projectId) : ''"
      proj:
        resource: project
        key: >
          by_name_found ? string(by_name.project)
            : (('projectId' in input && input.projectId != null) ? string(input.projectId) : '')
      dep:
        resource: deployment
        key: "('deploymentId' in input && input.deploymentId != null) ? string(input.deploymentId) : ''"
    require:
      - { cond: proj_found, error: NotFound, message: "The requested resource was not found." }
      - { cond: dep_found, error: NotFound, message: "The requested resource was not found." }
    effects:
      - patch:
          resource: project
          key: "string(proj.id)"
          record:
            id: id
            productionDeploymentId: "string(dep.uid)"
    # Empty 201: the document declares no body.

  # The eleven below close the gap against the vendor-authored oracle
  # (vercel-labs/emulate, pinned in specs/vercel/emulate-inventory.json) that
  # the vendored document covers: teams, the deployment sub-resources, file
  # upload registration, promote aliases and protection bypass. Each is
  # written from the document's shapes and the oracle's route behavior; where
  # the two disagree the document wins and `quirks` says so.

  ListPromoteAliases:
    reads:
      # The label is spelled `projectId`, as RequestPromote's is, so the index
      # and the project read carry the same explicit keys.
      by_name:
        resource: project_name
        key: "('projectId' in input && input.projectId != null) ? string(input.projectId) : ''"
      proj:
        resource: project
        key: >
          by_name_found ? string(by_name.project)
            : (('projectId' in input && input.projectId != null) ? string(input.projectId) : '')
    require:
      - { cond: proj_found, error: NotFound, message: "The requested resource was not found." }
    list:
      resource: deployment_alias
      member: aliases
      filter: "item.projectId == string(proj.id)"
    output:
      # PROMOTED when the alias's deployment is the project's production
      # pointer; otherwise PENDING. Promote and rollback set that pointer.
      aliases: >
        items.map(a, {'alias': a.alias, 'id': a.uid,
          'status': (('productionDeploymentId' in proj && proj.productionDeploymentId != null && string(proj.productionDeploymentId) == string(a.deploymentId)) ? 'PROMOTED' : 'PENDING')})
      pagination: "{'count': size(items), 'next': null, 'prev': null}"

  UpdateProjectProtectionBypass:
    reads:
      by_name: { resource: project_name }
      proj:
        resource: project
        key: >
          by_name_found ? string(by_name.project)
            : (('idOrName' in input && input.idOrName != null) ? string(input.idOrName) : '')
    require:
      - { cond: proj_found, error: NotFound, message: "The requested resource was not found." }
    effects:
      # The map lives on the project record: the response keys bypass metadata
      # BY secret, and no expression can fold a row collection into a map.
      # GetProjects projects its items so the member never leaks into a
      # listing. The draws are guarded the way CreateDeployment's project draw
      # is: a request without that action does not draw.
      - generate:
          bind: pbs
          kind: hex
          bytes: 16
          # Only a generate that left the secret to us draws; a caller-chosen
          # secret is honored instead, which the document's body declares.
          when: "'generate' in input && input.generate != null && !('secret' in input.generate && input.generate.secret != null)"
      - generate:
          bind: resec
          kind: hex
          bytes: 16
          # A regenerate of a secret the project does not hold draws and
          # discards: the alternative is a guard that cannot see a secret the
          # same request's generate just created, and a guard that misses the
          # draw while the patch below fires answers 500.
          when: "'revoke' in input && input.revoke != null && 'regenerate' in input.revoke && input.revoke.regenerate == true"
      # The unconditional patch refreshes updatedAt and guarantees `rec` for
      # the output; the guarded ones read rec, so they chain.
      - patch:
          resource: project
          key: "string(proj.id)"
          record:
            id: id
      - patch:
          resource: project
          key: "string(proj.id)"
          when: "'generate' in input && input.generate != null"
          record:
            id: id
            protectionBypass: >
              merge(('protectionBypass' in rec && rec.protectionBypass != null) ? rec.protectionBypass : {},
                {('secret' in input.generate && input.generate.secret != null) ? string(input.generate.secret) : fx.pbs:
                  {'createdAt': int(now) * 1000, 'createdBy': 'usr_' + (identity.project != '' ? identity.project : identity.account), 'scope': 'automation-bypass',
                   'note': ('note' in input.generate && input.generate.note != null) ? input.generate.note : null}})
      - patch:
          resource: project
          key: "string(proj.id)"
          when: "'revoke' in input && input.revoke != null && !('regenerate' in input.revoke && input.revoke.regenerate == true)"
          record:
            id: id
            protectionBypass: >
              without(('protectionBypass' in rec && rec.protectionBypass != null) ? rec.protectionBypass : {},
                [string(input.revoke.secret)])
      # Regenerate keeps the entry's note and scope under a fresh secret, as
      # the oracle does.
      - patch:
          resource: project
          key: "string(proj.id)"
          when: "'revoke' in input && input.revoke != null && ('regenerate' in input.revoke && input.revoke.regenerate == true) && 'protectionBypass' in rec && rec.protectionBypass != null && string(input.revoke.secret) in rec.protectionBypass"
          record:
            id: id
            protectionBypass: >
              merge(without(rec.protectionBypass, [string(input.revoke.secret)]),
                {fx.resec: merge(rec.protectionBypass[string(input.revoke.secret)],
                  {'createdAt': int(now) * 1000, 'createdBy': 'usr_' + (identity.project != '' ? identity.project : identity.account)})})
      - patch:
          resource: project
          key: "string(proj.id)"
          when: "'update' in input && input.update != null && 'protectionBypass' in rec && rec.protectionBypass != null && string(input.update.secret) in rec.protectionBypass"
          record:
            id: id
            protectionBypass: >
              merge(rec.protectionBypass,
                {string(input.update.secret): merge(rec.protectionBypass[string(input.update.secret)],
                  {'note': ('note' in input.update && input.update.note != null) ? input.update.note : null,
                   'isEnvVar': ('isEnvVar' in input.update && input.update.isEnvVar != null) ? input.update.isEnvVar : false})})
    output:
      protectionBypass: "('protectionBypass' in rec && rec.protectionBypass != null) ? rec.protectionBypass : {}"

  # --- Auth supplement: the routes the vendored document never declares and
  # the vendor's own emulator serves. The oracle answers its own 401 to a request
  # with no Bearer; these do not, because the covenant is that any credentials
  # work (strict mode, MIRROR_VERCEL_STRICT_AUTH, refuses at the edge for every
  # operation alike). The one 401 left is OauthUserinfo's, which is the OAuth
  # protocol's own and not a credential check on the API.

  GetRegistration:
    # The oracle's constant: registration is closed.
    output:
      registration: "false"

  CreateApiKey:
    effects:
      - generate: { bind: kid, kind: hex, bytes: 8 }
      - generate: { bind: tok, kind: hex, bytes: 24 }
      - put:
          resource: api_key
          key: "'ak_' + fx.kid"
          record:
            id: "'ak_' + fx.kid"
            name: "('name' in input && input.name != null && string(input.name) != '') ? string(input.name) : 'API Key'"
            teamId: "('teamId' in input && input.teamId != null && string(input.teamId) != '') ? dyn(string(input.teamId)) : dyn(null)"
            createdAt: "int(now) * 1000"
    output:
      apiKeyString: "'vercel_api_' + fx.tok"
      apiKey: "{'id': rec.id, 'name': rec.name, 'teamId': rec.teamId, 'createdAt': rec.createdAt}"

  ListApiKeys:
    list:
      resource: api_key
      member: keys
      filter: "!('teamId' in input) || input.teamId == null || string(input.teamId) == '' || string(item.teamId) == string(input.teamId)"
    output:
      keys: "items.map(k, {'id': k.id, 'name': k.name, 'teamId': k.teamId, 'createdAt': k.createdAt})"

  DeleteApiKey:
    reads:
      k: { resource: api_key, key: "string(input.keyId)" }
    require:
      - { cond: k_found, error: NotFound, message: "API key not found" }
    effects:
      - delete: { resource: api_key, key: "string(input.keyId)", missing: ignore }
    output: {}

  OauthAuthorize:
    # The sign-in page. The oracle renders a card per seeded user; mirror has
    # one user, so the page is one form posting that user back with every
    # parameter carried through. The markup is mirror's own -- a browser flow
    # needs a working form, not the oracle's pixels.
    output:
      page: >
        '<!doctype html><html><head><title>Sign in to Vercel</title></head><body>'
        + '<h1>Sign in to Vercel</h1>'
        + '<form method="post" action="/oauth/authorize/callback">'
        + '<input type="hidden" name="client_id" value="' + ('client_id' in input && input.client_id != null ? string(input.client_id) : '') + '">'
        + '<input type="hidden" name="redirect_uri" value="' + ('redirect_uri' in input && input.redirect_uri != null ? string(input.redirect_uri) : '') + '">'
        + '<input type="hidden" name="scope" value="' + ('scope' in input && input.scope != null ? string(input.scope) : '') + '">'
        + '<input type="hidden" name="state" value="' + ('state' in input && input.state != null ? string(input.state) : '') + '">'
        + '<input type="hidden" name="code_challenge" value="' + ('code_challenge' in input && input.code_challenge != null ? string(input.code_challenge) : '') + '">'
        + '<input type="hidden" name="code_challenge_method" value="' + ('code_challenge_method' in input && input.code_challenge_method != null ? string(input.code_challenge_method) : '') + '">'
        + '<button type="submit" name="username" value="test">Continue as test</button>'
        + '</form></body></html>'

  OauthAuthorizeCallback:
    effects:
      - generate: { bind: code, kind: hex, bytes: 20 }
      - put:
          resource: oauth_code
          key: fx.code
          record:
            username: "('username' in input && input.username != null) ? string(input.username) : ''"
            scope: "('scope' in input && input.scope != null) ? string(input.scope) : ''"
            redirect_uri: "('redirect_uri' in input && input.redirect_uri != null) ? string(input.redirect_uri) : ''"
            client_id: "('client_id' in input && input.client_id != null) ? string(input.client_id) : ''"
            code_challenge: "('code_challenge' in input && input.code_challenge != null) ? string(input.code_challenge) : ''"
            code_challenge_method: "('code_challenge_method' in input && input.code_challenge_method != null) ? string(input.code_challenge_method) : ''"
            created_at: "int(now) * 1000"
    output:
      code: fx.code
      location: >
        (('redirect_uri' in input && input.redirect_uri != null && string(input.redirect_uri) != '') ? string(input.redirect_uri) : '')
        + (('redirect_uri' in input && input.redirect_uri != null && string(input.redirect_uri).contains('?')) ? '&' : '?')
        + 'code=' + fx.code
        + (('state' in input && input.state != null && string(input.state) != '') ? '&state=' + string(input.state) : '')

  OauthToken:
    reads:
      pending: { resource: oauth_code, key: "('code' in input && input.code != null) ? string(input.code) : ''" }
    require:
      # In the oracle's order: unknown code, expiry, redirect mismatch, PKCE.
      - { cond: pending_found, error: InvalidGrant, message: "The code passed is incorrect or expired." }
      - { cond: "int(now) * 1000 - int(pending.created_at) <= 600000", error: InvalidGrant, message: "The code passed is incorrect or expired." }
      - cond: >
          !('redirect_uri' in input && input.redirect_uri != null && string(input.redirect_uri) != ''
            && string(pending.redirect_uri) != '')
          || string(input.redirect_uri) == string(pending.redirect_uri)
        error: InvalidGrant
        message: "The redirect_uri does not match the one used during authorization."
      - { cond: "string(pending.code_challenge) == '' || ('code_verifier' in input && input.code_verifier != null && string(input.code_verifier) != '')", error: InvalidGrant, message: "PKCE verification failed." }
      - cond: >
          string(pending.code_challenge) == ''
          || (string(pending.code_challenge_method) == 's256'
            ? b64urlhex(sha256hex(string(input.code_verifier))) == string(pending.code_challenge)
            : string(input.code_verifier) == string(pending.code_challenge))
        error: InvalidGrant
        message: "PKCE verification failed."
      # mirror has one user; a code issued for another name has none.
      - { cond: "string(pending.username) == 'test' || string(pending.username) == ''", error: InvalidGrant, message: "The user associated with this code was not found." }
    effects:
      - delete: { resource: oauth_code, key: "string(input.code)", missing: ignore }
      - generate: { bind: tok, kind: hex, bytes: 20 }
      - put:
          resource: oauth_token
          key: "'vercel_' + fx.tok"
          record:
            username: string(pending.username)
            scope: string(pending.scope)
    output:
      access_token: "'vercel_' + fx.tok"
      token_type: "'Bearer'"
      scope: string(pending.scope)

  OauthUserinfo:
    reads:
      tok: { resource: oauth_token, key: "('authorization' in input && input.authorization != null && size(split(string(input.authorization), ' ')) == 2) ? split(string(input.authorization), ' ')[1] : ''" }
      u: { resource: user }
    require:
      - { cond: "'authorization' in input && input.authorization != null && string(input.authorization) != ''", error: Unauthorized, message: "Authentication required" }
      - { cond: tok_found, error: Unauthorized, message: "Authentication required" }
    output:
      sub: "'usr_' + (identity.project != '' ? identity.project : identity.account)"
      email: "(u_found && 'email' in u) ? u.email : 'test@mirror.cloud'"
      name: "(u_found && 'name' in u) ? u.name : 'Mirror'"
      preferred_username: "'test'"
      email_verified: "true"
      picture: "''"

  # --- CI/CD surface beyond emulate's 52 routes ---

  PatchUrlProtectionBypass:
    reads:
      als: { resource: deployment_alias, key: "string(input.id)" }
    require:
      - { cond: als_found, error: NotFound, message: "The requested resource was not found." }
    effects:
      - patch:
          resource: deployment_alias
          key: "string(als.uid)"
          record:
            uid: id
            protectionBypass: "('protectionBypass' in input && input.protectionBypass != null) ? input.protectionBypass : {}"
    # Document declares an empty response.
    output: {}

  RequestRollback:
    reads:
      by_name:
        resource: project_name
        key: "('projectId' in input && input.projectId != null) ? string(input.projectId) : ''"
      proj:
        resource: project
        key: >
          by_name_found ? string(by_name.project)
            : (('projectId' in input && input.projectId != null) ? string(input.projectId) : '')
      dep:
        resource: deployment
        key: "('deploymentId' in input && input.deploymentId != null) ? string(input.deploymentId) : ''"
    require:
      - { cond: proj_found, error: NotFound, message: "The requested resource was not found." }
      - { cond: dep_found, error: NotFound, message: "The requested resource was not found." }
    effects:
      - patch:
          resource: project
          key: "string(proj.id)"
          record:
            id: id
            productionDeploymentId: "string(dep.uid)"
            # A rollback begins undescribed; the update-description route says why.
            rollbackDescription:
              userId: "'usr_' + (identity.project != '' ? identity.project : identity.account)"
              username: "'test'"
              description: "''"
              createdAt: "now_ms"
    output: {}

  UpdateProjectsByProjectIdRollbackByDeploymentIdUpdateDescription:
    reads:
      by_name:
        resource: project_name
        key: "('projectId' in input && input.projectId != null) ? string(input.projectId) : ''"
      proj:
        resource: project
        key: >
          by_name_found ? string(by_name.project)
            : (('projectId' in input && input.projectId != null) ? string(input.projectId) : '')
    require:
      - { cond: proj_found, error: NotFound, message: "The requested resource was not found." }
      - { cond: "!('description' in input) || input.description == null || size(string(input.description)) <= 250", error: BadRequest, message: "A rollback description is limited to 250 characters" }
    effects:
      - patch:
          resource: project
          key: "string(proj.id)"
          record:
            id: id
            rollbackDescription:
              userId: "'usr_' + (identity.project != '' ? identity.project : identity.account)"
              username: "'test'"
              description: "('description' in input && input.description != null) ? string(input.description) : ''"
              createdAt: "now_ms"
    output: {}


quirks:
  - operation: GetProjects
    note: >
      Versioning is restored, and this is the visible break. The pack's route
      table stripped the leading version segment before matching -- any `v`
      followed by a digit -- so /v1/projects, /v9/projects and /v99/projects
      all listed projects. Routing is the model's now, and each operation binds
      to the one version its document declares.

      Four of the pack's routes therefore move. Listing projects is /v10 where
      the pack answered /v9; project env is /v10 where it answered /v9; project
      domains is /v9 where it answered /v10; listing deployments is /v7 where
      it answered /v6. A client written against the emulator's laxity breaks,
      which is the same shape as Cloudflare's percent-encoded slash: the
      document is `declared` and the pack's tolerance was `authored`.

      The listing pages: `limit` is the page size and `from` is the cursor a
      previous page answered as pagination.next, a number that carries the
      project's place among those created in the same millisecond (see
      internal/engine/cursor.go), so a boundary between two of them loses
      neither. Projects page by creation instant, the order of the listing, where
      the document words `from` as "updated after". A bare integer timestamp
      still means the projects created before it.
  - operation: DeleteProject
    note: >
      Answers 204 with no body, where the pack answered 200 and an empty
      object. The document declares 204 for it, and a status that forbids a
      body gets none -- the rule is the protocol's, not this provider's.
  - operation: CreateProjectEnv
    note: >
      Answers {created, failed}, as the document declares, and 201. The pack
      answered the variable itself at the top level, one at a time.

      The body is one variable or an array of them. A variable that exists for
      the same key, target and git branch is refused: a single variable with a
      409 ENV_CONFLICT (the code the CLI reads to ask whether to overwrite, with
      the key and targets in the envelope), a batch by listing it under
      `failed` and making the rest. ?upsert=true updates it instead. What the
      API shows of a value depends on the type: plain and secret as set,
      encrypted opaque unless ?decrypt=true or the variable is addressed by id,
      sensitive never (its digest is kept, its value is not, so a snapshot holds
      no secret). The opaque form is a base64 document naming the digest; real
      Vercel's is a ciphertext, which nothing a client does can tell apart.
  - operation: FilterProjectEnvs
    note: >
      Lists in creation order, where the pack listed by store key (a random
      identifier). The document does not say what order it lists in; creation
      order is the one a snapshot can reproduce. `gitBranch` narrows to the
      variables set for that branch and those set for none. `target` (which the
      document does not declare and `vercel env pull` sends, to ask which of
      the empty values it was given are sensitive), `customEnvironmentSlug` and
      `customEnvironmentId` narrow it to the variables that list that
      environment; a target that is neither a built-in one nor a custom
      environment of the project lists nothing. `source` is read by nothing.
  - operation: GetProjectEnv
    note: >
      The document declares this at /v1; the vendored fragment and the pack's
      supplement disagreed about the version, and the supplement's /v10 is an
      address of the same operation now, with /v9 and /v8, so a client written
      against any of them reaches the one store. The pack's supplement answered
      five members; the document's variable carries the rest. Addressed by id,
      an encrypted value is shown decrypted.
  - operation: AddProjectDomain
    note: >
      A domain is added unverified and carries the TXT challenge a client is
      told to publish (`_vercel.<apex>`, `vc-domain-verify=<host>,<token>`),
      where the pack answered it verified the moment it was added. The wording
      and the empty challenge list once verified follow the vendor's own
      emulator (test/behavior/vercel/oracle, domains-add). A hostname under
      vercel.app, and one whose apex the account already holds verified, are
      verified from the start. A hostname is lower-cased; one that is not a
      hostname is a 400 invalid_domain; one a project already holds (this or
      another) is a 409 domain_already_in_use. The error codes are this
      bundle's reading of Vercel's: the document names the statuses and not the
      codes.
  - operation: CreateCheck
    note: >
      A check can be added only while the build runs (QUEUED or BUILDING), as the
      document says, and starts registered. Its integrationId is a constant:
      there is no integration behind it. Status, conclusion and the timestamps
      move because a client patches them; nothing runs the check.
  - operation: CreateDeploymentCheckRun
    note: >
      `checkId` names a project check, the definition the run is made from
      (name, requires, blocks, targets, timeout, source); the run starts queued.
      The pack and the oracle took any identifier, including a deployment check's.
  - operation: CreateProjectCheck
    note: >
      A check made through the API has no integration or git provider behind it,
      so its source is a webhook unless the request names another kind. The
      timeout defaults to five minutes (the document sets a floor of one
      second and no default).
  - operation: UpdateRollingReleaseConfig
    note: >
      The document declares this route with no request body, so the members are
      taken from the body whether they arrive flat or inside rollingRelease; a
      null rollingRelease takes the configuration away. The final stage must be
      100 percent and stages must rise.
  - operation: StartRollingRelease
    note: >
      Needs configured stages and a READY canary, and moves nothing: there is no
      traffic to split, so the stages are a state machine a client steps
      through (approve-stage moves to the next, complete finishes and makes the
      canary production). The answer is the document's RollingRelease object.
  - operation: GetRollingReleaseBillingStatus
    note: >
      Answers the plan with no limit (unlimited_slots); there is no billing.
  - operation: GetRuntimeLogs
    note: >
      Nothing serves traffic, so there is nothing to log; the stream is the
      delimiter row that opens it.
  - operation: UploadArtifact
    note: >
      The bytes are kept (base64 in the record, in memory), so an upload is what
      the next download returns, byte for byte. The pack kept the size alone and
      answered an empty body.
  - operation: RecordEvents
    note: >
      Accepted and not kept: cache events are the client's telemetry.
  - operation: CreateDeployment
    note: >
      Creating a deployment for a project that does not exist creates the
      project too, which is the pack's behaviour and not the real API's: Vercel
      answers 404 for an unknown project. It is kept because the recording
      gates it and because a client that relies on it would otherwise break
      silently, but it is the clearest candidate for a probe run to overturn.

      The create answer is QUEUED. One-second build timers settle through
      BUILDING to READY after the engine clock advances. The differential
      advances the clock after create so later get/cancel steps still match
      emulate's READY world. vercel-labs/emulate births READY and refuses
      every cancel; this surface deliberately diverges so CI/CD cancel is
      exercisable before Advance.
  - operation: UpdateProject
    note: >
      Stores the members a project is created with and the settings a client
      changes after (name, framework, the build, install and dev commands, the
      root and output directories, nodeVersion, the protection settings and the
      switches). The document declares some fifty; the rest are accepted and
      dropped, because nothing here reads them.
  - operation: EditProjectEnv
    note: >
      Honors key, value, type, target, gitBranch, comment and
      customEnvironmentIds; a member the request leaves out keeps its value. An
      edit that would land on another variable's key, target and branch is a 409
      ENV_CONFLICT. The pack carried only key, value, type and target. A value
      is shown decrypted because the variable is addressed by id.
  - operation: UpdateProjectDomain
    note: >
      Sets a redirect (with its status), a git branch or a custom environment;
      a null clears one. A redirect and a git branch together are a 400, as the
      document says, and so is a redirect to the domain itself or to something
      that is not a hostname. Whether the redirect target is a domain of the
      same project is not checked. The document declares a 409 for a project
      being transferred, which nothing here produces.
  - operation: VerifyProjectDomain
    note: >
      Takes the TXT challenge as met: an emulator has no network to resolve it,
      so verify cannot fail. It moves the domain, the account-wide record of the
      hostname and the account's own record of the apex (when it holds one) to
      verified, and the challenge list to empty. The document's 400s for a
      missing or mismatched TXT record are never answered.
  - operation: CreateOrTransferDomain
    note: >
      Adds the domain to the account unverified, with Vercel's nameservers as
      the intended ones and none as the current ones; `method` other than add is
      treated as add. A second add of the same name is a 409
      domain_already_exists, a code this bundle chose: the document names the
      status and not the code.
  - operation: PatchDomain
    note: >
      Only `op: update` is served (renew, zone, custom nameservers, echMode).
      Moving a domain out answers 400.
  - operation: GetDomainConfig
    note: >
      Recommends Vercel's real A record and CNAME target. A hostname is
      configured once a project holds it verified; there is no DNS to look at.
  - operation: CreateCustomEnvironment
    note: >
      The body's `slug` and the team-slug query share one member name in the
      narrowed model; the body value is what arrives. `type` is answered
      "preview" for every custom environment: the document declares the enum
      and nothing to set it from, and a custom environment exists to match
      branches, which is the preview kind. Both are judgment calls a probe
      run can overturn.
  - operation: GetProjectsByIdOrNameCustomEnvironments
    note: >
      accountLimit.total is a fixed 12. The document declares the member --
      "the maximum number of custom environments allowed either by the team's
      plan type or a custom override" -- and no value for it, and no pack
      ever answered one. The create does not enforce it either.
  - operation: RequestPromote
    note: >
      A promote sets the project's productionDeploymentId. ListPromoteAliases
      reports PROMOTED for aliases of that deployment and PENDING otherwise.
      The document declares an empty 201.
  - operation: GetTeams
    note: >
      Lists the teams there are, newest first, which is initially none: a team
      is made by CreateTeam (the oracle's POST /v2/teams, authored; the vendored
      document's own create answers only {id, slug}). Pages like every other
      listing: `limit` is the page size, `until` and `since` take a bare
      millisecond timestamp or the cursor pagination.next answered, which tells
      teams made in one millisecond apart.
  - operation: GetTeam
    note: >
      404 for any id until a team record exists (CreateTeam makes one).
      Members a bare row would not carry answer null -- or the oracle's
      defaults for membership, billing and resourceConfig -- rather than
      failing the read.
  - operation: PatchTeam
    note: >
      Honors name, slug, description and avatar -- the four the oracle's patch
      honors -- of the thirty-odd members the document declares. Two oracle
      guards have no counterpart: the owner-only 403 (there is no membership
      store to check a role against) and the slug-conflict 409 (nothing
      creates teams, so no second team can hold the slug).
  - operation: InviteUserToTeam
    note: >
      There is no user store, so any well-formed email is invitable where the
      oracle 404s an unknown user, and the answered uid is derived from the
      address (md5, truncated to the oracle's twenty) rather than looked up;
      username echoes the email. The role guard is the oracle's four roles,
      not the document's eight-member enum. A repeat invite to the same
      address is the oracle's 409 member_already_exists.
  - operation: ListDeploymentAliases
    note: >
      Answers uid, alias, created, redirect and protectionBypass per row, the
      document's item shape, oldest first. The oracle also answers deploymentId
      and projectId, which the document's item shape does not declare. The
      deployment's own URL is one of the rows, as the oracle writes it.
  - operation: AssignAlias
    note: >
      Needs a READY deployment (a 400 otherwise, as the document says), so a
      client polls to READY first; the pack and the oracle took one still
      building. A hostname that already names another deployment moves, and the
      answer carries oldDeploymentId; naming the deployment it already names is
      a 409. Any well-formed hostname is accepted: the document's 404 for a
      domain the account does not hold and its 403 for a missing .vercel.app
      alias are never answered, so a deploy script does not have to add the
      domain first. The deployment lists the hostname in its own `alias`.
  - operation: DeleteAlias
    note: >
      Removes the row and the hostname's index entry, and the deployment stops
      listing the hostname.
  - operation: GetDeploymentEvents
    note: >
      Newest first, the oracle's default direction; `direction`, `limit` and
      `since`/`until` (inclusive instants) are read, and `follow`, `format` and
      the rest are accepted and read by nothing. Events are the ones the
      create and cancel write -- created, building, ready, canceled -- not a
      build log.
  - operation: ListDeploymentFiles
    note: >
      Answers the document's bare FileTree array where the oracle wraps the
      same tree in {files: [...]} -- the document wins, as it does everywhere
      the two disagree. The tree is flat: every uploaded file is a child of
      the root under its full path, where the oracle splits nested paths into
      directory nodes.
  - operation: CancelDeployment
    note: >
      Cancel is legal only in QUEUED or BUILDING. A create is QUEUED; after
      Clock.Advance, get/list settle to READY and cancel answers 400 the way
      the emulate corpus expects. A cancel before Advance succeeds and lands
      CANCELED.
  - operation: UploadFile
    note: >
      Answers the empty object -- the one arm of the document's oneOf the
      model can serialize -- where the oracle answers a bare empty array. A
      re-upload of a known digest merges the registration where the oracle
      keeps the first; a digest travels by header, and the digest headers are
      the members the resource is keyed from.
  - operation: ListPromoteAliases
    note: >
      Answers the document's {aliases: [{alias, id, status}], pagination}
      where the oracle answers {status, alias: [...]} -- a shape the model
      cannot serialize. PROMOTED follows the project's productionDeploymentId
      (set by promote/rollback); otherwise PENDING.
  - operation: UpdateProjectProtectionBypass
    note: >
      The bypass map lives on the project record, keyed by secret, because
      the response keys metadata BY secret and no expression can fold a row
      collection into that map; GetProjects projects its items so the member
      never reaches a listing. Generate honors a caller-chosen secret when the
      document's body carries one, and the scope is the document's
      `automation-bypass` enum value where the oracle writes `deployment`.
  - operation: AssignAlias
    note: >
      A hostname is the account's to alias only if it holds the domain: a
      *.vercel.app name needs none, and anything else must be a domain of the
      account, sit under one (its apex), or be a hostname one of its projects
      holds. Otherwise 404 under the code domain_not_found. The document says
      "The domain used for the alias was not found" and names no code; this one
      is authored, chosen because the CLI lists it beside invalid_domain for a
      domain the account cannot use. This bundle accepted any hostname until
      now. The check runs after the hostname is known valid and before the
      deployment's state is looked at.
  - operation: AddProjectAlias
    note: >
      Not in the document: vercel 63.1.2 `domains add <domain> <project>` posts
      it. The answer is an array of alias targets; the CLI reads the entry for its
      host, so the members beyond `domain` are authored. A host another project
      holds is 409 ALIAS_DOMAIN_EXIST with `project: {id}` in the envelope, which
      is what the CLI reads to tell "already on this project" from "on another".
      The holder is named by id only: a name kept in the envelope would go stale
      on a project rename. The host lands in the store AddProjectDomain writes.
  - operation: RemoveProjectAlias
    note: >
      Not in the document: `domains add --force` sends it to take a host off the
      project that holds it. The CLI reads nothing from the answer but whether it
      is an error, so the empty object is authored.
  - operation: GetDomainProjectDomains
    note: >
      The document's route, which the CLI's `domains inspect` and `rm` read. It
      lists the project domains of every project of the account under one apex,
      and is a 404 for an apex the account does not hold. The account-wide
      hostname index (domain_owner) carries the whole project domain so that no
      per-project collection has to be asked.
  - operation: GetEnvPull
    note: >
      Not in the document: `vercel env pull`, `pull` and `link` read it. See the
      header of ops/envpull.yaml for what the CLI does with the answer. A
      sensitive variable is its key with "" (its value is not stored); which
      variables a real target includes beyond the project's own is not known.
      GetEnvPullTarget and GetEnvPullBranch are the same definition at the
      address with a target, and a target and a git branch.
