schema: bir/1
service: vercel.api

# Extracted from the REST half of internal/services/vercel/api (304 of its 342
# lines of Go). The other 38 served Vercel KV, which is a different product on
# a different host and is now behavior/vercel/kv.
#
# Every cell is `authored`: transcribed from that pack, not established against
# the real Vercel API. Where the document contradicts the pack the document
# wins, and each of those is stated per operation and in `quirks`.
provenance: authored

# The pack answered a missing name with `bad_request` / 400. The document marks
# the path labels required and the engine's model check runs before any rule
# here, so that failure has to carry Vercel's name for it rather than the
# ValidationException default.
missing_input_error: BadRequest

resources:
  project:
    collection: vproj
    # The identifier carries a prj_ prefix, so the record member rather than
    # the raw generated id is the store key.
    key: id
    id:
      # No `generate` here. Both operations that create a project draw the id
      # as an effect and pass it as the key, because two writes need the same
      # one; a resource generate beside that would draw a SECOND id per create
      # and throw it away. That is invisible in an answer and not invisible in
      # a recording: the two sides read the same seeded Rand, so a wasted draw
      # moves every later identifier, and the store sorts a listing by key --
      # so a discarded draw reorders a list.
      # The document calls the label `idOrName` because the real API accepts
      # either, and the pack's lookup did too -- it tried the key, then the
      # name index, then the id the index pointed at. Addressing by id is what
      # this resolves; addressing by name goes through project_name below.
      input_members: [idOrName]
    record:
      # Input-independent, because a write re-evaluates every member here:
      # UpdateProject patches this resource, and `name`/`framework` read from
      # `input` would answer the update's body (or fail on its absence) rather
      # than the project's. Both live on the create effects instead, which is
      # where the request that knows them runs.
      id: "'prj_' + id"
      accountId: "identity.account"
      createdAt: "int(now) * 1000"
      updatedAt: "int(now) * 1000"

  # Project names are unique, and the pack enforced that with a second row in
  # the SAME collection keyed `name:<name>`, skipped when listing. It is a
  # separate collection here for the reasons Cloudflare's title index is: a
  # listing should not have to know which of its rows are really an index, and
  # a project actually named `name:something` was indistinguishable from one.
  project_name:
    collection: vprojname
    id:
      # Total: evaluated wherever the resource is addressed, so a request
      # carrying neither member must yield an empty key rather than an
      # evaluation error. `idOrName` first, because a get and a delete name the
      # project that way and a create names it `name`.
      derive: >
        ('idOrName' in input && input.idOrName != null) ? string(input.idOrName)
          : (('name' in input && input.name != null) ? string(input.name) : '')

  env:
    # Parent-scoped: each project's variables are their own collection, as the
    # pack's `<project id>/<env id>` key prefix was.
    collection: "venv:{project.id}"
    parent: project
    key: id
    id:
      generate: { kind: hex, bytes: 10 }
      input_members: [id]
    record:
      # Input-independent for the same reason the project's is: EditProjectEnv
      # patches this resource, and `key`/`value`/`type`/`target` read from
      # `input` would reset to their defaults on any edit that omits them.
      # They live on the create effect instead.
      id: "'env_' + id"

  domain:
    collection: "vdom:{project.id}"
    parent: project
    id:
      # `name` on the add, `domain` on the get/update/remove/verify: the two
      # labels name the same record. input_members is tried first and an add
      # carries no `domain`, so it still falls through to the derive.
      input_members: [domain]
      derive: "('name' in input && input.name != null) ? string(input.name) : ''"
    record:
      name: id
      apexName: id
      # No projectId here: a parent-scoped resource's record cannot see its
      # parent, which binds for the collection template and not in this scope.
      # The two operations that answer a domain project it from their own read
      # of the project, which is the same value by construction -- a domain
      # lives in its project's collection.
      #
      # The pack answered a domain verified the moment it was added. A real one
      # is not, and a client that waits for verification waits forever against
      # the real API and not at all against this -- recorded as a quirk.
      verified: "true"
      createdAt: "int(now) * 1000"
      updatedAt: "int(now) * 1000"

  custom_environment:
    collection: "vcenv:{project.id}"
    parent: project
    # Keyed on the record's id, as the project is: the document gives the id
    # an env_ prefix, so the record member rather than the raw draw is the
    # store key.
    key: id
    id:
      # No `generate`, for the project's reason: the create draws the id as an
      # effect because the slug index write needs the same one. Addressed by
      # id directly or by slug through custom_environment_slug, the two
      # spellings of the path label `environmentSlugOrId`.
      input_members: [environmentSlugOrId]
    record:
      # Input-independent for the project's reason: UpdateCustomEnvironment
      # patches this resource. `slug`, `description` and `branchMatcher` live
      # on the create effect, whose request is the one that carries them.
      id: "'env_' + id"
      # The document declares the enum and nothing to set it from: a custom
      # environment is preview-shaped (it exists to match branches), which is
      # a judgment call and is recorded in `quirks`.
      type: "'preview'"
      createdAt: "int(now) * 1000"
      updatedAt: "int(now) * 1000"

  # Slugs are unique per project, the same shape of constraint as project
  # names, so the same shape of index: a separate collection rather than a
  # prefixed row the listing would have to know about.
  custom_environment_slug:
    collection: "vcenvslug:{project.id}"
    parent: project
    id:
      # Total, for the project_name reason: a request carrying neither member
      # must yield an empty key rather than an evaluation error. The label
      # first, because get/update/remove name the environment that way and a
      # create names it `slug`.
      derive: >
        ('environmentSlugOrId' in input && input.environmentSlugOrId != null) ? string(input.environmentSlugOrId)
          : (('slug' in input && input.slug != null) ? string(input.slug) : '')

  deployment:
    collection: vdeploy
    # Keyed on uid, which is what the record carries; see the note below.
    key: uid
    id:
      # No `generate`, for the reason the project has none, and with a second:
      # a deployment costs TWO draws, the id and the six random bytes in its
      # hostname, and they have to be drawn in that order. A resource generate
      # cannot express the second at all.
      # A get names it `idOrUrl` and a delete names it `id`; the first member
      # the request carries is the one that addresses it.
      input_members: [idOrUrl, id]
    record:
      # `uid` is the key itself, spelled `id` because that is what a record
      # calls its own key. The one writer passes the key explicitly -- it has
      # to, since the value is drawn by an effect and a record sees `input` and
      # `id` but never `fx` -- and this carries it into the record, which is
      # where the validator requires the key member to be set.
      #
      # `uid` and not `id`: the listed deployment's item shape declares uid,
      # where the single-deployment response declares id. The pack stored both
      # with the same value, which an unprojected list cannot do -- the record
      # IS the item, so every member it carries has to be one the item shape
      # declares. The two operations that answer `id` project it from here.
      #
      # Input-independent, as the project's is: CancelDeployment patches this
      # resource, and `name` read from `input` would fail on a request that
      # does not carry one. It lives on the create effect instead.
      uid: id
      readyState: "'READY'"
      state: "'READY'"
      createdAt: "int(now) * 1000"
      created: "int(now) * 1000"
      type: "'LAMBDAS'"

  # A team is an account fixture: the vendored document has no create for one
  # (POST /v2/teams exists only in emulate's routes), so nothing here writes
  # one and a listing answers whatever records exist -- initially none. The
  # record is patch-safe: PatchTeam re-evaluates it, so it carries only what
  # an update may legitimately refresh.
  team:
    collection: vteam
    key: id
    id:
      input_members: [teamId]
    record:
      id: id
      updatedAt: "int(now) * 1000"

  # A membership row per invited address, keyed team:email so a repeat invite
  # to the same address is the conflict the oracle answers. Writes and reads
  # all carry explicit keys, so there is nothing to derive from a request.
  team_member:
    collection: vteammem
    id:
      derive: "''"


  # The one caller. The pack answered a fixed identity and patches move it;
  # the singleton keeps the overrides so GetAuthUser, the patch and userinfo
  # read the same answer.
  user:
    collection: vuser
    singleton: current

  # An API key's id and its token are both minted at create; the token is the
  # secret answer, the id is how a delete addresses the row.
  api_key:
    collection: vapikey
    id:
      derive: "''"

  # The local OAuth flow's two stores: codes the callback issues and the token
  # exchange consumes exactly once, and the tokens it issues.
  oauth_code:
    collection: voauthcode
    id:
      derive: "''"

  oauth_token:
    collection: voauthtok
    id:
      derive: "''"

  # Teams are addressed by id or by slug, the way the oracle's
  # resolveTeamByIdOrSlug accepts both: the index answers which.
  team_slug:
    collection: vteamslug
    id:
      derive: "''"

  # A deployment's alias rows, written by CreateDeployment the way emulate
  # writes them (one per deployment, the deployment's own URL). Keyed off the
  # deployment id; the list filters on the record's deploymentId, so the key
  # is never derived from a request.
  deployment_alias:
    collection: vdepalias
    id:
      derive: "''"

  # A deployment's build events, written by CreateDeployment (created,
  # building, ready -- the three the oracle pushes) and CancelDeployment. The
  # key is the deployment id plus a serial suffix so one flat collection holds
  # every deployment's events in per-deployment order.
  deployment_event:
    collection: vdevent
    id:
      derive: "''"

  # A deployment's file descriptors, from the create body's `files`. Keyed
  # deployment id plus digest; the list filters on the record's deploymentId.
  deployment_file:
    collection: vdfile
    id:
      derive: "''"

  # An uploaded file's registration, keyed by its digest -- which is how both
  # writers name it: UploadFile carries it as the digest header, a deployment
  # create as each file entry's `sha`.
  file:
    collection: vfile
    id:
      derive: >
        ('x-vercel-digest' in input && input['x-vercel-digest'] != null) ? string(input['x-vercel-digest'])
          : (('x-now-digest' in input && input['x-now-digest'] != null) ? string(input['x-now-digest']) : '')
    record:
      digest: id
      contentType: "'application/octet-stream'"

errors:
  BadRequest:
    code: bad_request
    http: 400
    fault: client
  NotFound:
    code: not_found
    http: 404
    fault: client
  Conflict:
    code: conflict
    http: 409
    fault: client
  # The oracle's invite route answers a second 409 under its own code; the
  # generic Conflict stays for project names.
  MemberAlreadyExists:
    code: member_already_exists
    http: 409
    fault: client
  NotAuthenticated:
    code: not_authenticated
    http: 401
    fault: client
  Unauthorized:
    code: unauthorized
    http: 401
    fault: client
  TeamSlugAlreadyExists:
    code: team_slug_already_exists
    http: 409
    fault: client
  InvalidGrant:
    code: invalid_grant
    http: 400
    fault: client
  InvalidClient:
    code: invalid_client
    http: 401
    fault: client

operations:
  GetAuthUser:
    # The fixed identity the pack answered, now read through the user
    # singleton so UpdateAuthUser's patch moves the answer.
    reads:
      u: { resource: user }
    output:
      user: >
        {
          'id': 'usr_' + identity.account,
          'email': (u_found && 'email' in u) ? u.email : 'test@mirror.cloud',
          'name': (u_found && 'name' in u) ? u.name : 'Mirror',
          'username': 'test'
        }

  CreateProject:
    reads:
      taken: { resource: project_name }
    require:
      # `cond` is a precondition: the error fires when it does NOT hold. The
      # document marks `name` required, so a request omitting it entirely fails
      # the engine's model check before reaching here -- same code and status,
      # different wording, which is the quirk below. This rule is what answers
      # a name that is present and empty, which the model check permits.
      - { cond: "'name' in input && input.name != null && string(input.name) != ''", error: BadRequest, message: "Project name is required" }
      - { cond: "!taken_found", error: Conflict, message: "A project with the same name already exists." }
    effects:
      # The id is drawn first, because both writes need the same one and
      # neither can borrow it from the other: inside a write effect's record,
      # `id` is THAT resource's own key -- for the index that is the project's
      # name, so `'prj_' + id` there indexes `prj_web`, a key no project has.
      # A generate effect binds under `fx` and rebinds neither `rec` nor `id`.
      - generate: { bind: pid, kind: hex, bytes: 12 }
      # The index is written first, and the order still matters: every write
      # effect rebinds `rec`, and the output projects the project from it.
      # Reversing these answers with the index row.
      - put:
          resource: project_name
          record:
            project: "'prj_' + fx.pid"
      - create:
          resource: project
          key: "'prj_' + fx.pid"
          record:
            id: "'prj_' + fx.pid"
            # `name` and `framework` live here rather than on the resource:
            # the resource record must stay input-independent because
            # UpdateProject's patch re-evaluates it.
            name: "string(input.name)"
            framework: "('framework' in input && input.framework != null) ? input.framework : null"
    output:
      id: rec.id
      name: rec.name
      accountId: rec.accountId
      createdAt: rec.createdAt
      updatedAt: rec.updatedAt
      framework: rec.framework

  GetProjects:
    list: { resource: project, member: projects }
    output:
      # Projected rather than raw since the protection-bypass work: a project
      # record may carry the bypass map, which the listed item shape does not
      # declare, and an unprojected list would answer it (and fail the loader's
      # record-members check). The projection is exactly the members every
      # create establishes, so the answer is unchanged.
      projects: "items.map(i, {'id': i.id, 'name': i.name, 'accountId': i.accountId, 'createdAt': i.createdAt, 'updatedAt': i.updatedAt, 'framework': ('framework' in i) ? i.framework : null})"
      # The pack answered `pagination.count` and nothing else. The listing is
      # unpaginated -- see the quirk -- so every project is on the one page.
      pagination: "{'count': size(items)}"

  GetProject:
    reads:
      # Two reads, not three, and in this order because reads resolve in
      # dependency order and `by_name` sorts first: the index answers whether
      # `idOrName` is a name, and the project read prefers what it found over
      # the raw input. The pack did the same lookup in Go -- key, then name
      # index, then the id the index pointed at.
      #
      # One read of `project` rather than one per spelling, because a
      # parent-scoped child names its parent by RESOURCE name: `venv:{project.id}`
      # resolves against whichever read of `project` ran last, so two of them
      # make a child's collection depend on alphabetical order. That is how the
      # environment and domain operations failed to see a project addressed by
      # name at all.
      by_name: { resource: project_name }
      proj:
        resource: project
        key: >
          by_name_found ? string(by_name.project)
            : (('idOrName' in input && input.idOrName != null) ? string(input.idOrName) : '')
    require:
      - { cond: proj_found, error: NotFound, message: "The requested resource was not found." }
    output:
      id: proj.id
      name: proj.name
      accountId: proj.accountId
      createdAt: proj.createdAt
      updatedAt: proj.updatedAt
      framework: proj.framework

  DeleteProject:
    reads:
      # Two reads, not three, and in this order because reads resolve in
      # dependency order and `by_name` sorts first: the index answers whether
      # `idOrName` is a name, and the project read prefers what it found over
      # the raw input. The pack did the same lookup in Go -- key, then name
      # index, then the id the index pointed at.
      #
      # One read of `project` rather than one per spelling, because a
      # parent-scoped child names its parent by RESOURCE name: `venv:{project.id}`
      # resolves against whichever read of `project` ran last, so two of them
      # make a child's collection depend on alphabetical order. That is how the
      # environment and domain operations failed to see a project addressed by
      # name at all.
      by_name: { resource: project_name }
      proj:
        resource: project
        key: >
          by_name_found ? string(by_name.project)
            : (('idOrName' in input && input.idOrName != null) ? string(input.idOrName) : '')
    require:
      - { cond: proj_found, error: NotFound, message: "The requested resource was not found." }
    effects:
      - delete:
          resource: project
          key: "string(proj.id)"
      # Keyed off the stored record, not the request: a delete may address the
      # project by id and never carry its name.
      - delete:
          resource: project_name
          key: "string(proj.name)"
          missing: ignore

  FilterProjectEnvs:
    reads:
      # Two reads, not three, and in this order because reads resolve in
      # dependency order and `by_name` sorts first: the index answers whether
      # `idOrName` is a name, and the project read prefers what it found over
      # the raw input. The pack did the same lookup in Go -- key, then name
      # index, then the id the index pointed at.
      #
      # One read of `project` rather than one per spelling, because a
      # parent-scoped child names its parent by RESOURCE name: `venv:{project.id}`
      # resolves against whichever read of `project` ran last, so two of them
      # make a child's collection depend on alphabetical order. That is how the
      # environment and domain operations failed to see a project addressed by
      # name at all.
      by_name: { resource: project_name }
      proj:
        resource: project
        key: >
          by_name_found ? string(by_name.project)
            : (('idOrName' in input && input.idOrName != null) ? string(input.idOrName) : '')
    require:
      - { cond: proj_found, error: NotFound, message: "The requested resource was not found." }
    # No `pagination`. The document declares the member, but the pack answered
    # it only from the two unscoped listings -- projects and deployments -- and
    # not from the two scoped ones. A member the document permits and the pack
    # never sent is not evidence of anything, so it is not sent.
    list: { resource: env, member: envs }

  CreateProjectEnv:
    reads:
      # Two reads, not three, and in this order because reads resolve in
      # dependency order and `by_name` sorts first: the index answers whether
      # `idOrName` is a name, and the project read prefers what it found over
      # the raw input. The pack did the same lookup in Go -- key, then name
      # index, then the id the index pointed at.
      #
      # One read of `project` rather than one per spelling, because a
      # parent-scoped child names its parent by RESOURCE name: `venv:{project.id}`
      # resolves against whichever read of `project` ran last, so two of them
      # make a child's collection depend on alphabetical order. That is how the
      # environment and domain operations failed to see a project addressed by
      # name at all.
      by_name: { resource: project_name }
      proj:
        resource: project
        key: >
          by_name_found ? string(by_name.project)
            : (('idOrName' in input && input.idOrName != null) ? string(input.idOrName) : '')
    require:
      - { cond: proj_found, error: NotFound, message: "The requested resource was not found." }
      - { cond: "'key' in input && input.key != null && string(input.key) != ''", error: BadRequest, message: "Env key is required" }
    effects:
      # `key`, `value`, `type` and `target` live here rather than on the
      # resource: the resource record must stay input-independent because
      # EditProjectEnv's patch re-evaluates it.
      - create:
          resource: env
          record:
            key: "string(input.key)"
            value: "('value' in input && input.value != null) ? string(input.value) : ''"
            type: "('type' in input && input.type != null) ? string(input.type) : 'encrypted'"
            target: >
              ('target' in input && input.target != null) ? input.target
                : ['production', 'preview', 'development']
    output:
      # The document declares {created, failed} for this operation where the
      # pack answered the variable itself -- see the quirk.
      created: rec
      failed: "[]"

  RemoveProjectEnv:
    reads:
      # Two reads, not three, and in this order because reads resolve in
      # dependency order and `by_name` sorts first: the index answers whether
      # `idOrName` is a name, and the project read prefers what it found over
      # the raw input. The pack did the same lookup in Go -- key, then name
      # index, then the id the index pointed at.
      #
      # One read of `project` rather than one per spelling, because a
      # parent-scoped child names its parent by RESOURCE name: `venv:{project.id}`
      # resolves against whichever read of `project` ran last, so two of them
      # make a child's collection depend on alphabetical order. That is how the
      # environment and domain operations failed to see a project addressed by
      # name at all.
      by_name: { resource: project_name }
      proj:
        resource: project
        key: >
          by_name_found ? string(by_name.project)
            : (('idOrName' in input && input.idOrName != null) ? string(input.idOrName) : '')
      variable: { resource: env }
    require:
      - { cond: proj_found, error: NotFound, message: "The requested resource was not found." }
      - { cond: variable_found, error: NotFound, message: "The requested resource was not found." }
    effects:
      - delete: { resource: env }

  GetProjectDomains:
    reads:
      # Two reads, not three, and in this order because reads resolve in
      # dependency order and `by_name` sorts first: the index answers whether
      # `idOrName` is a name, and the project read prefers what it found over
      # the raw input. The pack did the same lookup in Go -- key, then name
      # index, then the id the index pointed at.
      #
      # One read of `project` rather than one per spelling, because a
      # parent-scoped child names its parent by RESOURCE name: `venv:{project.id}`
      # resolves against whichever read of `project` ran last, so two of them
      # make a child's collection depend on alphabetical order. That is how the
      # environment and domain operations failed to see a project addressed by
      # name at all.
      by_name: { resource: project_name }
      proj:
        resource: project
        key: >
          by_name_found ? string(by_name.project)
            : (('idOrName' in input && input.idOrName != null) ? string(input.idOrName) : '')
    require:
      - { cond: proj_found, error: NotFound, message: "The requested resource was not found." }
    # No `pagination`, for the reason FilterProjectEnvs has none.
    list: { resource: domain, member: domains }
    output:
      # The listed record carries no projectId -- see the resource -- so the
      # projection puts it back, which an unprojected list could not do.
      domains: "items.map(i, merge(i, {'projectId': proj.id}))"

  AddProjectDomain:
    reads:
      # Two reads, not three, and in this order because reads resolve in
      # dependency order and `by_name` sorts first: the index answers whether
      # `idOrName` is a name, and the project read prefers what it found over
      # the raw input. The pack did the same lookup in Go -- key, then name
      # index, then the id the index pointed at.
      #
      # One read of `project` rather than one per spelling, because a
      # parent-scoped child names its parent by RESOURCE name: `venv:{project.id}`
      # resolves against whichever read of `project` ran last, so two of them
      # make a child's collection depend on alphabetical order. That is how the
      # environment and domain operations failed to see a project addressed by
      # name at all.
      by_name: { resource: project_name }
      proj:
        resource: project
        key: >
          by_name_found ? string(by_name.project)
            : (('idOrName' in input && input.idOrName != null) ? string(input.idOrName) : '')
    require:
      - { cond: proj_found, error: NotFound, message: "The requested resource was not found." }
      - { cond: "'name' in input && input.name != null && string(input.name) != ''", error: BadRequest, message: "Domain name is required" }
    effects:
      - put: { resource: domain }
    output:
      name: rec.name
      apexName: rec.apexName
      projectId: proj.id
      verified: rec.verified
      createdAt: rec.createdAt
      updatedAt: rec.updatedAt

  CreateDeployment:
    reads:
      # A deployment names its project by name, and creates it when there is
      # none. The index answers whether there is.
      by_name: { resource: project_name, key: "('project' in input && input.project != null) ? string(input.project) : (('name' in input && input.name != null) ? string(input.name) : '')" }
    require:
      - { cond: "'name' in input && input.name != null && string(input.name) != ''", error: BadRequest, message: "Deployment name is required" }
    effects:
      # Three draws, in this order, because that is the order the pack drew
      # them and the recording gates every identifier after them: the project
      # id ONLY when there is no project, then the deployment id, then the six
      # bytes in the hostname. A generate effect binds under `fx` and rebinds
      # neither `rec` nor `id`, where every write effect rebinds both -- and a
      # generate carrying `when` does not draw at all when the guard is false,
      # which is what keeps a deployment into an existing project costing two
      # draws rather than three.
      - generate: { bind: newproj, kind: hex, bytes: 12, when: "!by_name_found" }
      - generate: { bind: depid, kind: hex, bytes: 16 }
      - generate: { bind: host, kind: hex, bytes: 6 }
      - put:
          resource: project_name
          when: "!by_name_found"
          record:
            project: "'prj_' + fx.newproj"
      - create:
          resource: project
          key: "'prj_' + fx.newproj"
          when: "!by_name_found"
          record:
            id: "'prj_' + fx.newproj"
            name: "('project' in input && input.project != null) ? string(input.project) : string(input.name)"
            # A deployment create carries no framework; the member stays null,
            # which is what the resource record answered for it before the
            # member moved onto the creates.
            framework: "null"
      # The sub-resource rows the oracle writes beside a deployment: one alias
      # (the deployment's own URL), three build events, and a file descriptor
      # per entry in the body's `files`, each with its digest registered. None
      # of these draws -- the alias id reuses the deployment's draw and the
      # event keys are serials -- so the recorded draw sequence is untouched.
      - put:
          resource: deployment_alias
          key: "'als_' + fx.depid"
          record:
            uid: "'als_' + fx.depid"
            alias: "string(input.name) + '-' + fx.host + '.vercel.app'"
            deploymentId: "'dpl_' + fx.depid"
            projectId: "by_name_found ? string(by_name.project) : 'prj_' + fx.newproj"
      - put:
          resource: deployment_event
          key: "'dpl_' + fx.depid + ':1'"
          record:
            deploymentId: "'dpl_' + fx.depid"
            type: "'created'"
            payload: "{'text': 'Deployment created'}"
            date: "int(now) * 1000"
            serial: "'1'"
      - put:
          resource: deployment_event
          key: "'dpl_' + fx.depid + ':2'"
          record:
            deploymentId: "'dpl_' + fx.depid"
            type: "'building'"
            payload: "{'text': 'Building'}"
            date: "int(now) * 1000"
            serial: "'2'"
      - put:
          resource: deployment_event
          key: "'dpl_' + fx.depid + ':3'"
          record:
            deploymentId: "'dpl_' + fx.depid"
            type: "'ready'"
            payload: "{'text': 'Deployment ready'}"
            date: "int(now) * 1000"
            serial: "'3'"
      # An entry the oracle skips -- no path or no digest -- is skipped here
      # too, and the two writes share the guard so they never disagree.
      - put:
          resource: file
          for_each: "('files' in input && input.files != null) ? input.files : []"
          key: "string(item.sha)"
          when: "'sha' in item && item.sha != null && string(item.sha) != '' && 'file' in item && item.file != null && string(item.file) != ''"
          record:
            size: "('size' in item && item.size != null) ? int(item.size) : 0"
      - put:
          resource: deployment_file
          for_each: "('files' in input && input.files != null) ? input.files : []"
          key: "'dpl_' + fx.depid + ':' + string(item.sha)"
          when: "'sha' in item && item.sha != null && string(item.sha) != '' && 'file' in item && item.file != null && string(item.file) != ''"
          record:
            uid: "'f_' + string(item.sha)"
            deploymentId: "'dpl_' + fx.depid"
            name: "string(item.file)"
            type: "'file'"
            mode: "420"
            contentType: "'application/octet-stream'"
      - create:
          resource: deployment
          key: "'dpl_' + fx.depid"
          record:
            # `name` lives here rather than on the resource, because the
            # resource record must stay input-independent: CancelDeployment's
            # patch re-evaluates it.
            name: "string(input.name)"
            # Six random bytes in the hostname, which is what makes two
            # deployments of one project addressable apart.
            url: "string(input.name) + '-' + fx.host + '.vercel.app'"
            projectId: "by_name_found ? string(by_name.project) : 'prj_' + fx.newproj"
    output:
      # `id` from `uid`, because the record is also the listed item and the
      # item shape declares uid where this response declares id.
      id: rec.uid
      name: rec.name
      url: rec.url
      projectId: rec.projectId
      readyState: rec.readyState
      type: rec.type
      createdAt: rec.createdAt

  GetDeployments:
    list: { resource: deployment, member: deployments }
    output:
      pagination: "{'count': size(items)}"

  GetDeployment:
    reads:
      dep: { resource: deployment }
    require:
      - { cond: dep_found, error: NotFound, message: "The requested resource was not found." }
    output:
      id: dep.uid
      name: dep.name
      url: dep.url
      projectId: dep.projectId
      readyState: dep.readyState
      type: dep.type
      createdAt: dep.createdAt

  DeleteDeployment:
    reads:
      dep: { resource: deployment }
    require:
      - { cond: dep_found, error: NotFound, message: "The requested resource was not found." }
    effects:
      # The oracle cascades: a delete takes the deployment's aliases, events
      # and file descriptors with it.
      - delete: { resource: deployment_alias, where: "item.deploymentId == string(dep.uid)" }
      - delete: { resource: deployment_event, where: "item.deploymentId == string(dep.uid)" }
      - delete: { resource: deployment_file, where: "item.deploymentId == string(dep.uid)" }
      - delete: { resource: deployment }
    output:
      uid: dep.uid
      state: "'DELETED'"

  # The twelve below have no pack behind them: the pack never served them, so
  # there was nothing to transcribe. Each is written from the document alone
  # -- its path, its declared response members, its status -- and keeps to the
  # state the fourteen above establish. Where the document is thin the
  # behavior is minimal and `quirks` says so.

  UpdateProject:
    reads:
      # The same by_name-then-project pair every project-scoped operation
      # here resolves: `idOrName` may be the key or the name the index holds.
      by_name: { resource: project_name }
      proj:
        resource: project
        key: >
          by_name_found ? string(by_name.project)
            : (('idOrName' in input && input.idOrName != null) ? string(input.idOrName) : '')
      # A rename collides with whatever already holds the new name. The index
      # derive would answer for `idOrName` rather than the new name, so the
      # key is explicit.
      taken:
        resource: project_name
        key: "('name' in input && input.name != null) ? string(input.name) : ''"
    require:
      - { cond: proj_found, error: NotFound, message: "The requested resource was not found." }
      - { cond: "!('name' in input) || input.name == null || string(input.name) != ''", error: BadRequest, message: "Project name is required" }
      - { cond: "!taken_found || string(input.name) == string(proj.name)", error: Conflict, message: "A project with the same name already exists." }
    effects:
      # The old name is freed and the new one claimed only when the name
      # actually moves; renaming to the current name is not a collision with
      # itself. `id` in the patch's record is the key the read resolved --
      # without the explicit member the resource record would prefix it a
      # second time and the row would move.
      - delete:
          resource: project_name
          key: "string(proj.name)"
          when: "'name' in input && input.name != null && string(input.name) != string(proj.name)"
      - put:
          resource: project_name
          key: "string(input.name)"
          when: "'name' in input && input.name != null && string(input.name) != string(proj.name)"
          record:
            project: "string(proj.id)"
      - patch:
          resource: project
          # Explicit key: the read resolved the id (possibly through the name
          # index), and without this the write re-resolves from
          # `input.idOrName` -- the NAME -- and merges against the wrong row.
          key: "string(proj.id)"
          record:
            id: id
            name: "('name' in input && input.name != null) ? string(input.name) : string(proj.name)"
            framework: "('framework' in input) ? input.framework : proj.framework"
    output:
      id: rec.id
      name: rec.name
      accountId: rec.accountId
      createdAt: rec.createdAt
      updatedAt: rec.updatedAt
      framework: rec.framework

  EditProjectEnv:
    reads:
      by_name: { resource: project_name }
      proj:
        resource: project
        key: >
          by_name_found ? string(by_name.project)
            : (('idOrName' in input && input.idOrName != null) ? string(input.idOrName) : '')
      variable: { resource: env }
    require:
      - { cond: proj_found, error: NotFound, message: "The requested resource was not found." }
      - { cond: variable_found, error: NotFound, message: "The requested resource was not found." }
      - { cond: "!('key' in input) || input.key == null || string(input.key) != ''", error: BadRequest, message: "Env key is required" }
    effects:
      # One patch, every member falling back to what the read found: a member
      # the request did not carry keeps its value. `id` is explicit for the
      # reason UpdateProject's is.
      - patch:
          resource: env
          # Explicit key, as UpdateProject's: here `input.id` happens to be
          # the store key already, but the write should address the record the
          # operation read, not re-derive one from the request.
          key: "string(variable.id)"
          record:
            id: id
            key: "('key' in input && input.key != null) ? string(input.key) : string(variable.key)"
            value: "('value' in input && input.value != null) ? string(input.value) : string(variable.value)"
            type: "('type' in input && input.type != null) ? string(input.type) : string(variable.type)"
            target: "('target' in input && input.target != null) ? input.target : variable.target"
    output:
      id: rec.id
      key: rec.key
      value: rec.value
      type: rec.type
      target: rec.target

  GetProjectDomain:
    reads:
      by_name: { resource: project_name }
      proj:
        resource: project
        key: >
          by_name_found ? string(by_name.project)
            : (('idOrName' in input && input.idOrName != null) ? string(input.idOrName) : '')
      dom: { resource: domain }
    require:
      - { cond: proj_found, error: NotFound, message: "The requested resource was not found." }
      - { cond: dom_found, error: NotFound, message: "The requested resource was not found." }
    output:
      name: dom.name
      apexName: dom.apexName
      projectId: proj.id
      verified: dom.verified
      createdAt: dom.createdAt
      updatedAt: dom.updatedAt
      # The three an update can set are null until one does: the shape
      # declares them optional, and an add does not establish them.
      gitBranch: "('gitBranch' in dom) ? dom.gitBranch : null"
      redirect: "('redirect' in dom) ? dom.redirect : null"
      redirectStatusCode: "('redirectStatusCode' in dom) ? dom.redirectStatusCode : null"

  UpdateProjectDomain:
    reads:
      by_name: { resource: project_name }
      proj:
        resource: project
        key: >
          by_name_found ? string(by_name.project)
            : (('idOrName' in input && input.idOrName != null) ? string(input.idOrName) : '')
      dom: { resource: domain }
    require:
      - { cond: proj_found, error: NotFound, message: "The requested resource was not found." }
      - { cond: dom_found, error: NotFound, message: "The requested resource was not found." }
    effects:
      # The unconditional patch refreshes updatedAt and guarantees `rec` for
      # the output; each conditional one stores a member only when the request
      # carried it, so an absent member stays absent from the record rather
      # than becoming null -- the same split CodeCommit's repository
      # description needed.
      - patch:
          resource: domain
          record:
            updatedAt: "int(now) * 1000"
      - patch:
          resource: domain
          when: "'gitBranch' in input"
          record:
            gitBranch: "input.gitBranch"
      - patch:
          resource: domain
          when: "'redirect' in input"
          record:
            redirect: "input.redirect"
      - patch:
          resource: domain
          when: "'redirectStatusCode' in input"
          record:
            redirectStatusCode: "input.redirectStatusCode"
    output:
      name: rec.name
      apexName: rec.apexName
      projectId: proj.id
      verified: rec.verified
      createdAt: rec.createdAt
      updatedAt: rec.updatedAt
      gitBranch: "('gitBranch' in rec) ? rec.gitBranch : null"
      redirect: "('redirect' in rec) ? rec.redirect : null"
      redirectStatusCode: "('redirectStatusCode' in rec) ? rec.redirectStatusCode : null"

  RemoveProjectDomain:
    reads:
      by_name: { resource: project_name }
      proj:
        resource: project
        key: >
          by_name_found ? string(by_name.project)
            : (('idOrName' in input && input.idOrName != null) ? string(input.idOrName) : '')
      dom: { resource: domain }
    require:
      - { cond: proj_found, error: NotFound, message: "The requested resource was not found." }
      - { cond: dom_found, error: NotFound, message: "The requested resource was not found." }
    effects:
      - delete: { resource: domain }
    # No output: the response shape declares no members. `removeRedirects` is
    # accepted and read by nothing -- there are no redirects to remove.

  VerifyProjectDomain:
    reads:
      by_name: { resource: project_name }
      proj:
        resource: project
        key: >
          by_name_found ? string(by_name.project)
            : (('idOrName' in input && input.idOrName != null) ? string(input.idOrName) : '')
      dom: { resource: domain }
    require:
      - { cond: proj_found, error: NotFound, message: "The requested resource was not found." }
      - { cond: dom_found, error: NotFound, message: "The requested resource was not found." }
    # No effects: the domain is verified from creation, which is the add's
    # quirk, so there is nothing for verify to move. It answers the domain.
    output:
      name: dom.name
      apexName: dom.apexName
      projectId: proj.id
      verified: dom.verified
      createdAt: dom.createdAt
      updatedAt: dom.updatedAt
      gitBranch: "('gitBranch' in dom) ? dom.gitBranch : null"
      redirect: "('redirect' in dom) ? dom.redirect : null"
      redirectStatusCode: "('redirectStatusCode' in dom) ? dom.redirectStatusCode : null"

  CreateCustomEnvironment:
    reads:
      by_name: { resource: project_name }
      proj:
        resource: project
        key: >
          by_name_found ? string(by_name.project)
            : (('idOrName' in input && input.idOrName != null) ? string(input.idOrName) : '')
      taken: { resource: custom_environment_slug }
    require:
      - { cond: proj_found, error: NotFound, message: "The requested resource was not found." }
      - { cond: "'slug' in input && input.slug != null && string(input.slug) != ''", error: BadRequest, message: "Environment slug is required" }
      - { cond: "!taken_found", error: Conflict, message: "A custom environment with the same slug already exists." }
    effects:
      # The id is drawn first, because both writes need the same one and
      # neither can borrow it from the other -- the project's two-write
      # pattern. The index is written first because every write rebinds `rec`
      # and the output projects the environment from it.
      - generate: { bind: eid, kind: hex, bytes: 10 }
      - put:
          resource: custom_environment_slug
          record:
            environment: "'env_' + fx.eid"
      - create:
          resource: custom_environment
          key: "'env_' + fx.eid"
          record:
            id: "'env_' + fx.eid"
            slug: "string(input.slug)"
            # Both members are always written, so every record carries them
            # and the listing is uniform; an update's fallback can rely on
            # them being there.
            description: "('description' in input && input.description != null) ? string(input.description) : ''"
            branchMatcher: "('branchMatcher' in input && input.branchMatcher != null) ? input.branchMatcher : null"
    output:
      id: rec.id
      slug: rec.slug
      type: rec.type
      description: rec.description
      branchMatcher: rec.branchMatcher
      createdAt: rec.createdAt
      updatedAt: rec.updatedAt

  GetProjectsByIdOrNameCustomEnvironments:
    reads:
      by_name: { resource: project_name }
      proj:
        resource: project
        key: >
          by_name_found ? string(by_name.project)
            : (('idOrName' in input && input.idOrName != null) ? string(input.idOrName) : '')
    require:
      - { cond: proj_found, error: NotFound, message: "The requested resource was not found." }
    list: { resource: custom_environment, member: environments }
    output:
      # A fixed limit: the document declares the member's shape and no value
      # for it -- see the quirk.
      accountLimit: "{'total': 12}"

  GetCustomEnvironment:
    reads:
      by_name: { resource: project_name }
      proj:
        resource: project
        key: >
          by_name_found ? string(by_name.project)
            : (('idOrName' in input && input.idOrName != null) ? string(input.idOrName) : '')
      # The by_slug-then-environment pair is the project's by_name pattern
      # one level down: `environmentSlugOrId` may be the id or the slug the
      # index holds.
      by_slug: { resource: custom_environment_slug }
      cenv:
        resource: custom_environment
        key: >
          by_slug_found ? string(by_slug.environment)
            : (('environmentSlugOrId' in input && input.environmentSlugOrId != null) ? string(input.environmentSlugOrId) : '')
    require:
      - { cond: proj_found, error: NotFound, message: "The requested resource was not found." }
      - { cond: cenv_found, error: NotFound, message: "The requested resource was not found." }
    output:
      id: cenv.id
      slug: cenv.slug
      type: cenv.type
      description: cenv.description
      branchMatcher: cenv.branchMatcher
      createdAt: cenv.createdAt
      updatedAt: cenv.updatedAt

  UpdateCustomEnvironment:
    reads:
      by_name: { resource: project_name }
      proj:
        resource: project
        key: >
          by_name_found ? string(by_name.project)
            : (('idOrName' in input && input.idOrName != null) ? string(input.idOrName) : '')
      by_slug: { resource: custom_environment_slug }
      cenv:
        resource: custom_environment
        key: >
          by_slug_found ? string(by_slug.environment)
            : (('environmentSlugOrId' in input && input.environmentSlugOrId != null) ? string(input.environmentSlugOrId) : '')
    require:
      - { cond: proj_found, error: NotFound, message: "The requested resource was not found." }
      - { cond: cenv_found, error: NotFound, message: "The requested resource was not found." }
    effects:
      # One patch, both members falling back to what the read found; the
      # create writes both unconditionally, so the fallback keys are always
      # there. `id` is explicit for UpdateProject's reason.
      - patch:
          resource: custom_environment
          # Explicit key: addressed by slug, the write would otherwise
          # re-resolve from `input.environmentSlugOrId` -- the SLUG -- and
          # merge against an empty row, losing every member it does not set.
          key: "string(cenv.id)"
          record:
            id: id
            description: "('description' in input && input.description != null) ? string(input.description) : string(cenv.description)"
            branchMatcher: "('branchMatcher' in input && input.branchMatcher != null) ? input.branchMatcher : cenv.branchMatcher"
    output:
      id: rec.id
      slug: rec.slug
      type: rec.type
      description: rec.description
      branchMatcher: rec.branchMatcher
      createdAt: rec.createdAt
      updatedAt: rec.updatedAt

  RemoveCustomEnvironment:
    reads:
      by_name: { resource: project_name }
      proj:
        resource: project
        key: >
          by_name_found ? string(by_name.project)
            : (('idOrName' in input && input.idOrName != null) ? string(input.idOrName) : '')
      by_slug: { resource: custom_environment_slug }
      cenv:
        resource: custom_environment
        key: >
          by_slug_found ? string(by_slug.environment)
            : (('environmentSlugOrId' in input && input.environmentSlugOrId != null) ? string(input.environmentSlugOrId) : '')
    require:
      - { cond: proj_found, error: NotFound, message: "The requested resource was not found." }
      - { cond: cenv_found, error: NotFound, message: "The requested resource was not found." }
    effects:
      - delete: { resource: custom_environment }
      # Keyed off the stored record, not the request: a remove may address the
      # environment by id and never carry its slug.
      - delete:
          resource: custom_environment_slug
          key: "string(cenv.slug)"
          missing: ignore
    # The document answers the removed environment, so this does too.
    # `deleteUnassignedEnvironmentVariables` is accepted and read by nothing.
    output:
      id: cenv.id
      slug: cenv.slug
      type: cenv.type
      description: cenv.description
      branchMatcher: cenv.branchMatcher
      createdAt: cenv.createdAt
      updatedAt: cenv.updatedAt

  RequestPromote:
    reads:
      # The label is spelled `projectId`, which the name index's derive does
      # not know, so the key is explicit; addressing by name still works
      # through the index, as it does everywhere else here.
      by_name:
        resource: project_name
        key: "('projectId' in input && input.projectId != null) ? string(input.projectId) : ''"
      proj:
        resource: project
        key: >
          by_name_found ? string(by_name.project)
            : (('projectId' in input && input.projectId != null) ? string(input.projectId) : '')
      dep:
        resource: deployment
        key: "('deploymentId' in input && input.deploymentId != null) ? string(input.deploymentId) : ''"
    require:
      - { cond: proj_found, error: NotFound, message: "The requested resource was not found." }
      - { cond: dep_found, error: NotFound, message: "The requested resource was not found." }
    # No effects and no output: the document declares an empty 201, and a
    # promote moves no state a client of this surface can read back -- see the
    # quirk.

  # The eleven below close the gap against the vendor-authored oracle
  # (vercel-labs/emulate, pinned in specs/vercel/emulate-inventory.json) that
  # the vendored document covers: teams, the deployment sub-resources, file
  # upload registration, promote aliases and protection bypass. Each is
  # written from the document's shapes and the oracle's route behavior; where
  # the two disagree the document wins and `quirks` says so.

  GetTeams:
    # Teams are account fixtures and nothing here creates one -- the vendored
    # document has no POST /v2/teams -- so this lists whatever records exist,
    # initially none. Unpaginated, as GetProjects is.
    list: { resource: team, member: teams }
    output:
      pagination: "{'count': size(items), 'next': null, 'prev': null}"

  GetTeam:
    reads:
      by_slug: { resource: team_slug, key: "string(input.teamId)" }
      team:
        resource: team
        key: "by_slug_found ? string(by_slug.team) : string(input.teamId)"
    require:
      - { cond: team_found, error: NotFound, message: "Team not found" }
    output:
      # The oracle's formatTeam subset. Every member beyond the key is
      # guarded: a fixture row carries only what a patch has written.
      id: team.id
      slug: "('slug' in team) ? team.slug : null"
      name: "('name' in team) ? team.name : null"
      avatar: "('avatar' in team) ? team.avatar : null"
      description: "('description' in team) ? team.description : null"
      creatorId: "('creatorId' in team) ? team.creatorId : null"
      createdAt: "('createdAt' in team) ? team.createdAt : null"
      updatedAt: "('updatedAt' in team) ? team.updatedAt : null"
      membership: "('membership' in team) ? team.membership : {'confirmed': true, 'role': 'OWNER'}"
      billing: "('billing' in team) ? team.billing : {'plan': 'hobby', 'period': null, 'trial': null, 'cancelation': null, 'addons': null}"
      resourceConfig: "('resourceConfig' in team) ? team.resourceConfig : {'nodeType': 'standard', 'concurrentBuilds': 1}"
      stagingPrefix: "('stagingPrefix' in team) ? team.stagingPrefix : ''"

  PatchTeam:
    reads:
      by_slug: { resource: team_slug, key: "string(input.teamId)" }
      team:
        resource: team
        key: "by_slug_found ? string(by_slug.team) : string(input.teamId)"
    require:
      - { cond: team_found, error: NotFound, message: "Team not found" }
    effects:
      # The unconditional patch refreshes updatedAt and guarantees `rec` for
      # the output; each conditional one stores a member only when the request
      # carried it -- UpdateProjectDomain's split. A null description clears
      # the member, as the oracle's does. The document declares some thirty
      # more members on the update; the oracle honors only these four, so only
      # these are stored.
      - patch:
          resource: team
          record:
            id: id
      - patch:
          resource: team
          when: "'name' in input && input.name != null"
          record:
            name: "string(input.name)"
      - patch:
          resource: team
          when: "'slug' in input && input.slug != null"
          record:
            slug: "string(input.slug)"
      - patch:
          resource: team
          when: "'description' in input"
          record:
            description: "input.description"
      - patch:
          resource: team
          when: "'avatar' in input"
          record:
            avatar: "input.avatar"
    output:
      id: rec.id
      slug: "('slug' in rec) ? rec.slug : null"
      name: "('name' in rec) ? rec.name : null"
      avatar: "('avatar' in rec) ? rec.avatar : null"
      description: "('description' in rec) ? rec.description : null"
      creatorId: "('creatorId' in rec) ? rec.creatorId : null"
      createdAt: "('createdAt' in rec) ? rec.createdAt : null"
      updatedAt: "('updatedAt' in rec) ? rec.updatedAt : null"
      membership: "('membership' in rec) ? rec.membership : {'confirmed': true, 'role': 'OWNER'}"
      billing: "('billing' in rec) ? rec.billing : {'plan': 'hobby', 'period': null, 'trial': null, 'cancelation': null, 'addons': null}"
      resourceConfig: "('resourceConfig' in rec) ? rec.resourceConfig : {'nodeType': 'standard', 'concurrentBuilds': 1}"
      stagingPrefix: "('stagingPrefix' in rec) ? rec.stagingPrefix : ''"

  InviteUserToTeam:
    reads:
      team: { resource: team }
      # The document's body is a list of {email, role, projects}; the oracle's
      # is a single {uid|email, role}. The 409 check names the first entry, as
      # the single-entry request every client of the oracle sends.
      member:
        resource: team_member
        key: >
          ('body' in input && input.body != null && size(input.body) > 0
            && 'email' in input.body[0] && input.body[0].email != null)
            ? string(input.teamId) + ':' + string(input.body[0].email) : ''
    require:
      - { cond: team_found, error: NotFound, message: "Team not found" }
      - { cond: "'body' in input && input.body != null && size(input.body) > 0", error: BadRequest, message: "Provide uid or email" }
      - { cond: "'email' in input.body[0] && input.body[0].email != null && string(input.body[0].email) != ''", error: BadRequest, message: "Provide uid or email" }
      # The oracle's four roles, not the document's eight: the oracle 400s the
      # rest, and the model check does not enforce the enum.
      - { cond: "!('role' in input.body[0]) || input.body[0].role == null || ['OWNER', 'MEMBER', 'DEVELOPER', 'VIEWER'].exists(r, r == string(input.body[0].role))", error: BadRequest, message: "Invalid role" }
      - { cond: "!member_found", error: MemberAlreadyExists, message: "User is already a member of this team" }
    effects:
      - put:
          resource: team_member
          for_each: input.body
          key: "string(input.teamId) + ':' + string(item.email)"
          record:
            teamId: "string(input.teamId)"
            email: "string(item.email)"
            # There is no user store to resolve an email against, so the uid
            # is derived deterministically from the address rather than drawn
            # -- and the oracle's 404 for an unknown user cannot fire.
            uid: "'usr_' + substr(md5hex(string(item.email)), 0, 20)"
            username: "string(item.email)"
            role: "('role' in item && item.role != null) ? string(item.role) : 'MEMBER'"
            confirmed: "true"
            joinedFrom: "'email'"
    output:
      # The last row written, which for the single-entry body is the only one.
      email: rec.email
      role: rec.role
      uid: rec.uid
      username: rec.username

  ListDeploymentAliases:
    reads:
      dep: { resource: deployment }
    require:
      - { cond: dep_found, error: NotFound, message: "The requested resource was not found." }
    list:
      resource: deployment_alias
      member: aliases
      filter: "item.deploymentId == string(dep.uid)"
    output:
      # The oracle answers {uid, alias, deploymentId, projectId}; the
      # document's item shape declares uid and alias but neither id, so the
      # projection answers the two a reader of the document can rely on. The
      # document also requires a `created` the oracle never sends; it is
      # omitted, as the oracle omits it.
      aliases: "items.map(a, {'uid': a.uid, 'alias': a.alias})"

  GetDeploymentEvents:
    reads:
      dep: { resource: deployment }
    require:
      - { cond: dep_found, error: NotFound, message: "The requested resource was not found." }
    list:
      resource: deployment_event
      member: _list
      filter: "item.deploymentId == string(dep.uid)"
    output:
      # The store orders by key, which is serial order; the oracle's default
      # direction is backward -- newest first -- so the projection reverses.
      # `direction`, `limit` and the rest are accepted and read by nothing,
      # as GetProjects' pagination members are.
      _list: "indices(items).map(i, items[size(items) - 1 - i]).map(e, {'type': e.type, 'payload': e.payload, 'date': e.date, 'serial': e.serial})"

  ListDeploymentFiles:
    reads:
      dep: { resource: deployment }
    require:
      - { cond: dep_found, error: NotFound, message: "The requested resource was not found." }
    effects:
      # The tree's root node carries a drawn uid, as the oracle's does.
      - generate: { bind: root, kind: hex, bytes: 10 }
    list:
      resource: deployment_file
      member: _list
      filter: "item.deploymentId == string(dep.uid)"
    output:
      # The document answers a bare FileTree array where the oracle wraps the
      # same tree in {files: [...]}; the document wins, as it does everywhere
      # here. The tree is flat -- paths are not split into directory nodes the
      # way the oracle splits them -- which `quirks` records.
      _list: >
        [{'uid': 'file_' + fx.root, 'name': '/', 'type': 'directory', 'mode': 16877, 'contentType': null,
          'children': items.map(f, {'uid': f.uid, 'name': f.name, 'type': 'file', 'mode': f.mode, 'contentType': f.contentType, 'children': []})}]

  CancelDeployment:
    reads:
      dep: { resource: deployment }
    require:
      - { cond: dep_found, error: NotFound, message: "The requested resource was not found." }
      # The oracle refuses unless the deployment is QUEUED or BUILDING, and
      # its deployments are born READY -- so strictly transcribed the guard
      # would refuse every cancel. This refuses only a second cancel, which is
      # the reachable half of the guard.
      - { cond: "dep.readyState != 'CANCELED'", error: BadRequest, message: "Deployment cannot be canceled in its current state" }
    effects:
      # The event write comes first: every write rebinds `rec`, and the output
      # projects the deployment from it. `canceledAt` is answered at cancel
      # time but not stored -- the listed deployment's item shape does not
      # declare it, and a listed record is the item.
      - put:
          resource: deployment_event
          key: "string(dep.uid) + ':canceled'"
          record:
            deploymentId: "string(dep.uid)"
            type: "'canceled'"
            payload: "{'text': 'Deployment canceled'}"
            date: "int(now) * 1000"
            serial: "string(int(now) * 1000)"
      - patch:
          resource: deployment
          key: "string(dep.uid)"
          record:
            uid: id
            readyState: "'CANCELED'"
            state: "'CANCELED'"
    output:
      id: rec.uid
      name: rec.name
      url: rec.url
      projectId: rec.projectId
      readyState: rec.readyState
      type: rec.type
      createdAt: rec.createdAt
      canceledAt: "int(now) * 1000"

  UploadFile:
    require:
      - { cond: "('x-vercel-digest' in input && input['x-vercel-digest'] != null && string(input['x-vercel-digest']) != '') || ('x-now-digest' in input && input['x-now-digest'] != null && string(input['x-now-digest']) != '')", error: BadRequest, message: "Missing x-vercel-digest header" }
    effects:
      # A re-upload of a known digest merges where the oracle keeps the first
      # registration; the quirk records it.
      - put:
          resource: file
          record:
            size: "('Content-Length' in input && input['Content-Length'] != null) ? int(input['Content-Length']) : 0"
    # No output: the document's 200 is a oneOf of {urls: [...]} and an empty
    # object, and the oracle answers a bare empty array, which is neither. The
    # empty object is the one arm the model can serialize.

  ListPromoteAliases:
    reads:
      # The label is spelled `projectId`, as RequestPromote's is, so the index
      # and the project read carry the same explicit keys.
      by_name:
        resource: project_name
        key: "('projectId' in input && input.projectId != null) ? string(input.projectId) : ''"
      proj:
        resource: project
        key: >
          by_name_found ? string(by_name.project)
            : (('projectId' in input && input.projectId != null) ? string(input.projectId) : '')
    require:
      - { cond: proj_found, error: NotFound, message: "The requested resource was not found." }
    list:
      resource: deployment_alias
      member: aliases
      filter: "item.projectId == string(proj.id)"
    output:
      # The document's arm is {aliases: [{alias, id, status}], pagination},
      # where the oracle answers {status, alias: [...]} -- a shape the model
      # cannot serialize, so the document wins. Every deployment here is READY
      # from creation, which is the oracle's PROMOTED condition.
      aliases: "items.map(a, {'alias': a.alias, 'id': a.uid, 'status': 'PROMOTED'})"
      pagination: "{'count': size(items), 'next': null, 'prev': null}"

  UpdateProjectProtectionBypass:
    reads:
      by_name: { resource: project_name }
      proj:
        resource: project
        key: >
          by_name_found ? string(by_name.project)
            : (('idOrName' in input && input.idOrName != null) ? string(input.idOrName) : '')
    require:
      - { cond: proj_found, error: NotFound, message: "The requested resource was not found." }
    effects:
      # The map lives on the project record: the response keys bypass metadata
      # BY secret, and no expression can fold a row collection into a map.
      # GetProjects projects its items so the member never leaks into a
      # listing. The draws are guarded the way CreateDeployment's project draw
      # is: a request without that action does not draw.
      - generate:
          bind: pbs
          kind: hex
          bytes: 16
          # Only a generate that left the secret to us draws; a caller-chosen
          # secret is honored instead, which the document's body declares.
          when: "'generate' in input && input.generate != null && !('secret' in input.generate && input.generate.secret != null)"
      - generate:
          bind: resec
          kind: hex
          bytes: 16
          # A regenerate of a secret the project does not hold draws and
          # discards: the alternative is a guard that cannot see a secret the
          # same request's generate just created, and a guard that misses the
          # draw while the patch below fires answers 500.
          when: "'revoke' in input && input.revoke != null && 'regenerate' in input.revoke && input.revoke.regenerate == true"
      # The unconditional patch refreshes updatedAt and guarantees `rec` for
      # the output; the guarded ones read rec, so they chain.
      - patch:
          resource: project
          key: "string(proj.id)"
          record:
            id: id
      - patch:
          resource: project
          key: "string(proj.id)"
          when: "'generate' in input && input.generate != null"
          record:
            id: id
            protectionBypass: >
              merge(('protectionBypass' in rec && rec.protectionBypass != null) ? rec.protectionBypass : {},
                {('secret' in input.generate && input.generate.secret != null) ? string(input.generate.secret) : fx.pbs:
                  {'createdAt': int(now) * 1000, 'createdBy': 'usr_' + identity.account, 'scope': 'automation-bypass',
                   'note': ('note' in input.generate && input.generate.note != null) ? input.generate.note : null}})
      - patch:
          resource: project
          key: "string(proj.id)"
          when: "'revoke' in input && input.revoke != null && !('regenerate' in input.revoke && input.revoke.regenerate == true)"
          record:
            id: id
            protectionBypass: >
              without(('protectionBypass' in rec && rec.protectionBypass != null) ? rec.protectionBypass : {},
                [string(input.revoke.secret)])
      # Regenerate keeps the entry's note and scope under a fresh secret, as
      # the oracle does.
      - patch:
          resource: project
          key: "string(proj.id)"
          when: "'revoke' in input && input.revoke != null && ('regenerate' in input.revoke && input.revoke.regenerate == true) && 'protectionBypass' in rec && rec.protectionBypass != null && string(input.revoke.secret) in rec.protectionBypass"
          record:
            id: id
            protectionBypass: >
              merge(without(rec.protectionBypass, [string(input.revoke.secret)]),
                {fx.resec: merge(rec.protectionBypass[string(input.revoke.secret)],
                  {'createdAt': int(now) * 1000, 'createdBy': 'usr_' + identity.account})})
      - patch:
          resource: project
          key: "string(proj.id)"
          when: "'update' in input && input.update != null && 'protectionBypass' in rec && rec.protectionBypass != null && string(input.update.secret) in rec.protectionBypass"
          record:
            id: id
            protectionBypass: >
              merge(rec.protectionBypass,
                {string(input.update.secret): merge(rec.protectionBypass[string(input.update.secret)],
                  {'note': ('note' in input.update && input.update.note != null) ? input.update.note : null,
                   'isEnvVar': ('isEnvVar' in input.update && input.update.isEnvVar != null) ? input.update.isEnvVar : false})})
    output:
      protectionBypass: "('protectionBypass' in rec && rec.protectionBypass != null) ? rec.protectionBypass : {}"

  # --- Auth supplement: the routes the vendored document never declares and
  # the vendor's own emulator serves. Auth is enforced on these the way the
  # oracle enforces it (401 without a Bearer), where the older operations
  # above predate that and stay open -- the asymmetry is recorded in quirks.

  CreateTeam:
    reads:
      clash: { resource: team_slug, key: "('slug' in input && input.slug != null) ? trim(string(input.slug)) : ''" }
    require:
      - { cond: "'authorization' in input && input.authorization != null && string(input.authorization) != ''", error: NotAuthenticated, message: "Authentication required" }
      - { cond: "trim(string(input.slug)) != ''", error: BadRequest, message: "Missing required field: slug" }
      - { cond: "!clash_found", error: TeamSlugAlreadyExists, message: "A team with this slug already exists" }
    effects:
      - generate: { bind: tid, kind: hex, bytes: 8 }
      # The creator is the first member, so the member listing of a fresh
      # team is not empty. Written first, because `rec` for the output is the
      # LAST write's record and the output is the team's.
      - put:
          resource: team_member
          key: "'team_' + fx.tid + ':test'"
          record:
            team: "'team_' + fx.tid"
            uid: "'usr_' + identity.account"
            username: "'test'"
            email: "'test@mirror.cloud'"
            role: "'OWNER'"
      - put:
          resource: team_slug
          key: "trim(string(input.slug))"
          record:
            team: "'team_' + fx.tid"
      - put:
          resource: team
          key: "'team_' + fx.tid"
          record:
            id: "'team_' + fx.tid"
            slug: "trim(string(input.slug))"
            name: "('name' in input && input.name != null && trim(string(input.name)) != '') ? trim(string(input.name)) : trim(string(input.slug))"
            creatorId: "'usr_' + identity.account"
            createdAt: "int(now) * 1000"
            updatedAt: "int(now) * 1000"
            membership: "{'confirmed': true, 'role': 'OWNER'}"
    output:
      id: rec.id
      slug: rec.slug
      name: rec.name
      creatorId: rec.creatorId
      createdAt: rec.createdAt
      updatedAt: rec.updatedAt
      membership: "{'confirmed': true, 'role': 'OWNER'}"

  ListTeamMembers:
    reads:
      by_slug: { resource: team_slug, key: "string(input.teamId)" }
      team:
        resource: team
        key: "by_slug_found ? string(by_slug.team) : string(input.teamId)"
    require:
      - { cond: "'authorization' in input && input.authorization != null && string(input.authorization) != ''", error: NotAuthenticated, message: "Authentication required" }
      - { cond: team_found, error: NotFound, message: "Team not found" }
    select:
      binding: members
      resource: team_member
      filter: "string(item.team) == string(team.id)"
    output:
      members: "members.map(m, {'uid': string(m.uid), 'username': string(m.username), 'email': string(m.email), 'role': string(m.role)})"
      pagination: "{'count': size(members), 'next': null, 'prev': null}"

  UpdateAuthUser:
    require:
      - { cond: "'authorization' in input && input.authorization != null && string(input.authorization) != ''", error: NotAuthenticated, message: "Authentication required" }
    reads:
      u: { resource: user }
    effects:
      # The base patch binds rec to the record as it stands, so the output
      # reads the post-write answer even when the body named neither member.
      - patch:
          resource: user
          record: {}
      - patch:
          resource: user
          when: "'name' in input"
          record:
            name: "input.name == null ? '' : string(input.name)"
      - patch:
          resource: user
          when: "'email' in input"
          record:
            email: "input.email == null ? '' : string(input.email)"
    output:
      user: >
        {
          'id': 'usr_' + identity.account,
          'email': ('email' in rec) ? rec.email : 'test@mirror.cloud',
          'name': ('name' in rec) ? rec.name : 'Mirror',
          'username': 'test'
        }

  GetRegistration:
    # The oracle's constant: registration is closed.
    output:
      registration: "false"

  GetDeploymentsV6:
    # The v6 listing is the v7 listing: the oracle serves both versions from
    # one handler, and the vendored document declares only v7.
    list: { resource: deployment, member: deployments }
    output:
      pagination: "{'count': size(items)}"

  GetProjectEnv:
    reads:
      # The project's two-spelling resolution, the same as every other env
      # operation: the parent scope names project.id, which nothing resolves
      # unless the project is read.
      by_name: { resource: project_name }
      proj:
        resource: project
        key: >
          by_name_found ? string(by_name.project)
            : (('idOrName' in input && input.idOrName != null) ? string(input.idOrName) : '')
      v: { resource: env }
    require:
      - { cond: proj_found, error: NotFound, message: "The requested resource was not found." }
      - { cond: v_found, error: NotFound, message: "Environment Variable not found" }
    output:
      id: v.id
      key: "('key' in v) ? v.key : null"
      value: "('value' in v) ? v.value : null"
      type: "('type' in v) ? v.type : null"
      target: "('target' in v) ? v.target : null"
      createdAt: "('createdAt' in v) ? v.createdAt : null"
      updatedAt: "('updatedAt' in v) ? v.updatedAt : null"

  CreateApiKey:
    require:
      - { cond: "'authorization' in input && input.authorization != null && string(input.authorization) != ''", error: NotAuthenticated, message: "Authentication required" }
    effects:
      - generate: { bind: kid, kind: hex, bytes: 8 }
      - generate: { bind: tok, kind: hex, bytes: 24 }
      - put:
          resource: api_key
          key: "'ak_' + fx.kid"
          record:
            id: "'ak_' + fx.kid"
            name: "('name' in input && input.name != null && string(input.name) != '') ? string(input.name) : 'API Key'"
            teamId: "('teamId' in input && input.teamId != null && string(input.teamId) != '') ? dyn(string(input.teamId)) : dyn(null)"
            createdAt: "int(now) * 1000"
    output:
      apiKeyString: "'vercel_api_' + fx.tok"
      apiKey: "{'id': rec.id, 'name': rec.name, 'teamId': rec.teamId, 'createdAt': rec.createdAt}"

  ListApiKeys:
    require:
      - { cond: "'authorization' in input && input.authorization != null && string(input.authorization) != ''", error: NotAuthenticated, message: "Authentication required" }
    list:
      resource: api_key
      member: keys
      filter: "!('teamId' in input) || input.teamId == null || string(input.teamId) == '' || string(item.teamId) == string(input.teamId)"
    output:
      keys: "items.map(k, {'id': k.id, 'name': k.name, 'teamId': k.teamId, 'createdAt': k.createdAt})"

  DeleteApiKey:
    reads:
      k: { resource: api_key, key: "string(input.keyId)" }
    require:
      - { cond: "'authorization' in input && input.authorization != null && string(input.authorization) != ''", error: NotAuthenticated, message: "Authentication required" }
      - { cond: k_found, error: NotFound, message: "API key not found" }
    effects:
      - delete: { resource: api_key, key: "string(input.keyId)", missing: ignore }
    output: {}

  OauthAuthorize:
    # The sign-in page. The oracle renders a card per seeded user; mirror has
    # one user, so the page is one form posting that user back with every
    # parameter carried through. The markup is mirror's own -- a browser flow
    # needs a working form, not the oracle's pixels.
    output:
      page: >
        '<!doctype html><html><head><title>Sign in to Vercel</title></head><body>'
        + '<h1>Sign in to Vercel</h1>'
        + '<form method="post" action="/oauth/authorize/callback">'
        + '<input type="hidden" name="client_id" value="' + ('client_id' in input && input.client_id != null ? string(input.client_id) : '') + '">'
        + '<input type="hidden" name="redirect_uri" value="' + ('redirect_uri' in input && input.redirect_uri != null ? string(input.redirect_uri) : '') + '">'
        + '<input type="hidden" name="scope" value="' + ('scope' in input && input.scope != null ? string(input.scope) : '') + '">'
        + '<input type="hidden" name="state" value="' + ('state' in input && input.state != null ? string(input.state) : '') + '">'
        + '<input type="hidden" name="code_challenge" value="' + ('code_challenge' in input && input.code_challenge != null ? string(input.code_challenge) : '') + '">'
        + '<input type="hidden" name="code_challenge_method" value="' + ('code_challenge_method' in input && input.code_challenge_method != null ? string(input.code_challenge_method) : '') + '">'
        + '<button type="submit" name="username" value="test">Continue as test</button>'
        + '</form></body></html>'

  OauthAuthorizeCallback:
    effects:
      - generate: { bind: code, kind: hex, bytes: 20 }
      - put:
          resource: oauth_code
          key: fx.code
          record:
            username: "('username' in input && input.username != null) ? string(input.username) : ''"
            scope: "('scope' in input && input.scope != null) ? string(input.scope) : ''"
            redirect_uri: "('redirect_uri' in input && input.redirect_uri != null) ? string(input.redirect_uri) : ''"
            client_id: "('client_id' in input && input.client_id != null) ? string(input.client_id) : ''"
            code_challenge: "('code_challenge' in input && input.code_challenge != null) ? string(input.code_challenge) : ''"
            code_challenge_method: "('code_challenge_method' in input && input.code_challenge_method != null) ? string(input.code_challenge_method) : ''"
            created_at: "int(now) * 1000"
    output:
      code: fx.code
      location: >
        (('redirect_uri' in input && input.redirect_uri != null && string(input.redirect_uri) != '') ? string(input.redirect_uri) : '')
        + (('redirect_uri' in input && input.redirect_uri != null && string(input.redirect_uri).contains('?')) ? '&' : '?')
        + 'code=' + fx.code
        + (('state' in input && input.state != null && string(input.state) != '') ? '&state=' + string(input.state) : '')

  OauthToken:
    reads:
      pending: { resource: oauth_code, key: "('code' in input && input.code != null) ? string(input.code) : ''" }
    require:
      # In the oracle's order: unknown code, expiry, redirect mismatch, PKCE.
      - { cond: pending_found, error: InvalidGrant, message: "The code passed is incorrect or expired." }
      - { cond: "int(now) * 1000 - int(pending.created_at) <= 600000", error: InvalidGrant, message: "The code passed is incorrect or expired." }
      - cond: >
          !('redirect_uri' in input && input.redirect_uri != null && string(input.redirect_uri) != ''
            && string(pending.redirect_uri) != '')
          || string(input.redirect_uri) == string(pending.redirect_uri)
        error: InvalidGrant
        message: "The redirect_uri does not match the one used during authorization."
      - { cond: "string(pending.code_challenge) == '' || ('code_verifier' in input && input.code_verifier != null && string(input.code_verifier) != '')", error: InvalidGrant, message: "PKCE verification failed." }
      - cond: >
          string(pending.code_challenge) == ''
          || (string(pending.code_challenge_method) == 's256'
            ? b64urlhex(sha256hex(string(input.code_verifier))) == string(pending.code_challenge)
            : string(input.code_verifier) == string(pending.code_challenge))
        error: InvalidGrant
        message: "PKCE verification failed."
      # mirror has one user; a code issued for another name has none.
      - { cond: "string(pending.username) == 'test' || string(pending.username) == ''", error: InvalidGrant, message: "The user associated with this code was not found." }
    effects:
      - delete: { resource: oauth_code, key: "string(input.code)", missing: ignore }
      - generate: { bind: tok, kind: hex, bytes: 20 }
      - put:
          resource: oauth_token
          key: "'vercel_' + fx.tok"
          record:
            username: string(pending.username)
            scope: string(pending.scope)
    output:
      access_token: "'vercel_' + fx.tok"
      token_type: "'Bearer'"
      scope: string(pending.scope)

  OauthUserinfo:
    reads:
      tok: { resource: oauth_token, key: "('authorization' in input && input.authorization != null && size(split(string(input.authorization), ' ')) == 2) ? split(string(input.authorization), ' ')[1] : ''" }
      u: { resource: user }
    require:
      - { cond: "'authorization' in input && input.authorization != null && string(input.authorization) != ''", error: Unauthorized, message: "Authentication required" }
      - { cond: tok_found, error: Unauthorized, message: "Authentication required" }
    output:
      sub: "'usr_' + identity.account"
      email: "(u_found && 'email' in u) ? u.email : 'test@mirror.cloud'"
      name: "(u_found && 'name' in u) ? u.name : 'Mirror'"
      preferred_username: "'test'"
      email_verified: "true"
      picture: "''"

quirks:
  - operation: GetProjects
    note: >
      Versioning is restored, and this is the visible break. The pack's route
      table stripped the leading version segment before matching -- any `v`
      followed by a digit -- so /v1/projects, /v9/projects and /v99/projects
      all listed projects. Routing is the model's now, and each operation binds
      to the one version its document declares.

      Four of the pack's routes therefore move. Listing projects is /v10 where
      the pack answered /v9; project env is /v10 where it answered /v9; project
      domains is /v9 where it answered /v10; listing deployments is /v7 where
      it answered /v6. A client written against the emulator's laxity breaks,
      which is the same shape as Cloudflare's percent-encoded slash: the
      document is `declared` and the pack's tolerance was `authored`.

      The listing is also unpaginated. `limit`, `from` and the rest are
      accepted and read by nothing, so every project is on the one page and
      `pagination.count` is the total rather than the page size.
  - operation: DeleteProject
    note: >
      Answers 204 with no body, where the pack answered 200 and an empty
      object. The document declares 204 for it, and a status that forbids a
      body gets none -- the rule is the protocol's, not this provider's.
  - operation: CreateProjectEnv
    note: >
      Answers {created, failed} where the pack answered the variable itself at
      the top level. The document declares those two members and the operation
      is bulk-shaped: `created` carries what was made, `failed` what was not.
      One variable at a time is what the pack did and what this transcribes, so
      `failed` is always empty.

      Answers 201, where the pack answered 200.
  - operation: AddProjectDomain
    note: >
      A domain is answered verified: true the moment it is added. A real one is
      not -- verification is a DNS round trip -- so a client that polls until
      verified never polls here and waits forever against the real API. The
      pack did this and the document declares `verified` without saying what it
      starts as, so it is transcribed rather than corrected, and named here.
  - operation: CreateDeployment
    note: >
      Creating a deployment for a project that does not exist creates the
      project too, which is the pack's behaviour and not the real API's: Vercel
      answers 404 for an unknown project. It is kept because the recording
      gates it and because a client that relies on it would otherwise break
      silently, but it is the clearest candidate for a probe run to overturn.

      The deployment is READY immediately. There is no build, so a client that
      waits for readyState to advance is already done.
  - operation: UpdateProject
    note: >
      The document's update shape declares some fifty members; the bundle
      tracks only the ones its create establishes -- name and framework -- so
      an update carrying buildCommand, rootDirectory or the rest is accepted
      and dropped. No pack ever served this operation, so there is no
      transcription to outrank; the document declares the members and says
      nothing about which an update must honor.
  - operation: EditProjectEnv
    note: >
      `comment`, `gitBranch` and `customEnvironmentIds` are accepted and
      dropped: the variable record carries only what CreateProjectEnv
      establishes (key, value, type, target), and the document declares the
      members without saying what an edit must do with them.
  - operation: UpdateProjectDomain
    note: >
      The document declares a 409 for this operation without saying what
      produces it -- redirect targets and git branches are stored verbatim,
      so the conflict is never answered. Simplified deliberately: the shape
      of the disagreement is known (a declared status with no declared
      trigger), which a probe run can overturn.
  - operation: VerifyProjectDomain
    note: >
      Answers the domain, which is already verified: true from creation --
      the add's quirk -- so verify moves nothing. A real verify is a DNS
      round trip that can fail; this one cannot, which follows from the
      creation behavior rather than being a second invention.
  - operation: CreateCustomEnvironment
    note: >
      The body's `slug` and the team-slug query share one member name in the
      narrowed model; the body value is what arrives. `type` is answered
      "preview" for every custom environment: the document declares the enum
      and nothing to set it from, and a custom environment exists to match
      branches, which is the preview kind. Both are judgment calls a probe
      run can overturn.
  - operation: GetProjectsByIdOrNameCustomEnvironments
    note: >
      accountLimit.total is a fixed 12. The document declares the member --
      "the maximum number of custom environments allowed either by the team's
      plan type or a custom override" -- and no value for it, and no pack
      ever answered one. The create does not enforce it either.
  - operation: RequestPromote
    note: >
      A promote changes no stored state: the document declares an empty 201
      and this surface has no member that records which deployment is
      promoted, so a later GetDeployment reads exactly as it did before. The
      404s for an unknown project or deployment are the bundle's own rule,
      the document declaring its usual error statuses without bodies.
  - operation: GetTeams
    note: >
      Lists whatever team records exist, which is initially none: teams are
      account fixtures, and the vendored document declares no create (the
      oracle's POST /v2/teams has no counterpart in it). Unpaginated, as
      GetProjects is: limit/since/until are accepted and read by nothing, and
      pagination.next/prev answer null.
  - operation: GetTeam
    note: >
      404 for any id until a team record exists, which nothing here creates.
      Members a bare row would not carry answer null -- or the oracle's
      defaults for membership, billing and resourceConfig -- rather than
      failing the read.
  - operation: PatchTeam
    note: >
      Honors name, slug, description and avatar -- the four the oracle's patch
      honors -- of the thirty-odd members the document declares. Two oracle
      guards have no counterpart: the owner-only 403 (there is no membership
      store to check a role against) and the slug-conflict 409 (nothing
      creates teams, so no second team can hold the slug).
  - operation: InviteUserToTeam
    note: >
      There is no user store, so any well-formed email is invitable where the
      oracle 404s an unknown user, and the answered uid is derived from the
      address (md5, truncated to the oracle's twenty) rather than looked up;
      username echoes the email. The role guard is the oracle's four roles,
      not the document's eight-member enum. A repeat invite to the same
      address is the oracle's 409 member_already_exists.
  - operation: ListDeploymentAliases
    note: >
      Answers uid and alias per row. The oracle also answers deploymentId and
      projectId, which the document's alias item shape does not declare, and
      the document requires a `created` the oracle never sends -- the
      projection follows the document's shape with the oracle's membership.
  - operation: GetDeploymentEvents
    note: >
      Newest first, the oracle's default direction; `direction`, `limit`,
      `since`/`until` and the rest are accepted and read by nothing. Events
      are the ones the create and cancel write -- created, building, ready,
      canceled -- not a build log.
  - operation: ListDeploymentFiles
    note: >
      Answers the document's bare FileTree array where the oracle wraps the
      same tree in {files: [...]} -- the document wins, as it does everywhere
      the two disagree. The tree is flat: every uploaded file is a child of
      the root under its full path, where the oracle splits nested paths into
      directory nodes.
  - operation: CancelDeployment
    note: >
      The oracle refuses unless the deployment is QUEUED or BUILDING, and its
      deployments -- like this bundle's -- are born READY, so the guard
      transcribed strictly would refuse every cancel. This allows the cancel
      from READY and keeps the reachable half of the guard: a second cancel
      answers 400. canceledAt is answered at cancel time but not retained;
      the listed deployment's item shape does not declare it.
  - operation: UploadFile
    note: >
      Answers the empty object -- the one arm of the document's oneOf the
      model can serialize -- where the oracle answers a bare empty array. A
      re-upload of a known digest merges the registration where the oracle
      keeps the first; a digest travels by header, and the digest headers are
      the members the resource is keyed from.
  - operation: ListPromoteAliases
    note: >
      Answers the document's {aliases: [{alias, id, status}], pagination}
      where the oracle answers {status, alias: [...]} -- a shape the model
      cannot serialize. Every deployment here is READY from creation, which
      is the oracle's PROMOTED condition, so every alias of the project's
      deployments reports PROMOTED; the oracle's target=production filter has
      no counterpart because no deployment record carries a target.
  - operation: UpdateProjectProtectionBypass
    note: >
      The bypass map lives on the project record, keyed by secret, because
      the response keys metadata BY secret and no expression can fold a row
      collection into that map; GetProjects projects its items so the member
      never reaches a listing. Generate honors a caller-chosen secret when the
      document's body carries one, and the scope is the document's
      `automation-bypass` enum value where the oracle writes `deployment`.
