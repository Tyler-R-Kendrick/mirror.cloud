schema: bir/1
service: vercel.kv

# Extracted from the KV half of internal/services/vercel/api (38 of its 342
# lines of Go), which served this surface under the id `vercel.api` alongside
# that provider's REST API. They are two products on two hosts -- this one
# answers on kv.vercel-storage.com and is Upstash Redis -- so the extraction
# gives each its own service rather than preserving a registration that
# carried both.
#
# Every cell is `authored`, and more so than usual: the document this is
# validated against is authored too, because neither Vercel nor Upstash
# publishes a machine-readable description of the command endpoint. See the
# description inside specs/vercel/kv.json, and treat both as the same grade of
# evidence -- a transcription of the pack, not a reading of the real service.
provenance: authored

# The engine's model check runs before any rule here. The document marks the
# body required, so a request with no body at all fails there, and it has to
# fail with the name this API gives that failure rather than the
# ValidationException default.
missing_input_error: BadRequest

resources:
  # One entry per key. The pack kept these in `vkv` scoped to the account, and
  # the collection name is kept so a store written by the pack is still
  # readable by the bundle.
  entry:
    collection: vkv
    id:
      # Reads `input` rather than the operation's `cmd` binding: a resource is
      # addressed wherever it is named, and `let` belongs to one operation.
      #
      # Total, and twice over. A command too short to carry a key must yield an
      # empty key rather than an evaluation error, because the `require` rules
      # below are what answer such a request and they cannot run if addressing
      # the resource has already failed.
      derive: >
        ('body' in input && input.body != null && size(input.body) > 1)
          ? string(input.body[1]) : ''
    record:
      value: >
        ('body' in input && input.body != null && size(input.body) > 2)
          ? string(input.body[2]) : ''
      # 0 means no TTL. Redis SET clears expiry; SETEX/EXPIRE write a unix
      # deadline here and reads treat a past deadline as a miss.
      expires_at: "0"

errors:
  BadRequest:
    code: bad_request
    http: 400
    fault: client
  # An unsupported verb is not a malformed request. HSET is a real Redis
  # command that the real service answers and this emulator does not, which is
  # what 501 MirrorNotImplemented says -- and the REST/JSON codec puts the
  # x-mirror-not-implemented header on any fault carrying that code, so a
  # client can tell "mirror has not got to this yet" from "you sent nonsense"
  # without reading the message. The pack answered exactly this, through
  # spi.NotImplemented; declaring it here keeps the distinction rather than
  # flattening every unknown command into a 400.
  NotImplemented:
    code: MirrorNotImplemented
    http: 501
    fault: client

operations:
  Command:
    # `body` is the whole request body, which is a bare JSON array: the codec
    # binds it because the model declares the member a list bound to the
    # payload. That rule is generic -- Cloudflare's bulk key operations are
    # shaped the same way -- and it replaced a branch of the REST/JSON codec
    # that recognised this provider by name and called the array `_redis`.
    let:
      # Upstash upper-cases the command, so ["get","k"] and ["GET","k"] are one
      # command. The pack did the same.
      cmd: "('body' in input && input.body != null) ? input.body : []"
      verb: "size(cmd) > 0 ? upper(string(cmd[0])) : ''"
      # A key past its deadline is a miss for every read path, matching Redis
      # lazy expiry. expires_at 0 / absent means no TTL. entry is {} on a miss,
      # so every field access sits behind entry_found / alive.
      alive: >
        entry_found && (
          !('expires_at' in entry) || entry.expires_at == null || int(entry.expires_at) == 0
            || int(entry.expires_at) > int(now)
        )
      # Numeric payload for INCR family. Missing key starts at 0; a live
      # non-integer is refused below as BadRequest. matches-guards keep int()
      # from running in let before require can answer 400.
      base_num: >
        alive && string(entry.value).matches('^-?[0-9]+$') ? int(entry.value) : 0
      delta: >
        verb == 'INCR' ? 1
          : (verb == 'DECR' ? -1
          : (verb == 'INCRBY' && size(cmd) > 2 && string(cmd[2]).matches('^-?[0-9]+$') ? int(cmd[2])
          : (verb == 'DECRBY' && size(cmd) > 2 && string(cmd[2]).matches('^-?[0-9]+$') ? -int(cmd[2]) : 0)))
      next_num: "base_num + delta"
      # SETEX key seconds value -- value is argv[3], not the schema's body[2].
      setex_value: "size(cmd) > 3 ? string(cmd[3]) : ''"
      setex_ttl: >
        size(cmd) > 2 && string(cmd[2]).matches('^[0-9]+$') ? int(cmd[2]) : 0
      expire_ttl: >
        size(cmd) > 2 && string(cmd[2]).matches('^[0-9]+$') ? int(cmd[2]) : 0
    reads:
      # Read unconditionally rather than per command: GET answers the value,
      # and DEL answers how many keys it removed, which is whether this read
      # found one. A read costs the same as asking whether to read.
      entry: { resource: entry }
    require:
      # `cond` is a precondition: the error fires when it does NOT hold.
      - { cond: "size(cmd) > 0", error: BadRequest, message: "redis command required" }
      - { cond: "verb != 'SET' || size(cmd) > 2", error: BadRequest, message: "SET needs key and value" }
      - { cond: "verb != 'GET' || size(cmd) > 1", error: BadRequest, message: "GET needs key" }
      - { cond: "verb != 'DEL' || size(cmd) > 1", error: BadRequest, message: "DEL needs key" }
      - { cond: "verb != 'EXISTS' || size(cmd) > 1", error: BadRequest, message: "EXISTS needs key" }
      - { cond: "verb != 'INCR' || size(cmd) > 1", error: BadRequest, message: "INCR needs key" }
      - { cond: "verb != 'DECR' || size(cmd) > 1", error: BadRequest, message: "DECR needs key" }
      - { cond: "verb != 'INCRBY' || size(cmd) > 2", error: BadRequest, message: "INCRBY needs key and increment" }
      - { cond: "verb != 'DECRBY' || size(cmd) > 2", error: BadRequest, message: "DECRBY needs key and decrement" }
      - { cond: "verb != 'APPEND' || size(cmd) > 2", error: BadRequest, message: "APPEND needs key and value" }
      - { cond: "verb != 'STRLEN' || size(cmd) > 1", error: BadRequest, message: "STRLEN needs key" }
      - { cond: "verb != 'EXPIRE' || size(cmd) > 2", error: BadRequest, message: "EXPIRE needs key and seconds" }
      - { cond: "verb != 'TTL' || size(cmd) > 1", error: BadRequest, message: "TTL needs key" }
      - { cond: "verb != 'SETEX' || size(cmd) > 3", error: BadRequest, message: "SETEX needs key, seconds and value" }
      - { cond: "verb != 'SETEX' || setex_ttl > 0", error: BadRequest, message: "ERR invalid expire time in setex" }
      - { cond: "verb != 'EXPIRE' || expire_ttl > 0", error: BadRequest, message: "ERR invalid expire time in expire" }
      # INCR family on a live non-integer: Redis WRONGTYPE/ERR, not 501.
      - {
          cond: "!(verb == 'INCR' || verb == 'DECR' || verb == 'INCRBY' || verb == 'DECRBY') || !alive || string(entry.value).matches('^-?[0-9]+$')",
          error: BadRequest,
          message: "ERR value is not an integer or out of range"
        }
      # Last, so a malformed SET still reads as malformed rather than as an
      # unimplemented command. String + control verbs below; hashes/lists/sets
      # and pipelines stay 501 until there is evidence for them.
      - {
          cond: "verb == 'SET' || verb == 'GET' || verb == 'DEL' || verb == 'EXISTS' || verb == 'PING' || verb == 'INCR' || verb == 'DECR' || verb == 'INCRBY' || verb == 'DECRBY' || verb == 'APPEND' || verb == 'STRLEN' || verb == 'EXPIRE' || verb == 'TTL' || verb == 'SETEX'",
          error: NotImplemented,
          message: "vercel.kv Command is not implemented for this verb at the requested fidelity; required tier: emulate"
        }
    effects:
      - put:
          resource: entry
          when: "verb == 'SET'"
      - put:
          resource: entry
          when: "verb == 'SETEX'"
          record:
            value: setex_value
            expires_at: "int(now) + setex_ttl"
      - put:
          resource: entry
          when: "verb == 'INCR' || verb == 'DECR' || verb == 'INCRBY' || verb == 'DECRBY'"
          record:
            value: "string(next_num)"
            # INCR on a missing/expired key mints a fresh string with no TTL.
            expires_at: "alive ? int(entry.expires_at) : 0"
      - put:
          resource: entry
          when: "verb == 'APPEND'"
          record:
            value: "alive ? string(entry.value) + string(cmd[2]) : string(cmd[2])"
            expires_at: "alive ? int(entry.expires_at) : 0"
      - put:
          resource: entry
          when: "verb == 'EXPIRE' && alive"
          record:
            value: "string(entry.value)"
            expires_at: "int(now) + expire_ttl"
      - delete:
          resource: entry
          when: "verb == 'DEL'"
          # A DEL of a key that is not there is not an error; it answers 0.
          missing: ignore
    output:
      # One member, many shapes, because one endpoint answers many commands.
      # dyn() on each arm because CEL requires a conditional's branches to
      # agree on a type and these deliberately do not: the response shape
      # declares `result` a union of a string and an integer, and a GET that
      # missed answers null.
      result: >
        verb == 'SET' || verb == 'SETEX' ? dyn('OK')
          : (verb == 'PING' ? dyn('PONG')
          : (verb == 'GET' ? (alive ? dyn(string(entry.value)) : dyn(null))
          : (verb == 'EXISTS' ? dyn(alive ? 1 : 0)
          : (verb == 'DEL' ? dyn(alive ? 1 : 0)
          : (verb == 'INCR' || verb == 'DECR' || verb == 'INCRBY' || verb == 'DECRBY' ? dyn(next_num)
          : (verb == 'APPEND' ? dyn(int(size(alive ? string(entry.value) + string(cmd[2]) : string(cmd[2]))))
          : (verb == 'STRLEN' ? dyn(alive ? int(size(string(entry.value))) : 0)
          : (verb == 'EXPIRE' ? dyn(alive ? 1 : 0)
          : (verb == 'TTL' ? (
                !alive ? dyn(-2)
                  : (int(entry.expires_at) == 0 ? dyn(-1)
                  : dyn(int(entry.expires_at) - int(now))))
          : dyn(null))))))))))

quirks:
  - operation: Command
    note: >
      LocalStack-class string surface for Upstash REST: SET, GET, DEL, EXISTS,
      PING, INCR, DECR, INCRBY, DECRBY, APPEND, STRLEN, EXPIRE, TTL, SETEX.
      Hashes, lists, sets, sorted sets, MGET/MSET, pipelines and SET options
      (EX/PX/NX/XX as argv) answer 501 `MirrorNotImplemented` with the
      x-mirror-not-implemented header. SET with those options still stores the
      value and clears TTL the way a bare SET does -- argv beyond key/value are
      ignored, matching the old pack's silence on EX/PX rather than inventing
      option parsing without a probe.

      EXPIRE/SETEX use whole seconds against the injected clock; sub-second
      PEXPIRE is not in the served set.
